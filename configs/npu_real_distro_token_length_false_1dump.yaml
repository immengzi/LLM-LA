# ===========================
# REAL WORKING CONFIG (flat)
# ===========================
# Modes:
#   - REAL only (pods): SIM_MODE: "off"
#
# Length:
#   - Distribution: LENGTH_MODE: "dist-output"; SIM_VARY_OUT_TOKENS: true; pick ONE SIM_OUT_DIST
#   - Fixed:        LENGTH_MODE: "target-output"; TARGET_OUTPUT_TOKENS: 128; SIM_VARY_OUT_TOKENS: false
#
# Token scale presets (change MAX_TOKENS + uncomment matching SIM_OUT_DIST):
#   - Medium (default): MAX_TOKENS: 1024 + one of the MEDIUM blocks
#   - High:             MAX_TOKENS: 2048 + one of the HIGH blocks
#   - Very Large:       MAX_TOKENS: 8192 + the VERY_LARGE_HIST block
#   - Low:              MAX_TOKENS: 256  + one of the LOW blocks

# ------- REAL endpoints only -------
SIM_MODE: "off"

# ------- Global caps / general -------
MAX_TOKENS: 8192        # Medium cap (default). For HIGH use 2048; VERY LARGE use 8192; LOW use 256
IGNORE_EOS: true

# ------- Length policy -------
LENGTH_MODE: "dist-output"        # Distribution mode (default for this file)
# LENGTH_MODE: "target-output"    # Fixed length mode (uncomment to use)
TARGET_OUTPUT_TOKENS: null        # e.g., 128 when using fixed mode
TARGET_TOTAL_TOKENS: null

# Distribution RNG (shared logic)
LENGTH_DIST_SEED: 2025
LENGTH_DIST_BY_PROMPT: true

# Use sampler (true) or fixed (false)
SIM_VARY_OUT_TOKENS: true         # keep true in dist-output, set false in fixed mode
# SIM_OUT_TOKENS: 128             # only used if SIM_VARY_OUT_TOKENS=false

# =======================
# DISTRO: pick ONE block
# =======================

# ---- MEDIUM tokens (default ACTIVE: gamma) ----
# SIM_OUT_DIST:
#   kind: "gamma"
#   k: 2.2
#   theta: 48
#   min: 16
#   max: 1024

# ---- MEDIUM / alt: lognormal ----
# SIM_OUT_DIST:
#   kind: "lognormal"
#   mu: 5.3
#   sigma: 0.8
#   min: 16
#   max: 1024

# ---- MEDIUM / alt: hist ----
SIM_OUT_DIST:
  kind: "hist"
  # values: [32, 64, 128, 256, 512, 768, 1024]
  # probs:  [0.05,0.10,0.30,0.30,0.15,0.07,0.03]
  values: [32, 4096]
  probs:  [0.7,0.3]
  # values: [1024]
  # probs:  [1]
  min: 16
  max: 40960

USE_LEN_AWARE: false
LEN_POLICY: short_first
PRED_LEN_THRESHOLD: 33
POOL_FACTOR: 1000


# ---- HIGH tokens (set MAX_TOKENS: 2048 above) ----
# SIM_OUT_DIST:
#   kind: "lognormal"
#   mu: 6.0
#   sigma: 0.9
#   min: 64
#   max: 2048

# ---- HIGH / alt: gamma ----
# SIM_OUT_DIST:
#   kind: "gamma"
#   k: 3.0
#   theta: 96
#   min: 64
#   max: 2048

# ---- VERY LARGE tokens (set MAX_TOKENS: 8192 above) ----
# SIM_OUT_DIST:
#   kind: "hist"
#   values: [512, 1024, 2048, 4096, 6144, 8192]
#   probs:  [0.05, 0.10, 0.20, 0.30, 0.20, 0.15]
#   min: 512
#   max: 8192

# ---- LOW tokens (set MAX_TOKENS: 256 above) ----
# SIM_OUT_DIST:
#   kind: "lognormal"
#   mu: 4.3
#   sigma: 0.7
#   min: 8
#   max: 256

# ---- LOW / alt: gamma ----
# SIM_OUT_DIST:
#   kind: "gamma"
#   k: 2.0
#   theta: 20
#   min: 8
#   max: 256

# =========================
# Input token estimation (for planning/meta)
# =========================
SIM_VARY_IN_TOKENS: true
SIM_CHARS_PER_TOKEN: 4.0
SIM_IN_MIN: 1
SIM_IN_MAX: 8192

# =========================
# Router/discovery basics
# =========================
NAMESPACE: "vllm"
LABEL_SELECTOR: "app=vllm-qwen"
VLLM_PORT: 8200


MAX_INFLIGHT_PER_EP: 8
LOAD_RATE_RPS: 1

# =========================
# Load generation knobs
# =========================
LOAD_PATTERN: "dump"          # one of: dump, det, poisson, bursty, steps
LOAD_RATE_RPS: 40
LOAD_WARMUP_S: 0.0
LOAD_DURATION_S: 999999.0
LENGTH_DIST_STRICT_HIST: true
LENGTH_HIST_SERIES_LABEL: "default"
