# ===========================
# REAL WORKING CONFIG (Prefill-only: LMSYS + 1-token output)
# ===========================

# Run real vLLM pods only
SIM_MODE: "off"

# ------- Global caps / general -------
MAX_TOKENS: 8192        # Large enough cap (unused since we force 1 output)
IGNORE_EOS: true        # Prevents early stop before 1 token is generated

# ------- Length policy -------
LENGTH_MODE: "target-output"     # Force fixed output length
TARGET_OUTPUT_TOKENS: 1          # One token per request → prefill-only workload
TARGET_TOTAL_TOKENS: null

# Disable stochastic output variation (fixed length)
SIM_VARY_OUT_TOKENS: false
# SIM_OUT_TOKENS: 1              # optional explicit backup cap

# ------- Distribution RNG (for completeness, unused here) -------
LENGTH_DIST_SEED: 2025
LENGTH_DIST_BY_PROMPT: true

# ------- Input token estimation (used for metadata/logging) -------
SIM_VARY_IN_TOKENS: true
SIM_CHARS_PER_TOKEN: 4.0
SIM_IN_MIN: 1
SIM_IN_MAX: 8192

# =========================
# Router / discovery basics
# =========================
NAMESPACE: "vllm"
LABEL_SELECTOR: "app=vllm-qwen"
VLLM_PORT: 8200

MAX_INFLIGHT_PER_EP: 8
SAMPLE_INTERVAL: 0.001

# =========================
# Load generation knobs
# =========================
LOAD_PATTERN: "dump"          # Immediate enqueue of all prompts
LOAD_RATE_RPS: 1
LOAD_WARMUP_S: 0.0
LOAD_DURATION_S: 999999.0
LENGTH_DIST_STRICT_HIST: true
LENGTH_HIST_SERIES_LABEL: "default"

# =========================
# Prompt source (LMSYS dataset)
# =========================
PROMPTS_SOURCE: "hf-lmsys"     # Use HuggingFace LMSYS dataset as prompt source

HF_DATASET_NAME: "lmsys/lmsys-chat-1m"
HF_DATASET_SPLIT: "train"
HF_TOKENIZER_NAME: "Qwen/Qwen2-7B"  # Used for metadata or length estimation only
HF_STREAMING: false
PROMPTS_LIMIT: 1000                 # Cap number of prompts used per run

# =========================
# Length-aware batching (unused in prefill-only)
# =========================
USE_LEN_AWARE: true
LEN_POLICY: short_first
PRED_LEN_THRESHOLD: 33
POOL_FACTOR: 10000000000


