{{/*
  41-vllm-multi.yaml — Per-model vLLM Deployments for multi-model mode.

  Only rendered when .Values.models is a non-empty list.
  Creates one Deployment + Service per model entry.

  When .Values.models is empty, this template produces nothing and the
  existing 40-vllm.yaml single-model Deployment is used instead.
*/}}

{{- if .Values.models }}
{{- range $m := .Values.models }}
{{- $modelName := $m.name }}
{{- $servedModelName := $m.servedModelName | default $modelName }}
{{- $replicas := $m.replicas | default 1 }}
{{- $tp := $m.tensorParallelSize | default $.Values.tensorParallelSize }}
{{- $batchSize := $m.batchSize | default $.Values.batchSize }}
{{- $modelSubPath := $m.modelSubPath | default $.Values.modelVolume.modelSubPath }}
{{- $mv := $m.vllm | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $modelName }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: vllm-{{ $modelName }}
      model: {{ $modelName }}
  template:
    metadata:
      labels:
        app: vllm-{{ $modelName }}
        model: {{ $modelName }}
    spec:
      restartPolicy: Always
      shareProcessNamespace: true

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      {{- $ns := $.Values.vllm.nodeSelector | default (dict) }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - vllm
        {{- if gt (int $tp) 1 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: model
                    operator: Exists
              topologyKey: kubernetes.io/hostname
        {{- else }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: model
                      operator: Exists
                topologyKey: kubernetes.io/hostname
        {{- end }}

      containers:
        - name: vllm
          image: {{ include "vllmkv.image" (list $ ($m.image | default $.Values.images.vllm)) }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eo pipefail

              export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name {{ $servedModelName }} \
                --tensor-parallel-size {{ $tp }} \
                --dtype auto \
                --kv-cache-dtype {{ $mv.kvCacheDtype | default $.Values.vllm.kvCacheDtype | default "auto" }} \
                {{- if $mv.cpuOffloadGb }}
                --cpu-offload-gb {{ $mv.cpuOffloadGb }} \
                {{- end }}
                --max-num-seqs {{ $batchSize }} \
                {{- if $mv.enablePrefixCaching }}
                --prefix-caching-hash-algo sha256_cbor \
                {{- else }}
                --no-enable-prefix-caching \
                {{- end }}
                {{- if $mv.gpuMemoryUtilization }}
                --gpu-memory-utilization {{ $mv.gpuMemoryUtilization }} \
                {{- end }}
                {{- if $mv.quantization }}
                --quantization {{ $mv.quantization }} \
                {{- end }}
                {{- if $mv.enableExpertParallel }}
                --enable-expert-parallel \
                {{- end }}
                {{- if $mv.compilationConfig }}
                --compilation-config '{"cudagraph_mode": "{{ $mv.compilationConfig.cudagraphMode | default "FULL_DECODE_ONLY" }}"}' \
                {{- else if $.Values.vllm.compilationConfig }}
                --compilation-config '{"cudagraph_mode": "{{ $.Values.vllm.compilationConfig.cudagraphMode }}"}' \
                {{- end }}
                {{- if or ($mv.trustRemoteCode) ($.Values.vllm.trustRemoteCode) }}
                --trust-remote-code \
                {{- end }}
                {{- if $mv.maxNumBatchedTokens }}
                --max-num-batched-tokens {{ $mv.maxNumBatchedTokens }} \
                {{- end }}
                {{- if $mv.maxModelLen }}
                --max-model-len {{ $mv.maxModelLen }} \
                {{- end }}
                {{- if $mv.toolCallParser }}
                --tool-call-parser {{ $mv.toolCallParser }} \
                --enable-auto-tool-choice \
                {{- end }}
                {{- if $mv.reasoningParser }}
                --reasoning-parser {{ $mv.reasoningParser }} \
                {{- end }}
                --host 0.0.0.0 \
                --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@{{ $servedModelName }}"}' \
                &
              VLLM_PID=$!
              echo "[vllm-wrapper] vLLM PID=$VLLM_PID model={{ $modelName }}"

              VLLM_PID="$VLLM_PID" POD_NAME="$POD_NAME" python - <<'PY' &
              import os, time
              from http.server import BaseHTTPRequestHandler, HTTPServer
              PID = int(os.environ["VLLM_PID"])
              POD = os.environ.get("POD_NAME", "unknown")
              PORT = 9101
              def threads(pid):
                  try: return len(os.listdir(f"/proc/{pid}/task"))
                  except: return None
              for _ in range(120):
                  if os.path.exists(f"/proc/{PID}"): break
                  time.sleep(0.25)
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_response(404); self.end_headers(); return
                      n = threads(PID)
                      body = 'vllm_threads{pod="%s"} %d\n' % (POD, n) if n else "# pid not visible\n"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.end_headers()
                      self.wfile.write(body.encode())
                  def log_message(self, *a): pass
              HTTPServer(("0.0.0.0", PORT), H).serve_forever()
              PY

              wait "$VLLM_PID"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ASCEND_RT_VISIBLE_DEVICES
              value: {{ include "vllmkv.tpDevices" (dict "tp" $tp) | quote }}
            - name: HCCL_OP_EXPANSION_MODE
              value: "AIV"
            - name: VLLM_USE_V1
              value: "1"
            - name: PYTORCH_NPU_ALLOC_CONF
              value: "expandable_segments:True"
            - name: ASCEND_BUFFER_POOL
              value: {{ $.Values.vllm.ascendBufferPool | default "4:8" | quote }}
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 5557
              name: kvpub
              protocol: TCP
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
              subPath: {{ $modelSubPath }}
            - name: dshm
              mountPath: /dev/shm
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm

          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          resources:
            requests:
              huawei.com/Ascend910: {{ $tp }}
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend910: {{ $tp }}
              ephemeral-storage: "4Gi"

        - name: kv-sidecar
          image: {{ include "vllmkv.image" (list $ $.Values.images.sidecar) }}
          imagePullPolicy: Always
          env:
            - name: ROUTER_URL
              value: "http://router-service:8080"
            - name: VLLM_URL
              value: "http://127.0.0.1:8200"
            - name: MODEL_NAME
              value: {{ $servedModelName | quote }}
            - name: SIDECAR_PORT
              value: "9000"
            - name: BATCH_SIZE
              value: {{ $batchSize | quote }}
            - name: SIDECAR_MODE
              value: {{ include "vllmkv.sidecarMode" $ | quote }}
            - name: PULL_INTERVAL_S
              value: "0.05"
            - name: ROUTER_PULL_TIMEOUT_S
              value: "1000.0"
            - name: VLLM_TIMEOUT_S
              value: "1000.0"
            - name: ROUTER_RESULT_TIMEOUT_S
              value: "1000.0"
            - name: RESULT_TRANSPORT_MODE
              value: "submit_ack"
            - name: RESULT_SUBMIT_PATH
              value: "/result_submit"
            - name: VLLM_HOST
              value: "127.0.0.1"
            - name: VLLM_SUB_PORT
              value: "5557"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MODEL_NAME_REDIS
              value: {{ $servedModelName | quote }}
            - name: TRACE_ENABLED
              value: "true"
          ports:
            - containerPort: 9000
              name: sidecar-http
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

      volumes:
        - name: model
          {{- if $.Values.modelVolume.hostPath }}
          hostPath:
            path: {{ $.Values.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ mul $tp 16 }}Gi
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ $modelName }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: vllm-{{ $modelName }}
    model: {{ $modelName }}
  ports:
    - name: http
      port: 8200
      targetPort: 8200

{{- end }}
{{- end }}
