{{/*
  40-vllm-unified.yaml — Unified vLLM deployment template.

  Handles all three deployment modes through a single template:
    - Single model  (legacy fallback when models[] is empty)
    - Multi-model   (one Deployment per models[] entry)
    - Data Parallel  (LeaderWorkerSet when models[].dataParallel.enabled)

  When .Values.models is empty, synthesizes a single model entry from
  top-level values for backward compatibility.
*/}}

{{- if .Values.deploy.vllm }}

{{/* ---- Build effective models list ---- */}}
{{- $models := list }}
{{- if .Values.models }}
  {{- $models = .Values.models }}
{{- else }}
  {{- $legacyModel := dict
        "name" "qwen"
        "servedModelName" "served-model"
        "replicas" (int (.Values.replicas.vllm | default 1))
        "tensorParallelSize" (int .Values.tensorParallelSize)
        "batchSize" (int .Values.batchSize)
        "modelSubPath" .Values.modelVolume.modelSubPath
        "vllm" .Values.vllm
  }}
  {{- if .Values.dataParallel.enabled }}
    {{- $_ := set $legacyModel "dataParallel" .Values.dataParallel }}
  {{- end }}
  {{- $models = list $legacyModel }}
{{- end }}

{{/* ---- Validate ---- */}}
{{- range $models }}
  {{- $sub := .modelSubPath | default $.Values.modelVolume.modelSubPath }}
  {{- if not $sub }}
    {{- fail (printf "modelSubPath must be set for model '%s' (or set modelVolume.modelSubPath globally)" (.name | default "?")) }}
  {{- end }}
{{- end }}

{{/* ---- Common variables ---- */}}
{{- $backend := lower $.Values.backend }}
{{- $needsSidecar := and (ne (toString $.Values.sidecar.enabled) "false") (or (eq $backend "router") (eq $backend "litellm") (eq $backend "boom")) }}
{{- $isLegacy := not $.Values.models }}

{{/* ---- Render resources per model ---- */}}
{{- range $idx, $m := $models }}

{{/* Per-model variables */}}
{{- $modelName := $m.name }}
{{- $servedModelName := $m.servedModelName | default $modelName }}
{{- $replicas := $m.replicas | default 1 }}
{{- $tp := $m.tensorParallelSize | default $.Values.tensorParallelSize | int }}
{{- $batchSize := $m.batchSize | default $.Values.batchSize | int }}
{{- $modelSubPath := $m.modelSubPath | default $.Values.modelVolume.modelSubPath }}
{{- $mv := $m.vllm | default dict }}
{{- $dp := $m.dataParallel | default dict }}
{{- $isDP := $dp.enabled | default false }}
{{- $flagCtx := dict "mv" $mv "gv" $.Values.vllm "batch" $batchSize }}

{{- if gt $idx 0 }}
---
{{- end }}

{{/* =============================================================== */}}
{{/* DATA PARALLEL — LeaderWorkerSet                                 */}}
{{/* =============================================================== */}}
{{- if $isDP }}
{{- $dpTotal := mul ($dp.size | default 2 | int) ($dp.sizeLocal | default 1 | int) }}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm-{{ $modelName }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ $dp.groups | default $replicas }}
  leaderWorkerTemplate:
    size: {{ $dp.size | default 2 }}
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: vllm-{{ $modelName }}
          component: vllm
          model: {{ $modelName }}
          role: leader
          {{- if $.Values.aibrix.enabled }}
          model.aibrix.ai/name: {{ $.Values.aibrix.modelName | quote }}
          model.aibrix.ai/port: {{ printf "%d" ($.Values.aibrix.port | int) | quote }}
          {{- end }}
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        {{- $ns := $.Values.vllm.nodeSelector | default (dict) }}
        {{- if $ns }}
        nodeSelector:
          {{- toYaml $ns | nindent 10 }}
        {{- end }}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: avoid
                      operator: NotIn
                      values:
                        - vllm
          {{- if $dp.pairTopologyKey }}
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: {{ $dp.pairTopologyKey }}
                labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                matchLabelKeys:
                  - leaderworkerset.sigs.k8s.io/group-index
          {{- end }}
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                topologyKey: kubernetes.io/hostname
        {{- if $dp.pairTopologyKey }}
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: {{ $dp.pairTopologyKey }}
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: vllm-{{ $modelName }}
        {{- end }}
        containers:
          - name: vllm
            image: {{ include "vllmkv.image" (list $ ($m.image | default $.Values.images.vllm)) }}
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

                {{- if $dp.nicName }}
                nic_name="{{ $dp.nicName }}"
                {{- else }}
{{ include "vllmkv.nicDetectScript" . | trim | indent 16 }}
                {{- end }}
                echo "[vllm-dp-leader] nic=${nic_name} leader_ip=${NODE_IP}"
                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE={{ $dp.hcclBuffSize | default 200 }}
                export OMP_NUM_THREADS={{ $dp.ompNumThreads | default 16 }}

                exec python -m vllm.entrypoints.openai.api_server \
                  --model /model \
                  --tokenizer /model \
                  --port 8200 \
                  --served-model-name {{ $servedModelName }} \
                  --tensor-parallel-size {{ $tp }} \
                  --data-parallel-size {{ $dpTotal }} \
                  --data-parallel-size-local {{ $dp.sizeLocal | default 1 }} \
                  --data-parallel-address "${NODE_IP}" \
                  --data-parallel-rpc-port {{ $dp.rpcPort | default 13389 }} \
{{ include "vllmkv.vllmRuntimeFlags" $flagCtx | trim | indent 18 }}
                  --host 0.0.0.0
            env:
              {{- include "vllmkv.vllmBaseEnv" (dict "tp" $tp "root" $) | nindent 14 }}
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            ports:
              - containerPort: 8200
                name: http
                protocol: TCP
              {{- if $needsSidecar }}
              - containerPort: 5557
                name: kvpub
                protocol: TCP
              {{- end }}
              - containerPort: 9101
                name: vllmthr
                protocol: TCP
            volumeMounts:
              - name: model
                mountPath: /model
                readOnly: true
                subPath: {{ $modelSubPath }}
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              {{- include "vllmkv.ascendDriverMounts" $ | nindent 14 }}
            startupProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 12
              timeoutSeconds: 5
            livenessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            resources:
              requests:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "2Gi"
              limits:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "4Gi"

          {{- if $needsSidecar }}
          - name: kv-sidecar
            image: {{ include "vllmkv.image" (list $ $.Values.images.sidecar) }}
            imagePullPolicy: Always
            env:
              - name: ROUTER_URL
                value: "http://router-service:8080"
              - name: VLLM_URL
                value: "http://127.0.0.1:8200"
              - name: MODEL_NAME
                value: {{ $servedModelName | quote }}
              - name: SIDECAR_PORT
                value: "9000"
              - name: BATCH_SIZE
                value: {{ mul $batchSize $dpTotal | quote }}
              - name: PREFETCH
                value: {{ $.Values.sidecar.prefetch | default $batchSize | quote }}
              - name: SIDECAR_MODE
                value: {{ include "vllmkv.sidecarMode" $ | quote }}
              - name: PULL_INTERVAL_S
                value: "0.05"
              - name: ROUTER_PULL_TIMEOUT_S
                value: "1000.0"
              - name: VLLM_TIMEOUT_S
                value: "1000.0"
              - name: ROUTER_RESULT_TIMEOUT_S
                value: "1000.0"
              - name: RESULT_TRANSPORT_MODE
                value: "submit_ack"
              - name: RESULT_SUBMIT_PATH
                value: "/result_submit"
              - name: VLLM_HOST
                value: "127.0.0.1"
              - name: VLLM_SUB_PORT
                value: "5557"
              - name: REDIS_HOST
                value: "redis"
              - name: REDIS_PORT
                value: "6379"
              - name: CONTAINER_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: MODEL_NAME_REDIS
                value: {{ $servedModelName | quote }}
              - name: TRACE_ENABLED
                value: "true"
              - name: LOG_LEVEL
                value: {{ $.Values.sidecar.logLevel | default "info" | quote }}
            ports:
              - containerPort: 9000
                name: sidecar-http
                protocol: TCP
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"
          {{- end }}

        volumes:
          - name: model
            {{- if $.Values.modelVolume.hostPath }}
            hostPath:
              path: {{ $.Values.modelVolume.hostPath }}
              type: Directory
            {{- else }}
            persistentVolumeClaim:
              claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
            {{- end }}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ mul $tp 16 }}Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          {{- include "vllmkv.ascendDriverVolumes" $ | nindent 10 }}

    workerTemplate:
      metadata:
        labels:
          app: vllm-{{ $modelName }}-worker
          component: vllm
          model: {{ $modelName }}
          role: worker
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        {{- if $ns }}
        nodeSelector:
          {{- toYaml $ns | nindent 10 }}
        {{- end }}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: avoid
                      operator: NotIn
                      values:
                        - vllm
          {{- if $dp.pairTopologyKey }}
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: {{ $dp.pairTopologyKey }}
                labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                matchLabelKeys:
                  - leaderworkerset.sigs.k8s.io/group-index
          {{- end }}
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                topologyKey: kubernetes.io/hostname
        {{- if $dp.pairTopologyKey }}
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: {{ $dp.pairTopologyKey }}
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: vllm-{{ $modelName }}
        {{- end }}
        containers:
          - name: vllm
            image: {{ include "vllmkv.image" (list $ ($m.image | default $.Values.images.vllm)) }}
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

                {{- if $dp.nicName }}
                nic_name="{{ $dp.nicName }}"
                {{- else }}
{{ include "vllmkv.nicDetectScript" . | trim | indent 16 }}
                {{- end }}

                WORKER_INDEX="${POD_NAME##*-}"
                START_RANK=$(( WORKER_INDEX * {{ $dp.sizeLocal | default 1 }} ))

                LEADER_IP=$(getent hosts ${LWS_LEADER_ADDRESS} | awk '{print $1}')
                echo "[vllm-dp-worker] nic=${nic_name} worker_idx=${WORKER_INDEX} start_rank=${START_RANK} leader_dns=${LWS_LEADER_ADDRESS} leader_ip=${LEADER_IP} node_ip=${NODE_IP}"

                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE={{ $dp.hcclBuffSize | default 200 }}
                export OMP_NUM_THREADS={{ $dp.ompNumThreads | default 16 }}

                exec vllm serve /model \
                  --headless \
                  --served-model-name {{ $servedModelName }} \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --tensor-parallel-size {{ $tp }} \
                  --data-parallel-size {{ $dpTotal }} \
                  --data-parallel-size-local {{ $dp.sizeLocal | default 1 }} \
                  --data-parallel-address "${LEADER_IP}" \
                  --data-parallel-rpc-port {{ $dp.rpcPort | default 13389 }} \
                  --data-parallel-start-rank ${START_RANK} \
{{ include "vllmkv.vllmRuntimeFlags" $flagCtx | trim | indent 18 }}
            env:
              {{- include "vllmkv.vllmBaseEnv" (dict "tp" $tp "root" $) | nindent 14 }}
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              - name: LWS_LEADER_ADDRESS
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['leaderworkerset.sigs.k8s.io/leader-address']
            volumeMounts:
              - name: model
                mountPath: /model
                readOnly: true
                subPath: {{ $modelSubPath }}
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              {{- include "vllmkv.ascendDriverMounts" $ | nindent 14 }}
            livenessProbe:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - "pgrep -f 'vllm.entrypoints' > /dev/null"
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 3
            resources:
              requests:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "2Gi"
              limits:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "4Gi"

        volumes:
          - name: model
            {{- if $.Values.modelVolume.hostPath }}
            hostPath:
              path: {{ $.Values.modelVolume.hostPath }}
              type: Directory
            {{- else }}
            persistentVolumeClaim:
              claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
            {{- end }}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ mul $tp 16 }}Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          {{- include "vllmkv.ascendDriverVolumes" $ | nindent 10 }}

{{/* =============================================================== */}}
{{/* STANDARD DEPLOYMENT                                             */}}
{{/* =============================================================== */}}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $modelName }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: vllm-{{ $modelName }}
      model: {{ $modelName }}
  template:
    metadata:
      labels:
        app: vllm-{{ $modelName }}
        component: vllm
        model: {{ $modelName }}
        {{- if $.Values.aibrix.enabled }}
        model.aibrix.ai/name: {{ $.Values.aibrix.modelName | quote }}
        model.aibrix.ai/port: {{ printf "%d" ($.Values.aibrix.port | int) | quote }}
        {{- end }}
    spec:
      restartPolicy: Always
      shareProcessNamespace: true

      {{- if and $.Values.mooncake.enabled $.Values.vllm.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      {{- $ns := $.Values.vllm.nodeSelector | default (dict) }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - vllm
        {{- if gt (int $tp) 1 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: model
                    operator: Exists
              topologyKey: kubernetes.io/hostname
        {{- else }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: model
                      operator: Exists
                topologyKey: kubernetes.io/hostname
        {{- end }}

      containers:
        - name: vllm
          image: {{ include "vllmkv.image" (list $ ($m.image | default $.Values.images.vllm)) }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eo pipefail

              export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

              {{- if $.Values.mooncake.enabled }}
{{ include "vllmkv.nicDetectScript" . | trim | indent 14 }}
              echo "[vllm] local_ip=${local_ip} nic=${nic_name}"
              export HCCL_IF_IP=${local_ip}
              export GLOO_SOCKET_IFNAME=${nic_name}
              export TP_SOCKET_IFNAME=${nic_name}
              export HCCL_SOCKET_IFNAME=${nic_name}
              export HCCL_BUFFSIZE=200
              export ASCEND_BUFFER_POOL={{ $.Values.vllm.ascendBufferPool | default "4:8" }}
              export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
              {{- end }}

              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name {{ $servedModelName }} \
                --tensor-parallel-size {{ $tp }} \
{{ include "vllmkv.vllmRuntimeFlags" $flagCtx | trim | indent 16 }}
                --host 0.0.0.0 \
                {{- if $needsSidecar }}
                --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@{{ $servedModelName }}"}' \
                {{- end }}
                {{- if $.Values.mooncake.enabled }}
                --kv-transfer-config '{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"master_server_address":"{{ $.Values.mooncake.masterServerAddress }}","lookup_rpc_port":"{{ $.Values.mooncake.lookupRpcPort }}","backend":"mooncake"}}' \
                {{- end }}
                &
              VLLM_PID=$!
              echo "[vllm-wrapper] vLLM PID=$VLLM_PID model={{ $modelName }}"

{{ include "vllmkv.threadExporter" . | trim | indent 14 }}

              wait "$VLLM_PID"
          env:
            {{- include "vllmkv.vllmBaseEnv" (dict "tp" $tp "root" $) | nindent 12 }}
            {{- if $.Values.mooncake.enabled }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake.json"
            {{- end }}
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            {{- if $needsSidecar }}
            - containerPort: 5557
              name: kvpub
              protocol: TCP
            {{- end }}
            {{- if $.Values.mooncake.enabled }}
            - containerPort: {{ $.Values.mooncake.lookupRpcPort }}
              name: kv-rpc
              protocol: TCP
            {{- end }}
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
              subPath: {{ $modelSubPath }}
            - name: dshm
              mountPath: /dev/shm
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm
            {{- if $.Values.mooncake.enabled }}
            - name: mooncake-config
              mountPath: /etc/mooncake/mooncake.json
              subPath: mooncake.json
              readOnly: true
            {{- end }}

          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          resources:
            requests:
              huawei.com/Ascend: {{ $tp }}
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend: {{ $tp }}
              ephemeral-storage: "4Gi"

        {{- if $needsSidecar }}
        - name: kv-sidecar
          image: {{ include "vllmkv.image" (list $ $.Values.images.sidecar) }}
          imagePullPolicy: Always
          env:
            - name: ROUTER_URL
              value: "http://router-service:8080"
            - name: VLLM_URL
              value: "http://127.0.0.1:8200"
            - name: MODEL_NAME
              value: {{ $servedModelName | quote }}
            - name: SIDECAR_PORT
              value: "9000"
            - name: BATCH_SIZE
              value: {{ $batchSize | quote }}
            - name: PREFETCH
              value: {{ $.Values.sidecar.prefetch | default $batchSize | quote }}
            - name: SIDECAR_MODE
              value: {{ include "vllmkv.sidecarMode" $ | quote }}
            - name: PULL_INTERVAL_S
              value: "0.05"
            - name: ROUTER_PULL_TIMEOUT_S
              value: "1000.0"
            - name: VLLM_TIMEOUT_S
              value: "1000.0"
            - name: ROUTER_RESULT_TIMEOUT_S
              value: "1000.0"
            - name: RESULT_TRANSPORT_MODE
              value: "submit_ack"
            - name: RESULT_SUBMIT_PATH
              value: "/result_submit"
            - name: VLLM_HOST
              value: "127.0.0.1"
            - name: VLLM_SUB_PORT
              value: "5557"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MODEL_NAME_REDIS
              value: {{ $servedModelName | quote }}
            - name: TRACE_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: {{ $.Values.sidecar.logLevel | default "info" | quote }}
          ports:
            - containerPort: 9000
              name: sidecar-http
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        {{- end }}

      volumes:
        - name: model
          {{- if $.Values.modelVolume.hostPath }}
          hostPath:
            path: {{ $.Values.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ mul $tp 16 }}Gi
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
        {{- if $.Values.mooncake.enabled }}
        - name: mooncake-config
          configMap:
            name: mooncake-config
        {{- end }}

{{- end }}
{{/* end if $isDP */}}

---
{{/* ---- Service for this model ---- */}}
{{/* For DP models the LWS controller creates a headless service named
     vllm-<modelName>, so our NodePort service must use a DIFFERENT name
     to avoid overwriting it (the headless service is required for pod DNS). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ if $isDP }}vllm-{{ $modelName }}-api{{ else }}vllm-{{ $modelName }}{{ end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    component: vllm
    model: {{ $modelName }}
spec:
  {{- if or $isDP $isLegacy }}
  type: NodePort
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    app: vllm-{{ $modelName }}
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      {{- if or $isDP $isLegacy }}
      nodePort: 30034
      {{- end }}

{{- end }}
{{/* end range $models */}}

{{- end }}
{{/* end if deploy.vllm */}}
