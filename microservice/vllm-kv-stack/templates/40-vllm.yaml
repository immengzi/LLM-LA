{{- if and .Values.deploy.vllm (not .Values.dataParallel.enabled) (not .Values.models) }}
{{- if not .Values.modelVolume.modelSubPath }}
{{- fail "modelVolume.modelSubPath must be set — deploy PV/PVC once on the parent dir and pass the model subfolder name per deployment" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas.vllm }}
  {{- end }}
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
        {{- if .Values.aibrix.enabled }}
        model.aibrix.ai/name: {{ .Values.aibrix.modelName | quote }}
        model.aibrix.ai/port: {{ printf "%d" (.Values.aibrix.port | int) | quote }}
        {{- end }}
    spec:
      restartPolicy: Always
      shareProcessNamespace: true

      {{- if and .Values.mooncake.enabled .Values.vllm.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      {{- $ns := .Values.vllm.nodeSelector | default (dict) }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - vllm

      containers:
        - name: vllm
          image: {{ include "vllmkv.image" (list . .Values.images.vllm) }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

              {{- if .Values.mooncake.enabled }}
              # Mooncake: auto-detect NIC for HCCL/RoCE
              local_ip="${NODE_IP}"
              nic_name=$(python3 -c "
              import os, socket, struct, fcntl
              local_ip = '${local_ip}'
              SIOCGIFADDR = 0x8915
              for iface in os.listdir('/sys/class/net/'):
                  if iface == 'lo': continue
                  try:
                      sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                      ifreq = struct.pack('16sH14s', iface.encode(), socket.AF_INET, b'')
                      res = fcntl.ioctl(sock.fileno(), SIOCGIFADDR, ifreq)
                      ip = socket.inet_ntoa(res[20:24])
                      sock.close()
                      if ip == local_ip:
                          print(iface)
                          break
                  except: pass
              ")
              echo "[vllm] local_ip=${local_ip} nic=${nic_name}"
              export HCCL_IF_IP=${local_ip}
              export GLOO_SOCKET_IFNAME=${nic_name}
              export TP_SOCKET_IFNAME=${nic_name}
              export HCCL_SOCKET_IFNAME=${nic_name}
              export HCCL_BUFFSIZE=200
              export ASCEND_BUFFER_POOL={{ .Values.vllm.ascendBufferPool | default "4:8" }}
              export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
              {{- end }}

              # --- start vLLM in background so we can launch a tiny exporter too
              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name served-model \
                --tensor-parallel-size {{ .Values.tensorParallelSize }} \
                --dtype auto \
                --kv-cache-dtype {{ .Values.vllm.kvCacheDtype | default "auto" }} \
                {{- if .Values.vllm.cpuOffloadGb }}
                --cpu-offload-gb {{ .Values.vllm.cpuOffloadGb }} \
                {{- end }}
                --max-num-seqs {{ .Values.batchSize }} \
                {{- if .Values.vllm.enablePrefixCaching }}
                --prefix-caching-hash-algo sha256_cbor \
                {{- else }}
                --no-enable-prefix-caching \
                {{- end }}
                {{- if .Values.vllm.gpuMemoryUtilization }}
                --gpu-memory-utilization {{ .Values.vllm.gpuMemoryUtilization }} \
                {{- end }}
                {{- if .Values.vllm.quantization }}
                --quantization {{ .Values.vllm.quantization }} \
                {{- end }}
                {{- if .Values.vllm.enableExpertParallel }}
                --enable-expert-parallel \
                {{- end }}
                {{- if .Values.vllm.compilationConfig }}
                --compilation-config '{"cudagraph_mode": "{{ .Values.vllm.compilationConfig.cudagraphMode }}"}' \
                {{- end }}
                {{- if .Values.vllm.trustRemoteCode }}
                --trust-remote-code \
                {{- end }}
                {{- if .Values.vllm.maxNumBatchedTokens }}
                --max-num-batched-tokens {{ .Values.vllm.maxNumBatchedTokens }} \
                {{- end }}
                {{- if .Values.vllm.seed }}
                --seed {{ .Values.vllm.seed }} \
                {{- end }}
                {{- if .Values.vllm.maxModelLen }}
                --max-model-len {{ .Values.vllm.maxModelLen }} \
                {{- end }}
                {{- if .Values.vllm.additionalConfig.multistreamOverlapSharedExpert }}
                --additional-config '{"multistream_overlap_shared_expert": {{ .Values.vllm.additionalConfig.multistreamOverlapSharedExpert }}}' \
                {{- end }}
                {{- if .Values.vllm.speculativeConfig.numSpeculativeTokens }}
                --speculative-config '{"num_speculative_tokens": {{ .Values.vllm.speculativeConfig.numSpeculativeTokens }}, "method": "{{ .Values.vllm.speculativeConfig.method }}"}' \
                {{- end }}
                {{- if .Values.vllm.toolCallParser }}
                --tool-call-parser {{ .Values.vllm.toolCallParser }} \
                --enable-auto-tool-choice \
                {{- end }}
                {{- if .Values.vllm.reasoningParser }}
                --reasoning-parser {{ .Values.vllm.reasoningParser }} \
                {{- end }}
                --host 0.0.0.0 \
                {{- if or (eq (lower .Values.backend) "router") (eq (lower .Values.backend) "litellm") (eq (lower .Values.backend) "boom") }}
                --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@served-model"}' \
                {{- end }}
                {{- if .Values.mooncake.enabled }}
                --kv-transfer-config '{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"master_server_address":"{{ .Values.mooncake.masterServerAddress }}","lookup_rpc_port":"{{ .Values.mooncake.lookupRpcPort }}","backend":"mooncake"}}' \
                {{- end }}
                &
              VLLM_PID=$!
              echo "[vllm-wrapper] vLLM PID=$VLLM_PID"

              # --- tiny Prometheus exporter on :9101 (serves ONLY /metrics)
              #     Exposes ONE metric: vllm_threads{pod="<podname>"} <N>
              VLLM_PID="$VLLM_PID" POD_NAME="$POD_NAME" python - <<'PY' &
              import os
              import time
              from http.server import BaseHTTPRequestHandler, HTTPServer

              PID = int(os.environ["VLLM_PID"])
              POD = os.environ.get("POD_NAME", "unknown")
              PORT = 9101

              def threads(pid: int):
                  try:
                      return len(os.listdir(f"/proc/{pid}/task"))
                  except Exception:
                      return None

              # Wait until /proc/PID exists (avoid startup race)
              for _ in range(120):
                  if os.path.exists(f"/proc/{PID}"):
                      break
                  time.sleep(0.25)

              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_response(404)
                          self.end_headers()
                          return

                      n = threads(PID)
                      if n is None:
                          body = "# vLLM pid not visible\n"
                      else:
                          body = 'vllm_threads{pod="%s"} %d\n' % (POD, n)

                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.end_headers()
                      self.wfile.write(body.encode("utf-8"))

                  def log_message(self, *args):
                      pass

              print(f"[vllm-thread-exporter] listening on :{PORT} (GET /metrics), pid={PID}, pod={POD}", flush=True)
              HTTPServer(("0.0.0.0", PORT), H).serve_forever()
              PY

              # keep container alive as long as vLLM lives
              wait "$VLLM_PID"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- $tp := .Values.tensorParallelSize }}
            - name: ASCEND_RT_VISIBLE_DEVICES
              value: {{ include "vllmkv.tpDevices" (dict "tp" $tp) | quote }}
            - name: HCCL_OP_EXPANSION_MODE
              value: "AIV"
            - name: VLLM_USE_V1
              value: "1"
            - name: PYTORCH_NPU_ALLOC_CONF
              value: "expandable_segments:True"
            - name: ASCEND_BUFFER_POOL
              value: {{ .Values.vllm.ascendBufferPool | default "4:8" | quote }}
            {{- if .Values.mooncake.enabled }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake.json"
            {{- end }}
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            {{- if or (eq (lower .Values.backend) "router") (eq (lower .Values.backend) "litellm") (eq (lower .Values.backend) "boom") }}
            - containerPort: 5557
              name: kvpub
              protocol: TCP
            {{- end }}
            {{- if .Values.mooncake.enabled }}
            - containerPort: {{ .Values.mooncake.lookupRpcPort }}
              name: kv-rpc
              protocol: TCP
            {{- end }}
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
              subPath: {{ .Values.modelVolume.modelSubPath }}
            - name: dshm
              mountPath: /dev/shm
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm
            {{- if .Values.mooncake.enabled }}
            - name: mooncake-config
              mountPath: /etc/mooncake/mooncake.json
              subPath: mooncake.json
              readOnly: true
            {{- end }}

          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          resources:
            requests:
              huawei.com/Ascend: {{ .Values.tensorParallelSize }}
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend: {{ .Values.tensorParallelSize }}
              ephemeral-storage: "4Gi"

        {{- if or (eq (lower .Values.backend) "router") (eq (lower .Values.backend) "litellm") (eq (lower .Values.backend) "boom") }}
        - name: kv-sidecar
          image: {{ include "vllmkv.image" (list . .Values.images.sidecar) }}
          imagePullPolicy: Always
          env:
            - name: ROUTER_URL
              value: "http://router-service:8080"
            - name: VLLM_URL
              value: "http://127.0.0.1:8200"
            - name: MODEL_NAME
              value: "served-model"

            - name: SIDECAR_PORT
              value: "9000"

            - name: BATCH_SIZE
              value: "{{ .Values.batchSize }}"

            - name: SIDECAR_MODE
              value: {{ quote (include "vllmkv.sidecarMode" .) }}

            - name: PULL_INTERVAL_S
              value: "0.05"

            - name: ROUTER_PULL_TIMEOUT_S
              value: "1000.0"
            - name: VLLM_TIMEOUT_S
              value: "1000.0"
            - name: ROUTER_RESULT_TIMEOUT_S
              value: "1000.0"

            - name: RESULT_TRANSPORT_MODE
              value: "submit_ack"
            - name: RESULT_SUBMIT_PATH
              value: "/result_submit"

            - name: VLLM_HOST
              value: "127.0.0.1"
            - name: VLLM_SUB_PORT
              value: "5557"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MODEL_NAME_REDIS
              value: "served-model"

            - name: TRACE_ENABLED
              value: "true"

          ports:
            - containerPort: 9000
              name: sidecar-http
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        {{- end }}

      volumes:
        - name: model
          {{- if .Values.modelVolume.hostPath }}
          hostPath:
            path: {{ .Values.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.modelVolume.pvcName | default "models-nfs-pvc" }}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ mul .Values.tensorParallelSize 16 }}Gi
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
        {{- if .Values.mooncake.enabled }}
        - name: mooncake-config
          configMap:
            name: mooncake-config
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30034
{{- end }}