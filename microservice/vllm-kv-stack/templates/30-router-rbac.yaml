apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-router-sa
  namespace: vllm

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kv-router-role
  namespace: vllm
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kv-router-rolebinding
  namespace: vllm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kv-router-role
subjects:
  - kind: ServiceAccount
    name: kv-router-sa
    namespace: vllm
