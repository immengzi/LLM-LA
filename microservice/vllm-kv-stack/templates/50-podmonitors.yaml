apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  selector:
    matchLabels:
      app: vllm-qwen
  podMetricsEndpoints:
    - path: /metrics
      port: http
      interval: 1s

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kv-router
  namespace: vllm
spec:
  selector:
    matchLabels:
      app: router-service
  podMetricsEndpoints:
    - path: /metrics
      port: http
      interval: 1s

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kv-sidecar
  namespace: vllm
spec:
  selector:
    matchLabels:
      app: vllm-qwen
  podMetricsEndpoints:
    - path: /metrics
      port: sidecar-http
      interval: 1s
