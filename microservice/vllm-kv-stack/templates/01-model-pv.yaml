{{- if .Values.modelVolume.create }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-local-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - ro
    - nfsvers=4.1
  nfs:
    server: 7.242.102.243
    path: /
{{- end }}
