{{- if and .Values.deploy.vllm .Values.dataParallel.enabled }}
{{- if not .Values.modelVolume.modelSubPath }}
{{- fail "modelVolume.modelSubPath must be set — deploy PV/PVC once on the parent dir and pass the model subfolder name per deployment" }}
{{- end }}
{{- $tp := .Values.tensorParallelSize }}
{{- $dpTotal := mul .Values.dataParallel.size .Values.dataParallel.sizeLocal | int }}
{{- $backend := lower .Values.backend }}
{{- $needsSidecar := or (eq $backend "router") (eq $backend "litellm") (eq $backend "boom") }}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm-dp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.dataParallel.groups }}
  leaderWorkerTemplate:
    size: {{ .Values.dataParallel.size }}
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: vllm-qwen
          role: leader
          {{- if .Values.aibrix.enabled }}
          model.aibrix.ai/name: {{ .Values.aibrix.modelName | quote }}
          model.aibrix.ai/port: {{ printf "%d" (.Values.aibrix.port | int) | quote }}
          {{- end }}
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        {{- $ns := .Values.vllm.nodeSelector | default (dict) }}
        {{- if $ns }}
        nodeSelector:
          {{- toYaml $ns | nindent 10 }}
        {{- end }}
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-dp
                topologyKey: kubernetes.io/hostname
        containers:
          - name: vllm
            image: {{ include "vllmkv.image" (list . .Values.images.vllm) }}
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

                {{- if .Values.dataParallel.nicName }}
                nic_name="{{ .Values.dataParallel.nicName }}"
                {{- else }}
                local_ip="${NODE_IP}"
                nic_name=$(python3 -c "
                import os, socket, struct, fcntl
                local_ip = '${local_ip}'
                SIOCGIFADDR = 0x8915
                for iface in os.listdir('/sys/class/net/'):
                    if iface == 'lo': continue
                    try:
                        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                        ifreq = struct.pack('16sH14s', iface.encode(), socket.AF_INET, b'')
                        res = fcntl.ioctl(sock.fileno(), SIOCGIFADDR, ifreq)
                        ip = socket.inet_ntoa(res[20:24])
                        sock.close()
                        if ip == local_ip:
                            print(iface)
                            break
                    except: pass
                ")
                {{- end }}
                echo "[vllm-dp-leader] nic=${nic_name} leader_ip=${NODE_IP}"
                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE={{ .Values.dataParallel.hcclBuffSize }}
                export OMP_NUM_THREADS={{ .Values.dataParallel.ompNumThreads }}

                exec python -m vllm.entrypoints.openai.api_server \
                  --model /model \
                  --tokenizer /model \
                  --port 8200 \
                  --served-model-name served-model \
                  --tensor-parallel-size {{ $tp }} \
                  --data-parallel-size {{ $dpTotal }} \
                  --data-parallel-size-local {{ .Values.dataParallel.sizeLocal }} \
                  --data-parallel-address "${NODE_IP}" \
                  --data-parallel-rpc-port {{ .Values.dataParallel.rpcPort }} \
                  --dtype auto \
                  --kv-cache-dtype {{ .Values.vllm.kvCacheDtype | default "auto" }} \
                  {{- if .Values.vllm.cpuOffloadGb }}
                  --cpu-offload-gb {{ .Values.vllm.cpuOffloadGb }} \
                  {{- end }}
                  --max-num-seqs {{ .Values.batchSize }} \
                  {{- if .Values.vllm.enablePrefixCaching }}
                  --prefix-caching-hash-algo sha256_cbor \
                  {{- else }}
                  --no-enable-prefix-caching \
                  {{- end }}
                  {{- if .Values.vllm.gpuMemoryUtilization }}
                  --gpu-memory-utilization {{ .Values.vllm.gpuMemoryUtilization }} \
                  {{- end }}
                  {{- if .Values.vllm.quantization }}
                  --quantization {{ .Values.vllm.quantization }} \
                  {{- end }}
                  {{- if .Values.vllm.enableExpertParallel }}
                  --enable-expert-parallel \
                  {{- end }}
                  {{- if .Values.vllm.compilationConfig }}
                  --compilation-config '{"cudagraph_mode": "{{ .Values.vllm.compilationConfig.cudagraphMode }}"}' \
                  {{- end }}
                  {{- if .Values.vllm.trustRemoteCode }}
                  --trust-remote-code \
                  {{- end }}
                  {{- if .Values.vllm.maxNumBatchedTokens }}
                  --max-num-batched-tokens {{ .Values.vllm.maxNumBatchedTokens }} \
                  {{- end }}
                  {{- if .Values.vllm.seed }}
                  --seed {{ .Values.vllm.seed }} \
                  {{- end }}
                  {{- if .Values.vllm.maxModelLen }}
                  --max-model-len {{ .Values.vllm.maxModelLen }} \
                  {{- end }}
                  {{- if .Values.vllm.additionalConfig.multistreamOverlapSharedExpert }}
                  --additional-config '{"multistream_overlap_shared_expert": {{ .Values.vllm.additionalConfig.multistreamOverlapSharedExpert }}}' \
                  {{- end }}
                  {{- if .Values.vllm.speculativeConfig.numSpeculativeTokens }}
                  --speculative-config '{"num_speculative_tokens": {{ .Values.vllm.speculativeConfig.numSpeculativeTokens }}, "method": "{{ .Values.vllm.speculativeConfig.method }}"}' \
                  {{- end }}
                  {{- if .Values.vllm.toolCallParser }}
                  --tool-call-parser {{ .Values.vllm.toolCallParser }} \
                  --enable-auto-tool-choice \
                  {{- end }}
                  {{- if .Values.vllm.reasoningParser }}
                  --reasoning-parser {{ .Values.vllm.reasoningParser }} \
                  {{- end }}
                  --host 0.0.0.0
            env:
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: HF_HUB_DISABLE_TELEMETRY
                value: "1"
              - name: PYTHONHASHSEED
                value: "0"
              - name: TOKENIZERS_PARALLELISM
                value: "false"
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              - name: ASCEND_RT_VISIBLE_DEVICES
                value: {{ include "vllmkv.tpDevices" (dict "tp" $tp) | quote }}
              - name: HCCL_OP_EXPANSION_MODE
                value: "AIV"
              - name: VLLM_USE_V1
                value: "1"
              - name: PYTORCH_NPU_ALLOC_CONF
                value: "expandable_segments:True"
              - name: ASCEND_BUFFER_POOL
                value: {{ .Values.vllm.ascendBufferPool | default "4:8" | quote }}
            ports:
              - containerPort: 8200
                name: http
                protocol: TCP
              {{- if $needsSidecar }}
              - containerPort: 5557
                name: kvpub
                protocol: TCP
              {{- end }}
              - containerPort: 9101
                name: vllmthr
                protocol: TCP
            volumeMounts:
              - name: model
                mountPath: /model
                readOnly: true
                subPath: {{ .Values.modelVolume.modelSubPath }}
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              {{- include "vllmkv.ascendDriverMounts" . | nindent 14 }}
            startupProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 12
              timeoutSeconds: 5
            livenessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            resources:
              requests:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "2Gi"
              limits:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "4Gi"

          {{- if $needsSidecar }}
          - name: kv-sidecar
            image: {{ include "vllmkv.image" (list . .Values.images.sidecar) }}
            imagePullPolicy: Always
            env:
              - name: ROUTER_URL
                value: "http://router-service:8080"
              - name: VLLM_URL
                value: "http://127.0.0.1:8200"
              - name: MODEL_NAME
                value: "served-model"
              - name: SIDECAR_PORT
                value: "9000"
              - name: BATCH_SIZE
                value: "{{ .Values.batchSize }}"
              - name: SIDECAR_MODE
                value: {{ quote (include "vllmkv.sidecarMode" .) }}
              - name: PULL_INTERVAL_S
                value: "0.05"
              - name: ROUTER_PULL_TIMEOUT_S
                value: "1000.0"
              - name: VLLM_TIMEOUT_S
                value: "1000.0"
              - name: ROUTER_RESULT_TIMEOUT_S
                value: "1000.0"
              - name: RESULT_TRANSPORT_MODE
                value: "submit_ack"
              - name: RESULT_SUBMIT_PATH
                value: "/result_submit"
              - name: VLLM_HOST
                value: "127.0.0.1"
              - name: VLLM_SUB_PORT
                value: "5557"
              - name: REDIS_HOST
                value: "redis"
              - name: REDIS_PORT
                value: "6379"
              - name: CONTAINER_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: MODEL_NAME_REDIS
                value: "served-model"
              - name: TRACE_ENABLED
                value: "true"
            ports:
              - containerPort: 9000
                name: sidecar-http
                protocol: TCP
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"
          {{- end }}

        volumes:
          - name: model
            {{- if .Values.modelVolume.hostPath }}
            hostPath:
              path: {{ .Values.modelVolume.hostPath }}
              type: Directory
            {{- else }}
            persistentVolumeClaim:
              claimName: {{ .Values.modelVolume.pvcName | default "models-nfs-pvc" }}
            {{- end }}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ mul $tp 16 }}Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          {{- include "vllmkv.ascendDriverVolumes" . | nindent 10 }}

    workerTemplate:
      metadata:
        labels:
          app: vllm-dp-worker
          role: worker
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        {{- if $ns }}
        nodeSelector:
          {{- toYaml $ns | nindent 10 }}
        {{- end }}
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-dp
                topologyKey: kubernetes.io/hostname
        containers:
          - name: vllm
            image: {{ include "vllmkv.image" (list . .Values.images.vllm) }}
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

                {{- if .Values.dataParallel.nicName }}
                nic_name="{{ .Values.dataParallel.nicName }}"
                {{- else }}
                local_ip="${NODE_IP}"
                nic_name=$(python3 -c "
                import os, socket, struct, fcntl
                local_ip = '${local_ip}'
                SIOCGIFADDR = 0x8915
                for iface in os.listdir('/sys/class/net/'):
                    if iface == 'lo': continue
                    try:
                        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                        ifreq = struct.pack('16sH14s', iface.encode(), socket.AF_INET, b'')
                        res = fcntl.ioctl(sock.fileno(), SIOCGIFADDR, ifreq)
                        ip = socket.inet_ntoa(res[20:24])
                        sock.close()
                        if ip == local_ip:
                            print(iface)
                            break
                    except: pass
                ")
                {{- end }}

                WORKER_INDEX="${POD_NAME##*-}"
                START_RANK=$(( WORKER_INDEX * {{ .Values.dataParallel.sizeLocal }} ))

                LEADER_IP=$(getent hosts ${LWS_LEADER_ADDRESS} | awk '{print $1}')
                echo "[vllm-dp-worker] nic=${nic_name} worker_idx=${WORKER_INDEX} start_rank=${START_RANK} leader_dns=${LWS_LEADER_ADDRESS} leader_ip=${LEADER_IP} node_ip=${NODE_IP}"

                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE={{ .Values.dataParallel.hcclBuffSize }}
                export OMP_NUM_THREADS={{ .Values.dataParallel.ompNumThreads }}

                exec vllm serve /model \
                  --headless \
                  --served-model-name served-model \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --tensor-parallel-size {{ $tp }} \
                  --data-parallel-size {{ $dpTotal }} \
                  --data-parallel-size-local {{ .Values.dataParallel.sizeLocal }} \
                  --data-parallel-address "${LEADER_IP}" \
                  --data-parallel-rpc-port {{ .Values.dataParallel.rpcPort }} \
                  --data-parallel-start-rank ${START_RANK} \
                  --dtype auto \
                  --kv-cache-dtype {{ .Values.vllm.kvCacheDtype | default "auto" }} \
                  {{- if .Values.vllm.cpuOffloadGb }}
                  --cpu-offload-gb {{ .Values.vllm.cpuOffloadGb }} \
                  {{- end }}
                  --max-num-seqs {{ .Values.batchSize }} \
                  {{- if .Values.vllm.enablePrefixCaching }}
                  --prefix-caching-hash-algo sha256_cbor \
                  {{- else }}
                  --no-enable-prefix-caching \
                  {{- end }}
                  {{- if .Values.vllm.gpuMemoryUtilization }}
                  --gpu-memory-utilization {{ .Values.vllm.gpuMemoryUtilization }} \
                  {{- end }}
                  {{- if .Values.vllm.quantization }}
                  --quantization {{ .Values.vllm.quantization }} \
                  {{- end }}
                  {{- if .Values.vllm.enableExpertParallel }}
                  --enable-expert-parallel \
                  {{- end }}
                  {{- if .Values.vllm.compilationConfig }}
                  --compilation-config '{"cudagraph_mode": "{{ .Values.vllm.compilationConfig.cudagraphMode }}"}' \
                  {{- end }}
                  {{- if .Values.vllm.trustRemoteCode }}
                  --trust-remote-code \
                  {{- end }}
                  {{- if .Values.vllm.maxNumBatchedTokens }}
                  --max-num-batched-tokens {{ .Values.vllm.maxNumBatchedTokens }} \
                  {{- end }}
                  {{- if .Values.vllm.seed }}
                  --seed {{ .Values.vllm.seed }} \
                  {{- end }}
                  {{- if .Values.vllm.maxModelLen }}
                  --max-model-len {{ .Values.vllm.maxModelLen }} \
                  {{- end }}
                  {{- if .Values.vllm.additionalConfig.multistreamOverlapSharedExpert }}
                  --additional-config '{"multistream_overlap_shared_expert": {{ .Values.vllm.additionalConfig.multistreamOverlapSharedExpert }}}' \
                  {{- end }}
                  {{- if .Values.vllm.speculativeConfig.numSpeculativeTokens }}
                  --speculative-config '{"num_speculative_tokens": {{ .Values.vllm.speculativeConfig.numSpeculativeTokens }}, "method": "{{ .Values.vllm.speculativeConfig.method }}"}' \
                  {{- end }}
                  {{- if .Values.vllm.toolCallParser }}
                  --tool-call-parser {{ .Values.vllm.toolCallParser }} \
                  --enable-auto-tool-choice \
                  {{- end }}
                  {{- if .Values.vllm.reasoningParser }}
                  --reasoning-parser {{ .Values.vllm.reasoningParser }} \
                  {{- end }}
            env:
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: HF_HUB_DISABLE_TELEMETRY
                value: "1"
              - name: PYTHONHASHSEED
                value: "0"
              - name: TOKENIZERS_PARALLELISM
                value: "false"
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              - name: ASCEND_RT_VISIBLE_DEVICES
                value: {{ include "vllmkv.tpDevices" (dict "tp" $tp) | quote }}
              - name: HCCL_OP_EXPANSION_MODE
                value: "AIV"
              - name: VLLM_USE_V1
                value: "1"
              - name: PYTORCH_NPU_ALLOC_CONF
                value: "expandable_segments:True"
              - name: ASCEND_BUFFER_POOL
                value: {{ .Values.vllm.ascendBufferPool | default "4:8" | quote }}
            volumeMounts:
              - name: model
                mountPath: /model
                readOnly: true
                subPath: {{ .Values.modelVolume.modelSubPath }}
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              {{- include "vllmkv.ascendDriverMounts" . | nindent 14 }}
            livenessProbe:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - "pgrep -f 'vllm.entrypoints' > /dev/null"
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 3
            resources:
              requests:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "2Gi"
              limits:
                huawei.com/Ascend: {{ $tp }}
                ephemeral-storage: "4Gi"

        volumes:
          - name: model
            {{- if .Values.modelVolume.hostPath }}
            hostPath:
              path: {{ .Values.modelVolume.hostPath }}
              type: Directory
            {{- else }}
            persistentVolumeClaim:
              claimName: {{ .Values.modelVolume.pvcName | default "models-nfs-pvc" }}
            {{- end }}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ mul $tp 16 }}Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          {{- include "vllmkv.ascendDriverVolumes" . | nindent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30034
{{- end }}
