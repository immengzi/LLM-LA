backend: router

replicas:
  router: 1
  vllm: 16

# Global override: if set, ALL images are rewritten to use this registry
global:
  imageRegistry: "reg.local:32000"
  # imageRegistry: "7.242.102.243:32000"  # set "" to disable rewriting
  # imageRegistry: ""  # set "" to disable rewriting

images:
  router: kv-router:latest
  sidecar: kv-sidecar:latest
  # vllm: quay.io/ascend/vllm-ascend:v0.11.0rc0
  # vllm: ascend/vllm-ascend:v0.11.0rc0
  # vllm: quay.io/ascend/vllm-ascend:latest
  vllm: quay.io/ascend/vllm-ascend:glm5-openeuler
  cpuHash: vllm-cpu-hash:latest
  redis: redis:7-alpine
  mooncakeMaster: quay.io/ascend/vllm-ascend:glm5-openeuler

sidecar:
  enabled: true     # set false in boom direct mode (no router/sidecar needed)
  logLevel: info    # debug | info | warning | error
  # Extra items to buffer beyond BATCH_SIZE (pull_cap = BATCH_SIZE + PREFETCH).
  # Workers = BATCH_SIZE + PREFETCH, extras queue inside vLLM's internal scheduler.
  # Control via sweep method --set sidecar.prefetch=N.
  prefetch: 0
  # When true, sidecar forces ignore_eos=True on every vLLM request
  # (replay mode: generate exactly max_tokens, finish_reason="length").
  forceIgnoreEos: false

router:
  # pull | push-rr | push-random | push-leastq
  mode: pull

  # API key for /v1/chat/completions (empty = no auth)
  apiKey: ""

  # Enable/disable KV-aware routing
  kvAware: true

  # Enable/disable length-aware batching/scheduling
  lenAware: true

  # Used only when lenAware=true
  # short_first | long_first | even_short_long
  lenPolicy: short_first

  # SLO-aware routing (disabled by default — zero impact on legacy path)
  sloAware: false
  sloWithKv: true
  admissionThrottle: false
  fixedBatchSize: 0
  outputLenPredictor: simple
  batchSizeEstimate: fixed
  fixedBatchEstimate: 8
  latencyPredictor: linear
  latencyOnlineUpdate: false
  latencyProfilePath: ""
  queueWaitModel: none
  chunkedPrefillAware: false
  maxNumBatchedTokens: 0

batchSize: 8

# Tensor parallelism size for vLLM (1 = no TP, 2 = 2-way, 4 = 4-way, etc.)
# This affects: --tensor-parallel-size, NPU resource limits, ASCEND_RT_VISIBLE_DEVICES, /dev/shm size
tensorParallelSize: 8

autoscaling:
  enabled: false

  minReplicaCount: null
  maxReplicaCount: 16
  threshold: "16"

  prometheusQuery: |
    max(router_central_queue_length{namespace="vllm"})

# Pin router + redis to a specific node by name (via kubernetes.io/hostname)
# Example node names from `kubectl get nodes`: master / master1 / worker1
pin:
  enabled: true
  nodeName: "node4"
  tolerations:
    # Allow scheduling onto control-plane/master nodes if tainted (common default)
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# PV and PVC are deployed ONCE manually on the parent NFS directory (e.g. /saeid/models/).
# The sweep runner always overrides modelVolume.create=false and sets modelSubPath per experiment.
# To deploy PV/PVC for the first time, run helm with:
#   --set modelVolume.create=true --set modelVolume.modelSubPath=<model-folder-name>
# modelVolume:
#   create: false
modelVolume:
  create: false                   # never recreated by sweep — deploy once externally
  nfsServer: nfs.local
  nfsPath: /saeid/models/         # parent directory containing all models
  # nfsPath: /saeid/models/qwen3-8b  # (old style — specific model path, no longer used)
  modelSubPath: ""                # set per-experiment by sweep (e.g. qwen3-8b, GLM-5-w4a8-mtp-QuaRot)
  pvcName: "models-nfs-pvc"       # PVC name when using NFS (default)
  hostPath: ""                     # set to local path (e.g. /home/haiting/models) to bypass NFS
                                  # must be set explicitly on first deploy via --set modelVolume.modelSubPath=<name>

# AIBrix integration.
# In backend=aibrix, vLLM pods expose labels so AIBrix gateway can discover them.
aibrix:
  enabled: false

  # Must match the vLLM --served-model-name
  modelName: "served-model"

  # Port where vLLM OpenAI server listens
  port: 8200

# vLLM runtime flags — all optional, set null to disable
vllm:
  # Memory / performance
  kvCacheDtype: "auto"             # "auto", "fp8", "fp8_e4m3" — fp8 halves KV cache memory
  cpuOffloadGb: null               # null = off; set to e.g. 3 to offload model weights to CPU for more KV cache
  ascendBufferPool: "4:8"          # NPU buffer pool config (set unconditionally for Ascend hardware)
  gpuMemoryUtilization: null       # null = use vLLM default
  quantization: null               # null = no quantization
  enableExpertParallel: false      # false = disable
  maxModelLen: null                # null = use model's default; set lower to save KV cache memory
  compilationConfig:
    cudagraphMode: "FULL_DECODE_ONLY"   # null = disable compilation config entirely

  # Additional optional flags (disabled by default)
  trustRemoteCode: false
  maxNumBatchedTokens: null        # null = use vLLM default
  seed: null                       # null = use vLLM default
  # Where default sampling params come from when a request omits them:
  #   null / omit — use the model checkpoint's generation_config.json (often temp=1, top_p=0.95 → startup WARNING)
  #   "vllm"      — use vLLM built-in defaults instead (--generation-config vllm)
  generationConfig: null
  additionalConfig: {}             # set to {multistreamOverlapSharedExpert: true} to enable
  speculativeConfig: {}            # set to {numSpeculativeTokens: 3, method: "deepseek_mtp"} to enable
  enablePrefixCaching: false       # true = enable prefix caching (uses KV cache memory)
  toolCallParser: null             # e.g. "qwen3_coder", "glm47" — also enables --enable-auto-tool-choice
  reasoningParser: null            # e.g. "qwen3", "glm45"
  hostNetwork: false

# -----------------------------------------------------------------------
# Unified model definitions.
#
# ALL deployment modes (single-model, multi-model, data-parallel) use
# this list. When populated, the chart renders one Deployment (or LWS)
# per model entry. When empty, a single-model fallback is synthesized
# from the top-level tensorParallelSize/batchSize/vllm values.
#
# The sweep runner (sweep_methods.py) always populates this list — either
# from the client YAML's helm.models[] or by auto-migrating legacy flat
# vllm_*/data_parallel_* fields.
#
# Per-model fields (camelCase):
#   name              - unique identifier (used in k8s resource names)
#   servedModelName   - vLLM --served-model-name (defaults to name)
#   replicas          - number of instances (Deployment pods, or LWS groups in DP mode)
#   modelSubPath      - subfolder under the model volume
#   tensorParallelSize - per-model TP
#   batchSize         - per-model --max-num-seqs
#   image             - optional per-model vLLM image override
#   vllm:             - per-model vLLM runtime flags (overrides top-level vllm:)
#   dataParallel:     - optional LWS config for this model
#     enabled: true
#     size: 2           # pods per DP group (1 leader + N-1 workers)
#     sizeLocal: 1      # --data-parallel-size-local per pod
#     rpcPort: 13389
#     nicName: ""       # GLOO/TP/HCCL_SOCKET_IFNAME (empty = auto-detect)
#     hcclBuffSize: 200
#     ompNumThreads: 16
#     pairTopologyKey: "" # node label key for RoCE-pair pinning (e.g. "roce-pair")
#                         # When set, pods in the same LWS group are forced onto
#                         # nodes sharing the same label value. Requires K8s 1.29+.
#                         # Label your nodes first:
#                         #   kubectl label node n1 n2 roce-pair=pair-a
#                         #   kubectl label node n3 n4 roce-pair=pair-b
#
# Example — single model:
# models:
#   - name: glm5-chat
#     servedModelName: served-model
#     replicas: 2
#     modelSubPath: GLM-5-w4a8-mtp-QuaRot
#     tensorParallelSize: 8
#     batchSize: 32
#     vllm:
#       gpuMemoryUtilization: 0.95
#       quantization: ascend
#       enableExpertParallel: true
#
# Example — data parallel (2 groups = 4 nodes total, pinned to RoCE pairs):
# models:
#   - name: glm5-dp
#     servedModelName: served-model
#     replicas: 2
#     modelSubPath: GLM-5-w4a8-mtp-QuaRot
#     tensorParallelSize: 8
#     batchSize: 32
#     dataParallel:
#       enabled: true
#       size: 2
#       pairTopologyKey: roce-pair   # pins each group to a node pair
#     vllm:
#       gpuMemoryUtilization: 0.95
#       quantization: ascend
#
# Example — multi-model:
# models:
#   - name: glm5-chat
#     servedModelName: glm5-chat
#     replicas: 1
#     modelSubPath: GLM-5-w4a8-mtp-QuaRot
#     tensorParallelSize: 8
#     batchSize: 32
#     vllm:
#       gpuMemoryUtilization: 0.95
#       quantization: ascend
#   - name: qwen3-8b
#     servedModelName: qwen3-8b
#     replicas: 4
#     modelSubPath: qwen3-8b
#     tensorParallelSize: 1
#     batchSize: 64
models: []

# Legacy top-level dataParallel — used as fallback when models[].dataParallel
# is not set. Prefer defining dataParallel per-model in the models[] list.
dataParallel:
  enabled: false
  size: 2
  groups: 1             # deprecated — use model's replicas field instead
  rpcPort: 13389
  sizeLocal: 1
  nicName: ""
  hcclBuffSize: 200
  ompNumThreads: 16
  pairTopologyKey: ""   # node label for RoCE-pair pinning (K8s 1.29+)

# -----------------------------------------------------------------------
# NFS page cache warm — pre-reads model shards before vLLM pods start.
#
# Large models (e.g. GLM-5 with 96 safetensor shards) can take hours to
# load from cold NFS. This Helm pre-install hook reads all shards once,
# warming the NFS server's page cache so vLLM pods load from memory.
#
# Runs as a Helm pre-install/pre-upgrade hook (Job) before vLLM pods start.
# Disabled by default — enable and set modelSubPath for large NFS-backed models.
cacheWarm:
  enabled: false
  pvcName: "models-nfs-pvc"
  modelSubPath: "GLM-5-w4a8-mtp-QuaRot"
  image: "busybox"
  ttlSeconds: 120

# -----------------------------------------------------------------------
# Mooncake KV cache transfer — optional enhancement WITHIN the router stack.
#
# When enabled, adds:
#   1. A mooncake-master Deployment (metadata coordination service)
#   2. A ConfigMap with mooncake.json
#   3. --kv-transfer-config on each vLLM worker
#   4. hostNetwork + HCCL NIC detection on vLLM pods
#
# Requires backend=router. Helm will fail if mooncake.enabled=true without it.
mooncake:
  enabled: false
  masterPort: 50088
  masterServerAddress: "10.50.156.106:50088"
  globalSegmentSize: 140000000000
  evictionHighWatermark: 0.9
  evictionRatio: 0.1
  ascendBufferPool: "4:8"
  lookupRpcPort: "10010"

# Component deployment control
# Set to false to skip deploying a component (used for decoupled vLLM/stack deploys)
deploy:
  vllm: true      # set false in stack-only deploys (sweep_methods --skip-vllm)
  router: true    # set false in vllm-only deploys (deploy_vllm.py)
  redis: true     # set false in vllm-only deploys (deploy_vllm.py)
  cpuHash: true   # set false in vllm-only deploys (deploy_vllm.py)
  mooncakeMaster: true    # set false to skip mooncake-master

# -----------------------------------------------------------------------
# LiteLLM proxy — production auth/spend gateway in front of the router.
#
# When enabled, deploys a LiteLLM proxy pod that:
#   - Accepts OpenAI-compatible requests from any external client
#   - Enforces virtual key auth, per-key/team spend limits, rate limits
#   - Forwards to router-service:8080/v1/chat/completions (the new shim)
#   - Optionally persists spend data to a Postgres DB
#
# Disabled by default — zero impact on benchmarking or existing paths.
# mu-load-test continues to hit the router directly for all experiments.
#
# To enable for production/demo:
#   helm upgrade vllm ./vllm-kv-stack \
#     --set litellm.enabled=true \
#     --set litellm.masterKey=sk-your-secret \
#     --set litellm.databaseUrl=postgresql://user:pass@host:5432/litellm
# -----------------------------------------------------------------------
litellm:
  enabled: false

  # LiteLLM proxy image — pulled from public ghcr.io or your private registry.
  # The global.imageRegistry rewrite applies here too if set.
  # image: ghcr.io/berriai/litellm:main-stable
  image: litellm:main-stable

  # Admin master key — used to generate virtual keys and access the admin UI.
  # Override this in production; never commit real keys here.
  masterKey: "sk-litellm-master"

  # NodePort for external cluster access (e.g. from a laptop or CI machine).
  # Access via http://<any-node-ip>:30400
  nodePort: 30400

  # Optional Postgres URL for spend tracking persistence.
  # Leave empty ("") to run in stateless mode — virtual keys still work but
  # spend history is lost on pod restart.
  # Example: "postgresql://litellm:password@postgres-host:5432/litellm"
  databaseUrl: ""

  # Resource requests/limits for the LiteLLM proxy container.
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# -----------------------------------------------------------------------
# BooM Gateway — Rust LLM API gateway in front of the router.
#
# When enabled, deploys a BooM Gateway pod that:
#   - Accepts OpenAI-compatible requests from any external client
#   - Enforces virtual key auth, per-key/team spend limits, rate limits
#   - Forwards to router-service:8080/v1/chat/completions (the router shim)
#   - Optionally persists spend data to a Postgres DB
#
# Same role as litellm but implemented in Rust for lower overhead.
# Disabled by default — zero impact on benchmarking or existing paths.
#
# To enable for production/demo:
#   helm upgrade vllm ./vllm-kv-stack \
#     --set boom.enabled=true \
#     --set boom.masterKey=sk-your-secret \
#     --set boom.databaseUrl=postgresql://user:pass@host:5432/boom
# -----------------------------------------------------------------------
boom:
  enabled: false

  # Routing mode — controls where BooM forwards requests:
  #   router  (default) — BooM → router-service → sidecar → vLLM (KV/len-aware)
  #   direct            — BooM → vLLM pods directly (no router/sidecar/redis/hash)
  # Use "direct" for A/B comparison to measure router value-add.
  routeVia: router

  # BooM routing strategy when routeVia=direct.
  # These map to real BooM scheduler policies:
  #   round_robin  — cycles through vLLM leader pods sequentially
  #   key_affinity — sticky routing per API key with load-aware rebalancing
  directRoutingStrategy: round_robin

  # Flow control — caps concurrent upstream connections per model deployment.
  # Without this, BooM opens one upstream connection per inflight request,
  # which can exhaust file descriptors under load.
  # Set to 0 to disable (unlimited). Excess requests queue inside BooM.
  maxInflight: 0

  # Upstream HTTP timeout (seconds) for BooM → router/vLLM (litellm_params.timeout).
  # Long generations need this high or BooM returns 502 ("Upstream provider unavailable").
  upstreamTimeoutSeconds: 7200

  # BooM Gateway image — built from BooMGateway-main/ and pushed to your registry.
  # The global.imageRegistry rewrite applies here too if set.
  image: boom-gateway:v4

  # Always pull so tag:latest (or any mutable tag) picks up the newest image after push.
  # Set to IfNotPresent to use cached layers only (not recommended with :latest).
  imagePullPolicy: Always

  # Admin master key — used to generate virtual keys and access the admin UI.
  # Override this in production; never commit real keys here.
  masterKey: "sk-boom-master"

  # NodePort for external cluster access (e.g. from a laptop or CI machine).
  # Access via http://<any-node-ip>:30401
  nodePort: 30401

  # Optional Postgres URL for spend tracking persistence.
  # Leave empty ("") to run in stateless mode — virtual keys still work but
  # spend history is lost on pod restart.
  # Example: "postgresql://boom:password@postgres-host:5432/boom"
  databaseUrl: ""

  # Enable Claude Code compatibility aliases.
  # When true, BooM config includes router_settings.model_group_alias that
  # maps standard Claude model names (claude-sonnet-4-20250514, etc.) to
  # "served-model", so Claude Code can connect via /v1/messages without
  # overriding model names in ~/.claude/settings.json.
  claudeCodeAliases: false

  # Additional model aliases (only when claudeCodeAliases=true).
  # Example: [{alias: "my-claude", target: "served-model"}]
  extraModelAliases: []

  # Resource requests/limits for the BooM Gateway container.
  # Lower than LiteLLM — Rust binary has much smaller memory footprint.
  resources:
    requests:
      cpu: "250m"
      memory: "128Mi"
    limits:
      cpu: "2000m"
      memory: "512Mi"