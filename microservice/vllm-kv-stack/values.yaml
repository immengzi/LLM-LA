backend: router

replicas:
  router: 1
  vllm: 16

# Global override: if set, ALL images are rewritten to use this registry
global:
  imageRegistry: "reg.local:32000"
  # imageRegistry: "7.242.102.243:32000"  # set "" to disable rewriting
  # imageRegistry: ""  # set "" to disable rewriting

images:
  router: kv-router:latest
  sidecar: kv-sidecar:latest
  # vllm: quay.io/ascend/vllm-ascend:v0.11.0rc0
  # vllm: ascend/vllm-ascend:v0.11.0rc0
  # vllm: quay.io/ascend/vllm-ascend:latest
  vllm: quay.io/ascend/vllm-ascend:glm5-openeuler
  cpuHash: vllm-cpu-hash:latest
  redis: redis:7-alpine

router:
  # pull | push-rr | push-random | push-leastq
  mode: pull

  # Enable/disable KV-aware routing
  kvAware: true

  # Enable/disable length-aware batching/scheduling
  lenAware: true

  # Used only when lenAware=true
  # short_first | long_first | even_short_long
  lenPolicy: short_first

batchSize: 8

# Tensor parallelism size for vLLM (1 = no TP, 2 = 2-way, 4 = 4-way, etc.)
# This affects: --tensor-parallel-size, NPU resource limits, ASCEND_RT_VISIBLE_DEVICES, /dev/shm size
tensorParallelSize: 8

autoscaling:
  enabled: false

  minReplicaCount: null
  maxReplicaCount: 16
  threshold: "16"

  prometheusQuery: |
    max(router_central_queue_length{namespace="vllm"})

# Pin router + redis to a specific node by name (via kubernetes.io/hostname)
# Example node names from `kubectl get nodes`: master / master1 / worker1
pin:
  enabled: true
  nodeName: "node4"
  tolerations:
    # Allow scheduling onto control-plane/master nodes if tainted (common default)
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# PV and PVC are deployed ONCE manually on the parent NFS directory (e.g. /saeid/models/).
# The sweep runner always overrides modelVolume.create=false and sets modelSubPath per experiment.
# To deploy PV/PVC for the first time, run helm with:
#   --set modelVolume.create=true --set modelVolume.modelSubPath=<model-folder-name>
# modelVolume:
#   create: false
modelVolume:
  create: false                   # never recreated by sweep — deploy once externally
  nfsServer: nfs.local
  nfsPath: /saeid/models/         # parent directory containing all models
  # nfsPath: /saeid/models/qwen3-8b  # (old style — specific model path, no longer used)
  modelSubPath: ""                # set per-experiment by sweep (e.g. qwen3-8b, GLM-5-w4a8-mtp-QuaRot)
                                  # must be set explicitly on first deploy via --set modelVolume.modelSubPath=<name>

# AIBrix integration.
# In backend=aibrix, vLLM pods expose labels so AIBrix gateway can discover them.
aibrix:
  enabled: false

  # Must match the vLLM --served-model-name
  modelName: "served-model"

  # Port where vLLM OpenAI server listens
  port: 8200

# vLLM runtime flags — all optional, set null to disable
vllm:
  # Memory / performance
  gpuMemoryUtilization: null       # null = use vLLM default
  quantization: null           # null = no quantization
  enableExpertParallel: false       # false = disable
  maxModelLen: null               # null = use model's default; set lower to save KV cache memory
  compilationConfig:
    cudagraphMode: "FULL_DECODE_ONLY"   # null = disable compilation config entirely

  # Additional optional flags (disabled by default)
  trustRemoteCode: false
  maxNumBatchedTokens: null        # null = use vLLM default
  seed: null                       # null = use vLLM default
  additionalConfig: null           # set to {multistreamOverlapSharedExpert: true} to enable
  speculativeConfig: null          # set to {numSpeculativeTokens: 3, method: "deepseek_mtp"} to enable

# Component deployment control
# Set to false to skip deploying a component (used for decoupled vLLM/stack deploys)
deploy:
  vllm: true      # set false in stack-only deploys (sweep_methods --skip-vllm)
  router: true    # set false in vllm-only deploys (deploy_vllm.py)
  redis: true     # set false in vllm-only deploys (deploy_vllm.py)
  cpuHash: true   # set false in vllm-only deploys (deploy_vllm.py)