# example_config.yaml
# Sample configuration for the microservice load client.

router_url: "http://127.0.0.1:30080"
total_requests: 100

prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "lmsys/lmsys-chat-1m"
  split: "train"
  tokenizer_name: "gpt2"
  streaming: false
  min_input_tokens: 32
  max_input_tokens: 512
  repeat_each: 1

load_pattern:
  pattern: "dump"

  rate_rps: 100.0
  duration_s: 60.0

  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0

  loadgen_seed: 12345

generation:
  max_tokens: 256
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
