# example_config.yaml
# Sample configuration for the microservice load client.

router_url: "http://127.0.0.1:30080"
total_requests: 200

# "file" or "hf-lmsys"
prompt_source: "file"

file_prompts:
  path: "prompts.json"
  variant: "medium"   # short | medium | long

hf_lmsys:
  dataset_name: "lmsys/lmsys-chat-1m"
  split: "train"
  tokenizer_name: "gpt2"
  streaming: false
  min_input_tokens: 32
  max_input_tokens: 512
  repeat_each: 1

load_pattern:
  # dump | det | poisson | bursty | steps | rand
  pattern: "det"

  rate_rps: 1.0
  duration_s: 60.0

  # Number of dummy warmup requests before timed load
  warmup_reqs: 2

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  # Used only when pattern == "steps"
  step_schedule: "0:5,30:15,60:3"

  # Used only when pattern == "rand"
  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0

  loadgen_seed: 12345

generation:
  max_tokens: 256
  temperature: 0.0
  # legacy | target-output | target-total
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
