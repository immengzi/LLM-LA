# boom-direct-glm-dp.yaml
# DIRECT MODE: BooM routes directly to vLLM pods, bypassing the KV-aware router.
# Use this for A/B comparison against boom-claude-glm-dp.yaml (which uses the router).
#
# In this mode:
#   - NO router-service, redis, cpu-hash, or sidecars are deployed.
#   - BooM routes directly to vLLM leader pods via stable LWS headless DNS.
#   - The "method" in master_config.yaml IS the BooM routing strategy:
#       round_robin   — simple round-robin across pods
#       key_affinity  — sticky routing per API key with load-aware rebalancing
#
# Everything else is identical to boom-claude-glm-dp.yaml.
# Claude Code connects via /v1/messages (Anthropic format) on port 30401.

backend: "boom"

router_url: "http://10.50.156.65:30080"
total_requests: 2000
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/mnt/nvme1/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/mnt/nvme1/saeid/models/GLM-5-w4a8-mtp-QuaRot"
  streaming: false
  min_input_tokens: 256
  max_input_tokens: 10000000
  repeat_each: 1

load_pattern:
  pattern: "det"
  rate_rps: 0.3
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: true
  replay_output_lengths_from: "303"

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

boom:
  base_url: "http://10.50.156.65:30401"
  chat_path: "/v1/chat/completions"
  model: "served-model"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: false

helm:
  boom_claude_aliases: true
  # boom_route_via: direct
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  nfs_path: "/saeid/models/GLM-5-w4a8-mtp-QuaRot"
  model_host_path: "/home/haiting/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  models:
    - name: glm5-chat
      servedModelName: served-model
      replicas: 4
      modelSubPath: GLM-5-w4a8-mtp-QuaRot
      tensorParallelSize: 8
      batchSize: 4
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 13389
        hcclBuffSize: 200
        ompNumThreads: 16
        pairTopologyKey: roce-pair
      vllm:
        gpuMemoryUtilization: 0.95
        quantization: ascend
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 4096
        seed: 1924
        toolCallParser: glm47
        reasoningParser: glm45
        additionalConfig:
          multistream_overlap_shared_expert: true
