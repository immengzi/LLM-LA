# router-slo.yaml
# Router-based experiment config with SLO-aware scheduling enabled.
# Multi-SLO traffic mix: chat (TTFT+TPOT), summarize (E2E), code (TPOT).
#
# This config activates SLO-aware routing on the router pod AND
# injects per-request SLO annotations from the load client.

backend: "router"

router_url: "http://10.50.156.65:30080"
total_requests: 128
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/mnt/nvme1/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/mnt/nvme1/saeid/models/qwen3-8b"
  streaming: false
  min_input_tokens: 256
  max_input_tokens: 10000000
  repeat_each: 8

load_pattern:
  pattern: "det"
  rate_rps: 5
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 5
  # max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 2.0
  include_debug_metrics: false
  model_name: "served-model"
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

# ---- SLO annotation config (client-side) ----
# The load client injects per-request SLO fields based on this mix.
# Fractions sum to 1.0 — every request gets an SLO annotation.
slo:
  enabled: true
  default_slo_type: "ttft+tpot"
  mix:
    - task_type: "chat"
      fraction: 0.5
      slo_type: "ttft+tpot"
      slo_ttft_ms: 500.0
      slo_tpot_ms: 50.0
    - task_type: "summarize"
      fraction: 0.3
      slo_type: "e2e"
      slo_e2e_ms: 10000.0
    - task_type: "code"
      fraction: 0.2
      slo_type: "tpot"
      slo_tpot_ms: 30.0

helm:
  replicas: 2
  batch_size: 8
  tensor_parallel_size: 8

  autoscaling_enabled: false
  autoscaling_min: 16
  autoscaling_max: 16
  autoscaling_threshold: "16"
  autoscaling_prometheus_query: |
    max(router_central_queue_length{namespace="vllm"})

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  # ---- SLO-aware routing (router-side) ----
  router_slo_aware: true
  router_slo_with_kv: true
  router_admission_throttle: true
  router_fixed_batch_size: 8
  router_output_len_predictor: "distribution"
  router_batch_size_estimate: "inflight"
  router_fixed_batch_estimate: 8
  router_latency_predictor: "linear"
  router_latency_online_update: true
  router_latency_profile_path: ""
  router_queue_wait_model: "simple"
  router_chunked_prefill_aware: false
  router_max_num_batched_tokens: 0

  # Model config
  model_name: "served-model"
  nfs_path: "/saeid/models/qwen3-8b"

  aibrix_enabled: false
  aibrix_model_name: "served-model"
  aibrix_port: 8200
