# boom-claude.yaml
# Deploys the full stack (vLLM + router + BooM Gateway) configured for Claude Code.
#
# BooM Gateway is deployed with Claude Code model aliases enabled, so a live
# Claude Code agent can connect via /v1/messages with its default model names.
#
# The load test runs a small validation pass (backend=boom, OpenAI format) to
# confirm the stack is healthy. The real client is Claude Code — see
# docs/boom_claude.md for ~/.claude/settings.json setup.

backend: "boom"

router_url: "http://7.216.57.215:30080"
total_requests: 8
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/mnt/nvme1/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/mnt/nvme1/saeid/models/qwen3-8b"
  streaming: false
  min_input_tokens: 256
  max_input_tokens: 10000000
  repeat_each: 8

load_pattern:
  pattern: "det"
  rate_rps: 2
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 5
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://7.216.57.215:31190"
  scrape_interval_s: 1.0
  window_s: 2.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "sync"
  submit_path: "/submit"
  results_zmq: ""
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

# BooM Gateway — load test validation uses OpenAI format;
# Claude Code connects separately via /v1/messages (Anthropic format).
boom:
  base_url: "http://7.216.57.215:30401"
  chat_path: "/v1/chat/completions"
  model: "served-model"
  api_key: "sk-boom-master"
  timeout_s: 1000.0
  stream: false

helm:
  boom_claude_aliases: true
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 16
  autoscaling_max: 16
  autoscaling_threshold: "16"
  autoscaling_prometheus_query: |
    max(router_central_queue_length{namespace="vllm"})

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  nfs_path: "/saeid/models/qwen3-8b"
  # model_host_path: "/home/haiting/models"  # uncomment to use local disk instead of NFS

  aibrix_enabled: false

  models:
    - name: qwen3-8b
      servedModelName: served-model
      replicas: 8
      modelSubPath: qwen3-8b
      tensorParallelSize: 1
      batchSize: 8
      vllm:
        toolCallParser: qwen3_coder
        reasoningParser: qwen3
