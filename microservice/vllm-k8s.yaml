# Source: vllm-kv-stack/templates/75-boom.yaml
# -----------------------------------------------------------------------
# Deployment: boom-proxy
# Single replica. Pinned to same node as router (pin.nodeName) when
# pin.enabled=true, so it stays co-located with the control plane.
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boom-proxy
  namespace: vllm
  labels:
    app: boom-proxy
    release: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boom-proxy
  template:
    metadata:
      labels:
        app: boom-proxy
        release: vllm
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "kubernetes.io/hostname"
                    operator: In
                    values:
                      - "node4"
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists

      containers:
        - name: boom
          image: reg.local:32000/boom-gateway:v4
          imagePullPolicy: Always

          args:
            - --config
            - /app/boom_config.yaml
            - --port
            - "4000"

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          volumeMounts:
            - name: boom-config
              mountPath: /app/boom_config.yaml
              subPath: boom_config.yaml

          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4

          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          resources:
            limits:
              cpu: 2000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 128Mi

          env:

      volumes:
        - name: boom-config
          configMap:
            name: boom-config
