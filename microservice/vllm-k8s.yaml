# Source: vllm-kv-stack/templates/40-vllm.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  replicas: 8
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
        model.aibrix.ai/name: "served-model"
        model.aibrix.ai/port: "8200"
    spec:
      restartPolicy: Always
      shareProcessNamespace: true

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - vllm-qwen

      containers:
        - name: vllm
          image: reg.local:32000/ascend/vllm-ascend:v0.11.0rc0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

              # --- start vLLM in background so we can launch a tiny exporter too
              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name served-model \
                --tensor-parallel-size 1 \
                --dtype float16 \
                --kv-cache-dtype auto \
                --max-num-seqs 8 \
                --prefix-caching-hash-algo sha256_cbor \
                --host 0.0.0.0 \
                &
              VLLM_PID=$!
              echo "[vllm-wrapper] vLLM PID=$VLLM_PID"

              # --- tiny Prometheus exporter on :9101 (serves ONLY /metrics)
              #     Exposes ONE metric: vllm_threads{pod="<podname>"} <N>
              VLLM_PID="$VLLM_PID" POD_NAME="$POD_NAME" python - <<'PY' &
              import os
              import time
              from http.server import BaseHTTPRequestHandler, HTTPServer

              PID = int(os.environ["VLLM_PID"])
              POD = os.environ.get("POD_NAME", "unknown")
              PORT = 9101

              def threads(pid: int):
                  try:
                      return len(os.listdir(f"/proc/{pid}/task"))
                  except Exception:
                      return None

              # Wait until /proc/PID exists (avoid startup race)
              for _ in range(120):
                  if os.path.exists(f"/proc/{PID}"):
                      break
                  time.sleep(0.25)

              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_response(404)
                          self.end_headers()
                          return

                      n = threads(PID)
                      if n is None:
                          body = "# vLLM pid not visible\n"
                      else:
                          body = 'vllm_threads{pod="%s"} %d\n' % (POD, n)

                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.end_headers()
                      self.wfile.write(body.encode("utf-8"))

                  def log_message(self, *args):
                      pass

              print(f"[vllm-thread-exporter] listening on :{PORT} (GET /metrics), pid={PID}, pod={POD}", flush=True)
              HTTPServer(("0.0.0.0", PORT), H).serve_forever()
              PY

              # keep container alive as long as vLLM lives
              wait "$VLLM_PID"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache

          startupProbe:
            httpGet:
              path: /health
              port: 8200
            periodSeconds: 10
            failureThreshold: 180
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 2

          resources:
            requests:
              huawei.com/Ascend910: 1
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend910: 1
              ephemeral-storage: "4Gi"

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-local-pvc
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
---
# Source: vllm-kv-stack/templates/50-podmonitors.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-qwen
  namespace: vllm
  labels:
    release: prometheus-kube-prometheus
spec:
  selector:
    matchLabels:
      app: vllm-qwen
  podMetricsEndpoints:
    - path: /metrics
      port: http
      scheme: http
      honorLabels: true
      interval: 1s

    - path: /metrics
      port: vllmthr
      scheme: http
      honorLabels: true
      interval: 1s
