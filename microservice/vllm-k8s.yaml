  name: vllm-qwen
  namespace: vllm
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: vllm-qwen
  podMetricsEndpoints:
    - path: /metrics
      port: http
      scheme: http
      honorLabels: true
      interval: 1s

    - path: /metrics
      port: vllmthr
      scheme: http
      honorLabels: true
      interval: 1s
