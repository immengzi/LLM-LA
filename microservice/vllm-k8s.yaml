# Source: vllm-kv-stack/templates/40-vllm.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      restartPolicy: Always
      shareProcessNamespace: true

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - vllm-qwen

      containers:
        - name: vllm
          image: reg.local:32000/ascend/vllm-ascend:glm5-openeuler
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail

              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

              # --- start vLLM in background so we can launch a tiny exporter too
              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name served-model \
                --tensor-parallel-size 8 \
                --dtype auto \
                --kv-cache-dtype auto \
                --max-num-seqs 8 \
                --prefix-caching-hash-algo sha256_cbor \
                --gpu-memory-utilization 0.95 \
                --quantization ascend \
                --enable-expert-parallel \
                --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
                --max-model-len 80000 \
                --host 0.0.0.0 \
                --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@served-model"}' \
                &
              VLLM_PID=$!
              echo "[vllm-wrapper] vLLM PID=$VLLM_PID"

              # --- tiny Prometheus exporter on :9101 (serves ONLY /metrics)
              #     Exposes ONE metric: vllm_threads{pod="<podname>"} <N>
              VLLM_PID="$VLLM_PID" POD_NAME="$POD_NAME" python - <<'PY' &
              import os
              import time
              from http.server import BaseHTTPRequestHandler, HTTPServer

              PID = int(os.environ["VLLM_PID"])
              POD = os.environ.get("POD_NAME", "unknown")
              PORT = 9101

              def threads(pid: int):
                  try:
                      return len(os.listdir(f"/proc/{pid}/task"))
                  except Exception:
                      return None

              # Wait until /proc/PID exists (avoid startup race)
              for _ in range(120):
                  if os.path.exists(f"/proc/{PID}"):
                      break
                  time.sleep(0.25)

              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_response(404)
                          self.end_headers()
                          return

                      n = threads(PID)
                      if n is None:
                          body = "# vLLM pid not visible\n"
                      else:
                          body = 'vllm_threads{pod="%s"} %d\n' % (POD, n)

                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.end_headers()
                      self.wfile.write(body.encode("utf-8"))

                  def log_message(self, *args):
                      pass

              print(f"[vllm-thread-exporter] listening on :{PORT} (GET /metrics), pid={PID}, pod={POD}", flush=True)
              HTTPServer(("0.0.0.0", PORT), H).serve_forever()
              PY

              # keep container alive as long as vLLM lives
              wait "$VLLM_PID"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ASCEND_RT_VISIBLE_DEVICES
              value: "0,1,2,3,4,5,6,7"
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 5557
              name: kvpub
              protocol: TCP
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
              subPath: GLM-5-w4a8-mtp-QuaRot
            - name: dshm
              mountPath: /dev/shm
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm

          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 1080
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 540
            timeoutSeconds: 2

          resources:
            requests:
              huawei.com/Ascend910: 8
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend910: 8
              ephemeral-storage: "4Gi"
        - name: kv-sidecar
          image: reg.local:32000/kv-sidecar:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ROUTER_URL
              value: "http://router-service:8080"
            - name: VLLM_URL
              value: "http://127.0.0.1:8200"
            - name: MODEL_NAME
              value: "served-model"

            - name: SIDECAR_PORT
              value: "9000"

            - name: BATCH_SIZE
              value: "8"

            - name: SIDECAR_MODE
              value: "pull"

            - name: PULL_INTERVAL_S
              value: "0.05"

            - name: ROUTER_PULL_TIMEOUT_S
              value: "1000.0"
            - name: VLLM_TIMEOUT_S
              value: "1000.0"
            - name: ROUTER_RESULT_TIMEOUT_S
              value: "1000.0"

            - name: RESULT_TRANSPORT_MODE
              value: "submit_ack"
            - name: RESULT_SUBMIT_PATH
              value: "/result_submit"

            - name: VLLM_HOST
              value: "127.0.0.1"
            - name: VLLM_SUB_PORT
              value: "5557"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MODEL_NAME_REDIS
              value: "served-model"

            - name: TRACE_ENABLED
              value: "true"

          ports:
            - containerPort: 9000
              name: sidecar-http
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: models-nfs-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
