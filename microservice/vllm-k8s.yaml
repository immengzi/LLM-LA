# Source: vllm-kv-stack/templates/43-vllm-lws.yaml
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm-dp
  namespace: vllm
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: vllm-qwen
          role: leader
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-dp
                topologyKey: kubernetes.io/hostname
        containers:
          - name: vllm
            image: reg.local:32000/ascend/vllm-ascend:glm5-openeuler
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
                nic_name="enp189s0f0"
                echo "[vllm-dp-leader] nic=${nic_name} leader_ip=${NODE_IP}"
                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE=200
                export OMP_NUM_THREADS=16

                exec python -m vllm.entrypoints.openai.api_server \
                  --model /model \
                  --tokenizer /model \
                  --port 8200 \
                  --served-model-name served-model \
                  --tensor-parallel-size 8 \
                  --data-parallel-size 2 \
                  --data-parallel-size-local 1 \
                  --data-parallel-address "${NODE_IP}" \
                  --data-parallel-rpc-port 13389 \
                  --dtype auto \
                  --kv-cache-dtype auto \
                  --max-num-seqs 32 \
                  --no-enable-prefix-caching \
                  --gpu-memory-utilization 0.95 \
                  --quantization ascend \
                  --enable-expert-parallel \
                  --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
                  --trust-remote-code \
                  --max-num-batched-tokens 4096 \
                  --seed 1924 \
                  --tool-call-parser glm47 \
                  --enable-auto-tool-choice \
                  --reasoning-parser glm45 \
                  --host 0.0.0.0
            env:
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: HF_HUB_DISABLE_TELEMETRY
                value: "1"
              - name: PYTHONHASHSEED
                value: "0"
              - name: TOKENIZERS_PARALLELISM
                value: "false"
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              - name: ASCEND_RT_VISIBLE_DEVICES
                value: "0,1,2,3,4,5,6,7"
              - name: HCCL_OP_EXPANSION_MODE
                value: "AIV"
              - name: VLLM_USE_V1
                value: "1"
              - name: PYTORCH_NPU_ALLOC_CONF
                value: "expandable_segments:True"
              - name: ASCEND_BUFFER_POOL
                value: "4:8"
            ports:
              - containerPort: 8200
                name: http
                protocol: TCP
              - containerPort: 5557
                name: kvpub
                protocol: TCP
              - containerPort: 9101
                name: vllmthr
                protocol: TCP
            volumeMounts:
              - name: model
                mountPath: /model
                readOnly: true
                subPath: GLM-5-w4a8-mtp-QuaRot
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              - name: dcmi-volume
                mountPath: /usr/local/dcmi
              - name: npu-smi-volume
                mountPath: /usr/local/bin/npu-smi
              - name: ascend-driver-lib64-volume
                mountPath: /usr/local/Ascend/driver/lib64/
              - name: version-info-volume
                mountPath: /usr/local/Ascend/driver/version.info
              - name: ascend-install-info-volume
                mountPath: /etc/ascend_install.info
            startupProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 12
              timeoutSeconds: 5
            livenessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            resources:
              requests:
                huawei.com/Ascend910: 8
                ephemeral-storage: "2Gi"
              limits:
                huawei.com/Ascend910: 8
                ephemeral-storage: "4Gi"
          - name: kv-sidecar
            image: reg.local:32000/kv-sidecar:latest
            imagePullPolicy: Always
            env:
              - name: ROUTER_URL
                value: "http://router-service:8080"
              - name: VLLM_URL
                value: "http://127.0.0.1:8200"
              - name: MODEL_NAME
                value: "served-model"
              - name: SIDECAR_PORT
                value: "9000"
              - name: BATCH_SIZE
                value: "32"
              - name: SIDECAR_MODE
                value: "pull"
              - name: PULL_INTERVAL_S
                value: "0.05"
              - name: ROUTER_PULL_TIMEOUT_S
                value: "1000.0"
              - name: VLLM_TIMEOUT_S
                value: "1000.0"
              - name: ROUTER_RESULT_TIMEOUT_S
                value: "1000.0"
              - name: RESULT_TRANSPORT_MODE
                value: "submit_ack"
              - name: RESULT_SUBMIT_PATH
                value: "/result_submit"
              - name: VLLM_HOST
                value: "127.0.0.1"
              - name: VLLM_SUB_PORT
                value: "5557"
              - name: REDIS_HOST
                value: "redis"
              - name: REDIS_PORT
                value: "6379"
              - name: CONTAINER_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: MODEL_NAME_REDIS
                value: "served-model"
              - name: TRACE_ENABLED
                value: "true"
            ports:
              - containerPort: 9000
                name: sidecar-http
                protocol: TCP
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"

        volumes:
          - name: model
            hostPath:
              path: /home/haiting/models
              type: Directory
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 128Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          - name: dcmi-volume
            hostPath:
              path: /usr/local/dcmi
              type: Directory
          - name: npu-smi-volume
            hostPath:
              path: /usr/local/bin/npu-smi
              type: File
          - name: ascend-driver-lib64-volume
            hostPath:
              path: /usr/local/Ascend/driver/lib64/
              type: Directory
          - name: version-info-volume
            hostPath:
              path: /usr/local/Ascend/driver/version.info
              type: File
          - name: ascend-install-info-volume
            hostPath:
              path: /etc/ascend_install.info
              type: File

    workerTemplate:
      metadata:
        labels:
          app: vllm-dp-worker
          role: worker
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-dp
                topologyKey: kubernetes.io/hostname
        containers:
          - name: vllm
            image: reg.local:32000/ascend/vllm-ascend:glm5-openeuler
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
                nic_name="enp189s0f0"

                WORKER_INDEX="${POD_NAME##*-}"
                START_RANK=$(( WORKER_INDEX * 1 ))

                LEADER_IP=$(getent hosts ${LWS_LEADER_ADDRESS} | awk '{print $1}')
                echo "[vllm-dp-worker] nic=${nic_name} worker_idx=${WORKER_INDEX} start_rank=${START_RANK} leader_dns=${LWS_LEADER_ADDRESS} leader_ip=${LEADER_IP} node_ip=${NODE_IP}"

                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE=200
                export OMP_NUM_THREADS=16

                exec vllm serve /model \
                  --headless \
                  --served-model-name served-model \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --tensor-parallel-size 8 \
                  --data-parallel-size 2 \
                  --data-parallel-size-local 1 \
                  --data-parallel-address "${LEADER_IP}" \
                  --data-parallel-rpc-port 13389 \
                  --data-parallel-start-rank ${START_RANK} \
                  --dtype auto \
                  --kv-cache-dtype auto \
                  --max-num-seqs 32 \
                  --no-enable-prefix-caching \
                  --gpu-memory-utilization 0.95 \
                  --quantization ascend \
                  --enable-expert-parallel \
                  --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
                  --trust-remote-code \
                  --max-num-batched-tokens 4096 \
                  --seed 1924 \
                  --tool-call-parser glm47 \
                  --enable-auto-tool-choice \
                  --reasoning-parser glm45 \
            env:
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: HF_HUB_DISABLE_TELEMETRY
                value: "1"
              - name: PYTHONHASHSEED
                value: "0"
              - name: TOKENIZERS_PARALLELISM
                value: "false"
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              - name: ASCEND_RT_VISIBLE_DEVICES
                value: "0,1,2,3,4,5,6,7"
              - name: HCCL_OP_EXPANSION_MODE
                value: "AIV"
              - name: VLLM_USE_V1
                value: "1"
              - name: PYTORCH_NPU_ALLOC_CONF
                value: "expandable_segments:True"
              - name: ASCEND_BUFFER_POOL
                value: "4:8"
            volumeMounts:
              - name: model
                mountPath: /model
                readOnly: true
                subPath: GLM-5-w4a8-mtp-QuaRot
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              - name: dcmi-volume
                mountPath: /usr/local/dcmi
              - name: npu-smi-volume
                mountPath: /usr/local/bin/npu-smi
              - name: ascend-driver-lib64-volume
                mountPath: /usr/local/Ascend/driver/lib64/
              - name: version-info-volume
                mountPath: /usr/local/Ascend/driver/version.info
              - name: ascend-install-info-volume
                mountPath: /etc/ascend_install.info
            livenessProbe:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - "pgrep -f 'vllm.entrypoints' > /dev/null"
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 3
            resources:
              requests:
                huawei.com/Ascend910: 8
                ephemeral-storage: "2Gi"
              limits:
                huawei.com/Ascend910: 8
                ephemeral-storage: "4Gi"

        volumes:
          - name: model
            hostPath:
              path: /home/haiting/models
              type: Directory
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 128Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          - name: dcmi-volume
            hostPath:
              path: /usr/local/dcmi
              type: Directory
          - name: npu-smi-volume
            hostPath:
              path: /usr/local/bin/npu-smi
              type: File
          - name: ascend-driver-lib64-volume
            hostPath:
              path: /usr/local/Ascend/driver/lib64/
              type: Directory
          - name: version-info-volume
            hostPath:
              path: /usr/local/Ascend/driver/version.info
              type: File
          - name: ascend-install-info-volume
            hostPath:
              path: /etc/ascend_install.info
              type: File
