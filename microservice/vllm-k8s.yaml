# -----------------------------------------------------------------------
# Service: boom-proxy
# ClusterIP on port 4000 for in-cluster access.
# NodePort on boom.nodePort for external access from dev machines / CI.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: boom-proxy
  namespace: vllm
  labels:
    app: boom-proxy
    release: vllm
spec:
  type: NodePort
  selector:
    app: boom-proxy
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30401
