# Source: vllm-kv-stack/templates/40-vllm-unified.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-qwen
      model: qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
        model: qwen
    spec:
      restartPolicy: Always
      shareProcessNamespace: true

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - vllm
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: model
                    operator: Exists
              topologyKey: kubernetes.io/hostname

      containers:
        - name: vllm
          image: reg.local:32000/ascend/vllm-ascend:glm5-openeuler
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eo pipefail

              export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name served-model \
                --tensor-parallel-size 8 \
                --dtype auto \
                --kv-cache-dtype auto \
                --max-num-seqs 32 \
                --no-enable-prefix-caching \
                --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
                --host 0.0.0.0 \
                &
              VLLM_PID=$!
              echo "[vllm-wrapper] vLLM PID=$VLLM_PID model=qwen"

              VLLM_PID="$VLLM_PID" POD_NAME="$POD_NAME" python - <<'PY' &
              import os, time
              from http.server import BaseHTTPRequestHandler, HTTPServer
              PID = int(os.environ["VLLM_PID"])
              POD = os.environ.get("POD_NAME", "unknown")
              PORT = 9101
              def threads(pid):
                  try: return len(os.listdir(f"/proc/{pid}/task"))
                  except: return None
              for _ in range(120):
                  if os.path.exists(f"/proc/{PID}"): break
                  time.sleep(0.25)
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_response(404); self.end_headers(); return
                      n = threads(PID)
                      body = 'vllm_threads{pod="%s"} %d\n' % (POD, n) if n else "# pid not visible\n"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.end_headers()
                      self.wfile.write(body.encode())
                  def log_message(self, *a): pass
              HTTPServer(("0.0.0.0", PORT), H).serve_forever()
              PY

              wait "$VLLM_PID"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ASCEND_RT_VISIBLE_DEVICES
              value: "0,1,2,3,4,5,6,7"
            - name: HCCL_OP_EXPANSION_MODE
              value: "AIV"
            - name: VLLM_USE_V1
              value: "1"
            - name: PYTORCH_NPU_ALLOC_CONF
              value: "expandable_segments:True"
            - name: ASCEND_BUFFER_POOL
              value: "4:8"
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
              subPath: GLM-5-w4a8-mtp-QuaRot
            - name: dshm
              mountPath: /dev/shm
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm

          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          resources:
            requests:
              huawei.com/Ascend: 8
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend: 8
              ephemeral-storage: "4Gi"

      volumes:
        - name: model
          hostPath:
            path: /home/haiting/models
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
---
# Source: vllm-kv-stack/templates/75-boom.yaml
# -----------------------------------------------------------------------
# Deployment: boom-proxy
# Single replica. Pinned to same node as router (pin.nodeName) when
# pin.enabled=true, so it stays co-located with the control plane.
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boom-proxy
  namespace: vllm
  labels:
    app: boom-proxy
    release: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boom-proxy
  template:
    metadata:
      labels:
        app: boom-proxy
        release: vllm
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "kubernetes.io/hostname"
                    operator: In
                    values:
                      - "node4"
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists

      containers:
        - name: boom
          image: reg.local:32000/boom-gateway:latest
          imagePullPolicy: IfNotPresent

          args:
            - --config
            - /app/boom_config.yaml
            - --port
            - "4000"

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          volumeMounts:
            - name: boom-config
              mountPath: /app/boom_config.yaml
              subPath: boom_config.yaml

          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4

          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          resources:
            limits:
              cpu: 2000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 128Mi

          env:

      volumes:
        - name: boom-config
          configMap:
            name: boom-config
