# Source: vllm-kv-stack/templates/20-cpu-hash.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu-hash
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cpu-hash
  template:
    metadata:
      labels:
        app: vllm-cpu-hash
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "kubernetes.io/hostname"
                    operator: In
                    values:
                      - "node4"
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists

      containers:
        - name: vllm-cpu-hash
          image: reg.local:32000/vllm-cpu-hash:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
            - /bin/bash
            - -c
          args:
            - |
              source /opt/venv/bin/activate 2>/dev/null || true && \
              python kv_cache_aware/prefix_hash_service.py \
                --model-path /model \
                --host 0.0.0.0 \
                --port 9095 \
                --block-size 128
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
          ports:
            - containerPort: 9095
              name: http
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
              subPath: GLM-5-w4a8-mtp-QuaRot
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: models-nfs-pvc
