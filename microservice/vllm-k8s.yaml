apiVersion: v1
kind: Namespace
metadata:
  name: vllm

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-local-pv
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/nvme1/saeid/models/qwen3-8b
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-local-pvc
  namespace: vllm
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: qwen-local-pv

# =====================================================================
# Redis deployment and service (NodePort)
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vllm
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379        # cluster-internal port
      targetPort: 6379  # container port
      nodePort: 30079   # external NodePort
  type: NodePort

# =====================================================================
# CPU hash service (prefix / block hashing)
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu-hash
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cpu-hash
  template:
    metadata:
      labels:
        app: vllm-cpu-hash
    spec:
      containers:
        - name: vllm-cpu-hash
          image: vllm-cpu-hash:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["/bin/bash", "-c"]
          args:
            - |
              source /opt/venv/bin/activate 2>/dev/null || true && \
              python kv_cache_aware/prefix_hash_service.py \
                --model-path /model \
                --host 0.0.0.0 \
                --port 9095 \
                --block-size 128
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
          ports:
            - containerPort: 9095
              name: http
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-local-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-cpu-hash
  namespace: vllm
spec:
  selector:
    app: vllm-cpu-hash
  ports:
    - name: http
      port: 9095         # cluster-internal
      targetPort: 9095   # container port
      nodePort: 30095    # external NodePort
  type: NodePort

# =====================================================================
# Router service (API + KV-aware scheduling)
# =====================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-router-sa
  namespace: vllm

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kv-router-role
  namespace: vllm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kv-router-rolebinding
  namespace: vllm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kv-router-role
subjects:
  - kind: ServiceAccount
    name: kv-router-sa
    namespace: vllm

---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-service
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router-service
  template:
    metadata:
      labels:
        app: router-service
    spec:
      serviceAccountName: kv-router-sa
      containers:
        - name: router
          image: kv-router:latest
          imagePullPolicy: IfNotPresent
          env:
            # Uvicorn / API host + port
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"

            # Entry-point / uvicorn access log
            - name: ACCESS_LOG
              value: "false"

            # Router logging
            - name: KV_LOG_KEYS
              value: "off"        # off | summary | full
            - name: REQ_LOG_MODE
              value: "summary"    # off | summary | full

            # Redis + model identity
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: MODEL_NAME
              value: "served-model"

            # K8s discovery for vLLM pods
            - name: NAMESPACE
              value: "vllm"
            - name: LABEL_SELECTOR
              value: "app=vllm-qwen"
            - name: VLLM_PORT
              value: "8200"

            # KV watcher tuning
            - name: KV_WATCH_INTERVAL_S
              value: "1.0"
            - name: KV_WATCH_MAX_KEYS
              value: "200"
            - name: KV_DISCOVERY_INTERVAL_S
              value: "5.0"

            # Hash service
            - name: HASH_SERVICE_URL
              value: "http://vllm-cpu-hash:9095"
            - name: HASH_TIMEOUT_S
              value: "2.0"

            # Routing features
            - name: KV_AWARE
              value: "true"
            - name: LEN_AWARE
              value: "true"
            - name: LEN_POLICY
              value: "short_first"   # short_first | long_first

            # Length selection pool size
            - name: POOL_FACTOR
              value: "4"

            # Predictor default max tokens (batch proxy)
            - name: DEFAULT_MAX_TOKENS
              value: "1024"

            # Router mode + sidecar port
            - name: ROUTER_MODE
              value: "pull"     # instead of pull / push-rr / push-random
            - name: SIDECAR_PORT
              value: "9000"

            # choose how least-queue gets its queue lengths
            - name: PUSH_LEASTQ_MODE
              value: "local"           # "health" (default) | "local"

            # Synchronous wait behavior
            - name: RESULT_TIMEOUT_S
              value: "1000.0"
            - name: RESULT_POLL_INTERVAL_S
              value: "0.02"

            # Push-mode HTTP timeouts
            - name: PUSH_HTTP_TIMEOUT_S
              value: "2.0"

            # Tracing (router-side timestamps, endpoint, etc.)
            - name: TRACE_ENABLED
              value: "true"

          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"


---
apiVersion: v1
kind: Service
metadata:
  name: router-service
  namespace: vllm
spec:
  type: NodePort
  selector:
    app: router-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

# =====================================================================
# vLLM Ascend deployment with KV events and sidecar
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  replicas: 8
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      restartPolicy: Always
      containers:
        - name: vllm
          image: quay.io/ascend/vllm-ascend:v0.11.0rc0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name served-model \
                --tensor-parallel-size 1 \
                --dtype float16 \
                --kv-cache-dtype auto \
                --max-num-seqs 8 \
                --prefix-caching-hash-algo sha256_cbor \
                --host 0.0.0.0 \
                --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@served-model"}'
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 5557
              name: kvpub
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              huawei.com/Ascend910: 1
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend910: 1
              ephemeral-storage: "4Gi"

        - name: kv-sidecar
          image: kv-sidecar:latest
          imagePullPolicy: IfNotPresent
          env:
            # Router and vLLM endpoints
            - name: ROUTER_URL
              value: "http://router-service:8080"
            - name: VLLM_URL
              value: "http://127.0.0.1:8200"
            - name: MODEL_NAME
              value: "served-model"

            # Sidecar HTTP and concurrency
            - name: SIDECAR_PORT
              value: "9000"
            - name: BATCH_SIZE
              value: "8"
            - name: SIDECAR_MODE
              value: "pull"
            - name: PULL_INTERVAL_S
              value: "0.05"

            # Sidecar HTTP timeouts
            - name: ROUTER_PULL_TIMEOUT_S
              value: "1000.0"
            - name: VLLM_TIMEOUT_S
              value: "1000.0"
            - name: ROUTER_RESULT_TIMEOUT_S
              value: "1000.0"

            # ZMQ → Redis KV sync
            - name: VLLM_HOST
              value: "127.0.0.1"
            - name: VLLM_SUB_PORT
              value: "5557"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MODEL_NAME_REDIS
              value: "served-model"

            # Tracing (sidecar + vLLM timestamps)
            - name: TRACE_ENABLED
              value: "true"

          ports:
            - containerPort: 9000
              name: sidecar-http
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-local-pvc
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: Directory


---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30034

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  selector:
    matchLabels:
      app: vllm-qwen
  podMetricsEndpoints:
    - path: /metrics
      port: http
      interval: 1s
