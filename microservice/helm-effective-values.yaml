COMPUTED VALUES:
aibrix:
  enabled: false
  modelName: served-model
  port: 8200
autoscaling:
  enabled: false
  maxReplicaCount: 16
  prometheusQuery: |
    max(router_central_queue_length{namespace="vllm"})
  threshold: "16"
backend: litellm
batchSize: 8
deploy:
  cpuHash: true
  redis: true
  router: true
  vllm: true
global:
  imageRegistry: reg.local:32000
images:
  cpuHash: vllm-cpu-hash:latest
  redis: redis:7-alpine
  router: kv-router:latest
  sidecar: kv-sidecar:latest
  vllm: quay.io/ascend/vllm-ascend:glm5-openeuler
litellm:
  databaseUrl: ""
  enabled: true
  image: litellm:main-stable
  masterKey: sk-litellm-master
  nodePort: 30400
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
modelVolume:
  create: false
  modelSubPath: qwen3-8b
  nfsPath: /saeid/models/
  nfsServer: nfs.local
pin:
  enabled: true
  nodeName: node4
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
replicas:
  router: 1
  vllm: 8
router:
  kvAware: true
  lenAware: true
  lenPolicy: short_first
  mode: pull
tensorParallelSize: 1
vllm:
  compilationConfig:
    cudagraphMode: FULL_DECODE_ONLY
  enableExpertParallel: false
  trustRemoteCode: false
