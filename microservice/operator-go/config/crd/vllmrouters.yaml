apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vllmrouters.kvstack.llm.io
spec:
  group: kvstack.llm.io
  names:
    kind: VllmRouter
    listKind: VllmRouterList
    plural: vllmrouters
    singular: vllmrouter
    shortNames:
      - vr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  default: 1
                routerMode:
                  type: string
                  enum: [pull, push-rr, push-random, push-leastq]
                  default: pull
                kvAware:
                  type: boolean
                  default: true
                lenAware:
                  type: boolean
                  default: true
                lenPolicy:
                  type: string
                  enum: [short_first, long_first]
                  default: short_first
                poolFactor:
                  type: integer
                  default: 4
                transportMode:
                  type: string
                  enum: [sync, async_pubsub]
                  default: sync
                redisHost:
                  type: string
                  default: redis
                redisPort:
                  type: integer
                  default: 6379
                port:
                  type: integer
                  default: 8080
                env:
                  type: object
                  additionalProperties:
                    type: string
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                    limits:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                ready:
                  type: integer
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.routerMode
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
