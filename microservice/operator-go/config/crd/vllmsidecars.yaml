apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vllmsidecars.kvstack.llm.io
spec:
  group: kvstack.llm.io
  names:
    kind: VllmSidecar
    listKind: VllmSidecarList
    plural: vllmsidecars
    singular: vllmsidecar
    shortNames:
      - vs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                sidecarMode:
                  type: string
                  enum: [pull, push]
                  default: pull
                batchSize:
                  type: integer
                  default: 8
                routerURL:
                  type: string
                  default: "http://router-service:8080"
                vllmURL:
                  type: string
                  default: "http://127.0.0.1:8200"
                modelName:
                  type: string
                  default: served-model
                redisHost:
                  type: string
                  default: redis
                redisPort:
                  type: integer
                  default: 6379
                port:
                  type: integer
                  default: 9000
                env:
                  type: object
                  additionalProperties:
                    type: string
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                    limits:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                ready:
                  type: integer
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.sidecarMode
        - name: BatchSize
          type: integer
          jsonPath: .spec.batchSize
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
