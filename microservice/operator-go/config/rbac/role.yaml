apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-go-router-role
  namespace: vllm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kvstack.llm.io"]
    resources: ["vllmrouters", "vllmsidecars", "vllmprefixhashes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kvstack.llm.io"]
    resources: ["vllmrouters/status", "vllmsidecars/status", "vllmprefixhashes/status"]
    verbs: ["update", "patch"]
