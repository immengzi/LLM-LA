apiVersion: v1
kind: Pod
metadata:
  name: ascend910b-job
  namespace: default
spec:
  nodeName: node4
  tolerations:
  - key: "node.kubernetes.io/disk-pressure"
    operator: "Exists"
    effect: "NoSchedule"
  initContainers:
  - name: wait-for-annotation
    image: quay.nju.edu.cn/ascend/vllm-ascend:v0.18.0rc1-openeuler
    imagePullPolicy: IfNotPresent
    command:
    - bash
    - -c
    - |
      echo "Waiting for huawei.com/Ascend910 annotation..."
      while true; do
        VAL=$(cat /etc/podinfo/ascend910)
        if [ -n "$VAL" ]; then
          echo "Annotation found: $VAL"
          exit 0
        fi
        echo "Annotation not yet set, retrying..."
        sleep 1
      done
    volumeMounts:
    - name: podinfo
      mountPath: /etc/podinfo
  containers:
  - name: vllm-container
    image: quay.nju.edu.cn/ascend/vllm-ascend:v0.18.0rc1-openeuler
    imagePullPolicy: IfNotPresent
    command: ["bash", "-c", "sleep infinity"]
    securityContext:
      privileged: true
    resources:
      limits:
        huawei.com/Ascend910: 1
      requests:
        huawei.com/Ascend910: 1
    env:
    - name: ASCEND_VISIBLE_DEVICES
      valueFrom:
        fieldRef:
          fieldPath: metadata.annotations['huawei.com/Ascend910']
    - name: LD_LIBRARY_PATH
      value: "/usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver"
    volumeMounts:
    - name: podinfo
      mountPath: /etc/podinfo
    - name: ascend-driver
      mountPath: /usr/local/Ascend/driver
    - name: ascend-dcmi
      mountPath: /usr/local/dcmi
    - name: ascend-version-info
      mountPath: /etc/ascend_install.info
    - name: npu-smi-tool
      mountPath: /usr/local/bin/npu-smi
  volumes:
  - name: podinfo
    downwardAPI:
      items:
      - path: "ascend910"
        fieldRef:
          fieldPath: metadata.annotations['huawei.com/Ascend910']
  - name: ascend-driver
    hostPath:
      path: /usr/local/Ascend/driver
      type: DirectoryOrCreate
  - name: ascend-dcmi
    hostPath:
      path: /usr/local/dcmi
      type: DirectoryOrCreate
  - name: ascend-version-info
    hostPath:
      path: /etc/ascend_install.info
      type: FileOrCreate
  - name: npu-smi-tool
    hostPath:
      path: /usr/local/bin/npu-smi
      type: FileOrCreate