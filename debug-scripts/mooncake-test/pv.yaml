---
# ============================================================
# PersistentVolume: 模型存储（NFS，只读）
# 与 helm template 对齐：
#   - storageClassName: "" 静态绑定
#   - mountOptions: ro, nfsvers=4.1
#   - annotation: helm.sh/resource-policy: keep
# ============================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-pv
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    type: model-storage
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - ro
    - nfsvers=4.1
  nfs:
    server: 7.242.102.243     # 替换为 243 的实际 IP（7.216.57.x 或 10.50.156.x）
    path: /mnt/nvme1/haiting_jd/models
    readOnly: true
