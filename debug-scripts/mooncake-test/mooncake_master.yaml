---
# ============================================================
# ConfigMap: mooncake.json
# 主节点 master_server_address 填 mooncake-master Pod 所在
# 节点（node1/215）的真实宿主机 IP
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mooncake-config
  namespace: vllm-mooncake
data:
  mooncake.json: |
    {
      "metadata_server": "P2PHANDSHAKE",
      "protocol": "ascend",
      "device_name": "",
      "master_server_address": "10.50.156.65:50088",
      "global_segment_size": 140000000000
    }

---
# ============================================================
# Mooncake Master Server - Deployment
# 固定调度到 node1（215），不占用 NPU
# 215 无 taint，无需 toleration
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooncake-master
  namespace: vllm-mooncake
  labels:
    app: mooncake-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mooncake-master
  template:
    metadata:
      labels:
        app: mooncake-master
    spec:
      # 固定调度到 215 节点
      nodeSelector:
        kubernetes.io/hostname: node3

      # mooncake master 需要监听宿主机真实 IP 的 50088 端口
      # 开启 hostNetwork 使 Pod 直接使用宿主机网络栈
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
            readOnly: true
        - name: mooncake-config
          configMap:
            name: mooncake-config
        - name: mooncake-logs
          hostPath:
            path: /mnt/nvme1/haiting_jd/mooncake_logs
            type: DirectoryOrCreate

      containers:
        - name: mooncake-master
          # 与 vLLM worker 使用同一镜像，mooncake_master 已内置
          image: your-registry/vllm-ascend:latest
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
            - |
              set -e

              # 自动检测本节点物理网卡名和 IP
              nic_name=$(ip addr show | grep 'inet ' | grep -v '127.0.0.1' | head -1 | awk '{print $NF}')
              local_ip="${NODE_IP}"
              echo "[mooncake-master] auto-detected nic=${nic_name} ip=${local_ip}"

              export HCCL_OP_EXPANSION_MODE="AIV"
              export HCCL_IF_IP=${local_ip}
              export GLOO_SOCKET_IFNAME=${nic_name}
              export TP_SOCKET_IFNAME=${nic_name}
              export HCCL_SOCKET_IFNAME=${nic_name}
              export HCCL_BUFFSIZE=200

              export OMP_PROC_BIND=false
              export OMP_NUM_THREADS=16
              export PYTHONHASHSEED=0
              export PYTHONPATH=${PYTHONPATH}:/vllm-workspace/vllm

              export VLLM_USE_V1=1
              export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
              export MOONCAKE_CONFIG_PATH="/workspace/glm5/mooncake.json"
              export ASCEND_BUFFER_POOL=4:8
              export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH}

              mkdir -p /workspace/glm5/mooncake_logs
              timestamp=$(date "+%Y%m%d%H%M%S")

              echo "[mooncake-master] timestamp: ${timestamp}"
              echo "[mooncake-master] local_ip: ${local_ip}, nic: ${nic_name}"
              echo "[mooncake-master] Starting on port 50088..."

              mooncake_master \
                --port 50088 \
                --eviction_high_watermark_ratio 0.9 \
                --eviction_ratio 0.1 \
                2>&1 | split -b 5M -d -a 5 - /workspace/glm5/mooncake_logs/logs_${timestamp}_

          ports:
            - name: grpc
              containerPort: 50088
              protocol: TCP

          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: HCCL_OP_EXPANSION_MODE
              value: "AIV"
            - name: HCCL_BUFFSIZE
              value: "200"
            - name: OMP_PROC_BIND
              value: "false"
            - name: OMP_NUM_THREADS
              value: "16"
            - name: PYTHONHASHSEED
              value: "0"
            - name: PYTHONPATH
              value: "/vllm-workspace/vllm"
            - name: VLLM_USE_V1
              value: "1"
            - name: PYTORCH_NPU_ALLOC_CONF
              value: "expandable_segments:True"
            - name: MOONCAKE_CONFIG_PATH
              value: "/workspace/glm5/mooncake.json"
            - name: ASCEND_BUFFER_POOL
              value: "4:8"
            - name: LD_LIBRARY_PATH
              value: "/usr/local/lib"

          volumeMounts:
            - name: model-storage
              mountPath: /workspace/glm5
            - name: mooncake-config
              mountPath: /workspace/glm5/mooncake.json
              subPath: mooncake.json
              readOnly: true
            - name: mooncake-logs
              mountPath: /workspace/glm5/mooncake_logs

          livenessProbe:
            tcpSocket:
              port: 50088
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50088
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

      restartPolicy: Always

# hostNetwork: true 模式下 mooncake-master 直接绑定宿主机网络，
# 所有 vLLM Pod 通过 mooncake.json 里的宿主机 IP 直接访问，
# 不需要 ClusterIP Service。