---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mooncake-config
  namespace: vllm-test
data:
  mooncake.json: |
    {
      "metadata_server": "P2PHANDSHAKE",
      "protocol": "ascend",
      "device_name": "",
      "master_server_address": "10.50.156.65:50088",
      "global_segment_size": 140000000000
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooncake-master
  namespace: vllm-test
  labels:
    app: mooncake-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mooncake-master
  template:
    metadata:
      labels:
        app: mooncake-master
    spec:
      nodeSelector:
        kubernetes.io/hostname: node3
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      volumes:
        # NFS 挂载根路径 /mnt/nvme1（fsid=0，必须挂 /）
        # 容器内 /workspace/glm5 对应宿主机 /mnt/nvme1
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
            readOnly: true

        # mooncake.json 挂载到 NFS 只读区域之外
        # 容器内路径：/etc/mooncake/mooncake.json
        - name: mooncake-config
          configMap:
            name: mooncake-config

        # 日志目录：hostPath，可写，在 NFS 挂载之外
        # 容器内路径：/workspace/mooncake_logs
        - name: mooncake-logs
          hostPath:
            path: /mnt/nvme1/haiting_jd/mooncake_logs
            type: DirectoryOrCreate

        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File

      containers:
        - name: mooncake-master
          image: quay.io/ascend/vllm-ascend:glm5-openeuler
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64

              nic_name=$(ip addr show | grep 'inet ' | grep -v '127.0.0.1' | head -1 | awk '{print $NF}')
              local_ip="${NODE_IP}"
              echo "[mooncake-master] auto-detected nic=${nic_name} ip=${local_ip}"

              export HCCL_OP_EXPANSION_MODE="AIV"
              export HCCL_IF_IP=${local_ip}
              export GLOO_SOCKET_IFNAME=${nic_name}
              export TP_SOCKET_IFNAME=${nic_name}
              export HCCL_SOCKET_IFNAME=${nic_name}
              export HCCL_BUFFSIZE=200

              export OMP_PROC_BIND=false
              export OMP_NUM_THREADS=16
              export PYTHONHASHSEED=0
              export PYTHONPATH=${PYTHONPATH}:/vllm-workspace/vllm
              export VLLM_USE_V1=1
              export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

              # mooncake.json 挂载在 NFS 只读区域之外
              export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
              export ASCEND_BUFFER_POOL=4:8
              export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH}

              mkdir -p /workspace/mooncake_logs
              timestamp=$(date "+%Y%m%d%H%M%S")

              echo "[mooncake-master] timestamp: ${timestamp}"
              echo "[mooncake-master] local_ip: ${local_ip}, nic: ${nic_name}"
              echo "[mooncake-master] MOONCAKE_CONFIG_PATH: ${MOONCAKE_CONFIG_PATH}"
              echo "[mooncake-master] ASCEND_BUFFER_POOL: ${ASCEND_BUFFER_POOL}"
              echo "[mooncake-master] Starting mooncake_master on port 50088..."

              mooncake_master \
                --port 50088 \
                --eviction_high_watermark_ratio 0.9 \
                --eviction_ratio 0.1

          ports:
            - name: grpc
              containerPort: 50088
              protocol: TCP

          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: HCCL_OP_EXPANSION_MODE
              value: "AIV"
            - name: OMP_PROC_BIND
              value: "false"
            - name: OMP_NUM_THREADS
              value: "16"
            - name: VLLM_USE_V1
              value: "1"
            - name: HCCL_BUFFSIZE
              value: "200"
            - name: PYTORCH_NPU_ALLOC_CONF
              value: "expandable_segments:True"
            - name: PYTHONHASHSEED
              value: "0"
            - name: PYTHONPATH
              value: "/vllm-workspace/vllm"
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake.json"
            - name: ASCEND_BUFFER_POOL
              value: "4:8"
            - name: LD_LIBRARY_PATH
              value: "/usr/local/lib"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"

          volumeMounts:
            # NFS 只读，挂到 /workspace/glm5
            # 模型在 /workspace/glm5/haiting_jd/models/qwen3-32b
            - name: model-storage
              mountPath: /workspace/glm5
              readOnly: true
            # mooncake.json 挂到 NFS 只读区域之外
            - name: mooncake-config
              mountPath: /etc/mooncake/mooncake.json
              subPath: mooncake.json
              readOnly: true
            # 日志目录，可写，在 NFS 之外
            - name: mooncake-logs
              mountPath: /workspace/mooncake_logs
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info

          livenessProbe:
            tcpSocket:
              port: 50088
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50088
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

      restartPolicy: Always