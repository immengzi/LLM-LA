apiVersion: v1
kind: Namespace
metadata:
  name: vllm
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-local-pv-1 # Unique name
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    # ❗️ IMPORTANT: Path to your model files on the K8s node
    path: /mnt/storage1/haiting/qwen-test
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-local-pvc-1 # Unique name
  namespace: vllm
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: qwen-local-pv-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-ascend-1 # Unique name
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-ascend-1 # Unique label
  template:
    metadata:
      labels:
        app: vllm-ascend-1 # Unique label
    spec:
      restartPolicy: Always
      containers:
        - name: vllm
          image: quay.io/ascend/vllm-ascend:v0.10.1rc1
          imagePullPolicy: IfNotPresent
          command:
            - "python"
            - "-m"
            - "vllm.entrypoints.openai.api_server"
          args:
            # --- ⚙️ Edit Your Batch Size Here ---
            - "--model"
            - "/model"
            - "--port"
            - "8200"
            - "--served-model-name"
            - "served-model"
            # To set a custom batch size, uncomment the next two lines.
            - "--max-num-seqs"
            - "8"
          ports:
            - containerPort: 8200
              name: http
          volumeMounts:
            - name: model
              mountPath: /model
          resources:
            limits:
              huawei.com/Ascend: 1
            requests:
              huawei.com/Ascend: 1
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-local-pvc-1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-ascend-1-svc # Unique name
  namespace: vllm
spec:
  type: NodePort # This makes the service accessible from outside the cluster
  selector:
    app: vllm-ascend-1 # Matches the deployment's label
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30003 # Unique external port