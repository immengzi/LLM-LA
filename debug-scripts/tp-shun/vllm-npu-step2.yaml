apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-npu-test-myname
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-npu-test-myname
  template:
    metadata:
      labels:
        app: vllm-npu-test-myname
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - node1
      hostNetwork: true
      containers:
      - name: vllm-container
        image: quay.io/ascend/vllm-ascend:v0.13.0-openeuler
        command: ["/bin/bash", "-c"]
        # CHANGED - different model and TP
        args: [
          "source /usr/local/Ascend/ascend-toolkit/set_env.sh && source /usr/local/Ascend/nnal/atb/set_env.sh && python3 -m vllm.entrypoints.openai.api_server --model Qwen/Qwen3-32B --trust-remote-code --port 8000 --tensor-parallel-size 2"
        ]
        securityContext:
          capabilities:
            add: ["SYS_NICE"]
        # CHANGED - Multi-card
        resources:
          limits:
            huawei.com/Ascend: 2
        env:
        - name: LD_LIBRARY_PATH
          value: "/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver/lib64:/usr/lib64:$LD_LIBRARY_PATH"
        # CHANGED - Multi-card device name
        - name: ASCEND_RT_VISIBLE_DEVICES
          value: "0,1"
        - name: http_proxy
          value: "http://127.0.0.1:3128"
        - name: https_proxy
          value: "http://127.0.0.1:3128"
        - name: HTTP_PROXY
          value: "http://127.0.0.1:3128"
        - name: HTTPS_PROXY
          value: "http://127.0.0.1:3128"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: ascend-driver
          mountPath: /usr/local/Ascend/driver
          readOnly: true
        - name: npu-smi
          mountPath: /usr/local/bin/npu-smi
          readOnly: true
        - name: ascend-install-info
          mountPath: /etc/ascend_install.info
          readOnly: true
      volumes:
      # CHANGED - share mem size
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      # CHANGED - your own model path
      - name: hf-cache
        hostPath:
          path: /workspace/shunyi/hf_cache/huggingface
      - name: ascend-driver
        hostPath:
          path: /usr/local/Ascend/driver
      - name: npu-smi
        hostPath:
          path: /usr/local/bin/npu-smi
      - name: ascend-install-info
        hostPath:
          path: /etc/ascend_install.info