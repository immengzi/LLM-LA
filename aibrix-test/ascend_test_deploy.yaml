apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b
  namespace: aibrix-test
  labels:
    model.aibrix.ai/name: qwen3-8b
    model.aibrix.ai/port: "8000"
spec:
  replicas: 2
  selector:
    matchLabels:
      model.aibrix.ai/name: qwen3-8b
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        model.aibrix.ai/name: qwen3-8b
        model.aibrix.ai/port: "8000"
    spec:
      nodeSelector:
        accelerator: "huawei-Ascend910"
        kubernetes.io/hostname: "master1"
      containers:
        - name: vllm-openai
          image: quay.io/ascend/vllm-ascend:v0.13.0rc1
          imagePullPolicy: IfNotPresent
          # 修改 1: 使用 bash 确保 source 命令可用
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # 修改 2: 增强型环境变量加载
              if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then
                  source /usr/local/Ascend/ascend-toolkit/set_env.sh
              fi
              # 修改 3: 显式指定动态库路径，防止推理时找不到 .so 文件
              export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
              
              # 启动 vLLM
              python3 -m vllm.entrypoints.openai.api_server \
                --host "0.0.0.0" \
                --port "8000" \
                --model /models \
                --served-model-name qwen3-8b \
                --enable-prefix-caching \
                --trust-remote-code \
                --dtype float16 \
                --max-model-len 4096
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ASCEND_VISIBLE_DEVICES
              value: "1"
          resources:
            limits:
              huawei.com/Ascend910: "1" 
            requests:
              huawei.com/Ascend910: "1"
          volumeMounts:
            - name: model-vol
              mountPath: /models
              readOnly: true
            - name: ascend-driver-lib64
              mountPath: /usr/local/Ascend/driver/lib64/
              readOnly: true
      volumes:
        - name: model-vol
          persistentVolumeClaim:
            claimName: qwen-master1-pvc 
        - name: ascend-driver-lib64
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
