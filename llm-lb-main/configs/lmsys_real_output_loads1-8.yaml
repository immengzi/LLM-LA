# ===========================
# REAL WORKING CONFIG (flat, all load variants)
# ===========================
# Modes:
#   - REAL only (pods): SIM_MODE: "off"
#
# Length:
#   - Distribution: LENGTH_MODE: "dist-output"; SIM_VARY_OUT_TOKENS: true; pick ONE SIM_OUT_DIST
#   - Fixed:        LENGTH_MODE: "target-output"; TARGET_OUTPUT_TOKENS: 128; SIM_VARY_OUT_TOKENS: false
#
# Token scale presets (change MAX_TOKENS + uncomment matching SIM_OUT_DIST):
#   - Medium (default): MAX_TOKENS: 1024 + one of the MEDIUM blocks
#   - High:             MAX_TOKENS: 2048 + one of the HIGH blocks
#   - Very Large:       MAX_TOKENS: 8192 + the VERY_LARGE_HIST block
#   - Low:              MAX_TOKENS: 256  + one of the LOW blocks

# ------- REAL endpoints only -------
SIM_MODE: "off"

# ------- Global caps / general -------
MAX_TOKENS: 8192        # Medium cap (default). For HIGH use 2048; VERY LARGE use 8192; LOW use 256
IGNORE_EOS: false

# ------- Length policy -------
LENGTH_MODE: "legacy"      # Distribution mode (default for this file)
TARGET_OUTPUT_TOKENS: null
TARGET_TOTAL_TOKENS: null

# Distribution RNG
LENGTH_DIST_SEED: 2025
LENGTH_DIST_BY_PROMPT: true
SIM_VARY_OUT_TOKENS: true

# =======================
# DISTRO: pick ONE block
# =======================

# ---- MEDIUM tokens (default) ----
SIM_OUT_DIST:
  kind: "hist"
  values: [32, 4096]
  probs:  [0.7, 0.3]
  min: 16
  max: 40960

USE_LEN_AWARE: false
LEN_POLICY: short_first
PRED_LEN_THRESHOLD: 33
POOL_FACTOR: 400

# =========================
# Input token estimation
# =========================
SIM_VARY_IN_TOKENS: true
SIM_CHARS_PER_TOKEN: 4.0
SIM_IN_MIN: 1
SIM_IN_MAX: 8192

# =========================
# Router/discovery basics
# =========================
NAMESPACE: "vllm"
LABEL_SELECTOR: "app=vllm-qwen"
VLLM_PORT: 8200

MAX_INFLIGHT_PER_EP: 8

# =========================
# Load generation knobs
# =========================
# Choose ONE pattern below (uncomment only one LOAD_PATTERN block)

# ---- A) Dump: enqueue everything immediately ----
# LOAD_PATTERN: "dump"
# (no rate knobs needed)
# LOAD_WARMUP_S: 0.0
# LOAD_DURATION_S: 999999.0

# ---- B) Deterministic fixed rate ----
# LOAD_PATTERN: "det"
# LOAD_RATE_RPS: 4.0
# LOAD_WARMUP_S: 0.0
# LOAD_DURATION_S: 999999.0

# ---- C) Poisson arrivals (exponential inter-arrival) ----
# LOAD_PATTERN: "poisson"
# LOAD_RATE_RPS: 4.0
# LOAD_WARMUP_S: 0.0
# LOAD_DURATION_S: 999999.0

# ---- D) Bursty on/off pattern ----
# LOAD_PATTERN: "bursty"
# LOAD_WARMUP_S: 0.0
# LOAD_DURATION_S: 999999.0
# BURST_ON_S: 2.0
# BURST_OFF_S: 2.0
# BURST_RPS_ON: 10.0
# BURST_RPS_OFF: 0.0

# ---- E) Step schedule (piecewise RPS) ----
# LOAD_PATTERN: "steps"
# LOAD_WARMUP_S: 0.0
# LOAD_DURATION_S: 999999.0
# STEP_SCHEDULE: "0:3,30:8,60:1"

# ---- F) Random range (re-sample RPS every epoch) ----
LOAD_PATTERN: "rand"
LOAD_WARMUP_S: 0.0
LOAD_DURATION_S: 999999.0
RAND_RPS_MIN: 1.0
RAND_RPS_MAX: 8.0
RAND_EPOCH_S: 1.0
RAND_KIND: "poisson"    #  det/poisson

# Common knobs
LENGTH_DIST_STRICT_HIST: true
LENGTH_HIST_SERIES_LABEL: "default"

# =========================
# Prompt source
# =========================
PROMPTS_SOURCE: "hf-lmsys"          # "file" | "hf-lmsys"
HF_DATASET_NAME: "lmsys/lmsys-chat-1m"
HF_DATASET_SPLIT: "train"
HF_TOKENIZER_NAME: "/mnt/nvme1/saeid/models/qwen3-8b"
HF_STREAMING: false
PROMPTS_LIMIT: 100
