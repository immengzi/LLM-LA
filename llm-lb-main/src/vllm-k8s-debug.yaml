apiVersion: v1
kind: Namespace
metadata:
  name: vllm

---
# Optional: hostPath so /model inside the pod points to your node path.
# If you prefer a PVC instead, swap this section for a PV+PVC pair.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-pv
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/nvme1/saeid/models/qwen3-4b
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-pvc
  namespace: vllm
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: qwen-pv

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      restartPolicy: Always
      containers:
        - name: vllm
          # Pin a concrete version to ensure identical stacks across replicas/nodes
          image: quay.io/ascend/vllm-ascend:v0.10.1rc1 #vllm-ascend:v0.11.0rc0
          imagePullPolicy: IfNotPresent
          # command: #edit the command for the vllm-ascend image since the ENTRYPOINT is not working as the original vllm image
          #   - "python"
          #   - "-m"
          #   - "vllm.entrypoints.openai.api_server"
          command: ["/bin/sh", "-c", "sleep infinity"]
          # vLLM image entrypoint already runs the OpenAI server; just pass args.
          # command: ["/bin/bash", "-c"]
          # args:
          # - |
          #   echo "--- DIAGNOSTIC --- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
          #   source /usr/local/Ascend/ascend-toolkit/set_env.sh && \
          #   export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64 && \
          #   python -m vllm.entrypoints.openai.api_server \
          #   --model /model \
          #   --tokenizer /model \
          #   --port 8200 \
          #   --served-model-name served-model \
          #   --max-num-seqs 512
            # - "--model"
            # - "/model"
            # - "--tokenizer"
            # - "/model"
            # - "--port"
            # - "8200"
            # - "--served-model-name"
            # - "served-model"
            # - "--max-num-seqs"
            # - "512"
            # - "--model"
            # - "/model"
            # - "--tokenizer"
            # - "/model"
            # - "--port"
            # - "8200"
            # - "--served-model-name"
            # - "served-model"
            # # Keep fast paths; avoid enforce-eager for performance while comparing determinism
            # - "--tensor-parallel-size"
            # - "1"
            # - "--dtype"
            # - "float16"
            # - "--kv-cache-dtype"
            # - "auto"
  
            # If you require KV transfer and your image supports it, uncomment:
            # - "--kv-transfer-config"
            # - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          # env:
          #   # Use local/offline model files so both replicas read the same bytes
          #   - name: HF_HUB_OFFLINE
          #     value: "1"
          #   - name: TRANSFORMERS_OFFLINE
          #     value: "1"
          #   - name: HF_HUB_DISABLE_TELEMETRY
          #     value: "1"
          #   # GPU visibility (optional; remove if using NVIDIA GPU Operator defaults)
          #   - name: CUDA_VISIBLE_DEVICES
          #     value: "0"
          #   - name: CUBLAS_WORKSPACE_CONFIG
          #     value: ":16:8"
          #   # Leave performance-friendly defaults; do not add strict determinism envs here
          #   # - name: VLLM_USE_FLASHINFER
          #   #   value: "0"
          #   # - name: VLLM_TORCH_COMPILE
          #   #   value: "0"   # keep compilation paths off while debugging
          env:
            # - name: ASCEND_TOOLKIT_HOME
            #   value: /usr/local/Ascend/ascend-toolkit/
            # - name: LD_LIBRARY_PATH
            #   value: /usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:$(LD_LIBRARY_PATH)
              #value: /usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64:$(LD_LIBRARY_PATH)
              # value: "/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64:/usr/local/Ascend/nnal/atb/latest/atb/cxx_abi_1/lib:/usr/local/Ascend/ascend-toolkit/latest/lib64:/usr/local/Ascend/driver/lib64/common/:/usr/local/Ascend/driver/lib64/driver/:/usr/local/Ascend/nnal/atb/latest/atb/cxx_abi_1/examples:/usr/local/Ascend/nnal/atb/latest/atb/cxx_abi_1/tests/atbopstest:/usr/local/Ascend/ascend-toolkit/latest/tools/aml/lib64:/usr/local/Ascend/ascend-toolkit/latest/tools/aml/lib64/plugin:/usr/local/Ascend/ascend-toolkit/latest/lib64/plugin/opskernel:/usr/local/Ascend/ascend-toolkit/latest/lib64/plugin/nnengine:/usr/local/Ascend/ascend-toolkit/latest/opp/built-in/op_impl/ai_core/tbe/op_tiling/lib/linux/aarch64:/usr/local/Ascend/nnal/atb/latest/atb/cxx_abi_0/lib:/usr/local/Ascend/nnal/atb/latest/atb/cxx_abi_0/examples:/usr/local/Ascend/nnal/atb/latest/atb/cxx_abi_0/tests/atbopstest:/usr/local/Ascend/ascend-toolkit/latest/opp/built-in/op_impl/ai_core/tbe/op_tiling"
            # Use local/offline model files so both replicas read the same bytes
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"

            # Make Python hashing and tokenizers behavior stable (tiny CPU-side impact)
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"

          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
          # Basic health checks
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 240
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              huawei.com/Ascend910: 1
            requests:
              huawei.com/Ascend910: 1

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-pvc
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30034 # Unique external port for debug tests