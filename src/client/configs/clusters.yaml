clusters:
  yz:
    router_url: "http://10.50.156.65:30080"
    experiments_root: "/home/data/saeid/experiments"

    hf_lmsys:
      dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
      tokenizer_name: "/home/models/GLM-5-w4a8-mtp-QuaRot"

    datasets:
      codeflowbench:
        dataset_name: "/home/data/saeid/datasets/CodeFlowBench-2505"
        tokenizer_name: "/home/models/MiniMax-M2.7-w8a8-QuaRot"

    metrics:
      prometheus_base_url: "http://10.50.156.65:31190"

    transport:
      results_zmq: "tcp://10.50.156.65:30559"

    boom:
      base_url: "http://10.50.156.65:30401"

    helm:
      nfs_path: "/home/models/GLM-5-w4a8-mtp-QuaRot"
      model_host_path: "/home/models"
      mooncake_master_server_address: "10.50.156.106:50088"
      values:
        global.imageRegistry: "reg.local:32000"
        images.router: "kv-router:latest"
        images.sidecar: "kv-sidecar:latest"
        images.vllm: "docker.io/library/vllm-ascend:v0.18.0"
        images.cpuHash: "vllm-cpu-hash:latest"
        images.redis: "redis:7-alpine"
        images.mooncakeMaster: "quay.io/ascend/vllm-ascend:glm5-openeuler"
        boom.image: "boom-gateway:v4"
        router.imagePullPolicy: "Always"
        sidecar.imagePullPolicy: "Always"
        boom.imagePullPolicy: "Always"
        cpuHash.ascendDriverMounts: false
        pin.enabled: true
        pin.nodeName: "node3"

  bz:
    router_url: "http://192.168.0.79:30080"
    # Shared, group-writable (wheel) dir so saeid and haiting both write runs to
    # one place. Each user symlinks their <repo>/src/client/experiments -> this path so
    # sweep artifacts co-locate with client logs.
    experiments_root: "/data/experiments"

    hf_lmsys:
      dataset_name: "/data/gateway/gateway/data/codeflowbench_conversations.jsonl"
      tokenizer_name: "/data/models/GLM-5-w4a8-mtp-QuaRot"

    datasets:
      codeflowbench:
        dataset_name: "/data/models/CodeFlowBench-2505"
        tokenizer_name: "/data/models/MiniMax-M2.7-w8a8-QuaRot"

    metrics:
      prometheus_base_url: "http://192.168.0.79:31190"

    transport:
      results_zmq: "tcp://192.168.0.79:30559"

    boom:
      base_url: "http://192.168.0.79:30401"

    helm:
      nfs_path: "/data/models/GLM-5-w4a8-mtp-QuaRot"
      model_host_path: "/data/models"
      mooncake_master_server_address: "192.168.0.79:50088"
      values:
        # BZ local registry is deployed at reg.local:32000 and resolves to
        # k8s-worker1 (192.168.0.42). Chart images have been rebuilt or mirrored
        # there, so global rewriting keeps mutable local tags pullable when
        # pullPolicy is Always.
        global.imageRegistry: "reg.local:32000"
        images.router: "kv-router:latest"
        images.sidecar: "kv-sidecar:latest"
        images.vllm: "quay.io/ascend/vllm-ascend:glm5-openeuler"
        images.cpuHash: "vllm-cpu-hash:latest"
        images.redis: "redis:7-alpine"
        images.mooncakeMaster: "quay.io/ascend/vllm-ascend:glm5-openeuler"
        boom.image: "boom-gateway:v5"
        router.imagePullPolicy: "Always"
        sidecar.imagePullPolicy: "Always"
        boom.imagePullPolicy: "Always"
        cpuHash.ascendDriverMounts: true
        pin.enabled: true
        pin.nodeName: "k8s-master"

  # NVIDIA GPU machine profile. Deploys the same KV-aware stack on a GPU cluster
  # by flipping a single hardware switch (helm.values.hardware: nvidia). The
  # chart then requests nvidia.com/gpu, applies the nvidia RuntimeClass, and
  # drops every Ascend driver mount / toolkit step — no deploy-script changes.
  # See docs/deployment/gpu.md for the device-plugin and cluster setup. Adjust
  # the endpoints, model_host_path, and images to match your cluster.
  gpu:
    router_url: "http://127.0.0.1:30080"
    experiments_root: "/data/experiments"

    hf_lmsys:
      dataset_name: "/data/datasets/lmsys_chat_1m"
      tokenizer_name: "/data/models/qwen3-8b"

    metrics:
      prometheus_base_url: "http://127.0.0.1:31190"

    transport:
      results_zmq: "tcp://127.0.0.1:30559"

    boom:
      base_url: "http://127.0.0.1:30401"

    helm:
      # Local hostPath model store; set nfs_path instead to use an NFS PVC.
      model_host_path: "/data/models"
      values:
        # ---- The GPU switch: everything below is standard per-cluster config ----
        hardware: nvidia
        # Empty registry => images pull from the paths below as-is (the public
        # vLLM image + your local stack images), with no registry rewrite.
        global.imageRegistry: ""
        images.vllm: "vllm/vllm-openai:latest"
        images.router: "reg.local:32000/kv-router:latest"
        images.sidecar: "reg.local:32000/kv-sidecar:latest"
        images.cpuHash: "reg.local:32000/vllm-cpu-hash:latest"
        images.redis: "redis:7-alpine"
        router.imagePullPolicy: "Always"
        sidecar.imagePullPolicy: "Always"
        # cpu-hash runs as a plain CPU pod on GPU nodes (no Ascend driver mounts).
        cpuHash.ascendDriverMounts: false
        # No node pinning by default; GPU pods land on any GPU-labelled node.
        pin.enabled: false
