# prod-yz-shadow: SHADOW deployment of the 142 LMCache P2P + host-staging replica.
# Parallel to prod (release/namespace vllm-shadow, port_offset 100) so it can run
# A/B against the prod stack without touching it. Same design as
# prod-yz-boom-minmax-lmcache-p2p-hoststaging-affinity.yaml — LMCacheAscendConnector
# + engine-to-engine HCCL P2P + host-staging (bounded 8 GiB registered arena) +
# a standalone lmcache_controller, NO Mooncake, NO NDS — just scoped to the shadow
# pool. See docs/internal/lmcache-p2p-host-staging.md.
#
# Node layout (single DP2 group, replicas: 1):
#   node3: prod infra (unchanged) + shadow vLLM (one DP2 pod)
#   node4: shadow infra (router, redis, BooM) + shadow vLLM (one DP2 pod)
#   node3 also hosts the lmcache_controller (pinned there, co-located w/ the DP leader)
#
# Pre-requisites:
#   kubectl label node node3 avoid=vllm --overwrite
#   kubectl label node node3 node4 vllm-pool=shadow --overwrite
#   kubectl label node node1 node2 node7 node8 avoid=vllm-shadow --overwrite
#   Pre-pull the P2P image on node3+node4:
#     ctr -n k8s.io images pull reg.local:32000/lmcache-ascend:hccl-p2p
#   sysctl -w vm.swappiness=0 && sysctl -w kernel.numa_balancing=0   (on node3/4)
#
# Controller placement: pinned to node3 (host IP 10.50.156.65 on this cluster);
# engines dial it over the node host network. controller_pull_url/reply_url below
# must match node3's host IP. To re-check a node's IP:
#     kubectl get node node3 -o jsonpath='{.status.addresses}'

switch_cluster: yz
backend: "boom"

router_url: "http://10.50.156.65:30180"
total_requests: 10
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  streaming: true
  min_input_tokens: 1
  max_input_tokens: 10000000
  repeat_each: 1

load_pattern:
  pattern: "det"
  rate_rps: 3
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30659"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

boom:
  base_url: "http://10.50.156.65:30501"
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

# --- Shadow-specific overrides ---
vllm_node_selector:
  vllm-pool: shadow

vllm_avoid_label: "vllm-shadow"

helm:
  release: vllm-shadow
  namespace: vllm-shadow
  port_offset: 100
  pin_node_name: node4

  boom_claude_aliases: true
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  # Router routing = BOTH (KV prefix + conversation affinity), HARD mode (mirrors
  # the prod p2p config). Switched from affinity-only per the claude strategy
  # comparison (both beat affinity on prefix-hit, throughput, p99 at equal
  # stickiness). owner_source=lookup below is now LIVE (was inert under affinity).
  router_strategy: "both"
  router_len_aware: true
  router_len_policy: "short_first"
  # Block-owner source for prefix routing. Inert under affinity (no effect on
  # routing here); kept explicit so a switch to prefix/both is drop-in.
  router_owner_source: "lookup"
  router_lookup_max_blocks: 512
  # Whole-block strip of Claude Code's x-anthropic-billing-header attribution
  # (rotating cc_version + per-request cch counter) router-side for byte-stable
  # KV-prefix matching. ENABLED: this deployment serves Claude, so without it the
  # rotating header bytes sit in the prefix and the KV-prefix cache never hits
  # across requests (prefix/both would then buy nothing). REQUIRES the remove-cc-
  # header router build -- VERIFY YZ `kv-router:latest` IS that build (BZ digest
  # e407aab5…f0a5b) or pin it in values below, else this is a silent no-op and the
  # KV-hit rate collapses. Idempotent: safe even if BooM Gateway also strips.
  router_strip_cch: "1"
  router_log_block_hashes: true
  router_measure_prefix: true
  # Persist request bodies into the /latency_log ring. OFF: we do not want to log
  # request content for this deployment. (kv_hits/block_hashes/endpoint are still
  # logged; only the raw body is withheld.)
  # router_log_request_body: true
  router_affinity_mode: "hard"
  router_affinity_ttl_s: 86400   # 24h. Memory-neutral today (prune() not wired -> lazy
  # expiry only), so a long TTL just retains locality across idle gaps. Real memory
  # bound is unique conversations since restart, not TTL; watch router_affinity_map_size.
  # Hard-affinity spillover window. Default 5s spills ~1/3 of pinned
  # conversations to other pods at peak (confirmed via router_affinity_releases_total
  # jumping 0 -> peak), scattering prefixes -> KV hit-rate (命中率) cliff. Waiting
  # longer for the pinned pod preserves prefix locality at the cost of tail latency
  # (this is what the flat-hit-rate "142" router effectively does). Bump
  # incrementally while watching releases_total, the 命中率 panel, and p99 latency.
  # 800 (rate-limit pairing): with batchSize 16 halving per-pod concurrency, the
  # longer hold makes queued turns wait for their warm pod instead of spilling, so
  # the throttle preserves prefix locality rather than scattering it. Hard ceiling is
  # RESULT_TIMEOUT_S=1000s (router waits that long end-to-end INCLUDING this hold, then
  # 504s), so 800 leaves ~200s for pull+inference. Higher also slows failover: requests
  # pinned to a dead/restarting pod wait this long before spilling to a healthy one.
  router_affinity_hard_timeout_s: 800

  expose_per_pod: true

  nfs_path: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/home/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  # --- Mooncake: OFF (142 has no remote store). ---
  mooncake_enabled: false
  deploy_mooncake_master: false

  # --- LMCache: P2P / host-staging mode (142) ---
  lmcache_enabled: true
  lmcache_mode: "p2p"
  lmcache_chunk_size: 512
  # 100 GiB/rank matches the 142 reference and the prod yz p2p config.
  # RAM budget: node3/node4 are ~2 TB machines (bigger than the 1.5 TB prod engine
  # nodes), and p2p mode runs NO Mooncake master — so the cache is private per
  # engine, not a shared pool. 8 TP ranks x 100 GiB = ~800 GiB/node, <40% of 2 TB,
  # leaving ~800 GiB headroom. Independent of the 8 GiB host-staging arena below,
  # so raising this does NOT reintroduce the device-registration ("gpu size") crash.
  # Safe to push to 128-150 for more retention if desired; 100 keeps the A/B clean.
  lmcache_max_local_cpu_size: 100

  lmcache_use_host_staging: true
  lmcache_os_staging_bytes: 8589934592   # 8 GiB

  # Controller pinned to node3 (host IP 10.50.156.65 on this cluster).
  lmcache_p2p_controller_pull_url: "10.50.156.65:9800"
  lmcache_p2p_controller_reply_url: "10.50.156.65:9900"
  deploy_lmcache_controller: true
  lmcache_controller_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  # NDS dropped in p2p mode (matches 142).
  lmcache_nds_enabled: false

  # --- vLLM flags ---
  dtype: "bfloat16"
  ascend_enable_flashcomm1: true
  # 142 drops the custom LSched scheduler and the hccl-p2p image does not ship
  # the `lsched` module, so setting this crashes EngineCore with
  # "ModuleNotFoundError: No module named 'lsched'". Leave unset to use vLLM's
  # default scheduler (matches the 142 reference run scripts).
  # scheduler_cls: "lsched.lsched_vllm.LSchedVLLMAdapter"
  model_loader_extra_config: '{"enable_multithread_load":true,"num_threads":16}'

  vllm_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  # Pin the controller to node3 (co-located with the DP leader; host IP 10.50.156.65).
  values:
    lmcacheController.nodeName: "node3"
    # Reserve CPU + host RAM for the vLLM engine container so LMCache's host-RAM
    # "local_cpu" tier is not CPU-starved / OOM-killed at peak load (the engine
    # otherwise requests ONLY the Ascend NPU + ephemeral-storage). Requests only,
    # no memory limit -> guaranteed floor without a hard OOM-kill ceiling.
    # Memory sizing: lmcache_max_local_cpu_size (100) x TP workers (8) ~= 800 GiB
    # local tier + host-staging + engine overhead => ~900Gi on the ~1509 GiB node.
    # Node has 192 cores; reserve ~half (96) as the engine floor. No cpu limit, so
    # it can still burst to all 192 under load. Drop memory if the node is smaller.
    vllm.engineResources.requests.cpu: "96"
    vllm.engineResources.requests.memory: "900Gi"
    # lmcache_controller runs on its own node (node3), off the engine nodes, so
    # give it a generous reservation (vs the 2/4Gi chart default) to handle P2P
    # block-owner lookups at peak without becoming the bottleneck.
    lmcacheController.resources.requests.cpu: "16"
    lmcacheController.resources.requests.memory: "32Gi"
    lmcacheController.resources.limits.cpu: "64"
    lmcacheController.resources.limits.memory: "64Gi"

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 1
      streamingMode: true
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      # 16 (rate-limit-to-affined-node): halve per-pod concurrency vs the 142
      # reference's 32 to cap KV pressure/eviction so queued turns wait for their
      # warm pod (hard affinity) instead of spilling. Blunt/static cap -- revisit
      # from the high-load KV-usage data (batch-32 vs batch-16 sweep).
      batchSize: 16
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 8888
        hcclBuffSize: 1024
        ompNumThreads: 16
      vllm:
        gpuMemoryUtilization: 0.92
        dtype: bfloat16
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 32768
        enablePrefixCaching: true
        enablePromptTokensDetails: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        # Dropped for p2p/142 — hccl-p2p image has no `lsched` module.
        # schedulerCls: "lsched.lsched_vllm.LSchedVLLMAdapter"
        modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
        ascendEnableFlashcomm1: true
