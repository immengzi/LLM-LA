# ── PROD master sweep config ──
# Maps client_config -> [methods...]. One (or a few) active entries at a time.
#
# Run:  cd src/client && python sweep_methods.py            # uses this file by default
#       cd src/client && python sweep_methods.py --config 1-master_config
#
# Active deployments are the LMCache P2P host-staging line + the benchmark sweeps.
# Legacy/superseded plans (Mooncake, pre-P2P LMCache, DP-multiturn checks, light
# claude runs, shadow-pool, autoscaling) have been moved to configs/old/<category>/
# and documented in configs/old/README.md. They still run by their relative path,
# e.g.  old/mooncake/prod-bz-boom-minmax-mooncake:  [pull]
# Non-prod / benchmark plans live in old/non-prod/1-master_config.yaml and
# old/non-prod/boom_master.yaml.

# ── ACTIVE p2p host-staging deployments (uncomment the one you want to run) ──
# BZ (this machine) — affinity, and its fair-pull variant:
# prod-bz-boom-minmax-lmcache-p2p-hoststaging-affinity:
#   - pull
# prod-bz-boom-minmax-lmcache-p2p-hoststaging-affinity-fair:
#   - pull
#
# YZ primary + its shadow-pool equivalent:
# prod-yz-boom-minmax-lmcache-p2p-hoststaging-affinity:
#   - pull
# prod-yz-shadow-boom-minmax-lmcache-p2p-hoststaging-affinity:
#   - pull

# ── ACTIVE: claude-CLI HIGH-LOAD routing-strategy comparison (96 users x 3) ──
# Drives the real `claude` CLI (transport.mode=claude) across every routing
# strategy on an identical replay. Offered concurrency (~96) exceeds pod capacity
# so router pull-queue / affinity backpressure is exercised. Full cold redeploy per
# strategy (do NOT pass --skip-vllm). Analyse in
# analysis-notebooks/claude-strategy-comparison.ipynb.
# Each strategy runs as pull (active) with a matching ROUTER_MODE=central-push
# variant (commented) right below it — router-driven capacity dispatch on the
# SAME workload, for a pull-vs-central-push comparison per strategy. Uncomment a
# central-push line to run it alongside (or instead of) its pull sibling.
benchmark-bz-pull-none:
  - pull
# benchmark-bz-central-push-none:
#   - central-push
benchmark-bz-pull-prefix:
  - pull
# benchmark-bz-central-push-prefix:
#   - central-push
benchmark-bz-pull-affinity-hard:
  - pull
# benchmark-bz-central-push-affinity-hard:
#   - central-push
benchmark-bz-pull-affinity-soft:
  - pull
# benchmark-bz-central-push-affinity-soft:
#   - central-push
benchmark-bz-pull-both:
  - pull
# benchmark-bz-central-push-both:
#   - central-push
