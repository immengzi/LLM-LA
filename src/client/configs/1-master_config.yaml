# ── ACTIVE: claude-CLI HIGH-LOAD routing comparison (96 users x 180 convs, ~1h) ──
# Drives the real `claude` CLI (transport.mode=claude) across every routing
# strategy on an identical replay. Offered concurrency (~96) exceeds pod capacity
# so router pull-queue / affinity backpressure is exercised. Full cold redeploy per
# strategy (do NOT pass --skip-vllm). Analyse in
# analysis-notebooks/claude-strategy-comparison.ipynb.
# 2x2x5 factorial over the SAME workload: METHOD {pull, central-push} x
# REBALANCING {off (vanilla), on (-fair: router_fair_pull)} x STRATEGY {none,
# prefix, affinity-hard, affinity-soft, both}. Each -fair config is byte-identical
# to its vanilla sibling EXCEPT router_fair_pull=true. ALL 20 cells are ACTIVE
# below for the full comparison; the sweep runs them sequentially and each is a
# full cold redeploy + ~1h soak (budget ~1-1.5h per cell, ~24-36h total). Comment
# out any block/line you want to skip.

