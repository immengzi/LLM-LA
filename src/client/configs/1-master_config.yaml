# =============================================================================
# TONIGHT (BZ only) — activate ONE block at a time; do not leave prod-bz active.
# Full cold redeploy (no --skip-vllm) on first launch of each block.
# Order suggested: (A) crash-soak → compare, then (B) fair high-load A/B.
# Soft-divert A/B is optional (needs feat/kv-soft-divert images).
# =============================================================================

# ---- A) Crash / pin-deadlock soak + path compare (metrics) ----
# Leave running until pin timeouts OR GPU KV ~100% + decode decay.
# Success signals: Pin timeout in vllm.log, prefix_cache_hit_rate collapse,
# decode tok/s down while running≈batchSize. Compare Grafana / notebook panels
# (running, rps, prefill/decode, TTFT/TPOT/e2e, prefix hit) between Series 1/2.
# A1 first (us+BooM = 33/218 path). A2 optional same-night or next (142 path).
# benchmark-bz-us-boom-lmsys-kv-soak:      # A1 us+boom
#   - pull
# benchmark-bz-boom-only-lmsys-kv-soak:    # A2 boom-only (key_affinity)
#   - key_affinity

# ---- B) Rebalancing under high load (fair pull A/B, 96 users) ----
# Prefix strategy. B1 = fair OFF, B2 = fair ON. Same 96-user overload.
# Watch: router_fair_* / in-flight balance, waiting, TTFT/TPOT, timeouts.
# benchmark-bz-pull-prefix-highload:       # B1 fair OFF
#   - pull
# benchmark-bz-pull-fair-prefix-highload:  # B2 fair ON
#   - pull

# ---- C) Optional: soft KV divert A/B (needs soft-divert router/sidecar image) ----
# benchmark-bz-pull-kvdivert-off-prefix:
#   - pull
# benchmark-bz-pull-kvdivert-on-prefix:
#   - pull

# ── BZ: KV soak — us+BooM (33/218 path) vs BooM-only (142 path) ──
# (see TONIGHT block A above)
# benchmark-bz-us-boom-lmsys-kv-soak:
#   - pull
# benchmark-bz-boom-only-lmsys-kv-soak:
#   - key_affinity

