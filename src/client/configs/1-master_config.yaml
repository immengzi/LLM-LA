# ── PROD master sweep config ──
# Maps client_config -> [methods...]. One (or a few) active entries at a time.
#
# Run:  cd src/client && python sweep_methods.py            # uses this file by default
#       cd src/client && python sweep_methods.py --config 1-master_config
#
# Active deployments are the LMCache P2P host-staging line + the benchmark sweeps.
# Legacy/superseded plans (Mooncake, pre-P2P LMCache, DP-multiturn checks, light
# claude runs, shadow-pool, autoscaling) have been moved to configs/old/<category>/
# and documented in configs/old/README.md. They still run by their relative path,
# e.g.  old/mooncake/prod-bz-boom-minmax-mooncake:  [pull]
# Non-prod / benchmark plans live in old/non-prod/1-master_config.yaml and
# old/non-prod/boom_master.yaml.

