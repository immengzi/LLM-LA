# to its vanilla sibling EXCEPT router_fair_pull=true. ALL 20 cells are ACTIVE
# below for the full comparison; the sweep runs them sequentially and each is a
# full cold redeploy + ~1h soak (budget ~1-1.5h per cell, ~24-36h total). Comment
# out any block/line you want to skip.

