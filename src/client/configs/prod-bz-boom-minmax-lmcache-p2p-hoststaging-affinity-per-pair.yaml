# prod + ROUTER KEY AFFINITY: MiniMax-M2.7 — BooM + LLM-LA (router), DP2 +
# LMCache P2P / host-staging with **one lmcache_controller per DP pair**
# (co-located on each leader node). BZ twin of
# prod-yz-boom-minmax-lmcache-p2p-hoststaging-affinity-per-pair.yaml.
#
# Layout (2 DP groups × leader+worker = 4 engines, 2 controllers) — matches
# docs/operations/bz-cluster-nodes.md current placement:
#   pair A: leader k8s-master (192.168.0.79) + worker k8s-worker (192.168.0.99)
#           → lmcache-controller-k8s-master on k8s-master
#   pair B: leader k8s-worker2 (192.168.0.69) + worker k8s-worker1 (192.168.0.42)
#           → lmcache-controller-k8s-worker2 on k8s-worker2
# Engines dial __CONTROLLER_HOST__ (leader=NODE_IP, worker=LEADER_IP) — no
# hardcoded controller IP.
#
# TRADE-OFF (intentional): each controller only knows chunks owned by its own
# pair → **no cross-pair P2P KV reuse**. Intra-pair P2P still works. For a
# single shared who-has directory use the sibling
# prod-bz-boom-minmax-lmcache-p2p-hoststaging-affinity.yaml instead.
#
# Same P2P / host-staging knobs as the yz per-pair + shared-controller siblings:
#   LMCacheAscendConnector, transfer_channel hccl, 8 GiB host-staging arena,
#   Mooncake OFF, NDS OFF, image lmcache-ascend:hccl-p2p-metrics-fix.
# See docs/internal/lmcache-p2p-host-staging.md.
#
# Pre-requisites on each engine node before deploying:
#   sysctl -w vm.swappiness=0
#   sysctl -w kernel.numa_balancing=0
# And label the DP leader/worker nodes:
#   kubectl label node k8s-master  vllm-role=leader --overwrite   # 192.168.0.79
#   kubectl label node k8s-worker2 vllm-role=leader --overwrite   # 192.168.0.69
#   kubectl label node k8s-worker  vllm-role=worker --overwrite   # 192.168.0.99
#   kubectl label node k8s-worker1 vllm-role=worker --overwrite   # 192.168.0.42
# Optional (if not already set): roce-pair labels for pairTopologyKey:
#   kubectl label node k8s-master  k8s-worker  roce-pair=pair-a --overwrite
#   kubectl label node k8s-worker2 k8s-worker1 roce-pair=pair-b --overwrite
# Also: lmcache-ascend:hccl-p2p-metrics-fix must be pullable from reg.local:32000
# on every engine node. Verify RAM (`free -g`) before trusting 100 GiB/rank.

switch_cluster: bz
backend: "boom"

vllm_leader_node_selector: { vllm-role: leader }
vllm_worker_node_selector: { vllm-role: worker }

total_requests: 10
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/data/gateway/gateway/data/lmsys_conversations_hf"
  split: "train"
  tokenizer_name: "/data/models/MiniMax-M2.7-w8a8-QuaRot"
  streaming: true
  min_input_tokens: 1
  max_input_tokens: 10000000
  repeat_each: 1

load_pattern:
  pattern: "det"
  rate_rps: 1
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false

output_log_mode: "summary"
print_trace: false

collect_router_log: true
emit_logs_full: true

redis_watch:
  enabled: true
  interval_s: 2.0
  snapshot_mode: "delta"
  snapshot_full_every_n_ticks: 150
  snapshot_max_blocks: 1000000
  max_keys: 1000000
  scan_count: 1000
  port: 30079

metrics:
  enabled: true
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

boom:
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

helm:
  boom_claude_aliases: true
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  # Same as yz per-pair: BOTH (KV prefix + hard affinity).
  router_strategy: "both"
  router_len_aware: true
  router_len_policy: "short_first"
  router_owner_source: "lookup"
  router_lookup_max_blocks: 512
  router_strip_cch: "1"
  router_log_block_hashes: true
  router_log_request_body: true
  router_log_request_body_max_bytes: 16384
  router_measure_prefix: true
  router_affinity_mode: "hard"
  router_affinity_ttl_s: 86400
  router_affinity_hard_timeout_s: 800

  expose_per_pod: true

  nfs_path: "/data/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/data/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  # --- Mooncake: OFF. 142 has no remote store; coordination is the controller. ---
  mooncake_enabled: false
  deploy_mooncake_master: false

  # --- LMCache: P2P / host-staging mode (142) ---
  lmcache_enabled: true
  lmcache_mode: "p2p"
  lmcache_chunk_size: 512
  lmcache_max_local_cpu_size: 100   # GiB per TP worker — VERIFY vs BZ node RAM

  lmcache_use_host_staging: true
  lmcache_os_staging_bytes: 8589934592   # 8 GiB

  # One controller per DP pair, co-located on each leader (same as yz per-pair).
  lmcache_p2p_controller_placement: "per-leader"
  lmcache_controller_node_names: ["k8s-master", "k8s-worker2"]
  deploy_lmcache_controller: true
  lmcache_controller_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  # NDS absent on BZ.
  lmcache_nds_enabled: false

  # --- vLLM flags ---
  dtype: "bfloat16"
  ascend_enable_flashcomm1: true
  model_loader_extra_config: '{"enable_multithread_load":true,"num_threads":16}'

  vllm_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  values:
    lmcache.p2p.transferChannel: "hccl"
    lmcache.p2p.delayPull: true
    boom.image: "boom-gateway:v5"
    # Engine reservation — drop memory if BZ nodes are smaller than ~1.5 TB.
    vllm.engineResources.requests.cpu: "96"
    vllm.engineResources.requests.memory: "900Gi"
    # Controllers share the leader nodes with the engines — keep small.
    lmcacheController.resources.requests.cpu: "2"
    lmcacheController.resources.requests.memory: "4Gi"
    lmcacheController.resources.limits.cpu: "4"
    lmcacheController.resources.limits.memory: "8Gi"
    # Avoid hostNetwork clash with kv-sidecar :9000 on the same leader node.
    # P2P engines dial pull/reply (9800/9900) only; this is the controller admin port.
    lmcacheController.port: 9010

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 2
      streamingMode: true
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      batchSize: 32
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 8888
        hcclBuffSize: 1024
        ompNumThreads: 16
        pairTopologyKey: roce-pair
      vllm:
        gpuMemoryUtilization: 0.92
        dtype: bfloat16
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 32768
        enablePrefixCaching: true
        enablePromptTokensDetails: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
        ascendEnableFlashcomm1: true
