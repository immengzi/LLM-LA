# benchmark: BZ KV soak — us + BooM (33/218-style path)
# ---------------------------------------------------------------------------
# Path: client → real `claude` CLI → BooM Gateway → LLM-LA router/sidecar/redis → vLLM
# Matches the prod YZ stack that sits behind our router (servers like 33/218).
#
# Routing mirrors prod-yz-boom-minmax-lmcache-p2p-hoststaging-affinity:
#   router_strategy: both (KV prefix + hard conversation affinity)
#   router_affinity_hard_timeout_s: 800
# Cluster / LMCache / paths from prod-bz (BZ registry, controller IP, host paths).
#
# WORKLOAD (Claude Code system prompt + CodeFlowBench, closed-loop users):
#   - transport.mode=claude → real CLI brings Claude Code's own ~system prompt
#   - prompt_source=codeflow / dataset_profile=codeflowbench (multi-turn)
#   - 96 users (~1.5× capacity) × 50 convs — elevated concurrency to fill GPU KV
#   - single deploy; leave pods up until pin timeouts / KV saturation
#
# Success criteria:
#   GPU KV usage → ~97–100% and stays there
#   vllm.log: "Pin timeout … Forcing unpin to 0"
#   decode tok/s decays while num_requests_running stays ~batchSize
#   prefix_cache_hit_rate collapses
#
# Pre-requisites (same as prod-bz p2p):
#   sysctl -w vm.swappiness=0 && sysctl -w kernel.numa_balancing=0  (each engine node)
#   lmcache-ascend:hccl-p2p image in reg.local:32000
#   controller IP/node below matches a real BZ node
#   `claude` binary on PATH
#
# Run (full redeploy — do not --skip-vllm the first time):
#   # in 1-master_config.yaml activate ONLY:
#   #   benchmark-bz-us-boom-lmsys-kv-soak:
#   #     - pull
#   cd src/client && python sweep_methods.py
#
# Sibling: benchmark-bz-boom-only-lmsys-kv-soak.yaml (142 / BooM-direct path).

switch_cluster: bz
backend: "boom"

# Claude-CLI KV soak: 96 users × 50 conversations = 4800 (closed-loop).
# Real `claude` CLI supplies Claude Code system prompt + growing history.
# total_requests is informational; users model controls conversation count.
total_requests: 4800
prompt_source: "codeflow"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_profile: codeflowbench
  split: "train"
  streaming: false
  min_input_tokens: 1
  # No input cap: YZ96-like length comes from Claude system+tools+history growth,
  # not from truncating CodeFlow user text (which is already short).
  max_input_tokens: null
  repeat_each: 1
  seed: 314
  multi_turn: true
  min_user_turns: 3
  max_pool_size: 99999

load_pattern:
  pattern: "det"
  rate_rps: 5.0
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  # Match prod-YZ output cap. Short YZ96-like outs should come from tool-call turns.
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false
  min_output_tokens_floor: 1024

output_log_mode: "summary"
print_trace: false

# LLM-LA path: keep router/redis collectors on (prod-yz style).
collect_router_log: true
emit_logs_full: true
collect_vllm_logs: true

redis_watch:
  enabled: true
  interval_s: 2.0
  snapshot_mode: "delta"
  snapshot_full_every_n_ticks: 150
  snapshot_max_blocks: 1000000
  max_keys: 1000000
  scan_count: 1000
  port: 30079

metrics:
  enabled: true
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

# Real claude CLI → BooM Anthropic gateway (system prompt comes from Claude Code).
transport:
  mode: "claude"

claude:
  # Match YZ96 reference: full Claude Code system + tools (short tool-call turns,
  # growing session context). Was bare+tools-off → tiny system + long free-form outs.
  bare: false
  enable_tools: true
  timeout_s: 10000.0

users:
  num_users: 96             # ~1.5x capacity (batchSize 32 x 2 = 64): elevated for KV fill
  convs_per_user: 50        # long soak — stop early once pin timeouts / KV ~100%
  interval_between_convs_s: 2.0
  interval_between_convs_max_s: 10.0
  ramp_window_s: 60.0

boom:
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

helm:
  boom_claude_aliases: true
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"
  # Default boom_route_via=router: BooM → LLM-LA. Master method = pull.

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  # Prod-YZ routing: BOTH (KV prefix + conversation affinity), HARD mode.
  router_strategy: "both"
  router_len_aware: true
  router_len_policy: "short_first"
  router_owner_source: "lookup"
  router_lookup_max_blocks: 512
  router_strip_cch: "1"
  router_log_block_hashes: true
  router_log_request_body: true
  router_log_request_body_max_bytes: 16384
  router_measure_prefix: true
  router_affinity_mode: "hard"
  router_affinity_ttl_s: 86400
  # Matches prod-yz (800s); hard ceiling RESULT_TIMEOUT_S=1000s.
  router_affinity_hard_timeout_s: 800

  expose_per_pod: true

  nfs_path: "/data/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/data/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  mooncake_enabled: false
  deploy_mooncake_master: false

  # --- LMCache P2P / host-staging (the failure surface under soak) ---
  lmcache_enabled: true
  lmcache_mode: "p2p"
  lmcache_chunk_size: 512
  lmcache_max_local_cpu_size: 100

  lmcache_use_host_staging: true
  lmcache_os_staging_bytes: 8589934592   # 8 GiB

  lmcache_p2p_controller_pull_url: "192.168.0.42:9800"
  lmcache_p2p_controller_reply_url: "192.168.0.42:9900"
  deploy_lmcache_controller: true
  lmcache_controller_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"
  lmcache_nds_enabled: false

  dtype: "bfloat16"
  ascend_enable_flashcomm1: true
  model_loader_extra_config: '{"enable_multithread_load":true,"num_threads":16}'

  vllm_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 2
      streamingMode: true
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      batchSize: 32
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 8888
        pairTopologyKey: roce-pair
        hcclBuffSize: 1024
        ompNumThreads: 16
      vllm:
        gpuMemoryUtilization: 0.92
        dtype: bfloat16
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 32768
        enablePrefixCaching: true
        enablePromptTokensDetails: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
        ascendEnableFlashcomm1: true

  values:
    lmcacheController.nodeName: "k8s-worker1"
    boom.image: "boom-gateway:v5"
