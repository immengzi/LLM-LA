# prod + ROUTER KEY AFFINITY: MiniMax-M2.7 — BooM + LLM-LA (router), DP2 +
# LMCache P2P / host-staging with **one lmcache_controller per DP pair**
# (co-located on each leader node), matching the 142 "controller on master"
# topology scaled to yz's two pairs.
#
# Layout (2 DP groups × leader+worker = 4 engines, 2 controllers):
#   pair A: leader node7 (7.150.6.33) + worker node8 (7.150.0.37)
#           → lmcache-controller-node7 on node7; engines dial that leader IP
#   pair B: leader node1 (7.150.1.218) + worker node2 (7.150.5.207)
#           → lmcache-controller-node1 on node1; engines dial that leader IP
#
# TRADE-OFF (intentional): each controller only knows chunks owned by its own
# pair → **no cross-pair P2P KV reuse**. Intra-pair P2P still works. For a
# single shared who-has directory (cross-pair reuse) use the sibling config
# prod-yz-boom-minmax-lmcache-p2p-hoststaging-affinity.yaml instead.
#
# Same P2P / host-staging knobs as the shared-controller sibling:
#   LMCacheAscendConnector, transfer_channel hccl, 8 GiB host-staging arena,
#   Mooncake OFF, NDS OFF, image lmcache-ascend:hccl-p2p-metrics-fix.
# See docs/internal/lmcache-p2p-host-staging.md.
#
# Pre-requisites on each engine node before deploying:
#   sysctl -w vm.swappiness=0
#   sysctl -w kernel.numa_balancing=0
# And label the DP leader/worker nodes:
#   kubectl label node node7 vllm-role=leader --overwrite   # 7.150.6.33
#   kubectl label node node1 vllm-role=leader --overwrite   # 7.150.1.218
#   kubectl label node node8 vllm-role=worker --overwrite   # 7.150.0.37
#   kubectl label node node2 vllm-role=worker --overwrite   # 7.150.5.207
# Optional (if not already set): roce-pair labels for pairTopologyKey:
#   kubectl label node node7 node8 roce-pair=pair-a --overwrite
#   kubectl label node node1 node2 roce-pair=pair-b --overwrite

switch_cluster: yz
backend: "boom"

vllm_leader_node_selector: { vllm-role: leader }
vllm_worker_node_selector: { vllm-role: worker }

router_url: "http://10.50.156.65:30080"
total_requests: 10
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  streaming: true
  min_input_tokens: 1
  max_input_tokens: 10000000
  repeat_each: 1

load_pattern:
  pattern: "det"
  rate_rps: 1
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false

output_log_mode: "summary"
print_trace: false
# Persist the full request body (messages + sampling params) into each logs.json
# record under "request_body". Opt-in; off by default. request_body_max_bytes
# caps each logged body (0 = unlimited). Kept OFF here on purpose: logs.json must
# stay lean/body-free -- the full request lives in logs_full.json instead (below).
# log_request_body: true
# request_body_max_bytes: 16384

# Poll the router /latency_log ring -> router_logs.json, and run the end-of-run
# authoritative join so logs.json carries the serving endpoint + prefix/KV-hit
# fields. Required for logs_full.json below.
collect_router_log: true
# Also emit logs_full.json: a SUPERSET of logs.json that additionally carries the
# full request body + the prefix block-hash list (pulled from router_logs.json).
# logs.json stays lean (no body, no bulky block-hash list); logs_full.json is the
# heavy twin for deep prefix/content analysis. Needs router_log_request_body +
# router_log_block_hashes on the router (set in helm: below).
emit_logs_full: true

# Live Redis KV-block ownership snapshot -> separate file redis_kv_watch.jsonl.
# Each tick SCANs <model>:kvblock:* and dumps the FULL block-hash -> owner-pods
# map plus aggregate ownership/sharing counts. Caps raised past the live key
# count so nothing is truncated. snapshot_mode: delta keeps the file small at a
# 2s cadence -- each tick records only blocks added/changed/removed vs the prior
# scan (the mostly-static map is NOT rewritten every tick), with a full baseline
# on tick 1 and every snapshot_full_every_n_ticks (150 @ 2s = ~5 min).
# Reconstruct full state at any tick = last baseline + replayed deltas. interval
# 2s tracks KV ownership churn closely (near the Prometheus scrape cadence);
# only blocks created AND evicted within the same 2s window slip through. Each
# tick logs scan_s -- headroom toward the 0.5s floor if it stays well under 2s.
# node_ip empty -> derived from router_url host; port = Redis NodePort.
redis_watch:
  enabled: true
  interval_s: 2.0
  snapshot_mode: "delta"
  snapshot_full_every_n_ticks: 150
  snapshot_max_blocks: 1000000
  max_keys: 1000000
  scan_count: 1000
  port: 30079

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

boom:
  base_url: "http://10.50.156.65:30401"
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

helm:
  boom_claude_aliases: true
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  # Router routing = BOTH (KV prefix + conversation affinity), HARD mode. Switched
  # from affinity-only per the claude strategy comparison (both beat affinity on
  # engine prefix-hit 0.55 vs 0.48, throughput, and p99 at equal 1.0 stickiness).
  # owner_source=lookup below is now LIVE (was inert under affinity-only).
  router_strategy: "both"
  router_len_aware: true
  router_len_policy: "short_first"
  # Block-owner source for prefix routing. Inert under affinity (no effect on
  # routing here); kept explicit so a switch to prefix/both is drop-in.
  router_owner_source: "lookup"
  router_lookup_max_blocks: 512
  # Whole-block strip of Claude Code's x-anthropic-billing-header attribution
  # (rotating cc_version + per-request cch counter) router-side for byte-stable
  # KV-prefix matching. ENABLED: this deployment serves Claude, so without it the
  # rotating header bytes sit in the prefix and the KV-prefix cache never hits
  # across requests (prefix/both would then buy nothing). REQUIRES the remove-cc-
  # header router build -- VERIFY YZ `kv-router:latest` IS that build (BZ digest
  # e407aab5…f0a5b) or pin it in values below, else this is a silent no-op and the
  # KV-hit rate collapses. Idempotent: safe even if BooM Gateway also strips.
  router_strip_cch: "1"
  router_log_block_hashes: true
  # Store the full request body (messages + sampling params) in the router's
  # /latency_log ring -> router_logs.json. ON: this deploy runs in "full request"
  # capture mode. The body is NOT copied into the lean logs.json; it is written
  # only to logs_full.json (client emit_logs_full=true above). max_bytes caps each
  # captured body (0 = unlimited).
  router_log_request_body: true
  router_log_request_body_max_bytes: 16384
  router_measure_prefix: true
  router_affinity_mode: "hard"
  router_affinity_ttl_s: 86400   # 24h. Memory-neutral today (prune() not wired -> lazy
  # expiry only), so a long TTL just retains locality across idle gaps. Real memory
  # bound is unique conversations since restart, not TTL; watch router_affinity_map_size.
  # Hard-affinity spillover window. Default 5s spills ~1/3 of pinned
  # conversations to other pods at peak (confirmed via router_affinity_releases_total
  # jumping 0 -> peak), scattering prefixes -> KV hit-rate (命中率) cliff. Waiting
  # longer for the pinned pod preserves prefix locality at the cost of tail latency
  # (this is what the flat-hit-rate "142" router effectively does). Bump
  # incrementally while watching releases_total, the 命中率 panel, and p99 latency.
  # Hard ceiling is RESULT_TIMEOUT_S=1000s (router waits that long end-to-end
  # INCLUDING this hold, then 504s), so 800 leaves ~200s for pull+inference. Higher
  # also slows failover: requests pinned to a dead/restarting pod wait this long
  # before spilling to a healthy one.
  router_affinity_hard_timeout_s: 800

  expose_per_pod: true

  nfs_path: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/home/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  # --- Mooncake: OFF. 142 has no remote store; coordination is the controller. ---
  mooncake_enabled: false
  deploy_mooncake_master: false

  # --- LMCache: P2P / host-staging mode (142) ---
  lmcache_enabled: true
  lmcache_mode: "p2p"
  lmcache_chunk_size: 512
  lmcache_max_local_cpu_size: 100   # matches 142; 8 TP x 100 GiB = ~800 GiB of 1509

  # Host-staging: register ONE bounded arena (not the full pool) -> avoids the
  # >10 GB device-registration crash. 8 GiB matches the 142 reference.
  lmcache_use_host_staging: true
  lmcache_os_staging_bytes: 8589934592   # 8 GiB

  # One controller per DP pair, co-located on each leader (142-style). Engines
  # dial __CONTROLLER_HOST__ (leader=NODE_IP, worker=LEADER_IP) — no hardcoded
  # controller IP. Who-has directory is partitioned per pair.
  lmcache_p2p_controller_placement: "per-leader"
  lmcache_controller_node_names: ["node7", "node1"]
  deploy_lmcache_controller: true
  # Image the p2p engines AND the controllers run.
  lmcache_controller_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  # NDS dropped in p2p mode (142 uses pure P2P/host-staging, no NDS spill).
  lmcache_nds_enabled: false

  # --- vLLM flags ---
  dtype: "bfloat16"
  ascend_enable_flashcomm1: true
  # 142 drops the custom LSched scheduler and the hccl-p2p image does not ship
  # the `lsched` module, so setting this crashes EngineCore with
  # "ModuleNotFoundError: No module named 'lsched'". Leave unset to use vLLM's
  # default scheduler (matches the 142 reference run scripts).
  # scheduler_cls: "lsched.lsched_vllm.LSchedVLLMAdapter"
  model_loader_extra_config: '{"enable_multithread_load":true,"num_threads":16}'

  # New P2P image for the vLLM engine pods (see note above).
  vllm_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  values:
    # Pin host-staging companions so chart-default drift can't silently break them.
    lmcache.p2p.transferChannel: "hccl"
    lmcache.p2p.delayPull: true
    # Reserve CPU + host RAM for the vLLM engine container so LMCache's host-RAM
    # "local_cpu" tier is not CPU-starved / OOM-killed at peak load.
    # Memory sizing: lmcache_max_local_cpu_size (100) x TP workers (8) ~= 800 GiB
    # local tier + host-staging + engine overhead => ~900Gi on the ~1509 GiB node.
    vllm.engineResources.requests.cpu: "96"
    vllm.engineResources.requests.memory: "900Gi"
    # Controllers share the leader nodes with the engines — keep reservations
    # small (chart defaults) so they can't crowd the 8 GiB pinned staging arena.
    lmcacheController.resources.requests.cpu: "2"
    lmcacheController.resources.requests.memory: "4Gi"
    lmcacheController.resources.limits.cpu: "4"
    lmcacheController.resources.limits.memory: "8Gi"

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 2
      streamingMode: true
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      # Match the 142 reference --max-num-seqs (32). Was briefly 16 for a
      # rate-limit experiment; restored so per-pod concurrency is not half-capped.
      batchSize: 32
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 8888
        hcclBuffSize: 1024
        ompNumThreads: 16
        pairTopologyKey: roce-pair
      vllm:
        gpuMemoryUtilization: 0.92
        dtype: bfloat16
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 32768
        enablePrefixCaching: true
        enablePromptTokensDetails: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        # Dropped for p2p/142 — hccl-p2p image has no `lsched` module.
        # schedulerCls: "lsched.lsched_vllm.LSchedVLLMAdapter"
        modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
        ascendEnableFlashcomm1: true
