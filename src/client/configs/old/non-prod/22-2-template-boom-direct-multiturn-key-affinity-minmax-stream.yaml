# 22-2: Multi-turn CodeFlow benchmark — BooM DIRECT + key_affinity + STREAMING, MiniMax-M2.7.
#
# DIRECT MODE + KEY AFFINITY: Each conversation's API key is rotated
# (sk-bench-{conv_id % 64}) so BooM's key_affinity routing sticks all
# turns of a conversation to the same vLLM pod, enabling prefix caching.
# Streaming enabled: measures TTFT and TPOT via real SSE.
#
# Helm requirements:
#   - boom.keyAffinityBench: true       (deploys in-memory Postgres with virtual keys)
#   - boom.directRoutingStrategy: key_affinity
#
# First run: set use_dataset_output_len: false, remove replay_output_lengths_from.
# Replay run: set replay_output_lengths_from to the first run's experiment ID.

backend: "boom"
multi_turn: true

router_url: "http://10.50.156.65:30080"
total_requests: 1000
prompt_source: "codeflow"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/CodeFlowBench-2505"
  split: "train"
  tokenizer_name: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  streaming: false
  min_input_tokens: 1
  max_input_tokens: 10000000
  repeat_each: 1
  multi_turn: true

load_pattern:
  pattern: "det"
  rate_rps: 3
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 500
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false
  # replay_output_lengths_from: "350"

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

boom:
  base_url: "http://10.50.156.65:30401"
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true
  key_affinity_keys: 64

helm:
  boom_claude_aliases: true
  boom_route_via: direct
  boom_key_affinity_bench: true
  boom_max_inflight: 10000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  nfs_path: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/home/models"

  aibrix_enabled: false
  cache_warm_enabled: false

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 6
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      batchSize: 4
      # dataParallel:                # DP disabled – DNS cannot resolve leader on new nodes
      #   enabled: true
      #   size: 2
      #   sizeLocal: 1
      #   rpcPort: 13389
      #   hcclBuffSize: 200
      #   ompNumThreads: 16
      #   pairTopologyKey: roce-pair
      dataParallel:
        enabled: false
      vllm:
        gpuMemoryUtilization: 0.85
        dtype: bfloat16
        quantization: ascend
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumSeqs: 32
        maxNumBatchedTokens: 32768
        maxModelLen: 131072
        enablePrefixCaching: true
        enableAutoToolChoice: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        seed: 1924
