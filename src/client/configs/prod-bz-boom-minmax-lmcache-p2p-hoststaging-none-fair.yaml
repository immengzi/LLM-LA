# FAIRNESS TEST (A) — router_strategy=none + pull-mode fairness ON.
#
# Derived from prod-bz-boom-minmax-lmcache-p2p-hoststaging-affinity.yaml. The
# deployment (MiniMax-M2.7, BooM + LLM-LA router, DP2 + LMCache P2P host-staging,
# BZ cluster, images, models, load) is IDENTICAL to that base. The ONLY
# differences vs the base are:
#   * router_strategy: "none"        (no KV, no affinity — every item is movable)
#   * router_fair_pull: true         (load-aware grant throttle enabled)
#   * affinity/persist knobs dropped (inert under strategy none)
#
# Purpose: exercise the fairness throttle at full strength (no pins to respect)
# and confirm the per-pod in-flight spread narrows. Compare against the paired
# config prod-bz-boom-minmax-lmcache-p2p-hoststaging-affinity-fair.yaml (fairness
# under HARD affinity) and against the base (fairness OFF).
#
# Observe while running:
#   * router_endpoint_inflight{endpoint}  -> spread across pods should tighten
#   * [PullRouter] "fair throttle ..." summary log lines on overloaded pods
# Flip fairness off for the baseline by setting router_fair_pull: false.
#
# BZ CAVEATS (same as base): needs lmcache-ascend:hccl-p2p image on the BZ
# registry; CONFIRM lmcache_p2p_controller_*_url + lmcacheController.nodeName
# against a real BZ node; verify node RAM before trusting lmcache_max_local_cpu_size.
# Pre-req on each engine node: sysctl -w vm.swappiness=0; sysctl -w kernel.numa_balancing=0

switch_cluster: bz
backend: "boom"

# Fairness load test: enough sustained concurrency for imbalance to form and the
# throttle to act (not the 5-request validation of the base). Tune as needed.
total_requests: 2000
prompt_source: "codeflow"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_profile: codeflowbench
  split: "train"
  streaming: false
  min_input_tokens: 1
  max_input_tokens: 3000
  repeat_each: 1
  seed: 314
  multi_turn: true
  min_user_turns: 3
  max_pool_size: 99999

load_pattern:
  pattern: "det"
  rate_rps: 5.0   # conversations/sec; spreads in-flight across pods
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 64
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false
  min_output_tokens_floor: 1024

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 300.0

boom:
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

helm:
  boom_claude_aliases: true
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  # Router routing = NONE (no KV, no affinity). Everything is movable, so the
  # fairness throttle operates at full strength.
  router_strategy: "none"
  router_len_aware: true
  router_len_policy: "short_first"
  router_owner_source: "lookup"
  router_lookup_max_blocks: 512
  router_strip_cch: "1"
  router_log_block_hashes: true
  router_measure_prefix: true   # keep kv_hits logged for cross-config comparison
  router_log_request_body: false
  router_log_request_body_max_bytes: 16384

  # ---- pull-mode fairness (the feature under test) ----
  router_fair_pull: true
  router_fair_margin: 1.25
  router_fair_floor: 1

  expose_per_pod: true

  nfs_path: "/data/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/data/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  # --- Mooncake: OFF (142 has no remote store). ---
  mooncake_enabled: false
  deploy_mooncake_master: false

  # --- LMCache: P2P / host-staging mode (142) ---
  lmcache_enabled: true
  lmcache_mode: "p2p"
  lmcache_chunk_size: 512
  lmcache_max_local_cpu_size: 100   # GiB per TP worker — VERIFY vs BZ node RAM

  lmcache_use_host_staging: true
  lmcache_os_staging_bytes: 8589934592   # 8 GiB

  lmcache_p2p_controller_pull_url: "192.168.0.42:9800"
  lmcache_p2p_controller_reply_url: "192.168.0.42:9900"
  deploy_lmcache_controller: true
  lmcache_controller_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  lmcache_nds_enabled: false

  # --- vLLM flags ---
  dtype: "bfloat16"
  ascend_enable_flashcomm1: true
  # 142 drops LSched; hccl-p2p image has no `lsched` module. Leave unset.
  # scheduler_cls: "lsched.lsched_vllm.LSchedVLLMAdapter"
  model_loader_extra_config: '{"enable_multithread_load":true,"num_threads":16}'

  vllm_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 2
      streamingMode: true
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      batchSize: 16
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 8888
        pairTopologyKey: roce-pair
        hcclBuffSize: 1024
        ompNumThreads: 16
      vllm:
        gpuMemoryUtilization: 0.92
        dtype: bfloat16
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 32768
        enablePrefixCaching: true
        enablePromptTokensDetails: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        # Dropped for p2p/142 — hccl-p2p image has no `lsched` module.
        # schedulerCls: "lsched.lsched_vllm.LSchedVLLMAdapter"
        modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
        ascendEnableFlashcomm1: true

  values:
    lmcacheController.nodeName: "k8s-worker1"
    boom.image: "boom-gateway:v5"
