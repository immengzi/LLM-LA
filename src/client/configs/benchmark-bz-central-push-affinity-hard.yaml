# CENTRAL-PUSH variant of benchmark-bz-pull-affinity-hard.yaml.
#
# IDENTICAL to that config (same claude-CLI HIGH-LOAD workload: 96 users x 3
# conversations, same deployment — MiniMax-M2.7, BooM + LLM-LA router, DP2 +
# LMCache P2P host-staging, BZ cluster, batchSize 32, HARD conversation affinity,
# same router knobs) EXCEPT the routing METHOD:
#   * router.mode: "central-push"  (router-driven capacity dispatch, not pull)
#   * router_central_push_cap: 34  (= batchSize 32 + sidecarPrefetch 2)
#
# Purpose: confirm central-push composes with HARD affinity WITHOUT overriding
# pins. Central-push admits through the SAME central queue / pull path, so KV-block
# registration, owner lookup and hard-affinity holds are identical to pull mode: a
# conversation pinned to a pod is only ever delivered to that pod, while the
# unpinned overflow is capacity-balanced by the router (CAP - in-flight per pod).
# Sidecars run in PUSH mode automatically (no pull poller).
#
# Directly comparable to benchmark-bz-pull-affinity-hard (pull) and to
# benchmark-bz-central-push-none (central-push under strategy=none).
#
# Observe while running:
#   * router_endpoint_inflight{endpoint}    -> unpinned overflow stays near CAP/tight
#   * router_affinity_hits_total / _releases_total -> pins still honored (central-push
#     must NOT inflate releases; /latency_log affinity_key must not be reassigned)
#   * router_central_push_pushed_total / _want / _passes_total -> dispatch flow
#   * router_central_push_requeued_total / _failed_total -> backpressure (~0 unless
#     a pod is warming/full)
#   * [CentralPush] dispatch log lines
#
# BZ-SPECIFIC CAVEATS — read before deploying:
#   1. IMAGE: needs the lmcache-ascend:hccl-p2p image pushed to the BZ registry.
#   2. CONTROLLER IP: set lmcache_p2p_controller_pull_url/reply_url and
#      lmcacheController.nodeName to a REAL BZ node (placeholder below is the old
#      mooncake IP 192.168.0.42 — CONFIRM before deploy).
#   3. RAM: local tier lives in HOST RAM per TP worker. Verify BZ node `free -g`
#      before trusting 100 GiB; lower if BZ nodes are smaller than YZ's 1.5 TB.
#
# Pre-requisite: run on each engine node before deploying:
#   sysctl -w vm.swappiness=0
#   sysctl -w kernel.numa_balancing=0

switch_cluster: bz
backend: "boom"

# Claude-CLI strategy comparison -- HIGH LOAD: 96 users x 3 conversations = 288
# conversations (~1021 requests/turns) (closed-loop "users" model; see
# transport.mode / users below). Offered concurrency (~96 users, one in-flight
# turn each) exceeds pod capacity (batchSize 32 x 2 pods = 64 sequences), so the
# router central queue / affinity holds / central-push dispatch are actually
# exercised here. total_requests is informational; the users model controls the
# conversation count.
total_requests: 288
prompt_source: "codeflow"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_profile: codeflowbench
  split: "train"
  streaming: false
  min_input_tokens: 1
  max_input_tokens: 3000
  repeat_each: 1
  seed: 314
  multi_turn: true
  min_user_turns: 3
  max_pool_size: 99999

load_pattern:
  pattern: "det"
  rate_rps: 5.0   # conversations/sec; spreads in-flight across pods
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  # Cap generated tokens per turn (not dataset length) so turns stay short and
  # many conversations keep flowing through the deployment during the soak.
  max_tokens: 64
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false
  min_output_tokens_floor: 1024   # unused while use_dataset_output_len=false

output_log_mode: "summary"
print_trace: false

# Capture the router /latency_log (KV/prefix truth) alongside the run, so each
# request's kv_hits/block_hashes/endpoint are recorded even though the claude CLI
# does not surface the router request id.
collect_router_log: true

metrics:
  enabled: true
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

# Integrated claude-CLI transport (closed-loop "users" load). The claude binary
# talks to the BooM Anthropic gateway; endpoint/model/auth default from `boom`.
transport:
  mode: "claude"

claude:
  bare: true            # skip hooks / CLAUDE.md for reproducibility
  enable_tools: false   # text-only; no file/shell tools, no permission prompts
  timeout_s: 900.0      # raised from 300s: under backpressure per-turn e2e tails
                        # exceed 300s (light-load p99 was already ~254s). Stays
                        # under the router RESULT_TIMEOUT_S=1000s hard ceiling.

# N users, each running K conversations sequentially with an interval between them.
users:
  num_users: 96             # > 64-seq pod capacity (batchSize 32 x 2) => backpressure
  convs_per_user: 3         # longer soak / more cache churn than the light run (2)
  interval_between_convs_s: 2.0
  ramp_s: 0.1               # PER-USER stagger (sleep = user_idx * ramp_s): 96 users
                            # spread over ~9.6s, then hold full concurrency

# Live Redis KV-block ownership timeline -> redis_kv_watch.jsonl. node_ip empty
# derives the host from router_url; port is the redis NodePort.
redis_watch:
  enabled: true
  port: 30079
  interval_s: 2.0

boom:
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

helm:
  boom_claude_aliases: true
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  # Router routing = affinity only, HARD mode (time-bounded pin). Central-push
  # honors the pins and capacity-balances only the unpinned overflow.
  router_strategy: "affinity"
  router_len_aware: true
  router_len_policy: "short_first"
  # Block-owner source for prefix routing. Inert under affinity (no effect on
  # routing here); kept explicit so a switch to prefix/both is drop-in.
  router_owner_source: "lookup"
  router_lookup_max_blocks: 512
  # Strip the whole Claude Code x-anthropic-billing-header attribution block
  # (rotating cc_version + per-request cch counter) router-side so KV-prefix
  # matching is byte-stable across requests. Chart default is OFF ("0"); opt in
  # here. Requires the remove-cc-header router build (whole-block strip).
  router_strip_cch: "1"
  router_log_block_hashes: true
  router_measure_prefix: true
  # Store each request's full body in the /latency_log ring so main.py can
  # content-match each claude turn to its entry (claude CLI does not surface the
  # router rid). logs.json stays body-free (only router_logs.json holds bodies).
  router_log_request_body: true
  router_log_request_body_max_bytes: 16384
  router_affinity_mode: "hard"
  # Clean affinity slate per strategy redeploy (no Redis-persisted map).
  router_affinity_persist_enabled: false
  router_affinity_ttl_s: 86400   # 24h; lazy expiry only (prune() not wired).
  # Hard-affinity spillover window. 600: strongly favors prefix locality
  # (near-"142" never-spill). Hard ceiling is RESULT_TIMEOUT_S=1000s (router waits
  # that long end-to-end INCLUDING this hold, then 504s), so 600 leaves ~400s for
  # dispatch+inference. Higher also slows failover off a dead/restarting pod.
  router_affinity_hard_timeout_s: 600

  # ---- central-push (the routing METHOD under test) ----
  # Only the unpinned overflow is capacity-balanced; hard pins are never moved.
  # CAP should track the sidecar batchSize + prefetch.
  router_central_push_cap: 34   # = batchSize 32 + sidecarPrefetch 2
  router_central_push_interval_s: 0.05

  expose_per_pod: true

  nfs_path: "/data/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/data/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  # --- Mooncake: OFF (142 has no remote store). ---
  mooncake_enabled: false
  deploy_mooncake_master: false

  # --- LMCache: P2P / host-staging mode (142) ---
  lmcache_enabled: true
  lmcache_mode: "p2p"
  lmcache_chunk_size: 512
  lmcache_max_local_cpu_size: 100   # GiB per TP worker — VERIFY vs BZ node RAM

  lmcache_use_host_staging: true
  lmcache_os_staging_bytes: 8589934592   # 8 GiB

  # CONFIRM these against a real BZ node (placeholder = old mooncake IP).
  lmcache_p2p_controller_pull_url: "192.168.0.42:9800"
  lmcache_p2p_controller_reply_url: "192.168.0.42:9900"
  deploy_lmcache_controller: true
  lmcache_controller_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  # NDS absent on BZ (no /dev/md0); nothing to disable.
  lmcache_nds_enabled: false

  # --- vLLM flags ---
  dtype: "bfloat16"
  ascend_enable_flashcomm1: true
  # 142 drops LSched; hccl-p2p image has no `lsched` module. Leave unset.
  # scheduler_cls: "lsched.lsched_vllm.LSchedVLLMAdapter"
  model_loader_extra_config: '{"enable_multithread_load":true,"num_threads":16}'

  # Must be the lmcache-ascend:hccl-p2p image on the BZ registry (caveat 1).
  vllm_image: "reg.local:32000/lmcache-ascend:hccl-p2p-metrics-fix"

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 2
      streamingMode: true
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      batchSize: 32
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 8888
        pairTopologyKey: roce-pair
        hcclBuffSize: 1024
        ompNumThreads: 16
      vllm:
        gpuMemoryUtilization: 0.92
        dtype: bfloat16
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 32768
        enablePrefixCaching: true
        enablePromptTokensDetails: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        # Dropped for p2p/142 — hccl-p2p image has no `lsched` module.
        # schedulerCls: "lsched.lsched_vllm.LSchedVLLMAdapter"
        modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
        ascendEnableFlashcomm1: true

  # Pin the controller to a real BZ node whose IP == controller_pull_url host.
  values:
    # Router mode is not driven by the BooM method, so set it explicitly here.
    # This also flips sidecars to push mode via vllmkv.sidecarMode.
    router.mode: "central-push"
    lmcacheController.nodeName: "k8s-worker1"
    boom.image: "boom-gateway:v5"
