# LLM-LA Go sidecarless: Go gateway external-push → mock-vllm.
# Paths relative to bench_mock/. Scale: --scale router=N
services:
  router:
    build:
      context: ../../core/services/go
      # dockerfile path is relative to context (services/go)
      dockerfile: ../../../client/bench_mock/docker/Dockerfile.router-go
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    env_file:
      - configs/llmla_go_sidecarless/router.env
    depends_on:
      redis:
        condition: service_healthy
      mock-vllm:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health/router >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  gateway-lb:
    volumes:
      - ./gateway-lb/nginx.router.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - router
