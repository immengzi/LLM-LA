# LLM-LA Go with sidecar: Locust → Go router → Go sidecar → mock-vllm.
# Pull mode: scale sidecars only (router stays 1). See scripts/run_path.sh.
services:
  router:
    build:
      context: ../../core/services/go
      dockerfile: ../../../client/bench_mock/docker/Dockerfile.router-go
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    env_file:
      - configs/llmla_go_sidecar/router.env
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health/router >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  sidecar:
    build:
      context: ../../core/services/go
      dockerfile: ../../../client/bench_mock/docker/Dockerfile.sidecar-go
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    env_file:
      - configs/llmla_go_sidecar/sidecar.env
    entrypoint: ["sh", "-c", "export CONTAINER_NAME=sidecar-$${HOSTNAME:-$$(cat /etc/hostname)}; exec sidecar"]

    depends_on:
      router:
        condition: service_healthy
      mock-vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s


  gateway-lb:
    volumes:
      - ./gateway-lb/nginx.router.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - router
      - sidecar
