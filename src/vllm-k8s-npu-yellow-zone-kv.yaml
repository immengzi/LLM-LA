apiVersion: v1
kind: Namespace
metadata:
  name: vllm

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-local-pv
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/nvme1/saeid/models/qwen3-8b
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-local-pvc
  namespace: vllm
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: qwen-local-pv

# =====================================================================
# *** ADDED: Redis Deployment + Service (ClusterIP)
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine   # *** ADDED
          args: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]  # *** ADDED
          ports:
            - containerPort: 6379
              name: redis
          resources:               # *** ADDED
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:          # *** ADDED
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:           # *** ADDED
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vllm
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP   # *** ADDED

# =====================================================================
# *** ADDED: CPU vLLM hash service (block-hash computing)
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu-hash
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cpu-hash
  template:
    metadata:
      labels:
        app: vllm-cpu-hash
    spec:
      containers:
        - name: vllm-cpu-hash
          image: vllm-cpu-hash:latest   # *** ADDED (build from openeuler/vllm-cpu)
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["/bin/bash", "-c"]  # *** ADDED
          args:
            - |
              source /opt/venv/bin/activate 2>/dev/null || true && \
              python kv_cache_aware/prefix_hash_service.py \
                --model-path /model \
                --host 0.0.0.0 \
                --port 9095 \
                --block-size 128
          env:                           # *** ADDED
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
          ports:
            - containerPort: 9095
              name: http
          volumeMounts:                  # *** ADDED
            - name: model
              mountPath: /model
              readOnly: true
          resources:                     # *** ADDED (tune as you like)
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-local-pvc    # *** ADDED

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-cpu-hash
  namespace: vllm
spec:
  selector:
    app: vllm-cpu-hash
  ports:
    - name: http
      port: 9095
      targetPort: 9095
  type: ClusterIP   # *** ADDED

# =====================================================================
# vLLM Ascend Deployment WITH KV-EVENTS + SIDECAR
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  replicas: 8
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      restartPolicy: Always
      containers:
        - name: vllm
          # image: quay.io/ascend/vllm-ascend:v0.10.1rc1
          image: quay.io/ascend/vllm-ascend:v0.11.0rc0   # *** FIXED to match docker-compose
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name served-model \
                --tensor-parallel-size 1 \
                --dtype float16 \
                --kv-cache-dtype auto \
                --max-num-seqs 8 \
                --prefix-caching-hash-algo sha256_cbor \
                --host 0.0.0.0 \
                --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@served-model"}'
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: POD_NAME          # *** ADDED (for kv-events-config topic)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 5557     # *** ADDED: ZMQ publisher port
              name: kvpub
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            # Mounting NPU-related host paths
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            - name: cache-volume
              mountPath: /root/.cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              huawei.com/Ascend910: 1
              ephemeral-storage: "2Gi"
            limits:
              huawei.com/Ascend910: 1
              ephemeral-storage: "4Gi"

        # ---------------------------------------------------------
        # *** ADDED: KV event listener sidecar (one per vLLM pod)
        # ---------------------------------------------------------
        - name: kv-listener          # *** ADDED
          image: kv_cache_event_listener:latest   # *** ADDED (build from Dockerfile.kv-listener)
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "-u", "zmq_subscriber.py"]   # *** ADDED
          env:
            - name: VLLM_HOST
              value: "127.0.0.1"         # connect to local ZMQ publisher
            - name: VLLM_SUB_PORT
              value: "5557"
            - name: REDIS_HOST
              value: "redis"             # Redis Service name
            - name: REDIS_PORT
              value: "6379"
            - name: CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MODEL_NAME
              value: "served-model"      # must match --served-model-name
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-local-pvc
        # HostPath volumes for Ascend/NPU integration
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30034

# --- PodMonitor: scrape vLLM pods exposing /metrics on named port "http"
# Namespace: vllm | Label selector: app=vllm-qwen | Interval: 15s
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  selector:
    matchLabels:
      app: vllm-qwen
  podMetricsEndpoints:
    - path: /metrics
      port: http
      interval: 1s
