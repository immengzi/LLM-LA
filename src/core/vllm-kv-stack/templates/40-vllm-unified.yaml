{{/*
  40-vllm-unified.yaml — Unified vLLM deployment template.

  Handles all three deployment modes through a single template:
    - Single model  (legacy fallback when models[] is empty)
    - Multi-model   (one Deployment per models[] entry)
    - Data Parallel  (LeaderWorkerSet when models[].dataParallel.enabled)

  When .Values.models is empty, synthesizes a single model entry from
  top-level values for backward compatibility.
*/}}

{{- if .Values.deploy.vllm }}

{{/* ---- Build effective models list ---- */}}
{{- $models := list }}
{{- if .Values.models }}
  {{- $models = .Values.models }}
{{- else }}
  {{- $legacyModel := dict
        "name" "qwen"
        "servedModelName" "served-model"
        "replicas" (int (.Values.replicas.vllm | default 1))
        "tensorParallelSize" (int .Values.tensorParallelSize)
        "batchSize" (int .Values.batchSize)
        "modelSubPath" .Values.modelVolume.modelSubPath
        "vllm" .Values.vllm
  }}
  {{- if .Values.dataParallel.enabled }}
    {{- $_ := set $legacyModel "dataParallel" .Values.dataParallel }}
  {{- end }}
  {{- $models = list $legacyModel }}
{{- end }}

{{/* ---- Validate ---- */}}
{{- range $models }}
  {{- $sub := .modelSubPath | default $.Values.modelVolume.modelSubPath }}
  {{- if not $sub }}
    {{- fail (printf "modelSubPath must be set for model '%s' (or set modelVolume.modelSubPath globally)" (.name | default "?")) }}
  {{- end }}
{{- end }}

{{/* ---- Common variables ---- */}}
{{- $backend := lower $.Values.backend }}
{{- $needsSidecar := and (ne (toString $.Values.sidecar.enabled) "false") (or (eq $backend "router") (eq $backend "litellm") (eq $backend "boom")) }}
{{/* KV-cache events must also be published (and port 5557 exposed) when BooM
     runs in kvc_aware direct mode, where sidecars are OFF but BooM subscribes to
     each leader pod's ZMQ PUB socket remotely. */}}
{{- $boomKvc := and (eq $backend "boom") (eq (lower ($.Values.boom.directRoutingStrategy | default "round_robin")) "kvc_aware") }}
{{/* Sidecar-optional push-*/central-push: when the sidecar is OFF and the
     router runs any push-* or central-push mode with prefix/both routing, the
     ROUTER hosts the KV-events subscriber (not the sidecar), so vLLM must still
     publish events + expose 5557 on a router-reachable address. Affinity-only /
     none need no events. */}}
{{- $strat := lower ($.Values.router.strategy | default "") }}
{{- $prefixOn := or (eq $strat "prefix") (eq $strat "both") (and (eq $strat "") ($.Values.router.kvAware)) }}
{{- $routerMode := lower ($.Values.router.mode | default "pull") }}
{{- $isPushOrCentral := or (hasPrefix "push-" $routerMode) (eq $routerMode "central-push") }}
{{- $directPushKv := and (eq (toString $.Values.sidecar.enabled) "false") $isPushOrCentral $prefixOn }}
{{- $publishKvEvents := or $needsSidecar $boomKvc $directPushKv }}
{{- $isLegacy := not $.Values.models }}

{{/* ---- Render resources per model ---- */}}
{{- range $idx, $m := $models }}

{{/* Per-model variables */}}
{{- $modelName := $m.name }}
{{- $servedModelName := $m.servedModelName | default $modelName }}
{{- $replicas := $m.replicas | default 1 }}
{{- $tp := $m.tensorParallelSize | default $.Values.tensorParallelSize | int }}
{{- $batchSize := $m.batchSize | default $.Values.batchSize | int }}
{{- $modelSubPath := $m.modelSubPath | default $.Values.modelVolume.modelSubPath }}
{{- $mv := $m.vllm | default dict }}
{{- $dp := $m.dataParallel | default dict }}
{{- $isDP := $dp.enabled | default false }}
{{- $flagCtx := dict "mv" $mv "gv" $.Values.vllm "batch" $batchSize }}
{{/* When this model is autoscaled, KEDA/HPA owns the replica count, so we omit
     the static replicas field to avoid helm upgrades fighting the autoscaler.
     Empty (back-compat) whenever autoscaling.enabled is false. */}}
{{- $autoscaled := eq (include "vllmkv.modelAutoscaled" (dict "root" $ "model" $m) | trim) "true" }}

{{- if gt $idx 0 }}
---
{{- end }}

{{/* =============================================================== */}}
{{/* DATA PARALLEL — LeaderWorkerSet                                 */}}
{{/* =============================================================== */}}
{{- if $isDP }}
{{- $dpTotal := mul ($dp.size | default 2 | int) ($dp.sizeLocal | default 1 | int) }}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm-{{ $modelName }}
  namespace: {{ $.Release.Namespace }}
spec:
  {{- if not $autoscaled }}
  replicas: {{ $dp.groups | default $replicas }}
  {{- end }}
  leaderWorkerTemplate:
    size: {{ $dp.size | default 2 }}
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: vllm-{{ $modelName }}
          component: vllm
          model: {{ $modelName }}
          role: leader
          {{- if $.Values.aibrix.enabled }}
          model.aibrix.ai/name: {{ $.Values.aibrix.modelName | quote }}
          model.aibrix.ai/port: {{ printf "%d" ($.Values.aibrix.port | int) | quote }}
          {{- end }}
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        {{- if include "vllmkv.isNvidia" $ }}
        runtimeClassName: {{ $.Values.vllm.runtimeClassName | default "nvidia" }}
        {{- end }}
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        {{- $ns := $.Values.vllm.leaderNodeSelector | default $.Values.vllm.nodeSelector | default (dict) }}
        {{- $xds := $.Values.lmcache.nds.xdsPathLeader | default $.Values.lmcache.nds.xdsPath }}
        {{- if $ns }}
        nodeSelector:
          {{- toYaml $ns | nindent 10 }}
        {{- end }}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: avoid
                      operator: NotIn
                      values:
                        - {{ $.Values.vllm.avoidLabelValue | default "vllm" }}
          {{- if $dp.pairTopologyKey }}
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: {{ $dp.pairTopologyKey }}
                labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                matchLabelKeys:
                  - leaderworkerset.sigs.k8s.io/group-index
          {{- end }}
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                topologyKey: kubernetes.io/hostname
        {{- if $dp.pairTopologyKey }}
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: {{ $dp.pairTopologyKey }}
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: vllm-{{ $modelName }}
        {{- end }}
        containers:
          - name: vllm
            {{- if $m.image }}
            image: {{ $m.image }}
            {{- else }}
            image: {{ include "vllmkv.image" (list $ $.Values.images.vllm) }}
            {{- end }}
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                {{- if not (include "vllmkv.isNvidia" $) }}
                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
                {{- end }}

                {{- if $dp.nicName }}
                nic_name="{{ $dp.nicName }}"
                {{- else }}
{{ include "vllmkv.nicDetectScript" . | trim | indent 16 }}
                {{- end }}
                echo "[vllm-dp-leader] nic=${nic_name} leader_ip=${NODE_IP}"
                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE={{ $dp.hcclBuffSize | default 200 }}
                export OMP_NUM_THREADS={{ $dp.ompNumThreads | default 16 }}
                {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
                export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
                {{- end }}
                {{- if $.Values.lmcache.enabled }}
                sed -e "s/__LOCAL_HOSTNAME__/${NODE_IP}/" -e "s/__P2P_HOST__/${NODE_IP}/" -e "s/__LMCACHE_INSTANCE_ID__/${POD_NAME}/" /etc/lmcache/lmcache_config.yaml > /tmp/lmcache_config.yaml
                export LMCACHE_CONFIG_FILE="/tmp/lmcache_config.yaml"
                # LMCache runs in worker processes separate from the vLLM API server.
                # In vLLM v1 their prometheus series only fold into /metrics when BOTH
                # share the same PROMETHEUS_MULTIPROC_DIR (LMCache issue #621). Pin it
                # (and wipe stale shards on restart) so lmcache: metrics show up on
                # :8200/metrics and get scraped by the vllm ServiceMonitor.
                export PROMETHEUS_MULTIPROC_DIR=/tmp/lmcache_prometheus
                rm -rf "${PROMETHEUS_MULTIPROC_DIR}" && mkdir -p "${PROMETHEUS_MULTIPROC_DIR}"
                {{- if $.Values.lmcache.nds.enabled }}
                mkdir -p {{ $.Values.lmcache.nds.path }}
                export PYTHONPATH="{{ $xds }}:${PYTHONPATH:-}"
                {{- end }}
                {{- end }}

                export PYTHONPATH="/etc/fingerprint-mw:${PYTHONPATH:-}"

                exec python -m vllm.entrypoints.openai.api_server \
                  --model /model \
                  --tokenizer /model \
                  --port 8200 \
                  --served-model-name {{ $servedModelName }} \
                  --tensor-parallel-size {{ $tp }} \
                  --data-parallel-size {{ $dpTotal }} \
                  --data-parallel-size-local {{ $dp.sizeLocal | default 1 }} \
                  --data-parallel-address "${NODE_IP}" \
                  --data-parallel-rpc-port {{ $dp.rpcPort | default 13389 }} \
                  --middleware _fp_mw.HostnameFingerprint \
{{ include "vllmkv.vllmRuntimeFlags" $flagCtx | trim | indent 18 }}
                  --host 0.0.0.0
                  {{- if $publishKvEvents }} \
                  --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@{{ $servedModelName }}"}'
                  {{- end }}
                  {{- if $.Values.lmcache.enabled }} \
                  {{- if eq $.Values.lmcache.mode "p2p" }}
                  --kv-transfer-config '{"kv_connector":"LMCacheAscendConnector","kv_role":"kv_both"}'
                  {{- else }}
                  --kv-transfer-config '{"kv_connector":"LMCacheAscendConnectorV1Dynamic","kv_role":"kv_both","kv_connector_module_path":"lmcache_ascend.integration.vllm.lmcache_ascend_connector_v1"}'
                  {{- end }}
                  {{- else if $.Values.mooncake.enabled }} \
                  --kv-transfer-config '{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"master_server_address":"{{ $.Values.mooncake.masterServerAddress }}","lookup_rpc_port":"{{ $.Values.mooncake.lookupRpcPort }}","backend":"mooncake"}}'
                  {{- end }}
            env:
              {{- include "vllmkv.vllmBaseEnv" (dict "tp" $tp "root" $) | nindent 14 }}
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
              - name: MOONCAKE_CONFIG_PATH
                value: "/etc/mooncake/mooncake.json"
              {{- end }}
            ports:
              - containerPort: 8200
                name: http
                protocol: TCP
              {{- if $publishKvEvents }}
              - containerPort: 5557
                name: kvpub
                protocol: TCP
              {{- end }}
              {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
              - containerPort: {{ $.Values.mooncake.lookupRpcPort }}
                name: kv-rpc
                protocol: TCP
              {{- end }}
              - containerPort: 9101
                name: vllmthr
                protocol: TCP
            volumeMounts:
              - name: fingerprint-mw
                mountPath: /etc/fingerprint-mw
                readOnly: true
              - name: model
                mountPath: /model
                readOnly: true
                subPath: {{ $modelSubPath }}
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              {{- if not (include "vllmkv.isNvidia" $) }}
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              {{- end }}
              {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
              - name: mooncake-config
                mountPath: /etc/mooncake/mooncake.json
                subPath: mooncake.json
                readOnly: true
              {{- end }}
              {{- if $.Values.lmcache.enabled }}
              - name: lmcache-config
                mountPath: /etc/lmcache/lmcache_config.yaml
                subPath: lmcache_config.yaml
                readOnly: true
              {{- if $.Values.lmcache.nds.enabled }}
              - name: nds-cache
                mountPath: {{ $.Values.lmcache.nds.path }}
              - name: p2p-device
                mountPath: /dev/p2p_device
              - name: xds-file-p2p
                mountPath: {{ $xds }}
                readOnly: true
              {{- end }}
              {{- end }}
              {{- include "vllmkv.ascendDriverMounts" $ | nindent 14 }}
            startupProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 12
              timeoutSeconds: 5
            livenessProbe:
              httpGet:
                path: /health
                port: 8200
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 720
              timeoutSeconds: 5
            resources:
              requests:
                {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
                ephemeral-storage: "2Gi"
                {{- with $.Values.vllm.engineResources.requests.cpu }}
                cpu: {{ . | quote }}
                {{- end }}
                {{- with $.Values.vllm.engineResources.requests.memory }}
                memory: {{ . | quote }}
                {{- end }}
              limits:
                {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
                ephemeral-storage: "4Gi"
                {{- with $.Values.vllm.engineResources.limits.cpu }}
                cpu: {{ . | quote }}
                {{- end }}
                {{- with $.Values.vllm.engineResources.limits.memory }}
                memory: {{ . | quote }}
                {{- end }}

          {{- if $needsSidecar }}
          - name: kv-sidecar
            image: {{ include "vllmkv.sidecarImage" $ }}
            imagePullPolicy: {{ $.Values.sidecar.imagePullPolicy | default "IfNotPresent" }}
            env:
              - name: ROUTER_URL
                value: "http://router-service:8080"
              - name: VLLM_URL
                value: "http://127.0.0.1:8200"
              - name: MODEL_NAME
                value: {{ $servedModelName | quote }}
              - name: SIDECAR_PORT
                value: "9000"
              - name: BATCH_SIZE
                value: {{ mul $batchSize $dpTotal | quote }}
              - name: PREFETCH
                value: {{ $.Values.sidecar.prefetch | quote }}
              - name: SIDECAR_MODE
                value: {{ include "vllmkv.sidecarMode" $ | quote }}
              - name: PULL_INTERVAL_S
                value: "0.05"
              - name: ROUTER_PULL_TIMEOUT_S
                value: "10000.0"
              - name: VLLM_TIMEOUT_S
                value: "7200.0"
              - name: ROUTER_RESULT_TIMEOUT_S
                value: "10000.0"
              - name: RESULT_TRANSPORT_MODE
                value: "submit_ack"
              - name: RESULT_SUBMIT_PATH
                value: "/result_submit"
              - name: VLLM_HOST
                value: "127.0.0.1"
              - name: VLLM_SUB_PORT
                value: "5557"
              - name: DP_SIZE
                value: {{ $isDP | ternary ($dp.size | default 2) 1 | quote }}
              - name: DP_SIZE_LOCAL
                value: {{ $isDP | ternary ($dp.sizeLocal | default 1) 1 | quote }}
              - name: REDIS_HOST
                value: "redis"
              - name: REDIS_PORT
                value: "6379"
              - name: CONTAINER_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: MODEL_NAME_REDIS
                value: {{ $servedModelName | quote }}
              - name: TRACE_ENABLED
                value: "true"
              - name: LOG_LEVEL
                value: {{ $.Values.sidecar.logLevel | default "info" | quote }}
              - name: FORCE_IGNORE_EOS
                value: {{ $.Values.sidecar.forceIgnoreEos | default false | quote }}
              - name: STREAMING_MODE
                value: {{ $.Values.sidecar.streamingMode | default false | quote }}
              {{- $slo := $.Values.sidecar.sloDynamicPull | default dict }}
              - name: SLO_DYNAMIC_PULL_ENABLED
                value: {{ $slo.enabled | default false | quote }}
              - name: SLO_TPOT_SLO_S
                value: {{ $slo.tpotSloSeconds | default 0.05 | quote }}
              - name: SLO_EVAL_INTERVAL_S
                value: {{ $slo.evalIntervalSeconds | default 5 | quote }}
              - name: SLO_WINDOW_SAMPLES
                value: {{ $slo.windowSamples | default 6 | quote }}
              - name: SLO_WINDOW_AGG
                value: {{ $slo.windowAgg | default "mean" | quote }}
              - name: SLO_MIN_PULL
                value: {{ $slo.minPull | default 1 | quote }}
              - name: SLO_MAX_PULL
                value: {{ $slo.maxPull | default 0 | quote }}
              - name: SLO_DECREASE_MODE
                value: {{ $slo.decreaseMode | default "additive" | quote }}
              - name: SLO_DECREASE_STEP
                value: {{ $slo.decreaseStep | default 1 | quote }}
              - name: SLO_DECREASE_FACTOR
                value: {{ $slo.decreaseFactor | default 0.5 | quote }}
              - name: SLO_RECOVER_STEP
                value: {{ $slo.recoverStep | default 1 | quote }}
              - name: SLO_COOLDOWN_S
                value: {{ $slo.cooldownSeconds | default 10 | quote }}
              {{- $kvReport := $.Values.sidecar.kvUsageReport | default dict }}
              - name: KV_USAGE_REPORT
                value: {{ ternary "true" "false" ($kvReport.enabled | default false) | quote }}
              - name: KV_USAGE_SCRAPE_INTERVAL_S
                value: {{ $kvReport.scrapeIntervalSeconds | default 5 | quote }}
              - name: KV_USAGE_SCRAPE_TIMEOUT_S
                value: {{ $kvReport.scrapeTimeoutSeconds | default 2 | quote }}
            ports:
              - containerPort: 9000
                name: sidecar-http
                protocol: TCP
            # Sidecar /health returns 503 until vLLM /health is 200 (health-gated
            # pulls). vLLM cold-load on big TP/DP models takes many minutes, far
            # longer than the liveness budget below. Without a startupProbe the
            # sidecar liveness kills the container mid-load, and because the LWS
            # restartPolicy is RecreateGroupOnPodRestart that tears down the whole
            # (still-loading) vLLM group — an unbreakable cold-start crash loop.
            # The startupProbe suspends liveness/readiness until vLLM first comes
            # up (budget ~3h, matching the vLLM container's own probes); normal
            # liveness only takes over once the model is actually serving.
            startupProbe:
              httpGet:
                path: /health
                port: 9000
              initialDelaySeconds: 30
              periodSeconds: 15
              failureThreshold: 720
              timeoutSeconds: 3
            readinessProbe:
              httpGet:
                path: /health
                port: 9000
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 3
              timeoutSeconds: 3
            livenessProbe:
              httpGet:
                path: /health
                port: 9000
              initialDelaySeconds: 30
              periodSeconds: 15
              failureThreshold: 5
              timeoutSeconds: 3
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"
          {{- end }}

        volumes:
          - name: fingerprint-mw
            configMap:
              name: {{ $.Release.Name }}-fingerprint-mw
          - name: model
            {{- if $.Values.modelVolume.hostPath }}
            hostPath:
              path: {{ $.Values.modelVolume.hostPath }}
              type: Directory
            {{- else }}
            persistentVolumeClaim:
              claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
            {{- end }}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ mul $tp 16 }}Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          {{- if not (include "vllmkv.isNvidia" $) }}
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          {{- end }}
          {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
          - name: mooncake-config
            configMap:
              name: mooncake-config
          {{- end }}
          {{- if $.Values.lmcache.enabled }}
          - name: lmcache-config
            configMap:
              name: lmcache-config
          {{- if $.Values.lmcache.nds.enabled }}
          - name: nds-cache
            hostPath:
              path: {{ $.Values.lmcache.nds.path }}
              type: DirectoryOrCreate
          - name: p2p-device
            hostPath:
              path: /dev/p2p_device
              type: CharDevice
          - name: xds-file-p2p
            hostPath:
              path: {{ $xds }}
              type: Directory
          {{- end }}
          {{- end }}
          {{- include "vllmkv.ascendDriverVolumes" $ | nindent 10 }}

    workerTemplate:
      metadata:
        labels:
          app: vllm-{{ $modelName }}-worker
          component: vllm
          model: {{ $modelName }}
          role: worker
      spec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        restartPolicy: Always
        shareProcessNamespace: true
        {{- if include "vllmkv.isNvidia" $ }}
        runtimeClassName: {{ $.Values.vllm.runtimeClassName | default "nvidia" }}
        {{- end }}
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        {{- $ns = $.Values.vllm.workerNodeSelector | default $.Values.vllm.nodeSelector | default (dict) }}
        {{- $xds = $.Values.lmcache.nds.xdsPathWorker | default $.Values.lmcache.nds.xdsPath }}
        {{- if $ns }}
        nodeSelector:
          {{- toYaml $ns | nindent 10 }}
        {{- end }}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: avoid
                      operator: NotIn
                      values:
                        - {{ $.Values.vllm.avoidLabelValue | default "vllm" }}
          {{- if $dp.pairTopologyKey }}
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: {{ $dp.pairTopologyKey }}
                labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                matchLabelKeys:
                  - leaderworkerset.sigs.k8s.io/group-index
          {{- end }}
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: leaderworkerset.sigs.k8s.io/name
                      operator: In
                      values:
                        - vllm-{{ $modelName }}
                topologyKey: kubernetes.io/hostname
        {{- if $dp.pairTopologyKey }}
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: {{ $dp.pairTopologyKey }}
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: vllm-{{ $modelName }}
        {{- end }}
        containers:
          - name: vllm
            {{- if $m.image }}
            image: {{ $m.image }}
            {{- else }}
            image: {{ include "vllmkv.image" (list $ $.Values.images.vllm) }}
            {{- end }}
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            command:
              - /bin/bash
              - -c
            args:
              - |
                set -eo pipefail

                {{- if not (include "vllmkv.isNvidia" $) }}
                export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
                export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
                {{- end }}

                {{- if $dp.nicName }}
                nic_name="{{ $dp.nicName }}"
                {{- else }}
{{ include "vllmkv.nicDetectScript" . | trim | indent 16 }}
                {{- end }}

                WORKER_INDEX="${POD_NAME##*-}"
                START_RANK=$(( WORKER_INDEX * {{ $dp.sizeLocal | default 1 }} ))

                # Retry DNS resolution up to 30 times (leader pod may not be registered yet)
                LEADER_IP=""
                for i in $(seq 1 30); do
                  LEADER_IP=$(getent hosts ${LWS_LEADER_ADDRESS} | awk '{print $1}' || true)
                  if [ -n "$LEADER_IP" ]; then
                    break
                  fi
                  echo "[vllm-dp-worker] DNS retry $i/30: cannot resolve ${LWS_LEADER_ADDRESS}, waiting 5s..."
                  sleep 5
                done
                if [ -z "$LEADER_IP" ]; then
                  echo "[vllm-dp-worker] FATAL: could not resolve ${LWS_LEADER_ADDRESS} after 30 retries"
                  echo "[vllm-dp-worker] resolv.conf: $(cat /etc/resolv.conf | tr '\n' ' ')"
                  exit 1
                fi
                echo "[vllm-dp-worker] nic=${nic_name} worker_idx=${WORKER_INDEX} start_rank=${START_RANK} leader_dns=${LWS_LEADER_ADDRESS} leader_ip=${LEADER_IP} node_ip=${NODE_IP}"

                export HCCL_IF_IP=${NODE_IP}
                export GLOO_SOCKET_IFNAME=${nic_name}
                export TP_SOCKET_IFNAME=${nic_name}
                export HCCL_SOCKET_IFNAME=${nic_name}
                export HCCL_BUFFSIZE={{ $dp.hcclBuffSize | default 200 }}
                export OMP_NUM_THREADS={{ $dp.ompNumThreads | default 16 }}
                {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
                export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
                {{- end }}
                {{- if $.Values.lmcache.enabled }}
                sed -e "s/__LOCAL_HOSTNAME__/${NODE_IP}/" -e "s/__P2P_HOST__/${NODE_IP}/" -e "s/__LMCACHE_INSTANCE_ID__/${POD_NAME}/" /etc/lmcache/lmcache_config.yaml > /tmp/lmcache_config.yaml
                export LMCACHE_CONFIG_FILE="/tmp/lmcache_config.yaml"
                # LMCache runs in worker processes separate from the vLLM API server.
                # In vLLM v1 their prometheus series only fold into /metrics when BOTH
                # share the same PROMETHEUS_MULTIPROC_DIR (LMCache issue #621). Pin it
                # (and wipe stale shards on restart) so lmcache: metrics show up on
                # :8200/metrics and get scraped by the vllm ServiceMonitor.
                export PROMETHEUS_MULTIPROC_DIR=/tmp/lmcache_prometheus
                rm -rf "${PROMETHEUS_MULTIPROC_DIR}" && mkdir -p "${PROMETHEUS_MULTIPROC_DIR}"
                {{- if $.Values.lmcache.nds.enabled }}
                mkdir -p {{ $.Values.lmcache.nds.path }}
                export PYTHONPATH="{{ $xds }}:${PYTHONPATH:-}"
                {{- end }}
                {{- end }}

                exec vllm serve /model \
                  --headless \
                  --served-model-name {{ $servedModelName }} \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --tensor-parallel-size {{ $tp }} \
                  --data-parallel-size {{ $dpTotal }} \
                  --data-parallel-size-local {{ $dp.sizeLocal | default 1 }} \
                  --data-parallel-address "${LEADER_IP}" \
                  --data-parallel-rpc-port {{ $dp.rpcPort | default 13389 }} \
                  --data-parallel-start-rank ${START_RANK} \
{{ include "vllmkv.vllmRuntimeFlags" $flagCtx | trim | indent 18 }}
                  {{- if $publishKvEvents }}
                  --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@{{ $servedModelName }}"}' \
                  {{- end }}
                  {{- if $.Values.lmcache.enabled }}
                  {{- if eq $.Values.lmcache.mode "p2p" }}
                  --kv-transfer-config '{"kv_connector":"LMCacheAscendConnector","kv_role":"kv_both"}'
                  {{- else }}
                  --kv-transfer-config '{"kv_connector":"LMCacheAscendConnectorV1Dynamic","kv_role":"kv_both","kv_connector_module_path":"lmcache_ascend.integration.vllm.lmcache_ascend_connector_v1"}'
                  {{- end }}
                  {{- else if $.Values.mooncake.enabled }}
                  --kv-transfer-config '{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"master_server_address":"{{ $.Values.mooncake.masterServerAddress }}","lookup_rpc_port":"{{ $.Values.mooncake.lookupRpcPort }}","backend":"mooncake"}}'
                  {{- end }}
            env:
              {{- include "vllmkv.vllmBaseEnv" (dict "tp" $tp "root" $) | nindent 14 }}
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              - name: LWS_LEADER_ADDRESS
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['leaderworkerset.sigs.k8s.io/leader-address']
              {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
              - name: MOONCAKE_CONFIG_PATH
                value: "/etc/mooncake/mooncake.json"
              {{- end }}
            volumeMounts:
              - name: fingerprint-mw
                mountPath: /etc/fingerprint-mw
                readOnly: true
              - name: model
                mountPath: /model
                readOnly: true
                subPath: {{ $modelSubPath }}
              - name: dshm
                mountPath: /dev/shm
              - name: cache-volume
                mountPath: /root/.cache
              {{- if not (include "vllmkv.isNvidia" $) }}
              - name: hccn-conf
                mountPath: /etc/hccn.conf
                readOnly: true
              {{- end }}
              {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
              - name: mooncake-config
                mountPath: /etc/mooncake/mooncake.json
                subPath: mooncake.json
                readOnly: true
              {{- end }}
              {{- if $.Values.lmcache.enabled }}
              - name: lmcache-config
                mountPath: /etc/lmcache/lmcache_config.yaml
                subPath: lmcache_config.yaml
                readOnly: true
              {{- if $.Values.lmcache.nds.enabled }}
              - name: nds-cache
                mountPath: {{ $.Values.lmcache.nds.path }}
              - name: p2p-device
                mountPath: /dev/p2p_device
              - name: xds-file-p2p
                mountPath: {{ $xds }}
                readOnly: true
              {{- end }}
              {{- end }}
              {{- include "vllmkv.ascendDriverMounts" $ | nindent 14 }}
            livenessProbe:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - "pgrep -f 'vllm.entrypoints' > /dev/null"
              initialDelaySeconds: 120
              periodSeconds: 30
              failureThreshold: 3
            resources:
              requests:
                {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
                ephemeral-storage: "2Gi"
                {{- with $.Values.vllm.engineResources.requests.cpu }}
                cpu: {{ . | quote }}
                {{- end }}
                {{- with $.Values.vllm.engineResources.requests.memory }}
                memory: {{ . | quote }}
                {{- end }}
              limits:
                {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
                ephemeral-storage: "4Gi"
                {{- with $.Values.vllm.engineResources.limits.cpu }}
                cpu: {{ . | quote }}
                {{- end }}
                {{- with $.Values.vllm.engineResources.limits.memory }}
                memory: {{ . | quote }}
                {{- end }}

        volumes:
          - name: fingerprint-mw
            configMap:
              name: {{ $.Release.Name }}-fingerprint-mw
          - name: model
            {{- if $.Values.modelVolume.hostPath }}
            hostPath:
              path: {{ $.Values.modelVolume.hostPath }}
              type: Directory
            {{- else }}
            persistentVolumeClaim:
              claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
            {{- end }}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: {{ mul $tp 16 }}Gi
          - name: cache-volume
            hostPath:
              path: /root/.cache
              type: DirectoryOrCreate
          {{- if not (include "vllmkv.isNvidia" $) }}
          - name: hccn-conf
            hostPath:
              path: /etc/hccn.conf
              type: File
          {{- end }}
          {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
          - name: mooncake-config
            configMap:
              name: mooncake-config
          {{- end }}
          {{- if $.Values.lmcache.enabled }}
          - name: lmcache-config
            configMap:
              name: lmcache-config
          {{- if $.Values.lmcache.nds.enabled }}
          - name: nds-cache
            hostPath:
              path: {{ $.Values.lmcache.nds.path }}
              type: DirectoryOrCreate
          - name: p2p-device
            hostPath:
              path: /dev/p2p_device
              type: CharDevice
          - name: xds-file-p2p
            hostPath:
              path: {{ $xds }}
              type: Directory
          {{- end }}
          {{- end }}
          {{- include "vllmkv.ascendDriverVolumes" $ | nindent 10 }}

{{/* =============================================================== */}}
{{/* STANDARD DEPLOYMENT                                             */}}
{{/* =============================================================== */}}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $modelName }}
  namespace: {{ $.Release.Namespace }}
spec:
  {{- if not $autoscaled }}
  replicas: {{ $replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: vllm-{{ $modelName }}
      model: {{ $modelName }}
  template:
    metadata:
      labels:
        app: vllm-{{ $modelName }}
        component: vllm
        model: {{ $modelName }}
        {{- if $.Values.aibrix.enabled }}
        model.aibrix.ai/name: {{ $.Values.aibrix.modelName | quote }}
        model.aibrix.ai/port: {{ printf "%d" ($.Values.aibrix.port | int) | quote }}
        {{- end }}
    spec:
      restartPolicy: Always
      shareProcessNamespace: true
      {{- if include "vllmkv.isNvidia" $ }}
      runtimeClassName: {{ $.Values.vllm.runtimeClassName | default "nvidia" }}
      {{- end }}

      {{- if and (or $.Values.mooncake.enabled $.Values.lmcache.enabled) $.Values.vllm.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      {{- $ns := $.Values.vllm.nodeSelector | default (dict) }}
      {{- $xds := $.Values.lmcache.nds.xdsPath }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - {{ $.Values.vllm.avoidLabelValue | default "vllm" }}
        {{- if gt (int $tp) 1 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: model
                    operator: Exists
              topologyKey: kubernetes.io/hostname
        {{- else }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: model
                      operator: Exists
                topologyKey: kubernetes.io/hostname
        {{- end }}

      containers:
        - name: vllm
          {{- if $m.image }}
          image: {{ $m.image }}
          {{- else }}
          image: {{ include "vllmkv.image" (list $ $.Values.images.vllm) }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
          securityContext:
            privileged: true
          {{- end }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eo pipefail

              {{- if not (include "vllmkv.isNvidia" $) }}
              export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
              echo "--- ASCEND_TOOLKIT_HOME before sourcing: [$ASCEND_TOOLKIT_HOME]"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
              {{- end }}

              {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
{{ include "vllmkv.nicDetectScript" . | trim | indent 14 }}
              echo "[vllm] local_ip=${local_ip} nic=${nic_name}"
              export HCCL_IF_IP=${local_ip}
              export GLOO_SOCKET_IFNAME=${nic_name}
              export TP_SOCKET_IFNAME=${nic_name}
              export HCCL_SOCKET_IFNAME=${nic_name}
              export HCCL_BUFFSIZE=200
              export ASCEND_BUFFER_POOL={{ $.Values.vllm.ascendBufferPool | default "4:8" }}
              {{- if not $.Values.lmcache.enabled }}
              export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
              {{- end }}
              {{- end }}
              {{- if $.Values.lmcache.enabled }}
              sed -e "s/__LOCAL_HOSTNAME__/${NODE_IP}/" -e "s/__P2P_HOST__/${NODE_IP}/" -e "s/__LMCACHE_INSTANCE_ID__/${POD_NAME}/" /etc/lmcache/lmcache_config.yaml > /tmp/lmcache_config.yaml
              export LMCACHE_CONFIG_FILE="/tmp/lmcache_config.yaml"
              # LMCache runs in worker processes separate from the vLLM API server.
              # In vLLM v1 their prometheus series only fold into /metrics when BOTH
              # share the same PROMETHEUS_MULTIPROC_DIR (LMCache issue #621). Pin it
              # (and wipe stale shards on restart) so lmcache: metrics show up on
              # :8200/metrics and get scraped by the vllm ServiceMonitor.
              export PROMETHEUS_MULTIPROC_DIR=/tmp/lmcache_prometheus
              rm -rf "${PROMETHEUS_MULTIPROC_DIR}" && mkdir -p "${PROMETHEUS_MULTIPROC_DIR}"
              {{- if $.Values.lmcache.nds.enabled }}
              mkdir -p {{ $.Values.lmcache.nds.path }}
              export PYTHONPATH="{{ $xds }}:${PYTHONPATH:-}"
              {{- end }}
              {{- end }}

              export PYTHONPATH="/etc/fingerprint-mw:${PYTHONPATH:-}"

              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name {{ $servedModelName }} \
                --tensor-parallel-size {{ $tp }} \
                --middleware _fp_mw.HostnameFingerprint \
{{ include "vllmkv.vllmRuntimeFlags" $flagCtx | trim | indent 16 }}
                --host 0.0.0.0 \
                {{- if $publishKvEvents }}
                --kv-events-config '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@'"${POD_NAME}"'@{{ $servedModelName }}"}' \
                {{- end }}
                {{- if $.Values.lmcache.enabled }}
                {{- if eq $.Values.lmcache.mode "p2p" }}
                --kv-transfer-config '{"kv_connector":"LMCacheAscendConnector","kv_role":"kv_both"}' \
                {{- else }}
                --kv-transfer-config '{"kv_connector":"LMCacheAscendConnectorV1Dynamic","kv_role":"kv_both","kv_connector_module_path":"lmcache_ascend.integration.vllm.lmcache_ascend_connector_v1"}' \
                {{- end }}
                {{- else if $.Values.mooncake.enabled }}
                --kv-transfer-config '{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"master_server_address":"{{ $.Values.mooncake.masterServerAddress }}","lookup_rpc_port":"{{ $.Values.mooncake.lookupRpcPort }}","backend":"mooncake"}}' \
                {{- end }}
                &
              VLLM_PID=$!
              echo "[vllm-wrapper] vLLM PID=$VLLM_PID model={{ $modelName }}"

{{ include "vllmkv.threadExporter" . | trim | indent 14 }}

              wait "$VLLM_PID"
          env:
            {{- include "vllmkv.vllmBaseEnv" (dict "tp" $tp "root" $) | nindent 12 }}
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- end }}
            {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake.json"
            {{- end }}
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            {{- if $publishKvEvents }}
            - containerPort: 5557
              name: kvpub
              protocol: TCP
            {{- end }}
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            - containerPort: {{ $.Values.mooncake.lookupRpcPort }}
              name: kv-rpc
              protocol: TCP
            {{- end }}
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: fingerprint-mw
              mountPath: /etc/fingerprint-mw
              readOnly: true
            - name: model
              mountPath: /model
              readOnly: true
              subPath: {{ $modelSubPath }}
            - name: dshm
              mountPath: /dev/shm
            {{- if not (include "vllmkv.isNvidia" $) }}
            - name: dcmi-volume
              mountPath: /usr/local/dcmi
            - name: npu-smi-volume
              mountPath: /usr/local/bin/npu-smi
            - name: ascend-driver-lib64-volume
              mountPath: /usr/local/Ascend/driver/lib64/
            - name: version-info-volume
              mountPath: /usr/local/Ascend/driver/version.info
            - name: ascend-install-info-volume
              mountPath: /etc/ascend_install.info
            {{- end }}
            - name: cache-volume
              mountPath: /root/.cache
            {{- if not (include "vllmkv.isNvidia" $) }}
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm
            {{- end }}
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            {{- if not $.Values.lmcache.enabled }}
            - name: mooncake-config
              mountPath: /etc/mooncake/mooncake.json
              subPath: mooncake.json
              readOnly: true
            {{- end }}
            {{- if $.Values.lmcache.enabled }}
            - name: lmcache-config
              mountPath: /etc/lmcache/lmcache_config.yaml
              subPath: lmcache_config.yaml
              readOnly: true
            {{- if $.Values.lmcache.nds.enabled }}
            - name: nds-cache
              mountPath: {{ $.Values.lmcache.nds.path }}
            - name: p2p-device
              mountPath: /dev/p2p_device
            - name: xds-file-p2p
              mountPath: {{ $xds }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: hccn-conf
              mountPath: /etc/hccn.conf
              readOnly: true
            {{- end }}

          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5

          resources:
            requests:
              {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
              ephemeral-storage: "2Gi"
              {{- with $.Values.vllm.engineResources.requests.cpu }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $.Values.vllm.engineResources.requests.memory }}
              memory: {{ . | quote }}
              {{- end }}
            limits:
              {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
              ephemeral-storage: "4Gi"
              {{- with $.Values.vllm.engineResources.limits.cpu }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $.Values.vllm.engineResources.limits.memory }}
              memory: {{ . | quote }}
              {{- end }}

        {{- if $needsSidecar }}
        - name: kv-sidecar
          image: {{ include "vllmkv.sidecarImage" $ }}
          imagePullPolicy: {{ $.Values.sidecar.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: ROUTER_URL
              value: "http://router-service:8080"
            - name: VLLM_URL
              value: "http://127.0.0.1:8200"
            - name: MODEL_NAME
              value: {{ $servedModelName | quote }}
            - name: SIDECAR_PORT
              value: "9000"
            - name: BATCH_SIZE
              value: {{ $batchSize | quote }}
            - name: PREFETCH
              value: {{ $.Values.sidecar.prefetch | quote }}
            - name: SIDECAR_MODE
              value: {{ include "vllmkv.sidecarMode" $ | quote }}
            - name: PULL_INTERVAL_S
              value: "0.05"
            - name: ROUTER_PULL_TIMEOUT_S
              value: "10000.0"
            - name: VLLM_TIMEOUT_S
              value: "7200.0"
            - name: ROUTER_RESULT_TIMEOUT_S
              value: "10000.0"
            - name: RESULT_TRANSPORT_MODE
              value: "submit_ack"
            - name: RESULT_SUBMIT_PATH
              value: "/result_submit"
            - name: VLLM_HOST
              value: "127.0.0.1"
            - name: VLLM_SUB_PORT
              value: "5557"
            - name: DP_SIZE
              value: "1"
            - name: DP_SIZE_LOCAL
              value: "1"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MODEL_NAME_REDIS
              value: {{ $servedModelName | quote }}
            - name: TRACE_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: {{ $.Values.sidecar.logLevel | default "info" | quote }}
            - name: FORCE_IGNORE_EOS
              value: {{ $.Values.sidecar.forceIgnoreEos | default false | quote }}
            - name: STREAMING_MODE
              value: {{ $.Values.sidecar.streamingMode | default false | quote }}
            {{- $slo := $.Values.sidecar.sloDynamicPull | default dict }}
            - name: SLO_DYNAMIC_PULL_ENABLED
              value: {{ $slo.enabled | default false | quote }}
            - name: SLO_TPOT_SLO_S
              value: {{ $slo.tpotSloSeconds | default 0.05 | quote }}
            - name: SLO_EVAL_INTERVAL_S
              value: {{ $slo.evalIntervalSeconds | default 5 | quote }}
            - name: SLO_WINDOW_SAMPLES
              value: {{ $slo.windowSamples | default 6 | quote }}
            - name: SLO_WINDOW_AGG
              value: {{ $slo.windowAgg | default "mean" | quote }}
            - name: SLO_MIN_PULL
              value: {{ $slo.minPull | default 1 | quote }}
            - name: SLO_MAX_PULL
              value: {{ $slo.maxPull | default 0 | quote }}
            - name: SLO_DECREASE_MODE
              value: {{ $slo.decreaseMode | default "additive" | quote }}
            - name: SLO_DECREASE_STEP
              value: {{ $slo.decreaseStep | default 1 | quote }}
            - name: SLO_DECREASE_FACTOR
              value: {{ $slo.decreaseFactor | default 0.5 | quote }}
            - name: SLO_RECOVER_STEP
              value: {{ $slo.recoverStep | default 1 | quote }}
            - name: SLO_COOLDOWN_S
              value: {{ $slo.cooldownSeconds | default 10 | quote }}
            {{- $kvReport := $.Values.sidecar.kvUsageReport | default dict }}
            - name: KV_USAGE_REPORT
              value: {{ ternary "true" "false" ($kvReport.enabled | default false) | quote }}
            - name: KV_USAGE_SCRAPE_INTERVAL_S
              value: {{ $kvReport.scrapeIntervalSeconds | default 5 | quote }}
            - name: KV_USAGE_SCRAPE_TIMEOUT_S
              value: {{ $kvReport.scrapeTimeoutSeconds | default 2 | quote }}
          ports:
            - containerPort: 9000
              name: sidecar-http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
        {{- end }}

      volumes:
        - name: fingerprint-mw
          configMap:
            name: {{ $.Release.Name }}-fingerprint-mw
        - name: model
          {{- if $.Values.modelVolume.hostPath }}
          hostPath:
            path: {{ $.Values.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ mul $tp 16 }}Gi
        {{- if not (include "vllmkv.isNvidia" $) }}
        - name: dcmi-volume
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npu-smi-volume
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: ascend-driver-lib64-volume
          hostPath:
            path: /usr/local/Ascend/driver/lib64/
            type: Directory
        - name: version-info-volume
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info-volume
          hostPath:
            path: /etc/ascend_install.info
            type: File
        {{- end }}
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        {{- if not (include "vllmkv.isNvidia" $) }}
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
        {{- end }}
        {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
        {{- if not $.Values.lmcache.enabled }}
        - name: mooncake-config
          configMap:
            name: mooncake-config
        {{- end }}
        {{- if $.Values.lmcache.enabled }}
        - name: lmcache-config
          configMap:
            name: lmcache-config
        {{- if $.Values.lmcache.nds.enabled }}
        - name: nds-cache
          hostPath:
            path: {{ $.Values.lmcache.nds.path }}
            type: DirectoryOrCreate
        - name: p2p-device
          hostPath:
            path: /dev/p2p_device
            type: CharDevice
        - name: xds-file-p2p
          hostPath:
            path: {{ $xds }}
            type: Directory
        {{- end }}
        {{- end }}
        - name: hccn-conf
          hostPath:
            path: /etc/hccn.conf
            type: File
        {{- end }}

{{- end }}
{{/* end if $isDP */}}

---
{{/* ---- Service for this model ---- */}}
{{/* For DP models the LWS controller creates a headless service named
     vllm-<modelName>, so our NodePort service must use a DIFFERENT name
     to avoid overwriting it (the headless service is required for pod DNS). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ if $isDP }}vllm-{{ $modelName }}-api{{ else }}vllm-{{ $modelName }}{{ end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    component: vllm
    model: {{ $modelName }}
spec:
  {{- if or $isDP $isLegacy $m.nodePort }}
  type: NodePort
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    app: vllm-{{ $modelName }}
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      {{- if $m.nodePort }}
      nodePort: {{ $m.nodePort }}
      {{- else if or $isDP $isLegacy }}
      nodePort: {{ add ($.Values.portOffset | int) 30034 }}
      {{- end }}

{{- end }}
{{/* end range $models */}}

{{/* ---- Per-pod NodePort services ---- */}}
{{/* Created by the sweep runner via helm upgrade --reuse-values after pods
     are running.  Each entry in perPodServices.pods gets a dedicated
     NodePort Service targeting a single pod.  The selector depends on the
     workload type (perPodServices.useStatefulSetSelector, set by the sweep
     runner from the discovered pods):
       - DP (LeaderWorkerSet, StatefulSet-backed leaders): select on the
         built-in `statefulset.kubernetes.io/pod-name` label, which the
         controller re-applies on every restart -> the Service stays attached
         across pod restarts with NO manual re-labeling or re-sweep.
       - non-DP (plain Deployment, no stable per-pod label): fall back to the
         imperative `vllm-pod-id` label applied by the sweep runner. */}}
{{- if and .Values.perPodServices .Values.perPodServices.enabled }}
{{- range $pod := .Values.perPodServices.pods }}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pp-{{ $pod.name | trunc 54 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    component: vllm-per-pod
    managed-by: helm-per-pod
spec:
  type: NodePort
  selector:
    {{- if $.Values.perPodServices.useStatefulSetSelector }}
    statefulset.kubernetes.io/pod-name: {{ $pod.name }}
    {{- else }}
    vllm-pod-id: {{ $pod.name }}
    {{- end }}
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      {{- if $pod.nodePort }}
      nodePort: {{ $pod.nodePort }}
      {{- end }}
{{- end }}
{{- end }}

{{- end }}
{{/* end if deploy.vllm */}}
