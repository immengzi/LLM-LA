{{- if .Values.vllm.sleepOverlay.enabled }}
{{- if not (include "vllmkv.isNvidia" .) }}
{{/* File list + bodies are injected at deploy time (see the patch package:
     overlay.json + make-overlay-command.py). Shared with 41 so a partial entry
     fails identically wherever the overlay is rendered. */}}
{{- include "vllmkv.validateOverlayFiles" . }}
{{- $overlayFiles := .Values.vllm.sleepOverlay.files | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.vllm.sleepOverlay.configMapName | default (printf "%s-te-unreg-sc" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- range $name, $f := $overlayFiles }}
  {{ $f.key | quote }}: |
{{ $f.content | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
