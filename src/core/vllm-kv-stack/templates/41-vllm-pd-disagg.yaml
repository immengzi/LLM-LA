{{/*
  41-vllm-pd-disagg.yaml — Vanilla prefill/decode (P/D) disaggregation.

  Opt-in PER MODEL via `models[].prefillDecode.enabled: true`. This is a
  standalone topology that mirrors the LeaderWorkerSet (DP) branch in
  40-vllm-unified.yaml: instead of one vLLM Deployment per model, a P/D model
  is served by

    - a PREFILL pool  (vllm-<model>-prefill, kv_role producer side)
    - a DECODE  pool  (vllm-<model>-decode,  kv_role consumer side)
    - a lightweight PROXY (vllm-<model>, NodePort) that routes each request
      prefill(max_tokens=1) -> decode, and streams the decode output back.

  KV state moves between the two pools over the SAME connector the chart
  already uses (Mooncake / LMCache). The proxy handshake is connector-agnostic:
  it forwards `kv_transfer_params` from the prefill response to decode when a
  connector returns them (NIXL-style), and otherwise relies on the shared KV
  store (Mooncake/LMCache) so decode pulls the prefix by hash.

  P/D models are deliberately independent of the router/sidecar/Redis path —
  the proxy IS the entry point. Router-integrated, KV-aware P/D orchestration is
  a separate roadmap item. Models with prefillDecode.enabled are skipped by
  40-vllm-unified.yaml, 60-keda-scaledobject.yaml, and 10-model-registry.yaml.
*/}}

{{- if .Values.deploy.vllm }}

{{/* ---- Collect P/D-enabled models (only from an explicit models[] list) ---- */}}
{{- $pdModels := list }}
{{- range $m := (.Values.models | default list) }}
  {{- if ($m.prefillDecode | default dict).enabled }}
    {{- $pdModels = append $pdModels $m }}
  {{- end }}
{{- end }}

{{- if $pdModels }}
{{/* ---- Shared P/D proxy code (mounted read-only into every proxy pod) ---- */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pd-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: pd-proxy
    release: {{ .Release.Name }}
data:
  pd_proxy.py: |
{{ .Files.Get "files/pd_proxy.py" | nindent 4 }}
{{- end }}
---
{{/* ---- Per-model P/D resources ---- */}}
{{- range $idx, $m := $pdModels }}
{{- $modelName := $m.name }}
{{- $servedModelName := $m.servedModelName | default $modelName }}
{{- $modelSubPath := $m.modelSubPath | default $.Values.modelVolume.modelSubPath }}
{{- if not $modelSubPath }}
{{- fail (printf "modelSubPath must be set for P/D model '%s'" ($modelName | default "?")) }}
{{- end }}
{{- $mv := $m.vllm | default dict }}
{{/* Merge global prefillDecode defaults under the per-model block (model wins). */}}
{{- $pd := merge (deepCopy ($m.prefillDecode | default dict)) ($.Values.prefillDecode | default dict) }}
{{- $prefill := $pd.prefill | default dict }}
{{- $decode := $pd.decode | default dict }}
{{- $proxy := $pd.proxy | default dict }}
{{- $defBatch := $m.batchSize | default $.Values.batchSize | int }}
{{- $defTp := $m.tensorParallelSize | default $.Values.tensorParallelSize | int }}
{{- $prefillTp := $prefill.tensorParallelSize | default $defTp | int }}
{{- $decodeTp := $decode.tensorParallelSize | default $defTp | int }}
{{- $maxTp := max $prefillTp $decodeTp }}

{{/* Default KV-transfer-config: reuse the connector the standard deployment
     uses, so P/D works out of the box on a Mooncake/LMCache-backed cluster. */}}
{{- $defaultKv := "" }}
{{- if $.Values.lmcache.enabled }}
  {{- if eq $.Values.lmcache.mode "p2p" }}
    {{- $defaultKv = `{"kv_connector":"LMCacheAscendConnector","kv_role":"kv_both"}` }}
  {{- else }}
    {{- $defaultKv = `{"kv_connector":"LMCacheAscendConnectorV1Dynamic","kv_role":"kv_both","kv_connector_module_path":"lmcache_ascend.integration.vllm.lmcache_ascend_connector_v1"}` }}
  {{- end }}
{{- else if $.Values.mooncake.enabled }}
  {{- $defaultKv = printf `{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"master_server_address":"%s","lookup_rpc_port":"%s","backend":"mooncake"}}` $.Values.mooncake.masterServerAddress ($.Values.mooncake.lookupRpcPort | toString) }}
{{- end }}
{{- $kvOverride := $pd.kvTransferConfig | default dict }}
{{- $prefillKv := $kvOverride.prefill | default $defaultKv }}
{{- $decodeKv := $kvOverride.decode | default $defaultKv }}

{{- $roles := list
      (dict "role" "prefill" "kv" $prefillKv
            "tp" ($prefill.tensorParallelSize | default $defTp | int)
            "batch" ($prefill.batchSize | default $defBatch | int)
            "replicas" ($prefill.replicas | default 1 | int))
      (dict "role" "decode" "kv" $decodeKv
            "tp" ($decode.tensorParallelSize | default $defTp | int)
            "batch" ($decode.batchSize | default $defBatch | int)
            "replicas" ($decode.replicas | default 1 | int)) }}

{{- $reb := $pd.dynamicRebalance | default dict }}
{{- $warmStandby := eq ($reb.mode | default "scale") "warmstandby" }}
{{- $prefillPort := $prefill.port | default 8200 | int }}
{{- $decodePort := $decode.port | default (ternary 8201 8200 $warmStandby) | int }}
{{- $sleepLevel := $reb.sleepLevel | default 1 | int }}
{{- $poolBootSleep := $pd.poolBootSleep | default false }}
{{- $kvRpcBase := $.Values.mooncake.lookupRpcPort | default "10010" | int }}
{{- $pdHostNetwork := $pd.hostNetwork | default ($.Values.vllm.hostNetwork | default false) }}
{{- $useHostNet := or $pdHostNetwork (and (or $.Values.mooncake.enabled $.Values.lmcache.enabled) $.Values.vllm.hostNetwork) }}
{{- if $warmStandby }}
{{- if ne $prefillTp $decodeTp }}
{{- fail (printf "warmstandby mode requires equal prefill/decode tensorParallelSize for model %q" $modelName) }}
{{- end }}
{{/* Port plan + overlay validation live in shared helpers so both the mounts here
     and the ConfigMap in 44-engine-sleep-overlay.yaml fail with the same message. */}}
{{- include "vllmkv.validateWarmStandbyPorts" (dict "modelName" $modelName "prefill" $prefill "decode" $decode) }}
{{- if $.Values.vllm.sleepOverlay.enabled }}
{{- include "vllmkv.validateOverlayFiles" $ }}
{{- end }}
{{- $pdReplicas := $pd.replicas | default ($reb.maxTotalReplicas | default 1 | int) | int }}
{{- $gvNoCC := deepCopy $.Values.vllm }}
{{- $_ := unset $gvNoCC "compilationConfig" }}
{{- $mvNoCC := deepCopy $mv }}
{{- $_ := unset $mvNoCC "compilationConfig" }}
{{- $warmRoles := list
      (dict "role" "prefill" "kv" $prefillKv
            "tp" $prefillTp
            "batch" ($prefill.batchSize | default $defBatch | int)
            "port" $prefillPort
            "kvRpc" $kvRpcBase
            "thrPort" 9101
            "hcclSocketPortRange" ($prefill.hcclSocketPortRange | default "")
            "hcclHostSocketPortRange" ($prefill.hcclHostSocketPortRange | default "")
            "hixlListenPort" ($prefill.hixlListenPort | default "")
            "primary" true
            "deviceShare" false)
      (dict "role" "decode" "kv" $decodeKv
            "tp" $decodeTp
            "batch" ($decode.batchSize | default $defBatch | int)
            "port" $decodePort
            "kvRpc" (add $kvRpcBase 1)
            "thrPort" 9102
            "hcclSocketPortRange" ($decode.hcclSocketPortRange | default "")
            "hcclHostSocketPortRange" ($decode.hcclHostSocketPortRange | default "")
            "hixlListenPort" ($decode.hixlListenPort | default "")
            "primary" false
            "deviceShare" true) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $modelName }}-pd
  namespace: {{ $.Release.Namespace }}
  labels:
    app: vllm-{{ $modelName }}-pd
    component: vllm
    model: {{ $modelName }}
    pd-per-card: "true"
spec:
  replicas: {{ $pdReplicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-{{ $modelName }}-pd
  template:
    metadata:
      labels:
        app: vllm-{{ $modelName }}-pd
        component: vllm
        model: {{ $modelName }}
        pd-per-card: "true"
        pd-prefill-awake: "false"
        pd-decode-awake: {{ ternary "false" "true" $poolBootSleep | quote }}
    spec:
      restartPolicy: Always
      shareProcessNamespace: true
      hostIPC: true
      terminationGracePeriodSeconds: {{ $pd.terminationGracePeriodSeconds | default 120 | int }}
      {{- if $useHostNet }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      {{- $ns := $.Values.vllm.nodeSelector | default (dict) }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}
      affinity:
        {{- if and $useHostNet (gt $maxTp 1) }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  pd-per-card: "true"
              topologyKey: kubernetes.io/hostname
        {{- end }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - {{ $.Values.vllm.avoidLabelValue | default "vllm" }}
      containers:
      {{- range $r := $warmRoles }}
        - name: vllm-{{ $r.role }}
          {{- if $m.image }}
          image: {{ $m.image }}
          {{- else }}
          image: {{ include "vllmkv.image" (list $ $.Values.images.vllm) }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eo pipefail

              {{- if not (include "vllmkv.isNvidia" $) }}
              export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
              {{- end }}

              {{- if or (gt $maxTp 1) $.Values.mooncake.enabled $.Values.lmcache.enabled }}
{{ include "vllmkv.nicDetectScript" $ | trim | indent 14 }}
              echo "[vllm-{{ $r.role }}] local_ip=${local_ip} nic=${nic_name}"
              export HCCL_IF_IP=${local_ip}
              export GLOO_SOCKET_IFNAME=${nic_name}
              export TP_SOCKET_IFNAME=${nic_name}
              export HCCL_SOCKET_IFNAME=${nic_name}
              export HCCL_BUFFSIZE=200
              {{- if not (include "vllmkv.isNvidia" $) }}
              export ASCEND_BUFFER_POOL={{ $.Values.vllm.ascendBufferPool | default "4:8" }}
              {{- end }}
              {{- end }}
              {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
              export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
              {{- end }}
              {{- if $.Values.lmcache.enabled }}
              sed -e "s/__LOCAL_HOSTNAME__/${NODE_IP}/" -e "s/__P2P_HOST__/${NODE_IP}/" -e "s/__LMCACHE_INSTANCE_ID__/${POD_NAME}/" /etc/lmcache/lmcache_config.yaml > /tmp/lmcache_config.yaml
              export LMCACHE_CONFIG_FILE="/tmp/lmcache_config.yaml"
              export PROMETHEUS_MULTIPROC_DIR=/tmp/lmcache_prometheus
              rm -rf "${PROMETHEUS_MULTIPROC_DIR}" && mkdir -p "${PROMETHEUS_MULTIPROC_DIR}"
              {{- end }}

{{ include "vllmkv.timeshareNpuDeviceScript" $ | trim | indent 14 }}
              {{- if $r.deviceShare }}
{{ include "vllmkv.timeshareStartupGateScript" (dict "port" $prefillPort "level" $sleepLevel "waitPeer" true) | trim | indent 14 }}
              {{- else }}
{{ include "vllmkv.timeshareStartupGateScript" (dict "port" $decodePort "level" $sleepLevel "waitPeer" false) | trim | indent 14 }}
              {{- end }}

              # Serialize engine initialisation per pod. cache-volume is a
              # hostPath (/root/.cache) shared node-wide, so the lock file name
              # is scoped to POD_NAME: the two engines of a pod (same
              # device-share card pair) are mutually exclusive, while pods on
              # different card pairs boot concurrently. Cross-card concurrent
              # init is safe; only same-card (device-share) init needs
              # serialisation, so the lock is per pod and no node-wide lock /
              # BOOT_SLOT stagger is used. prefill takes the lock before
              # booting; decode takes it only after its startup gate has seen
              # prefill healthy, so the two never deadlock.
              exec 9>/root/.cache/pd-engine-init-${POD_NAME}.lock
              flock 9
              echo "[boot] acquired per-pod engine init lock (${POD_NAME})"

              export PYTHONPATH="/etc/fingerprint-mw:${PYTHONPATH:-}"

              python -m vllm.entrypoints.openai.api_server \
                --enable-sleep-mode \
                --model /model \
                --tokenizer /model \
                --port {{ $r.port }} \
                --served-model-name {{ $servedModelName }} \
                --tensor-parallel-size {{ $r.tp }} \
                --middleware _fp_mw.HostnameFingerprint \
{{ include "vllmkv.vllmRuntimeFlags" (dict "mv" $mvNoCC "gv" $gvNoCC "batch" $r.batch) | trim | indent 16 }}
                --host 0.0.0.0 \
                {{- if $r.kv }}
                --kv-transfer-config '{{ $r.kv }}' \
                {{- end }}
                &
              VLLM_PID=$!
              echo "[vllm-{{ $r.role }}] vLLM PID=$VLLM_PID model={{ $modelName }}"

              # Release the node-wide init lock once this engine is healthy
              # (or its process died / hard cap) so the next engine can start.
              for ((_i=0; _i<120; _i++)); do
                if ! kill -0 "$VLLM_PID" 2>/dev/null; then
                  echo "[boot] engine process exited during init, releasing lock"
                  break
                fi
                curl -sf "http://127.0.0.1:{{ $r.port }}/health" >/dev/null 2>&1 && break
                sleep 5
              done
              flock -u 9
              exec 9>&-

{{ include "vllmkv.threadExporterOn" (dict "port" $r.thrPort) | trim | indent 14 }}

              {{- if and $poolBootSleep (eq $r.role "decode") }}
{{ include "vllmkv.poolBootSleepScript" (dict "port" $decodePort "level" $sleepLevel) | trim | indent 14 }}
              {{- end }}

              wait "$VLLM_PID"
          env:
            {{- include "vllmkv.vllmSleepBaseEnv" (dict "tp" $r.tp "root" $) | nindent 12 }}
            - name: PD_ROLE
              value: {{ $r.role | quote }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HCCL_CONNECT_TIMEOUT
              value: "1800"
            {{- if $r.hcclSocketPortRange }}
            - name: HCCL_NPU_SOCKET_PORT_RANGE
              value: {{ $r.hcclSocketPortRange | quote }}
            {{- end }}
            {{- if $r.hcclHostSocketPortRange }}
            - name: HCCL_HOST_SOCKET_PORT_RANGE
              value: {{ $r.hcclHostSocketPortRange | quote }}
            {{- end }}
            {{- if $r.hixlListenPort }}
            # HIXL/ADXL (NPU network adapter) listen port. NOT covered by the
            # HCCL_*_SOCKET_PORT_RANGE variables: HIXL reads it from
            # ASCEND_GLOBAL_RESOURCE_CONFIG (dotted key form, same as the
            # upstream vllm-ascend kv_pool docs). Without it every engine on a
            # card falls back to 16666; with two engines per card (warmstandby)
            # the one that wakes later can never bind and its KV path stays
            # broken (EI0020 Bind_IP_Port -> error_codes=[-800] -> recompute).
            - name: ASCEND_GLOBAL_RESOURCE_CONFIG
              value: {{ printf "{\"comm_resource_config.listen_port\":%v}" $r.hixlListenPort | quote }}
            {{- end }}
            {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake.json"
            {{- end }}
          ports:
            - containerPort: {{ $r.port }}
              name: http
              protocol: TCP
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            - containerPort: {{ $r.kvRpc }}
              name: kv-rpc
              protocol: TCP
            {{- end }}
            - containerPort: {{ $r.thrPort }}
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: fingerprint-mw
              mountPath: /etc/fingerprint-mw
              readOnly: true
            - name: model
              mountPath: /model
              readOnly: true
              subPath: {{ $modelSubPath }}
            - name: dshm
              mountPath: /dev/shm
            {{- include "vllmkv.ascendDriverMounts" $ | nindent 12 }}
            {{- if $.Values.vllm.sleepOverlay.enabled }}
{{- range $name, $f := ($.Values.vllm.sleepOverlay.files | default dict) }}
            - name: te-unreg-sc
              mountPath: {{ $f.path }}
              subPath: {{ $f.key }}
{{- end }}
            {{- end }}
            - name: cache-volume
              mountPath: /root/.cache
            {{- if not (include "vllmkv.isNvidia" $) }}
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm
            {{- end }}
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            {{- if not $.Values.lmcache.enabled }}
            - name: mooncake-config
              mountPath: /etc/mooncake/mooncake.json
              subPath: mooncake.json
              readOnly: true
            {{- end }}
            {{- if $.Values.lmcache.enabled }}
            - name: lmcache-config
              mountPath: /etc/lmcache/lmcache_config.yaml
              subPath: lmcache_config.yaml
              readOnly: true
            {{- end }}
            - name: hccn-conf
              mountPath: /etc/hccn.conf
              readOnly: true
            {{- end }}
            - name: pod-annotations
              mountPath: /etc/pod-annotations
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: {{ $r.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $r.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $r.port }}
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5
          resources:
            requests:
              {{- if $r.primary }}
              {{ include "vllmkv.acceleratorResource" $ }}: {{ $r.tp }}
              {{- end }}
              ephemeral-storage: "2Gi"
              {{- with $.Values.vllm.engineResources.requests.cpu }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $.Values.vllm.engineResources.requests.memory }}
              memory: {{ . | quote }}
              {{- end }}
            limits:
              {{- if $r.primary }}
              {{ include "vllmkv.acceleratorResource" $ }}: {{ $r.tp }}
              {{- end }}
              ephemeral-storage: "4Gi"
              {{- with $.Values.vllm.engineResources.limits.cpu }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $.Values.vllm.engineResources.limits.memory }}
              memory: {{ . | quote }}
              {{- end }}
      {{- end }}
      volumes:
        - name: fingerprint-mw
          configMap:
            name: {{ $.Release.Name }}-fingerprint-mw
        - name: model
          {{- if $.Values.modelVolume.hostPath }}
          hostPath:
            path: {{ $.Values.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ mul $maxTp 16 }}Gi
        {{- include "vllmkv.ascendDriverVolumes" $ | nindent 8 }}
        {{- if $.Values.vllm.sleepOverlay.enabled }}
        - name: te-unreg-sc
          configMap:
            name: {{ $.Values.vllm.sleepOverlay.configMapName | default (printf "%s-te-unreg-sc" $.Release.Name) }}
        {{- end }}
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        {{- if not (include "vllmkv.isNvidia" $) }}
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
        {{- end }}
        {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
        {{- if not $.Values.lmcache.enabled }}
        - name: mooncake-config
          configMap:
            name: mooncake-config
        {{- end }}
        {{- if $.Values.lmcache.enabled }}
        - name: lmcache-config
          configMap:
            name: lmcache-config
        {{- end }}
        - name: hccn-conf
          hostPath:
            path: /etc/hccn.conf
            type: File
        {{- end }}
        - name: pod-annotations
          downwardAPI:
            items:
              - path: "ascend-real"
                fieldRef:
                  fieldPath: metadata.annotations['{{ $.Values.accelerator.realDeviceAnnotation }}']
              - path: "ascend-alloc"
                fieldRef:
                  fieldPath: metadata.annotations['{{ include "vllmkv.acceleratorResource" $ }}']
---
{{/* ---- Internal Services for the per-card P/D pod (role + awake selectors) ---- */}}
apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ $modelName }}-prefill
  namespace: {{ $.Release.Namespace }}
  labels:
    component: vllm
    model: {{ $modelName }}
    pd-role: prefill
spec:
  type: ClusterIP
  selector:
    app: vllm-{{ $modelName }}-pd
    pd-prefill-awake: "true"
  ports:
    - name: http
      port: 8200
      targetPort: {{ $prefillPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ $modelName }}-decode
  namespace: {{ $.Release.Namespace }}
  labels:
    component: vllm
    model: {{ $modelName }}
    pd-role: decode
spec:
  type: ClusterIP
  selector:
    app: vllm-{{ $modelName }}-pd
    pd-decode-awake: "true"
  ports:
    - name: http
      port: 8200
      targetPort: {{ $decodePort }}
{{- else }}
{{- range $r := $roles }}
{{- $tp := $r.tp }}
{{- $flagCtx := dict "mv" $mv "gv" $.Values.vllm "batch" $r.batch }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $modelName }}-{{ $r.role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: vllm-{{ $modelName }}-{{ $r.role }}
    component: vllm
    model: {{ $modelName }}
    pd-role: {{ $r.role }}
spec:
  {{- /* When the P/D rebalancer manages this role, the replica count is runtime
         state owned by the rebalancer. Preserve the live count across `helm
         upgrade` instead of resetting it to the chart values (which would
         fight the rebalancer). Fresh installs still use the chart values. */}}
  {{- $reb := $pd.dynamicRebalance | default dict }}
  {{- if $reb.enabled }}
  {{- $liveDeployment := lookup "apps/v1" "Deployment" $.Release.Namespace (printf "vllm-%s-%s" $modelName $r.role) }}
  {{- $liveReplicas := $r.replicas }}
  {{- if $liveDeployment.spec }}
  {{- $liveReplicas = $liveDeployment.spec.replicas | default $r.replicas }}
  {{- end }}
  replicas: {{ $liveReplicas }}
  {{- else }}
  replicas: {{ $r.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: vllm-{{ $modelName }}-{{ $r.role }}
  template:
    metadata:
      labels:
        app: vllm-{{ $modelName }}-{{ $r.role }}
        component: vllm
        model: {{ $modelName }}
        pd-role: {{ $r.role }}
    spec:
      restartPolicy: Always
      shareProcessNamespace: true
      {{- /* Graceful shutdown window: a draining engine pod must be allowed to
             finish in-flight decode/prefill work before the kubelet kills it. */}}
      terminationGracePeriodSeconds: {{ $pd.terminationGracePeriodSeconds | default 120 | int }}
      {{- if include "vllmkv.isNvidia" $ }}
      runtimeClassName: {{ $.Values.vllm.runtimeClassName | default "nvidia" }}
      {{- end }}
      {{- if and (or $.Values.mooncake.enabled $.Values.lmcache.enabled) $.Values.vllm.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      {{- $ns := $.Values.vllm.nodeSelector | default (dict) }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: avoid
                    operator: NotIn
                    values:
                      - {{ $.Values.vllm.avoidLabelValue | default "vllm" }}
        {{- if gt (int $tp) 1 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: model
                    operator: Exists
              topologyKey: kubernetes.io/hostname
        {{- end }}
      containers:
        - name: vllm
          {{- if $m.image }}
          image: {{ $m.image }}
          {{- else }}
          image: {{ include "vllmkv.image" (list $ $.Values.images.vllm) }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
          securityContext:
            privileged: true
          {{- end }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eo pipefail

              {{- if not (include "vllmkv.isNvidia" $) }}
              export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64
              {{- end }}

              {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
{{ include "vllmkv.nicDetectScript" $ | trim | indent 14 }}
              echo "[vllm-{{ $r.role }}] local_ip=${local_ip} nic=${nic_name}"
              export HCCL_IF_IP=${local_ip}
              export GLOO_SOCKET_IFNAME=${nic_name}
              export TP_SOCKET_IFNAME=${nic_name}
              export HCCL_SOCKET_IFNAME=${nic_name}
              export HCCL_BUFFSIZE=200
              {{- if not (include "vllmkv.isNvidia" $) }}
              export ASCEND_BUFFER_POOL={{ $.Values.vllm.ascendBufferPool | default "4:8" }}
              {{- end }}
              {{- if not $.Values.lmcache.enabled }}
              export MOONCAKE_CONFIG_PATH="/etc/mooncake/mooncake.json"
              {{- end }}
              {{- end }}
              {{- if $.Values.lmcache.enabled }}
              sed -e "s/__LOCAL_HOSTNAME__/${NODE_IP}/" -e "s/__P2P_HOST__/${NODE_IP}/" -e "s/__LMCACHE_INSTANCE_ID__/${POD_NAME}/" /etc/lmcache/lmcache_config.yaml > /tmp/lmcache_config.yaml
              export LMCACHE_CONFIG_FILE="/tmp/lmcache_config.yaml"
              export PROMETHEUS_MULTIPROC_DIR=/tmp/lmcache_prometheus
              rm -rf "${PROMETHEUS_MULTIPROC_DIR}" && mkdir -p "${PROMETHEUS_MULTIPROC_DIR}"
              {{- end }}

              export PYTHONPATH="/etc/fingerprint-mw:${PYTHONPATH:-}"

              python -m vllm.entrypoints.openai.api_server \
                --model /model \
                --tokenizer /model \
                --port 8200 \
                --served-model-name {{ $servedModelName }} \
                --tensor-parallel-size {{ $tp }} \
                --middleware _fp_mw.HostnameFingerprint \
{{ include "vllmkv.vllmRuntimeFlags" $flagCtx | trim | indent 16 }}
                --host 0.0.0.0 \
                {{- if $r.kv }}
                --kv-transfer-config '{{ $r.kv }}' \
                {{- end }}
                &
              VLLM_PID=$!
              echo "[vllm-{{ $r.role }}] vLLM PID=$VLLM_PID model={{ $modelName }}"

{{ include "vllmkv.threadExporter" $ | trim | indent 14 }}

              wait "$VLLM_PID"
          env:
            {{- include "vllmkv.vllmBaseEnv" (dict "tp" $tp "root" $) | nindent 12 }}
            - name: PD_ROLE
              value: {{ $r.role | quote }}
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- if and $.Values.mooncake.enabled (not $.Values.lmcache.enabled) }}
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake.json"
            {{- end }}
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            - containerPort: {{ $.Values.mooncake.lookupRpcPort }}
              name: kv-rpc
              protocol: TCP
            {{- end }}
            - containerPort: 9101
              name: vllmthr
              protocol: TCP
          volumeMounts:
            - name: fingerprint-mw
              mountPath: /etc/fingerprint-mw
              readOnly: true
            - name: model
              mountPath: /model
              readOnly: true
              subPath: {{ $modelSubPath }}
            - name: dshm
              mountPath: /dev/shm
            {{- include "vllmkv.ascendDriverMounts" $ | nindent 12 }}
            {{- if $.Values.vllm.sleepOverlay.enabled }}
{{- range $name, $f := ($.Values.vllm.sleepOverlay.files | default dict) }}
            - name: te-unreg-sc
              mountPath: {{ $f.path }}
              subPath: {{ $f.key }}
{{- end }}
            {{- end }}
            - name: cache-volume
              mountPath: /root/.cache
            {{- if not (include "vllmkv.isNvidia" $) }}
            - name: hisi-hdc-volume
              mountPath: /dev/hisi_hdc
            - name: devmm-svm-volume
              mountPath: /dev/devmm_svm
            {{- end }}
            {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
            {{- if not $.Values.lmcache.enabled }}
            - name: mooncake-config
              mountPath: /etc/mooncake/mooncake.json
              subPath: mooncake.json
              readOnly: true
            {{- end }}
            {{- if $.Values.lmcache.enabled }}
            - name: lmcache-config
              mountPath: /etc/lmcache/lmcache_config.yaml
              subPath: lmcache_config.yaml
              readOnly: true
            {{- end }}
            - name: hccn-conf
              mountPath: /etc/hccn.conf
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 720
            timeoutSeconds: 5
          resources:
            requests:
              {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
              ephemeral-storage: "2Gi"
              {{- with $.Values.vllm.engineResources.requests.cpu }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $.Values.vllm.engineResources.requests.memory }}
              memory: {{ . | quote }}
              {{- end }}
            limits:
              {{ include "vllmkv.acceleratorResource" $ }}: {{ $tp }}
              ephemeral-storage: "4Gi"
              {{- with $.Values.vllm.engineResources.limits.cpu }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $.Values.vllm.engineResources.limits.memory }}
              memory: {{ . | quote }}
              {{- end }}
      volumes:
        - name: fingerprint-mw
          configMap:
            name: {{ $.Release.Name }}-fingerprint-mw
        - name: model
          {{- if $.Values.modelVolume.hostPath }}
          hostPath:
            path: {{ $.Values.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelVolume.pvcName | default "models-nfs-pvc" }}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ mul $tp 16 }}Gi
        {{- include "vllmkv.ascendDriverVolumes" $ | nindent 8 }}
        {{- if $.Values.vllm.sleepOverlay.enabled }}
        - name: te-unreg-sc
          configMap:
            name: {{ $.Values.vllm.sleepOverlay.configMapName | default (printf "%s-te-unreg-sc" $.Release.Name) }}
        {{- end }}
        - name: cache-volume
          hostPath:
            path: /root/.cache
            type: DirectoryOrCreate
        {{- if not (include "vllmkv.isNvidia" $) }}
        - name: hisi-hdc-volume
          hostPath:
            path: /dev/hisi_hdc
            type: CharDevice
        - name: devmm-svm-volume
          hostPath:
            path: /dev/devmm_svm
            type: CharDevice
        {{- end }}
        {{- if or $.Values.mooncake.enabled $.Values.lmcache.enabled }}
        {{- if not $.Values.lmcache.enabled }}
        - name: mooncake-config
          configMap:
            name: mooncake-config
        {{- end }}
        {{- if $.Values.lmcache.enabled }}
        - name: lmcache-config
          configMap:
            name: lmcache-config
        {{- end }}
        - name: hccn-conf
          hostPath:
            path: /etc/hccn.conf
            type: File
        {{- end }}
---
{{/* ---- Internal Service for this P/D pool ---- */}}
apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ $modelName }}-{{ $r.role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    component: vllm
    model: {{ $modelName }}
    pd-role: {{ $r.role }}
spec:
  type: ClusterIP
  selector:
    app: vllm-{{ $modelName }}-{{ $r.role }}
  ports:
    - name: http
      port: 8200
      targetPort: 8200
{{- end }}
{{/* end range roles */}}
{{- end }}

---
{{/* ---- P/D proxy (the model endpoint) ---- */}}
{{- $proxyPort := $proxy.port | default 8200 | int }}
{{- $proxyImg := "" }}
{{- if $proxy.image }}
{{- $proxyImg = include "vllmkv.image" (list $ $proxy.image) }}
{{- else }}
{{- $proxyImg = include "vllmkv.image" (list $ $.Values.images.vllm) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $modelName }}-pd-proxy
  namespace: {{ $.Release.Namespace }}
  labels:
    app: vllm-{{ $modelName }}-pd-proxy
    component: pd-proxy
    model: {{ $modelName }}
spec:
  replicas: {{ $proxy.replicas | default 1 }}
  selector:
    matchLabels:
      app: vllm-{{ $modelName }}-pd-proxy
  template:
    metadata:
      labels:
        app: vllm-{{ $modelName }}-pd-proxy
        component: pd-proxy
        model: {{ $modelName }}
      annotations:
        checksum/config: {{ $.Files.Get "files/pd_proxy.py" | sha256sum }}
    spec:
      restartPolicy: Always
      {{- with $proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: pd-proxy
          image: {{ $proxyImg }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -eo pipefail
              exec python /etc/pd-proxy/pd_proxy.py
          env:
            - name: PREFILL_BASE
              value: "http://vllm-{{ $modelName }}-prefill:8200"
            - name: DECODE_BASE
              value: "http://vllm-{{ $modelName }}-decode:8200"
            - name: PROXY_PORT
              value: {{ $proxyPort | quote }}
            - name: MODEL_NAME
              value: {{ $servedModelName | quote }}
            - name: LOG_LEVEL
              value: {{ $proxy.logLevel | default "info" | quote }}
            - name: PROXY_DRAIN_MAX_WAIT_SECONDS
              value: {{ $proxy.drainMaxWaitSeconds | default 300 | quote }}
            - name: PROXY_RETRY_DEADLINE_SECONDS
              value: {{ $proxy.retryDeadlineSeconds | default 60 | quote }}
          ports:
            - containerPort: {{ $proxyPort }}
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $proxyPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $proxyPort }}
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: {{ ($proxy.resources | default dict).cpuRequest | default "200m" | quote }}
              memory: {{ ($proxy.resources | default dict).memoryRequest | default "512Mi" | quote }}
            limits:
              cpu: {{ ($proxy.resources | default dict).cpuLimit | default "2000m" | quote }}
              memory: {{ ($proxy.resources | default dict).memoryLimit | default "2Gi" | quote }}
          volumeMounts:
            - name: pd-proxy
              mountPath: /etc/pd-proxy
              readOnly: true
      volumes:
        - name: pd-proxy
          configMap:
            name: {{ $.Release.Name }}-pd-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ $modelName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    component: pd-proxy
    model: {{ $modelName }}
spec:
  type: NodePort
  selector:
    app: vllm-{{ $modelName }}-pd-proxy
  ports:
    - name: http
      port: 8200
      targetPort: {{ $proxyPort }}
      nodePort: {{ add ($.Values.portOffset | int) ($proxy.nodePort | default 30036 | int) }}
{{- end }}
{{/* end range pdModels */}}

{{- end }}
{{/* end if deploy.vllm */}}
