apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: engine
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      component: engine
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  targetLabels:
    - model
    - inference-engine
    - release
  endpoints:
    # Was 1s with implicit timeout <= interval. Under LMCache P2P host-staging
    # saturation the vLLM process stalls on pin/transfer work and /metrics often
    # exceeds 1s -> scrape timeouts -> gappy Grafana. Keep batchSize/engine knobs
    # alone; give scrapes headroom so panel continuity survives overload.
    - path: /metrics
      port: http
      scheme: http
      honorLabels: true
      interval: 15s
      scrapeTimeout: 10s

---
{{- if or (eq (lower .Values.backend) "router") (eq (lower .Values.backend) "litellm") (eq (lower .Values.backend) "boom") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kv-router
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: router-service
  podTargetLabels:
    - release
  podMetricsEndpoints:
    - path: /metrics
      port: http
      scheme: http
      honorLabels: true
      interval: 5s
      scrapeTimeout: 4s

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kv-sidecar
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      component: engine
  podTargetLabels:
    - release
  podMetricsEndpoints:
    - path: /metrics
      port: sidecar-http
      scheme: http
      honorLabels: true
      interval: 5s
      scrapeTimeout: 4s
{{- end }}

---
{{/*
  LiteLLM proxy PodMonitor.
  Only rendered when litellm.enabled=true.
  Scrapes LiteLLM's built-in Prometheus metrics at /metrics/ on port 4000.
  enable_prometheus_system_metrics: true must be set in litellm_config.yaml
  (done in 70-litellm.yaml) for this endpoint to return data.
  Interval is 5s (vs 1s for router/engine) — litellm metrics are less time-critical.
*/}}
{{- if .Values.litellm.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litellm-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: litellm-proxy
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: litellm-proxy
  podMetricsEndpoints:
    - path: /metrics/
      port: http
      scheme: http
      honorLabels: true
      interval: 5s
{{- end }}
