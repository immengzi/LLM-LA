{{/*
  70-litellm.yaml — LiteLLM proxy pod for production auth/spend tracking.

  Only rendered when litellm.enabled=true.
  Disabled by default — zero impact on benchmarking or existing paths.

  Deploys:
    - ConfigMap:  litellm-config  (litellm_config.yaml mounted into pod)
    - Deployment: litellm-proxy   (single replica, pinned to same node as router)
    - Service:    litellm-proxy   (ClusterIP internal + NodePort for external access)

  The LiteLLM proxy receives OpenAI-format requests from external clients,
  enforces virtual key auth + spend limits, then forwards to:
    http://router-service:8080/v1/chat/completions
  which is the new shim added to services/router_service/router/api.py.

  mu-load-test benchmarks bypass this entirely and hit the router directly.
*/}}

{{- if .Values.litellm.enabled }}

---
# -----------------------------------------------------------------------
# ConfigMap: litellm proxy config
# Mounted as /app/litellm_config.yaml inside the container.
# -----------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: litellm-proxy
    release: {{ .Release.Name }}
data:
  litellm_config.yaml: |
    model_list:
      - model_name: served-model
        litellm_params:
          # Routes to the router's /v1/chat/completions shim.
          # api_base must end at /v1 — LiteLLM appends /chat/completions
          # automatically for openai/ provider, giving the full path:
          #   http://router-service:8080/v1/chat/completions
          model: openai/served-model
          api_base: http://router-service:8080/v1
          api_key: dummy   # required by litellm but not checked by our router

    router_settings:
      # Disable cooldown — our router is a local always-on service, not a
      # cloud API with rate limits. Cooldown causes cascading 429s under load
      # when the backend has transient errors (e.g. during infrastructure fixes).
      cooldown_time: 0          # no cooldown period after failures
      num_retries: 0            # don't retry at LiteLLM level; client handles retries
      allowed_fails: 1000       # very high threshold before cooling down a deployment
      retry_after: 0            # no retry delay

    general_settings:
      master_key: {{ .Values.litellm.masterKey | quote }}
      {{- if .Values.litellm.databaseUrl }}
      database_url: {{ .Values.litellm.databaseUrl | quote }}
      {{- end }}

      # Allow all origins for the admin UI (tighten in production if needed)
      allow_requests_on_db_unavailable: true

      # Enable Prometheus metrics endpoint at /metrics/
      enable_prometheus_system_metrics: true

    litellm_settings:
      success_callback: []
      failure_callback: []

---
# -----------------------------------------------------------------------
# Deployment: litellm-proxy
# Single replica. Pinned to same node as router (pin.nodeName) when
# pin.enabled=true, so it stays co-located with the control plane.
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: litellm-proxy
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.pin.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "kubernetes.io/hostname"
                    operator: In
                    values:
                      - {{ .Values.pin.nodeName | quote }}
      tolerations:
{{- toYaml .Values.pin.tolerations | nindent 8 }}
      {{- end }}

      containers:
        - name: litellm
          # Reuses the global imageRegistry rewrite helper from _helpers.tpl
          image: {{ include "vllmkv.image" (list . .Values.litellm.image) }}
          imagePullPolicy: IfNotPresent

          args:
            - --config
            - /app/litellm_config.yaml
            - --port
            - "4000"
            - --detailed_debug

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          volumeMounts:
            - name: litellm-config
              mountPath: /app/litellm_config.yaml
              subPath: litellm_config.yaml

          # Liveness: proxy is up
          # initialDelaySeconds=60 — LiteLLM takes ~17s to initialize;
          # 60s gives ample margin to avoid premature kill on cold start.
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4

          # Readiness: proxy can serve requests
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6

          resources:
{{ toYaml .Values.litellm.resources | indent 12 }}

          env:
            # Suppress telemetry back to litellm.ai
            - name: LITELLM_TELEMETRY
              value: "False"
            # If databaseUrl is set, also expose it as env var (litellm reads both)
            {{- if .Values.litellm.databaseUrl }}
            - name: DATABASE_URL
              value: {{ .Values.litellm.databaseUrl | quote }}
            {{- end }}

      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config

---
# -----------------------------------------------------------------------
# Service: litellm-proxy
# ClusterIP on port 4000 for in-cluster access.
# NodePort on litellm.nodePort for external access from dev machines / CI.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: litellm-proxy
    release: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: litellm-proxy
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: {{ .Values.litellm.nodePort }}

{{- end }}