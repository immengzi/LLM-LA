backend: router

# Inference runtime selector. vLLM is the production-compatible default.
engine:
  type: vllm

# Engine contracts consumed by probes, sidecars, ServiceMonitors and autoscaling.
# Per-model vllm.healthPath / sglang.healthPath settings can override these.
engineProfiles:
  vllm:
    healthPath: /health
    readinessPath: ""
    metricsPath: /metrics
    metricsPort: 8200
  sglang:
    healthPath: /health
    readinessPath: ""
    metricsPath: /metrics
    metricsPort: 8200

# Implementation of the router + sidecar services: "python" (reference) or "go".
# This is a single knob that swaps the router and sidecar container images for
# their Go equivalents (images.routerGo / images.sidecarGo). Both implementations
# support the standard vLLM and pinned SGLang profiles; env vars and endpoints
# remain identical.
serviceImpl: python

# Accelerator backend for the vLLM engine pods:
#   ascend (default) - Huawei Ascend NPUs. Requests the accelerator resource
#                      named by accelerator.resourceName (supplied by the
#                      deployment overlay), mounts the Ascend driver from the
#                      host, and sources the Ascend toolkit.
#   nvidia           - NVIDIA GPUs. Requests nvidia.com/gpu (injected by the
#                      NVIDIA device plugin), sets vllm.runtimeClassName, and
#                      drops all Ascend driver mounts / toolkit setup.
# This is a single, machine-level switch. Set it per cluster through
# helm.values.hardware in src/client/configs/clusters.yaml rather than editing
# the deploy scripts. See docs/deployment/gpu.md.
hardware: ascend

# Generic accelerator resource defaults for the public chart. The values below
# are placeholders and are not schedulable by themselves; real values are
# supplied per cluster by the deployment overlay
# (helm.values.accelerator in src/client/configs/clusters.yaml) so vendor
# hardware identifiers stay out of this repository.
accelerator:
  resourceName: "accelerator.example.com/device"   # extended-resource name to request/schedule
  devicePrefix: "Device"                            # legacy; the annotation parser now accepts any "<vendor>-<n>" token
  realDeviceAnnotation: "accelerator.example.com/real-device"  # optional; annotation written by the device plugin with physical device IDs

# Offset added to every hardcoded NodePort (redis, router, cpu-hash, vLLM).
# Default 0 keeps original ports; set e.g. 100 for a shadow deployment to
# avoid port collisions with the primary deployment on the same cluster.
portOffset: 0

# Per-pod NodePort services for direct/external vLLM metrics access.
# Managed by the sweep runner (sweep_methods.py) via helm upgrade --reuse-values
# when a config sets expose_per_pod: true — the runner discovers the pods,
# renders one NodePort Service per pod, and sets these values. Not meant to be
# edited by hand.
perPodServices:
  enabled: false
  pods: []
  # true  -> selector uses statefulset.kubernetes.io/pod-name (DP/LeaderWorkerSet;
  #          controller-managed, survives restarts).
  # false -> selector uses the imperative vllm-pod-id label (non-DP Deployment
  #          fallback; the sweep runner applies that label).
  # The sweep runner sets this automatically based on the discovered workload.
  useStatefulSetSelector: true

replicas:
  router: 1
  vllm: 16

# Global override: if set, ALL images are rewritten to use this registry
global:
  imageRegistry: "reg.local:32000"
  # imageRegistry: "7.242.102.243:32000"  # set "" to disable rewriting
  # imageRegistry: ""  # set "" to disable rewriting

images:
  router: kv-router:latest
  sidecar: kv-sidecar:latest
  # Go implementations (used when serviceImpl=go)
  routerGo: kv-router-go:latest
  sidecarGo: kv-sidecar-go:latest
  # vllm: quay.io/ascend/vllm-ascend:v0.11.0rc0
  # vllm: ascend/vllm-ascend:v0.11.0rc0
  # vllm: quay.io/ascend/vllm-ascend:latest
  # vllm: quay.io/ascend/vllm-ascend:glm5-openeuler
  vllm: quay.io/ascend/vllm-ascend:v0.23.0
  # Pin the complete CUDA 12.9 image because the mutable v0.5.15 tag now resolves
  # to CUDA 13, which is incompatible with NVIDIA 570-series drivers.
  sglang: lmsysorg/sglang:v0.5.15-cu129
  cpuHash: vllm-cpu-hash:latest
  redis: redis:7-alpine
  # mooncakeMaster: quay.io/ascend/vllm-ascend:glm5-openeuler
  mooncakeMaster: quay.io/ascend/vllm-ascend:v0.23.0

sidecar:
  # true  = per-pod sidecar container runs (pull / push-* / sidecar central-push).
  # false = no sidecar container. Used by: boom direct mode, AND sidecar-less
  #         push-*/central-push where the router delivers directly to each
  #         pod's vLLM and hosts the KV-events subscriber itself.
  enabled: true
  logLevel: info    # debug | info | warning | error
  # Always re-pull the sidecar image. Needed because the image ships as a
  # mutable :latest tag — IfNotPresent would keep a stale cached copy on the
  # node after a rebuild. Mirrors the router's default.
  imagePullPolicy: Always
  # Extra items to buffer beyond BATCH_SIZE (pull_cap = BATCH_SIZE + PREFETCH).
  # Workers = BATCH_SIZE + PREFETCH, extras queue inside vLLM's internal scheduler.
  # Control via sweep method --set sidecar.prefetch=N.
  prefetch: 0
  # When true, sidecar forces ignore_eos=True on every vLLM request
  # (replay mode: generate exactly max_tokens, finish_reason="length").
  forceIgnoreEos: false
  # When true, sidecar streams from vLLM internally (captures TTFT).
  streamingMode: false

router:
  # pull | push-rr | push-random | push-leastq | push-throughput | push-p2c | push-kv-cost | push-least-kv | push-least-latency | push-least-busy | central-push | external-push
  #
  # Any push-* mode and central-push can run WITHOUT the per-pod sidecar: set
  # sidecar.enabled=false and the router keeps pod discovery (and for
  # central-push the central queue — KV-affinity / fairness / SLO still apply)
  # but delivers DIRECTLY to each pod's vLLM and hosts the KV-events subscriber
  # itself. See sidecar.enabled + the vllmKvEvents* knobs below. Ignored for
  # pull (sidecars must pull) and external-push (already direct).
  # push-throughput routes to the pod that has processed the fewest total tokens
  # (vllm prompt+generation token counters scraped from each pod's vLLM /metrics;
  # VLLM_METRICS_PORT default 8200, cached PUSH_METRIC_TTL_S default 1s).
  # push-p2c (aliases: p2c, power-of-two) samples two random endpoints and picks
  # the one with the lower local queue / inflight pressure.
  # push-least-kv routes to the pod with the lowest KV-cache occupancy; it needs
  # sidecar.kvUsageReport.enabled so sidecars publish kv_usage on /health
  # (degrades without a sidecar — prefer metrics-based modes when sidecar-less).
  # push-least-latency routes to the pod with the lowest average end-to-end
  # latency, scraped from each pod's vLLM /metrics (VLLM_METRICS_PORT, default
  # 8200; cached PUSH_METRIC_TTL_S, default 1s).
  # push-least-busy routes to the pod with the least cumulative inference/busy
  # time (vllm:request_inference_time_seconds_sum scraped from each pod's vLLM
  # /metrics; VLLM_METRICS_PORT default 8200, cached PUSH_METRIC_TTL_S default 1s).
  mode: pull

  # push-kv-cost tunables (KV-aware cost function). Only used
  # when mode: push-kv-cost. cost = prefillLoadScale * max(prefill_blocks -
  # overlapCredit*cached_prefix, 0) + decode_load; pick min (or softmax-sample
  # when temperature > 0). Higher overlapCredit favors cache reuse (lower TTFT);
  # higher temperature spreads load.
  kvCost:
    overlapCredit: 1.0
    prefillLoadScale: 1.0
    temperature: 0.0

  # API key for /v1/chat/completions (empty = no auth)
  apiKey: ""

  # Router-side inline KV hash controls. The tokenizer path is mounted at /model.
  kvBlockSize: 128
  # Empty selects engine.type. Explicitly set vllm|sglang only for validation
  # or fail-closed rollout testing.
  hashBackend: ""
  # Default OFF: current BooM gateway serialises tools in insertion order
  # (serde_json preserve_order), so the router must not sort tool parameters
  # keys -- doing so drifts from what vLLM tokenises. Set "1" only against a
  # legacy BooM build that alphabetically sorts tools.
  kvCanonicaliseTools: "0"

  # When true, the /latency_log ring (and thus router_logs.json + logs.json when
  # collect_router_log is on) includes the full per-request prefix block-hash
  # list. Bulky; the kv-hit counts are always logged regardless of this flag.
  logBlockHashes: false

  # When true, the /latency_log ring includes the full request body (messages +
  # sampling params) under "request_body". Opt-in and off by default. Bodies
  # live in the bounded ring (evict automatically) and logRequestBodyMaxBytes
  # caps each body (0 = unlimited) so worst-case memory stays bounded.
  logRequestBody: false
  logRequestBodyMaxBytes: 16384

  # When true, compute per-request prefix blocks + the chosen endpoint's
  # prefix-hit count FOR LOGGING ONLY, even when kvAware is off (affinity-only
  # or none strategies). Makes kv_hits_len/total_blocks/kv_hit comparable across
  # all strategies. Routing is unaffected; only adds per-request hash compute.
  measurePrefix: false

  # KV-block hash source (applies to both serviceImpl python and go):
  #   inline   = in-process (python) / in-container (go) hasher using the
  #              router's prefix_hash.py. Default; no external pod needed.
  #   external = legacy vLLM-based vllm-cpu-hash service over HTTP. The external
  #              pod is auto-deployed by the chart only when this is "external".
  hashSource: inline

  # KV block-owner source used for prefix/both routing (applies to both python
  # and go):
  #   lookup  = targeted per-request Redis HGETALL of the request's own block
  #             hashes at ingress (default). Makes prefix/both routing and the
  #             kv_hit metric truthful; inert under affinity/none strategies.
  #   watcher = legacy background scan into a shared block-owner map (add-only,
  #             could starve under load and under-count kv_hit).
  ownerSource: lookup
  # Cap on leading block hashes looked up per request when ownerSource=lookup.
  lookupMaxBlocks: 512

  # Claude Code client seam: when "1", strip the whole x-anthropic-billing-header
  # attribution block (rotating cc_version + per-request cch counter) from system
  # messages so KV-prefix matching is byte-stable. Default OFF ("0"); opt in per
  # deployment (e.g. router_strip_cch in the sweep config).
  stripCch: "0"

  # Query head+tail of the pull pool for prefix matches.
  poolBidirectional: false

  # Unified routing-strategy selector. Empty = use the kvAware/affinityEnabled
  # flags below directly. Set to one of: none | prefix | affinity | both to
  # drive both flags from a single knob (overrides them when non-empty).
  # affinityMode (soft|hard) still applies when the strategy includes affinity.
  strategy: ""

  # Enable/disable KV-aware routing
  kvAware: true

  # Enable/disable length-aware batching/scheduling
  lenAware: true

  # Used only when lenAware=true
  # short_first | long_first | even_short_long
  lenPolicy: short_first

  # Key-affinity routing: keep all turns of a chat conversation on the same
  # vLLM pod to reuse the engine's prefix cache. Disabled by default (zero
  # impact on the legacy path). Fully router-side; no BooM/sidecar/client change.
  affinityEnabled: false
  # soft = preference (any pod may still serve), hard = time-bounded pin
  affinityMode: soft
  # conversation -> endpoint mapping lifetime (seconds)
  affinityTtlS: 300
  # hard mode: max time an item waits for its pod before release to any pod
  affinityHardTimeoutS: 5

  # ---- Persistent affinity map (Redis-backed; OFF by default) ----
  # When true, every affinity claim is write-through to Redis and the in-memory
  # map is warmed from Redis at startup, so the conversation->pod map survives
  # router restarts and full redeploys. Requires Redis persistence (see the
  # `redis:` block below) to survive a Redis pod restart too. Feature-off is
  # byte-for-byte identical to the legacy in-memory-only behavior.
  affinityPersistEnabled: false
  # Per-key Redis TTL. 0 = no expiry (preserve continuity across long deploy
  # gaps, at the cost of keeping stale post-scale-down keys). A finite value
  # bounds stale keys but drops mappings for conversations idle > TTL.
  affinityRedisTtlSeconds: 0
  # Redis key namespace prefix: "{prefix}:{cluster}:{model}:{affinity_key}".
  affinityRedisKeyPrefix: "affinity"
  # In-memory front-cache bound (0 = unbounded); evicted keys stay in Redis.
  affinityCacheMax: 100000
  # Periodic re-warm from Redis (0 = warm once at startup only).
  affinityCacheRefreshS: 0
  # A pinned pod is "available" only if it pulled within this window. A sidecar
  # /pull is health-gated on vLLM /health, so a pull doubles as a per-pod READY
  # heartbeat (ready pods heartbeat sub-second); this window is headroom against
  # a briefly-silent ready pod, and ages out genuinely gone/scaled-down pods to
  # LB. See docs/internal/persistent-affinity-map.md.
  affinityEndpointStaleS: 1800
  # Cluster component of the Redis key namespace. Empty => the chart falls back
  # to .Values.switchCluster, then the code falls back to the k8s namespace.
  affinityCluster: ""

  # SLO-aware routing (disabled by default — zero impact on legacy path)
  sloAware: false
  sloWithKv: true
  admissionThrottle: false
  fixedBatchSize: 0
  # Pull-mode fairness (load-aware grant throttle; disabled by default).
  # fairPull on -> each /pull grant is capped so a pod fills up to
  # fairMargin x fleet-average in-flight; only movable/unpinned items are
  # trimmed (affinity is never overridden); fairFloor is the min movable items
  # an overloaded pod still gets. stuckPullSeconds/affinityReleaseOnStuck are
  # the optional liveness/stuck-pod controls.
  fairPull: false
  fairMargin: 1.25
  fairFloor: 1
  stuckPullSeconds: 0
  affinityReleaseOnStuck: false
  # Central-push mode (only used when mode: central-push). The router dispatches
  # centralPushCap - in-flight items per pod via POST /push every
  # centralPushIntervalS (and on each enqueue). centralPushCap should track the
  # sidecar batchSize + prefetch so a pod is kept busy without overrunning it.
  centralPushCap: 8
  centralPushIntervalS: 0.05
  # Sidecar-optional push-*/central-push (direct-to-vLLM delivery). The router
  # reads ROUTER_SIDECAR_ENABLED from sidecar.enabled (one switch drops the
  # sidecar container AND flips push-*/central-push to direct delivery). These
  # two only matter when sidecar.enabled=false AND mode is push-* or
  # central-push AND prefix/both routing is on: the router subscribes to each
  # pod's vLLM KV-events ZMQ at tcp://{pod_ip}:{vllmKvEventsPort} with topic
  # prefix {vllmKvEventsTopic}. Must match the engine's --kv-events-config
  # (chart publishes port 5557, topic "kv@{POD_NAME}@{model}"; the "kv@" prefix
  # matches all pods).
  vllmKvEventsPort: 5557
  vllmKvEventsTopic: "kv@"
  outputLenPredictor: simple
  batchSizeEstimate: fixed
  fixedBatchEstimate: 8
  latencyPredictor: linear
  latencyOnlineUpdate: false
  latencyProfilePath: ""
  queueWaitModel: none
  chunkedPrefillAware: false
  maxNumBatchedTokens: 0

batchSize: 8

# Tensor parallelism size for vLLM (1 = no TP, 2 = 2-way, 4 = 4-way, etc.)
# This affects: --tensor-parallel-size, NPU resource limits, ASCEND_RT_VISIBLE_DEVICES, /dev/shm size
tensorParallelSize: 8

autoscaling:
  # Master switch. When false, NO autoscaling resources are rendered and the
  # chart behaves exactly as before (replicas come from the model spec). This
  # is the production-safe default — leave it false unless KEDA is installed.
  enabled: false

  # Scaling signal driving every model's ScaledObject (overridable per model):
  #   queue -> router_central_queue_length_by_model  (needs a router-style
  #            backend: router|boom|litellm; scales on central-queue depth)
  #   vllm   -> vllm:gpu_cache_usage_perc             (router-independent; works
  #             for direct/vllm-only topologies, scales on KV-cache pressure)
  #   sglang -> SGLang token usage for the served model and release namespace
  #             (accepts both colon and underscore metric names)
  signal: queue

  # Prometheus endpoint KEDA queries. Defaults to the Service created by the
  # kube-prometheus-stack release (name "kube-prometheus-stack") that
  # infra/ansible deploys into the monitoring namespace. The release-agnostic
  # headless service http://prometheus-operated.monitoring.svc:9090 also works.
  prometheusServerAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090

  # null -> fall back to each model's own replica count (DP: dataParallel.groups)
  minReplicaCount: null
  maxReplicaCount: 16

  # Threshold for the queue signal (target central-queue depth per model).
  threshold: "16"
  # Threshold for the vllm signal (fraction of KV cache utilised, 0..1).
  vllmThreshold: "0.8"
  # Threshold for the fractional SGLang token-usage signal (0..1).
  sglangThreshold: "0.8"

  pollingInterval: 10
  cooldownPeriod: 300

  # Optional full-query overrides (advanced). Leave empty to use the
  # signal-derived per-model queries above.
  #   vllmQuery       -> overrides the vllm-signal query for every model
  #   prometheusQuery -> overrides the queue-signal query for every model
  #                      (back-compat with the pre-per-model single query)
  vllmQuery: ""
  sglangQuery: ""
  prometheusQuery: ""

  # Per-model overrides, keyed by models[].name. Each entry may set:
  #   enabled, minReplicaCount, maxReplicaCount, threshold, signal, query
  # Example:
  #   perModel:
  #     qwen:    { signal: queue, threshold: "12", maxReplicaCount: 8 }
  #     minimax: { enabled: false }   # opt this model out of autoscaling
  perModel: {}

# Pin router + redis to a specific node by name (via kubernetes.io/hostname)
# Example node names from `kubectl get nodes`: master / master1 / worker1
pin:
  enabled: true
  nodeName: "node3"
  tolerations:
    # Allow scheduling onto control-plane/master nodes if tainted (common default)
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# PV and PVC are deployed ONCE manually on the parent NFS directory (e.g. /saeid/models/).
# The sweep runner always overrides modelVolume.create=false and sets modelSubPath per experiment.
# To deploy PV/PVC for the first time, run helm with:
#   --set modelVolume.create=true --set modelVolume.modelSubPath=<model-folder-name>
# modelVolume:
#   create: false
modelVolume:
  create: false                   # never recreated by sweep — deploy once externally
  nfsServer: nfs.local
  nfsPath: /home/models/          # parent directory containing all models
  # nfsPath: /saeid/models/qwen3-8b  # (old style — specific model path, no longer used)
  modelSubPath: ""                # set per-experiment by sweep (e.g. qwen3-8b, GLM-5-w4a8-mtp-QuaRot)
  pvcName: "models-nfs-pvc"       # PVC name when using NFS (default)
  hostPath: ""                     # set to local path (e.g. /home/models) to bypass NFS
                                  # must be set explicitly on first deploy via --set modelVolume.modelSubPath=<name>

# AIBrix integration.
# In backend=aibrix, vLLM pods expose labels so AIBrix gateway can discover them.
aibrix:
  enabled: false

  # Must match the vLLM --served-model-name
  modelName: "served-model"

  # Port where vLLM OpenAI server listens
  port: 8200

# vLLM runtime flags — all optional, set null to disable
vllm:
  # RuntimeClass applied to vLLM pods when hardware=nvidia (ignored on Ascend).
  # Most GPU clusters install the NVIDIA container runtime under the class name
  # "nvidia"; override if your cluster registers a different RuntimeClass.
  runtimeClassName: nvidia

  # Nodes labelled avoid=<avoidLabelValue> are excluded from vLLM scheduling.
  # Override for shadow deployments (e.g. "vllm-shadow") so prod and shadow
  # use independent avoid labels.
  avoidLabelValue: "vllm"

  # Optional per-role node pinning (DP LeaderWorkerSet). Empty = fall back to
  # nodeSelector below (i.e. same selector for both roles). Set these to pin the
  # DP leader and worker to specific labelled nodes, e.g. {vllm-role: leader}.
  leaderNodeSelector: {}
  workerNodeSelector: {}

  # Optional CPU / memory reservations for the vLLM engine container (the one that
  # hosts the LMCache connector + its host-RAM "local_cpu" offload tier). By
  # default the engine only requests the Ascend NPU + ephemeral-storage, so its
  # CPU and host RAM are UNRESERVED -- at peak load LMCache can be CPU-starved or
  # OOM-killed by co-tenants. Set requests here to reserve a floor (Burstable QoS).
  # Prefer requests WITHOUT memory limits: a memory limit below LMCache's actual
  # footprint would make the kernel OOM-kill the engine, which is worse than the
  # problem. Empty by default => behaviour unchanged. Injected into all three
  # engine containers (non-DP, DP-leader, DP-worker).
  engineResources:
    requests: {}   # e.g. { cpu: "16", memory: "200Gi" }
    limits: {}     # e.g. { cpu: "64" }   (avoid a memory limit unless you must)

  # Memory / performance
  kvCacheDtype: "auto"             # "auto", "fp8", "fp8_e4m3" — fp8 halves KV cache memory
  cpuOffloadGb: null               # null = off; set to e.g. 3 to offload model weights to CPU for more KV cache
  ascendBufferPool: "4:8"          # NPU buffer pool config (set unconditionally for Ascend hardware)
  ascendUseShortConnection: "1" # ADXL disconnect after each transfer batch; required for clean CaMem sleep/wake (dyn-pd)
  # ADXL/HIXL connect timeout (ms). Mooncake defaults to 10000, and every failed
  # attempt against an engine that has gone to sleep pays that timeout before the
  # request falls back to recompute. 2000 is the conservative chart default;
  # dyn-pd runs 500 (healthy connect measures ~6ms, so 500 still leaves ~80x
  # margin) and sets it in delivery/values-pd-dynamic-rebalance.yaml; see
  # DELIVERY.md for the measurement.
  ascendConnectTimeout: "2000"
  # Engine-source overlay: patched *upstream engine sources* mounted into the
  # engine containers at runtime instead of baking them into the image. The chart
  # is file-agnostic: it renders whatever the vllm.upstreamOverlay.files table
  # below describes (see the patch package's overlay.json +
  # make-overlay-command.py) and fails fast when an entry is incomplete.
  upstreamOverlay:
    enabled: false
    configMapName: ""   # "" -> <release>-te-unreg-sc
    # The overlay is data-driven: one entry per patched upstream file.
    #   <name>:            free label used by --set-file
    #     key:             ConfigMap key AND mount subPath (usually the file name)
    #     path:            target path inside the engine container
    #     content:         file body, injected at deploy time with
    #                      --set-file vllm.upstreamOverlay.files.<name>.content=<file>
    # The mapping (which upstream files a given vllm-ascend version needs, and
    # where they live in the container) belongs to the PATCH PACKAGE, not to this
    # repository: delivery/pd-dynamic-rebalance/overlay.json + make-overlay-command.py
    # generate both this fragment and the --set-file flags, so adding or removing
    # a patched file is a patch-package change, never a chart change.
    files: {}
    # Example (filled in by the patch package):
    #   camem:
    #     key: camem.py
    #     path: /vllm-workspace/vllm-ascend/vllm_ascend/device_allocator/camem.py
    #     content: ""
  gpuMemoryUtilization: null       # null = use vLLM default
  quantization: null               # null = no quantization
  enableExpertParallel: false      # false = disable
  maxModelLen: null                # null = use model's default; set lower to save KV cache memory
  compilationConfig:
    cudagraphMode: "FULL_DECODE_ONLY"   # null = disable compilation config entirely

  # Additional optional flags (disabled by default)
  trustRemoteCode: false
  maxNumBatchedTokens: null        # null = use vLLM default
  seed: null                       # null = use vLLM default
  # Where default sampling params come from when a request omits them:
  #   null / omit — use the model checkpoint's generation_config.json (often temp=1, top_p=0.95 → startup WARNING)
  #   "vllm"      — use vLLM built-in defaults instead (--generation-config vllm)
  generationConfig: null
  additionalConfig: {}             # set to {multistreamOverlapSharedExpert: true} to enable
  speculativeConfig: {}            # set to {numSpeculativeTokens: 3, method: "deepseek_mtp"} to enable
  enablePrefixCaching: false       # true = enable prefix caching (uses KV cache memory)
  enablePromptTokensDetails: false # true = --enable-prompt-tokens-details (per-request cached-token counts for gateway hit-rate feedback)
  toolCallParser: null             # e.g. "qwen", "qwen3_coder", "glm47"
  reasoningParser: null            # e.g. "qwen3", "glm45"
  hostNetwork: false
  dtype: "auto"                      # "auto", "bfloat16", "float16" — passed to --dtype
  schedulerCls: ""                   # e.g. "lsched.lsched_vllm.LSchedVLLMAdapter" — passed to --scheduler-cls
  modelLoaderExtraConfig: ""         # JSON string, e.g. '{"enable_multithread_load":true,"num_threads":16}'
  ascendEnableFlashcomm1: false      # true = set VLLM_ASCEND_ENABLE_FLASHCOMM1=1

# SGLang v0.5.15 runtime and KV-event publisher defaults. These values are
# inert while engine.type=vllm.
sglang:
  # Router hash contract pin; must match the supported engine image contract.
  contractVersion: "0.5.15"
  pageSize: 16
  memFractionStatic: 0.9
  logLevel: info
  toolCallParser: null
  reasoningParser: null
  # Must remain false for v0.5.15: router tokenizer init cannot mirror remote code.
  trustRemoteCode: false
  extraArgs: []
  healthPath: /health
  # Explicitly set /health_generate only when generation-backed readiness is
  # desired. Liveness always uses healthPath and never this value.
  readinessPath: ""
  metricsPath: /metrics
  metricsPort: 8200
  # Large CUDA images and model initialization can legitimately exceed the
  # Kubernetes Deployment default of 600 seconds on a cold node.
  progressDeadlineSeconds: 7200
  # Once startup succeeds, five failed 30-second health checks restart a dead
  # engine in about 2.5 minutes. Startup retains its separate 720-attempt budget.
  livenessFailureThreshold: 5
  # Required when hardware=nvidia (ignored on Ascend). Override if your cluster
  # registers a different RuntimeClass; falls back to vllm.runtimeClassName.
  runtimeClassName: nvidia
  # Deprecated: accelerator requests come from the top-level hardware switch
  # (vllmkv.acceleratorResource). Kept only so older overlays that set this
  # key do not fail unknown-field checks; it is not read by the templates.
  gpuResourceName: nvidia.com/gpu
  nodeSelector: {}
  engineResources:
    requests: {}
    limits: {}
  kvEvents:
    port: 5557
    replayPort: 5558
    topic: "kv@"
    discoveryTimeoutS: 2.0

# -----------------------------------------------------------------------
# Unified model definitions.
#
# ALL deployment modes (single-model, multi-model, data-parallel) use
# this list. When populated, the chart renders one Deployment (or LWS)
# per model entry. When empty, a single-model fallback is synthesized
# from the top-level tensorParallelSize/batchSize/vllm values.
#
# The sweep runner (sweep_methods.py) always populates this list — either
# from the client YAML's helm.models[] or by auto-migrating legacy flat
# vllm_*/data_parallel_* fields.
#
# Per-model fields (camelCase):
#   name              - unique identifier (used in k8s resource names)
#   servedModelName   - vLLM --served-model-name (defaults to name)
#   replicas          - number of instances (Deployment pods, or LWS groups in DP mode)
#   modelSubPath      - subfolder under the model volume
#   tensorParallelSize - per-model TP
#   batchSize         - per-model --max-num-seqs
#   image             - optional per-model vLLM image override
#   vllm:             - per-model vLLM runtime flags (overrides top-level vllm:)
#   dataParallel:     - optional LWS config for this model
#     enabled: true
#     size: 2           # pods per DP group (1 leader + N-1 workers)
#     sizeLocal: 1      # --data-parallel-size-local per pod
#     rpcPort: 13389
#     nicName: ""       # GLOO/TP/HCCL_SOCKET_IFNAME (empty = auto-detect)
#     hcclBuffSize: 200
#     ompNumThreads: 16
#     pairTopologyKey: "" # node label key for RoCE-pair pinning (e.g. "roce-pair")
#                         # When set, pods in the same LWS group are forced onto
#                         # nodes sharing the same label value. Requires K8s 1.29+.
#                         # Label your nodes first:
#                         #   kubectl label node n1 n2 roce-pair=pair-a
#                         #   kubectl label node n3 n4 roce-pair=pair-b
#   prefillDecode:      - optional vanilla prefill/decode (P/D) disaggregation.
#     enabled: true       # serve this model via a prefill pool + decode pool +
#                         # a proxy (see 41-vllm-pd-disagg.yaml and the global
#                         # prefillDecode: block below for the full schema).
#     dynamicRebalance:
#       mode: warmstandby # scale (default, delete pod + cold start) | warmstandby
#                         # (per-card dual engine: one awake, peer sleeping; flips in seconds)
#       sleepLevel: 1     # warmstandby: vLLM sleep level (1=weights to CPU, drop KV)
#     replicas: 3         # warmstandby: number of dual-engine pods (cards); null -> maxTotalReplicas
#     prefill: { port: 8200, tensorParallelSize: 1, batchSize: 32 }
#     decode:  { port: 8201, tensorParallelSize: 1, batchSize: 32 }
#     proxy:   { nodePort: 30036 }
#
# Example — single model:
# models:
#   - name: glm5-chat
#     servedModelName: served-model
#     replicas: 2
#     modelSubPath: GLM-5-w4a8-mtp-QuaRot
#     tensorParallelSize: 8
#     batchSize: 32
#     vllm:
#       gpuMemoryUtilization: 0.95
#       quantization: ascend
#       enableExpertParallel: true
#
# Example — data parallel (2 groups = 4 nodes total, pinned to RoCE pairs):
# models:
#   - name: glm5-dp
#     servedModelName: served-model
#     replicas: 2
#     modelSubPath: GLM-5-w4a8-mtp-QuaRot
#     tensorParallelSize: 8
#     batchSize: 32
#     dataParallel:
#       enabled: true
#       size: 2
#       pairTopologyKey: roce-pair   # pins each group to a node pair
#     vllm:
#       gpuMemoryUtilization: 0.95
#       quantization: ascend
#
# Example — multi-model:
# models:
#   - name: glm5-chat
#     servedModelName: glm5-chat
#     replicas: 1
#     modelSubPath: GLM-5-w4a8-mtp-QuaRot
#     tensorParallelSize: 8
#     batchSize: 32
#     vllm:
#       gpuMemoryUtilization: 0.95
#       quantization: ascend
#   - name: qwen3-8b
#     servedModelName: qwen3-8b
#     replicas: 4
#     modelSubPath: qwen3-8b
#     tensorParallelSize: 1
#     batchSize: 64
models: []

# Legacy top-level dataParallel — used as fallback when models[].dataParallel
# is not set. Prefer defining dataParallel per-model in the models[] list.
dataParallel:
  enabled: false
  size: 2
  groups: 1             # deprecated — use model's replicas field instead
  rpcPort: 13389
  sizeLocal: 1
  nicName: ""
  hcclBuffSize: 200
  ompNumThreads: 16
  pairTopologyKey: ""   # node label for RoCE-pair pinning (K8s 1.29+)

# -----------------------------------------------------------------------
# Vanilla prefill/decode (P/D) disaggregation — DEFAULTS.
#
# Opt-in PER MODEL via models[].prefillDecode.enabled: true. When enabled for a
# model, the chart SKIPS its standard Deployment and instead renders (in
# 41-vllm-pd-disagg.yaml):
#   - a PREFILL pool   (vllm-<model>-prefill)   — computes prompt KV
#   - a DECODE  pool   (vllm-<model>-decode)    — generates output tokens
#   - a lightweight PROXY (vllm-<model>, NodePort) — routes each request
#     prefill(max_tokens=1) -> decode and streams the decode output back.
#
# KV moves between the pools over the SAME connector the chart already uses:
# leave kvTransferConfig empty and the pools reuse the mooncake/lmcache
# `kv_both` connector (recommended — the shared KV store makes decode pull the
# prompt prefix by hash). For P2P connectors (NixlConnector, MooncakeConnector
# point-to-point) set the raw --kv-transfer-config JSON per role instead.
#
# The values below are DEFAULTS merged under each model's prefillDecode block;
# per-model settings (models[].prefillDecode.*) win. Off unless a model opts in.
# See docs/deployment/prefill-decode-disaggregation.md.
prefillDecode:
  terminationGracePeriodSeconds: 120   # engine pods get this long to finish in-flight work on scale-down
  # warmstandby only: run the dual-engine pod on the host network. TP>1 needs
  # hostNetwork on clusters whose HCCL must use the physical host NIC; with the
  # default (false) the engines use the pod network and multiple TP>1 pods may
  # share one node. hostNetwork=true enforces one pod per node.
  hostNetwork: false
  # warmstandby only: number of dual-engine pods (one card each). Each pod
  # hosts BOTH a prefill and a decode engine; exactly one is awake per card.
  # null -> dynamicRebalance.maxTotalReplicas.
  replicas: null
  # warmstandby only: boot both engines asleep so the card joins the pre-warm
  # pool (true), or boot decode-awake and let the rebalancer converge (false,
  # default). With true the first reconcile is a drain-free wake of exactly
  # the target roles.
  poolBootSleep: false
  prefill:
    replicas: 1
    port: 8200                # engine http port (warmstandby: prefill container)
    tensorParallelSize: null   # null -> model.tensorParallelSize (or global)
    batchSize: null            # null -> model.batchSize (or global)
    # Multi-process-per-NPU port plan: warmstandby runs a prefill AND a decode
    # engine on the same NPUs, so every port family must be disjoint between the
    # containers and must stay clear of the ports libhcomm binds for itself
    # (16666 HETEROG_CCL_PORT, 16667 AICPU_RETRY_BACKUP_PORT).
    #   hcclSocketPortRange     -> HCCL_NPU_SOCKET_PORT_RANGE (device side)
    #   hcclHostSocketPortRange -> HCCL_HOST_SOCKET_PORT_RANGE (host side)
    #   hixlListenPort          -> comm_resource_config.listen_port inside
    #                              ASCEND_GLOBAL_RESOURCE_CONFIG, NOT covered
    #                              by the HCCL ranges.
    # The numbers are environment values: the chart ships them empty and
    # warmstandby fails the render with guidance until a plan is supplied.
    hcclSocketPortRange: ""
    hcclHostSocketPortRange: ""
    hixlListenPort: ""
  decode:
    replicas: 1
    port: 8201                # engine http port (warmstandby: decode container;
                              # scale mode keeps 8200 unless overridden)
    tensorParallelSize: null
    batchSize: null
    hcclSocketPortRange: ""
    hcclHostSocketPortRange: ""
    hixlListenPort: ""
  # Per-model opt-in only (models[].prefillDecode.dynamicRebalance). Defaults
  # used by the rebalancer template when a model opts in:
  #   enabled: true
  #   mode: scale             # scale (cold pod recreation) | warmstandby (per-card sleep/wake)
  #   minPrefillReplicas: 1
  #   minDecodeReplicas: 1
  #   maxTotalReplicas: 3     # awake budget (P+D); warmstandby also = default card count
  #   sleepLevel: 1           # warmstandby: vLLM sleep level
  proxy:
    image: ""                  # "" -> images.vllm (guaranteed to ship aiohttp; CPU-only)
    replicas: 1
    port: 8200                 # proxy container listen port
    nodePort: 30036            # +portOffset; the model's external endpoint
    logLevel: info             # debug | info | warning | error
    drainMaxWaitSeconds: 300   # max time a new P/D request waits during a rebalancer drain window
    resources:
      cpuRequest: "200m"
      memoryRequest: "512Mi"
      cpuLimit: "2000m"
      memoryLimit: "2Gi"
  # Raw --kv-transfer-config JSON per pool. Empty => reuse the mooncake/lmcache
  # connector the standard deployment uses (kv_both). Only set these for P2P
  # connectors that need explicit producer/consumer roles.
  kvTransferConfig:
    prefill: ""
    decode: ""

# Optional quiescent P/D replica rebalancer. It owns only P/D-enabled models
# that opt in through models[].prefillDecode.dynamicRebalance.enabled.
pdRebalancer:
  image: ""                    # empty -> images.vllm; must provide Python 3
  port: 8081
  pollIntervalSeconds: 2
  heartbeatTimeoutSeconds: 60   # /healthz fails when a worker loop has not stamped within this many seconds
  readinessTimeoutSeconds: 900
  drainTimeoutSeconds: 300     # rebalancer waits this long for the proxy to drain in-flight requests
  quiesceSettleSeconds: 3      # warmstandby: a card's engine must report zero in-flight requests for this
                               # long (after its label left the Service) before the flip sleeps it;
                               # covers the kube-proxy endpoint update window (per-card quiesce)
  sleepRetries: 5              # warmstandby: /sleep retry attempts (transient 500 while delayed KV connector frees drain)
  sleepBackoffSeconds: 2       # warmstandby: linear backoff between /sleep retries (seconds)
  wakeRetries: 3               # warmstandby: /wake_up retry attempts before the card is marked needs_recreate
  wakeBackoffSeconds: 5        # warmstandby: linear backoff between /wake_up retries (seconds)
  wakeAfterSleepSeconds: 2     # warmstandby: grace between a confirmed sleep and waking the peer
  # warmstandby: cap on how many cards of one transition flip at the same time.
  # Empty -> every card of the plan flips at once (a 2-replica move then costs
  # ~one flip); 1 -> sequential, for troubleshooting a wake resource spike.
  flipParallelism: ""
  # warmstandby: the light KV warm-up probe. Every engine pair pays a one-off
  # channel/pool setup (~3.4s per leg) the first time it transfers, and after a
  # role flip that cost would otherwise land on the first user request. The
  # probe pays it deliberately: with kvWarmupBlocking it runs INSIDE the drain
  # window (first request afterwards is warm, flip duration unchanged because
  # the probe itself costs <1s once the pair is warm).
  # Off by default: it sends synthetic requests through the engines, so enable
  # it per deployment (dyn-pd enables both, see the delivery values).
  kvWarmup: 0
  kvWarmupBlocking: 0          # 1 -> warm inside the drain window; 0 -> background thread after the drain is released
  # Hard cap on how long a blocking warm-up may hold the proxy drain. On budget
  # exhaustion the traffic is released and the probe keeps running in the
  # background (a genuinely failed warm-up still rolls the flip back as long as
  # it fails within the budget).
  kvWarmupBlockingBudgetSeconds: 20
  kvWarmupFillerRepeats: 24    # "The quick brown fox..."xN; 24 ~= 270 tokens, enough for >=2 KV blocks
  kvWarmupMaxTokens: 1         # prefill leg generation length
  kvWarmupPeerMaxTokens: 1     # decode leg generation length
  kvWarmupTimeoutSeconds: 40   # per-leg HTTP timeout (cold start is ~3.4s/leg)
  kvWarmupAttempts: 2
  kvWarmupGapSeconds: 1
  capacityPreflight:           # reject targets that cannot fit the cluster's accelerator budget
    enabled: true              # true -> renders a ClusterRole (nodes + all-namespace pods read)
    resourceName: ""           # optional override; empty -> accelerator.resourceName via vllmkv.acceleratorResource
  dryRun: false                # true -> reconcile logs planned transitions without touching /scale
  advisory: true               # true -> planner logs recommendations only; false -> auto propose+commit
  plannerPollIntervalSeconds: 5
  plannerScrapeDeadlineSeconds: 5   # per-poll cap for the concurrent metrics scrape; keep <= plannerPollIntervalSeconds to hold cadence
  metricsPort: 8200
  proxyMetricsPort: 8200     # P/D proxy /metrics port (planner scrapes proxy on this)
  apiToken: ""               # optional; when non-empty, /v1/targets/* requires an X-Auth-Token header (healthz excluded)
  plannerConfig: {}            # JSON object overriding pd_planner.PlannerConfig defaults
  resources:
    cpuRequest: "100m"
    memoryRequest: "128Mi"
    cpuLimit: "500m"
    memoryLimit: "512Mi"

# -----------------------------------------------------------------------
# NFS page cache warm — pre-reads model shards before vLLM pods start.
#
# Large models (e.g. GLM-5 with 96 safetensor shards) can take hours to
# load from cold NFS. This Helm pre-install hook reads all shards once,
# warming the NFS server's page cache so vLLM pods load from memory.
#
# Runs as a Helm pre-install/pre-upgrade hook (Job) before vLLM pods start.
# Disabled by default — enable and set modelSubPath for large NFS-backed models.
cacheWarm:
  enabled: false
  pvcName: "models-nfs-pvc"
  modelSubPath: "GLM-5-w4a8-mtp-QuaRot"
  image: "busybox"
  ttlSeconds: 120

# -----------------------------------------------------------------------
# Mooncake KV cache transfer — optional enhancement WITHIN the router stack.
#
# When enabled, adds:
#   1. A mooncake-master Deployment (metadata coordination service)
#   2. A ConfigMap with mooncake.json
#   3. --kv-transfer-config on each vLLM worker
#   4. hostNetwork + HCCL NIC detection on vLLM pods
#
# Requires backend=router. Helm will fail if mooncake.enabled=true without it.
mooncake:
  # Pin store PUTs to the writing engine's own local segment (dyn-pd warm standby).
  preferredSegment: true
  enabled: false
  masterPort: 50088
  masterServerAddress: "10.50.156.106:50088"
  globalSegmentSize: 140000000000
  evictionHighWatermark: 0.9
  evictionRatio: 0.1
  ascendBufferPool: "4:8"
  ascendUseShortConnection: "1"
  lookupRpcPort: "10010"

# -----------------------------------------------------------------------
# LMCache — wraps Mooncake for cross-replica KV cache coordination.
#
# When enabled, replaces AscendStoreConnector with LMCacheAscendConnectorV1Dynamic
# on vLLM pods. Mooncake master is still required (mooncake.enabled must be true).
# vLLM pods get LMCACHE_CONFIG_FILE instead of MOONCAKE_CONFIG_PATH.
lmcache:
  enabled: false
  # LMCache backend mode:
  #   "mooncake" (default) — 33/218 lineage: LMCacheAscendConnectorV1Dynamic +
  #                          Mooncake remote store + P2PHANDSHAKE. Unchanged.
  #   "p2p"                 — 142 lineage: LMCacheAscendConnector + engine-to-engine
  #                          HCCL P2P + host-staging + lmcache_controller, NO Mooncake.
  # Anything other than "p2p" renders the historical Mooncake config verbatim, so
  # existing configs are unaffected.
  mode: "mooncake"
  chunkSize: 512
  maxLocalCpuSize: 50
  localCpu: true
  useLayerwise: false
  enableAsyncLoading: false
  internalApiServerEnabled: true
  internalApiServerHost: "0.0.0.0"
  internalApiServerPortStart: 6999
  extraConfig:
    useExistsAsync: true
    saveChunkMeta: false
    protocol: "ascend"
    globalSegmentSize: 80530636800
    localBufferSize: 0
    mooncakePreferLocalAlloc: true
    useAscendDirect: true
  # ---- P2P / host-staging mode (142). Only read when mode == "p2p". ----
  # Defaults match lmcache-csi/142/*/lmcache_instance*_host_staging.yaml.
  p2p:
    tpSize: 8                        # per-TP port arrays are length tpSize
    transferChannel: "hccl"          # host-staging REQUIRES "hccl" (not hccl_onesided)
    useNpu: true                     # p2p_use_npu: intermediate buffer on NPU
    pullMode: true                   # p2p_pull_mode: read vs write
    delayPull: true                  # p2p_delay_pull: required by host-staging
    npuBufferSize: 134217728         # p2p_npu_buffer_size: 128 MB ping-pong buffer
    initPortBase: 9950               # p2p_init_ports  = [base .. base+tpSize-1]
    lookupPortBase: 9970             # p2p_lookup_ports
    workerPortBase: 9940             # lmcache_worker_ports
    useHostStaging: true             # register ONE bounded arena, not the full pool
    osStagingBytes: 8589934592       # 8 GiB — keep SAFELY below the ~10 GB reg. ceiling
    saveOnlyFirstRank: false
    storeAsync: false
    lookupBackoffTime: 0.001
    # host:port of the lmcache_controller the engines dial. Empty => must be set
    # by the config (points at the pinned controller node, e.g. 10.50.156.65).
    # Ignored when controllerPlacement is "per-leader" (see below).
    controllerPullUrl: ""
    controllerReplyUrl: ""
    # Controller placement for p2p mode:
    #   "shared"     — one controller; engines dial controllerPullUrl/ReplyUrl
    #                  (default; existing configs).
    #   "per-leader" — one controller co-located on EACH DP leader node
    #                  (lmcacheController.nodeNames). ConfigMap emits
    #                  __CONTROLLER_HOST__:pullPort/replyPort; leaders sed
    #                  NODE_IP, workers sed LEADER_IP. Isolates the who-has
    #                  directory per DP pair (no cross-pair P2P lookup).
    controllerPlacement: "shared"
  # NDS (NVMe Direct Storage) — P2P DMA from NVMe SSD to NPU memory.
  # Requires p2p_dev.ko kernel module loaded on the host and /dev/p2p_device present.
  nds:
    enabled: false
    path: "/workspace/nds_kvcache"
    dev: "/dev/md0"
    size: 2048
    xdsPath: "/workspace/qyf/xds/xds/file_p2p"
    # Optional per-role overrides for the xds/file_p2p path (some hosts stage the
    # build at a different depth on leader vs worker). Empty = use xdsPath above.
    xdsPathLeader: ""
    xdsPathWorker: ""

# -----------------------------------------------------------------------
# LMCache controller — lightweight P2P lookup directory for lmcache.mode="p2p".
# Replaces the Mooncake master as the coordinator (it holds NO KV data, just the
# who-has-which-chunk directory). Deployed only when mode=="p2p" AND
# deploy.lmcacheController. Engines dial it via lmcache.p2p.controllerPullUrl/
# controllerReplyUrl (raw node IP:port; hostNetwork, so no Service needed).
lmcacheController:
  image: "127.0.0.1:32000/lmcache-ascend:hccl-p2p"
  # Control/admin port (probes + lmcache_controller --port). NOT the P2P
  # pull/reply ports. Must NOT be 9000 when co-located with a vLLM leader:
  # kv-sidecar already binds hostNetwork :9000, and the scheduler rejects the
  # leader with "didn't have free ports". Engines dial pull/reply only.
  port: 9010
  pullPort: 9800
  replyPort: 9900
  # Pin the controller to a fixed node so its host IP is stable and matches
  # lmcache.p2p.controllerPullUrl/replyUrl. Empty = let the scheduler place it
  # (only safe if you don't hardcode the controller IP).
  # Used when nodeNames / nodeNamesCsv are empty (shared single-controller).
  nodeName: ""
  # Per-leader placement: one controller Deployment per entry, each pinned to
  # that hostname. Prefer a YAML list (helm -f overlay) or the CSV form below
  # (works with --set). When non-empty, overrides nodeName.
  # Example: nodeNames: [node7, node1]  or  nodeNamesCsv: "node7,node1"
  nodeNames: []
  nodeNamesCsv: ""
  # Same control-plane / master tolerations as vLLM engines — required when a
  # per-leader controller is pinned to a control-plane node (e.g. BZ k8s-master).
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  # Resource requests/limits for the standalone lmcache_controller pod (the P2P
  # lookup directory). Shared mode often runs it on its own node; per-leader
  # co-locates it with a vLLM engine — keep these small so it can't starve the
  # engine. Override per deployment via helm.values (lmcacheController.resources.*).
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# -----------------------------------------------------------------------
# Redis persistence (for the durable, Redis-backed affinity map).
# When persistence.enabled=true the chart mounts a PVC at /data and runs Redis
# with AOF (appendonly) + RDB so the affinity map survives a Redis pod
# restart/reschedule and a full redeploy. Leave disabled if you do not use
# router.affinityPersistEnabled (default keeps the old ephemeral behavior).
redis:
  appendfsync: everysec   # everysec (default) | always | no
  persistence:
    enabled: false
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""      # "" = cluster default StorageClass

# Component deployment control
# Set to false to skip deploying a component (used for decoupled vLLM/stack deploys)
deploy:
  vllm: true      # set false in stack-only deploys (sweep_methods --skip-vllm)
  router: true    # set false in vllm-only deploys (deploy_vllm.py)
  redis: true     # set false in vllm-only deploys (deploy_vllm.py)
  # cpuHash (legacy external hasher) is auto-deployed based on router.hashSource
  # ("external" -> deployed). This flag is no longer read by the chart.
  cpuHash: false
  mooncakeMaster: true    # set false to skip mooncake-master
  lmcacheController: true # deploy lmcache_controller when lmcache.mode=="p2p"

# -----------------------------------------------------------------------
# LiteLLM proxy — production auth/spend gateway in front of the router.
#
# When enabled, deploys a LiteLLM proxy pod that:
#   - Accepts OpenAI-compatible requests from any external client
#   - Enforces virtual key auth, per-key/team spend limits, rate limits
#   - Forwards to router-service:8080/v1/chat/completions (the new shim)
#   - Optionally persists spend data to a Postgres DB
#
# Disabled by default — zero impact on benchmarking or existing paths.
# mu-load-test continues to hit the router directly for all experiments.
#
# To enable for production/demo:
#   helm upgrade vllm ./vllm-kv-stack \
#     --set litellm.enabled=true \
#     --set litellm.masterKey=sk-your-secret \
#     --set litellm.databaseUrl=postgresql://user:pass@host:5432/litellm
# -----------------------------------------------------------------------
litellm:
  enabled: false

  # LiteLLM proxy image — pulled from public ghcr.io or your private registry.
  # The global.imageRegistry rewrite applies here too if set.
  # image: ghcr.io/berriai/litellm:main-stable
  image: litellm:main-stable

  # Admin master key — used to generate virtual keys and access the admin UI.
  # Override this in production; never commit real keys here.
  masterKey: "sk-litellm-master"

  # NodePort for external cluster access (e.g. from a laptop or CI machine).
  # Access via http://<any-node-ip>:30400
  nodePort: 30400

  # Optional Postgres URL for spend tracking persistence.
  # Leave empty ("") to run in stateless mode — virtual keys still work but
  # spend history is lost on pod restart.
  # Example: "postgresql://litellm:password@postgres-host:5432/litellm"
  databaseUrl: ""

  # Resource requests/limits for the LiteLLM proxy container.
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# -----------------------------------------------------------------------
# BooM Gateway — Rust LLM API gateway in front of the router.
#
# When enabled, deploys a BooM Gateway pod that:
#   - Accepts OpenAI-compatible requests from any external client
#   - Enforces virtual key auth, per-key/team spend limits, rate limits
#   - Forwards to router-service:8080/v1/chat/completions (the router shim)
#   - Optionally persists spend data to a Postgres DB
#
# Same role as litellm but implemented in Rust for lower overhead.
# Disabled by default — zero impact on benchmarking or existing paths.
#
# To enable for production/demo:
#   helm upgrade vllm ./vllm-kv-stack \
#     --set boom.enabled=true \
#     --set boom.masterKey=sk-your-secret \
#     --set boom.databaseUrl=postgresql://user:pass@host:5432/boom
# -----------------------------------------------------------------------
boom:
  enabled: false

  # Routing mode — controls where BooM forwards requests:
  #   router  (default) — BooM → router-service → sidecar → vLLM (KV/len-aware)
  #   direct            — BooM → vLLM pods directly (no router/sidecar/redis/hash)
  # Use "direct" for A/B comparison to measure router value-add.
  routeVia: router

  # BooM routing strategy when routeVia=direct.
  # These map to real BooM scheduler policies:
  #   round_robin  — cycles through vLLM leader pods sequentially
  #   key_affinity — sticky routing per API key with load-aware rebalancing
  #   kvc_aware    — subscribe to vLLM KV-cache ZMQ events, route to the worker
  #                  holding the longest cached prefix (see boom.kvcAware below)
  directRoutingStrategy: round_robin

  # KV-Cache-Aware routing config. Only consumed when
  # directRoutingStrategy=kvc_aware (routeVia=direct). Renders
  # router_settings.schedule_policy=kvc_aware + a kvc_aware block in
  # boom_config.yaml, and forces vLLM to publish KV-cache events over ZMQ
  # (port zmqPort) even in direct mode where sidecars are off.
  #
  # Identity alignment (BooM README): the ZMQ topic worker_id MUST equal
  # model_info.id. vLLM publishes topic "kv@<POD_NAME>@<servedModelName>", so in
  # kvc_aware mode 75-boom.yaml sets model_info.id to the full leader pod name
  # (vllm-<model>-<i>) instead of the short <model>-<i>.
  kvcAware:
    # Must match vLLM --block-size (block_size defaults to 128 with prefix cache).
    blockSize: 128
    # combined_score = cacheWeight*hit_ratio + tierWeight*tier + loadWeight*load
    cacheWeight: 0.5
    tierWeight: 0.3
    loadWeight: 0.2
    # ZMQ port each vLLM pod publishes KV events on (matches --kv-events-config).
    zmqPort: 5557
    # Topic prefix; vLLM publishes "kv@<pod>@<model>".
    zmqTopicPrefix: "kv@"
    # Tokenizer root inside the boom-proxy pod. Files must live under
    # {tokenizerDir}/{model_name}/ (tokenizer.json, tokenizer_config.json).
    # 75-boom.yaml hostPath-mounts each model's dir to {tokenizerDir}/{served}.
    tokenizerDir: "/app/tokenizers"

  # Flow control — caps concurrent upstream connections per model deployment.
  # Without this, BooM opens one upstream connection per inflight request,
  # which can exhaust file descriptors under load.
  # Set to 0 to disable (unlimited). Excess requests queue inside BooM.
  maxInflight: 0

  # Upstream HTTP timeout (seconds) for BooM → router/vLLM (litellm_params.timeout).
  # Long generations need this high or BooM returns 502 ("Upstream provider unavailable").
  upstreamTimeoutSeconds: 7200

  # BooM Gateway image — built from the cloned boom-gateway/ repo and pushed to your registry.
  # The global.imageRegistry rewrite applies here too if set.
  image: boom-gateway:v5

  # Always pull so tag:latest (or any mutable tag) picks up the newest image after push.
  # Set to IfNotPresent to use cached layers only (not recommended with :latest).
  imagePullPolicy: Always

  # Admin master key — used to generate virtual keys and access the admin UI.
  # Override this in production; never commit real keys here.
  masterKey: "sk-boom-master"

  # NodePort for external cluster access (e.g. from a laptop or CI machine).
  # Access via http://<any-node-ip>:30401
  nodePort: 30401

  # Optional Postgres URL for spend tracking persistence.
  # Leave empty ("") to run in stateless mode — virtual keys still work but
  # spend history is lost on pod restart.
  # Example: "postgresql://boom:password@postgres-host:5432/boom"
  databaseUrl: ""

  # Key-affinity benchmarking: deploy a lightweight in-memory PostgreSQL
  # with 64 pre-seeded virtual keys (sk-bench-0 .. sk-bench-63).
  # When true, also auto-sets databaseUrl to the internal Postgres service.
  # Default false — no extra pods, no DB, master-key-only auth.
  keyAffinityBench: false

  # Enable Claude Code compatibility aliases.
  # When true, BooM config includes router_settings.model_group_alias that
  # maps standard Claude model names (claude-sonnet-4-20250514, etc.) to
  # the first model's servedModelName, so Claude Code can connect via
  # /v1/messages without overriding model names in ~/.claude/settings.json.
  claudeCodeAliases: false

  # Additional model aliases (only when claudeCodeAliases=true).
  # Example: [{alias: "my-claude", target: "served-model"}]
  extraModelAliases: []

  # Strip Claude Code's `x-anthropic-billing-header` attribution block from
  # /v1/messages requests before forwarding upstream. Claude Code injects a
  # standalone system text block whose rotating `cc_version` tail and per-request
  # `cch=` counter invalidate byte-exact KV-cache prefix matching on EVERY
  # request (misses ~100% of the time). Enabling this drops the whole block
  # (matching vLLM PR #36829 and the router-side STRIP_CCH seam), restoring
  # prefix-cache hits. Needed for a fair KV-cache comparison when routeVia=direct
  # (the router-side strip only applies on the router path, not BooM-direct).
  # Default false to match BooM's out-of-box behavior.
  stripClaudeCodeAttribution: false

  # Resource requests/limits for the BooM Gateway container.
  # Lower than LiteLLM — Rust binary has much smaller memory footprint.
  resources:
    requests:
      cpu: "250m"
      memory: "128Mi"
    limits:
      cpu: "2000m"
      memory: "512Mi"
