[pytest]
# Run from the router_service dir. pythonpath makes the `router` package
# importable under a bare `pytest` invocation (CI), matching `python -m pytest`.
pythonpath = .
testpaths = tests
addopts = -ra -q
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
