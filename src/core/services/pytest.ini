[pytest]
# Standalone-module tests (fingerprint_middleware) that live directly under
# src/core/services. Run from this directory with PYTHONPATH=. so the flat
# module is importable. testpaths is scoped to ./tests so this run does NOT
# recurse into the per-service suites (router_service/, sidecar/).
pythonpath = .
testpaths = tests
addopts = -ra -q
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
