apiVersion: v1
kind: Namespace
metadata:
  name: vllm

---
# Optional: hostPath so /model inside the pod points to your node path.
# If you prefer a PVC instead, swap this section for a PV+PVC pair.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-local-pv
  namespace: vllm
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /home/saeid/llm-lb/qwen-4b
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-local-pvc
  namespace: vllm
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: qwen-local-pv

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      restartPolicy: Always
      containers:
        - name: vllm
          # Pin a concrete version to ensure identical stacks across replicas/nodes
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          # vLLM image entrypoint already runs the OpenAI server; just pass args.
          args:
            - "--model"
            - "/model"
            - "--tokenizer"
            - "/model"
            - "--port"
            - "8200"
            - "--served-model-name"
            - "served-model"
            # Keep fast paths; avoid enforce-eager for performance while comparing determinism
            - "--tensor-parallel-size"
            - "1"
            - "--dtype"
            - "float16"
            - "--kv-cache-dtype"
            - "auto"
            - "--max-num-seqs"
            - "8"
            # If you require KV transfer and your image supports it, uncomment:
            # - "--kv-transfer-config"
            # - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          # env:
          #   # Use local/offline model files so both replicas read the same bytes
          #   - name: HF_HUB_OFFLINE
          #     value: "1"
          #   - name: TRANSFORMERS_OFFLINE
          #     value: "1"
          #   - name: HF_HUB_DISABLE_TELEMETRY
          #     value: "1"
          #   # GPU visibility (optional; remove if using NVIDIA GPU Operator defaults)
          #   - name: CUDA_VISIBLE_DEVICES
          #     value: "0"
          #   - name: CUBLAS_WORKSPACE_CONFIG
          #     value: ":16:8"
          #   # Leave performance-friendly defaults; do not add strict determinism envs here
          #   # - name: VLLM_USE_FLASHINFER
          #   #   value: "0"
          #   # - name: VLLM_TORCH_COMPILE
          #   #   value: "0"   # keep compilation paths off while debugging
          env:
            # Use local/offline model files so both replicas read the same bytes
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"

            # GPU visibility (optional; remove if using NVIDIA GPU Operator defaults)
            - name: CUDA_VISIBLE_DEVICES
              value: "0"

            # Prefer add this FIRST for cross-GPU parity (small perf impact)
            - name: NVIDIA_TF32_OVERRIDE
              value: "0"

            # Only add this if you still see drift after the above (larger perf hit)
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":16:8"

            # Make Python hashing and tokenizers behavior stable (tiny CPU-side impact)
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"

          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
          # Basic health checks
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-local-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  type: NodePort
  selector:
    app: vllm-qwen
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30003 # Unique external port for debug tests