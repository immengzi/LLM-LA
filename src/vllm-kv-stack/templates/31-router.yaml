{{- if or (eq (lower .Values.backend) "router") (eq (lower .Values.backend) "litellm") (eq (lower .Values.backend) "boom") }}
{{- if .Values.deploy.router }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas.router }}
  selector:
    matchLabels:
      app: router-service
  template:
    metadata:
      labels:
        app: router-service
    spec:
      serviceAccountName: kv-router-sa

      {{- if .Values.pin.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "kubernetes.io/hostname"
                    operator: In
                    values:
                      - {{ .Values.pin.nodeName | quote }}
      tolerations:
{{- toYaml .Values.pin.tolerations | nindent 8 }}
      {{- end }}

      containers:
        - name: router
          image: {{ include "vllmkv.routerImage" . }}
          # imagePullPolicy: IfNotPresent
          imagePullPolicy: {{ .Values.router.imagePullPolicy | default "Always" }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: ACCESS_LOG
              value: "false"

            - name: KV_LOG_KEYS
              value: "off"
            - name: REQ_LOG_MODE
              value: "summary"

            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: MODEL_NAME
              value: "served-model"

            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: LABEL_SELECTOR
            {{- if .Values.models }}
              value: "component=vllm"
            {{- else }}
              value: "app=vllm-qwen"
            {{- end }}
            - name: VLLM_PORT
              value: "8200"

            - name: KV_WATCH_INTERVAL_S
              value: "1.0"
            - name: KV_WATCH_MAX_KEYS
              value: "200"
            - name: KV_DISCOVERY_INTERVAL_S
              value: "5.0"

            # ---- KV-block hash source (inline | external) ----
            - name: KV_HASH_SOURCE
              value: {{ quote (default "inline" .Values.router.hashSource) }}
            - name: HASH_SERVICE_URL
              {{- if and (eq (lower (default "python" .Values.serviceImpl)) "go") (ne (lower (default "inline" .Values.router.hashSource)) "external") }}
              value: "http://127.0.0.1:9095"
              {{- else }}
              value: "http://vllm-cpu-hash:9095"
              {{- end }}
            - name: KV_TOKENIZER_PATH
              value: "/model"
            - name: KV_BLOCK_SIZE
              value: {{ quote (toString (.Values.router.kvBlockSize | default 128)) }}
            - name: ROUTER_LOG_BLOCK_HASHES
              value: {{ ternary "true" "false" (.Values.router.logBlockHashes | default false) | quote }}
            - name: ROUTER_MEASURE_PREFIX
              value: {{ ternary "true" "false" (.Values.router.measurePrefix | default false) | quote }}
            - name: PYTHONHASHSEED
              value: "0"
            - name: KV_CANONICALISE_TOOLS
              value: {{ if hasKey .Values.router "kvCanonicaliseTools" }}{{ quote (toString .Values.router.kvCanonicaliseTools) }}{{ else }}"1"{{ end }}

            # ---- Unified routing strategy (overrides kvAware/affinityEnabled when set) ----
            - name: ROUTER_STRATEGY
              value: {{ if hasKey .Values.router "strategy" }}{{ quote .Values.router.strategy }}{{ else }}""{{ end }}

            # ---- Helm-controlled routing knobs ----
            - name: KV_AWARE
              value: {{ ternary "true" "false" .Values.router.kvAware | quote }}

            - name: LEN_AWARE
              value: {{ ternary "true" "false" .Values.router.lenAware | quote }}

            - name: LEN_POLICY
              value: {{ quote .Values.router.lenPolicy }}
            # --------------------------------------

            # ---- Key-affinity routing knobs ----
            - name: AFFINITY_ENABLED
              value: {{ ternary "true" "false" .Values.router.affinityEnabled | quote }}
            - name: AFFINITY_MODE
              value: {{ quote .Values.router.affinityMode }}
            - name: AFFINITY_TTL_S
              value: {{ quote (toString .Values.router.affinityTtlS) }}
            - name: AFFINITY_HARD_TIMEOUT_S
              value: {{ quote (toString .Values.router.affinityHardTimeoutS) }}
            # ------------------------------------

            # ---- SLO-aware routing knobs ----
            - name: SLO_AWARE
              value: {{ ternary "true" "false" .Values.router.sloAware | quote }}
            - name: SLO_WITH_KV
              value: {{ ternary "true" "false" .Values.router.sloWithKv | quote }}
            - name: ADMISSION_THROTTLE
              value: {{ ternary "true" "false" .Values.router.admissionThrottle | quote }}
            - name: FIXED_BATCH_SIZE
              value: {{ quote (toString .Values.router.fixedBatchSize) }}
            - name: OUTPUT_LEN_PREDICTOR
              value: {{ quote .Values.router.outputLenPredictor }}
            - name: BATCH_SIZE_ESTIMATE
              value: {{ quote .Values.router.batchSizeEstimate }}
            - name: FIXED_BATCH_ESTIMATE
              value: {{ quote (toString .Values.router.fixedBatchEstimate) }}
            - name: LATENCY_PREDICTOR
              value: {{ quote .Values.router.latencyPredictor }}
            - name: LATENCY_ONLINE_UPDATE
              value: {{ ternary "true" "false" .Values.router.latencyOnlineUpdate | quote }}
            {{- if .Values.router.latencyProfilePath }}
            - name: LATENCY_PROFILE_PATH
              value: {{ quote .Values.router.latencyProfilePath }}
            {{- end }}
            - name: QUEUE_WAIT_MODEL
              value: {{ quote .Values.router.queueWaitModel }}
            - name: CHUNKED_PREFILL_AWARE
              value: {{ ternary "true" "false" .Values.router.chunkedPrefillAware | quote }}
            - name: MAX_NUM_BATCHED_TOKENS
              value: {{ quote (toString .Values.router.maxNumBatchedTokens) }}
            # ---------------------------------

            - name: POOL_FACTOR
              value: "4"
            - name: STRIP_CCH
              value: {{ quote (toString (.Values.router.stripCch | default "1")) }}
            - name: POOL_BIDIRECTIONAL
              value: {{ ternary "true" "false" (.Values.router.poolBidirectional | default false) | quote }}
            - name: DEFAULT_MAX_TOKENS
              value: "1024"

            - name: ROUTER_MODE
              value: {{ quote .Values.router.mode }}

            - name: SIDECAR_PORT
              value: "9000"

            - name: PUSH_LEASTQ_MODE
              value: "local"

            - name: RESULT_TIMEOUT_S
              value: "1000.0"
            - name: RESULT_POLL_INTERVAL_S
              value: "0.02"

            - name: PUSH_HTTP_TIMEOUT_S
              value: "2.0"

            - name: TRACE_ENABLED
              value: "true"

            - name: TRANSPORT_MODE
              value: "async_pubsub"
            - name: SUBMIT_PATH
              value: "/submit"
            - name: RESULTS_ZMQ_BIND
              value: "tcp://0.0.0.0:5559"
            - name: RESULTS_ZMQ_TOPIC
              value: "results"
            - name: RESULTS_ZMQ_HWM
              value: "500000"
            - name: RESULTS_GRACE_S
              value: "5.0"

            - name: RESULT_TRANSPORT_MODE
              value: "submit_ack"
            - name: RESULT_SUBMIT_PATH
              value: "/result_submit"

            {{- if .Values.router.apiKey }}
            - name: API_KEY
              value: {{ quote .Values.router.apiKey }}
            {{- end }}

            {{- if .Values.models }}
            - name: MODEL_CONFIG_PATH
              value: "/etc/model-registry/models.yaml"
            {{- end }}

          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5559
              name: results-zmq

          readinessProbe:
            httpGet:
              path: /health/router
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/router
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
              {{- if .Values.models }}
              subPath: {{ ((index .Values.models 0).modelSubPath | default .Values.modelVolume.modelSubPath) }}
              {{- else }}
              subPath: {{ .Values.modelVolume.modelSubPath }}
              {{- end }}
          {{- if .Values.models }}
            - name: model-registry
              mountPath: /etc/model-registry/models.yaml
              subPath: models.yaml
              readOnly: true
          {{- end }}

          resources:
            {{- if and (eq (lower (default "python" .Values.serviceImpl)) "go") (ne (lower (default "inline" .Values.router.hashSource)) "external") }}
            # go + inline: the container also runs the embedded Python hasher
            # (transformers + tokenizer), so it needs more headroom than the
            # lightweight gateway-only / external cases.
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2560Mi"
            {{- else }}
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
            {{- end }}

      volumes:
        - name: model
          {{- if .Values.modelVolume.hostPath }}
          hostPath:
            path: {{ .Values.modelVolume.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.modelVolume.pvcName | default "models-nfs-pvc" }}
          {{- end }}
      {{- if .Values.models }}
        - name: model-registry
          configMap:
            name: model-registry
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: router-service
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: router-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: {{ add (.Values.portOffset | int) 30080 }}
    - name: results-zmq
      port: 5559
      targetPort: 5559
      nodePort: {{ add (.Values.portOffset | int) 30559 }}
{{- end }}
{{- end }}