# prod-yz-shadow-autoscaling-qwen: KEDA autoscaling validation on the SHADOW pool.
#
# Deploys a dense Qwen3-8B (TP=1, 1 NPU/replica) as release "vllm-shadow" in
# namespace "vllm-shadow" with portOffset=100, pinned to the shadow infra node
# and scheduled onto the shadow vLLM pool (vllm-pool=shadow / avoid=vllm-shadow)
# — exactly like prod-yz-shadow-boom-minmax-lmcache-hq.yaml, so it runs inside the
# prod cluster WITHOUT touching the prod release/namespace.
#
# A dense model is used on purpose: it can genuinely scale 1->N on the 2-node
# shadow pool, whereas a DP LeaderWorkerSet would need an extra RoCE pair per
# group. This is the autoscaling smoke test for the Deployment target.
#
# Node layout (same shadow pool as the minmax shadow):
#   node3: prod infra (unchanged) + shadow vLLM
#   node4: shadow infra (router, redis) + shadow vLLM
#
# Pre-requisites (see docs/operations/autoscaling.md):
#   kubectl label node node3 node4 vllm-pool=shadow --overwrite
#   kubectl label node node3 avoid=vllm --overwrite
#   monitoring stack:  cd infra && make monitoring
#   KEDA (+ LWS RBAC): cd infra && make keda
# Run via the sweep runner (autoscaling is applied on the full-stack deploy):
#   cd src && python sweep_methods.py --config 1-master_config   # entry is commented in
# Watch it react (note the shadow namespace):
#   kubectl -n vllm-shadow get scaledobjects,hpa,pods -w

backend: "router"

router_url: "http://10.50.156.65:30180"
total_requests: 300
prompt_source: "hf-lmsys"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/home/models/qwen3-8b"
  streaming: false
  min_input_tokens: 256
  max_input_tokens: 10000000
  repeat_each: 1

# Step schedule: idle -> burst (drives the per-model queue up to trigger
# scale-up) -> idle (observe scale-down after the cooldown window).
load_pattern:
  pattern: "steps"
  rate_rps: 5
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:2,60:25,240:2"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 2.0
  include_debug_metrics: false
  model_name: "served-model"
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30659"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

# --- Shadow-specific scheduling (keeps this off the prod vLLM pool) ---
vllm_node_selector:
  vllm-pool: shadow

vllm_avoid_label: "vllm-shadow"

helm:
  release: vllm-shadow
  namespace: vllm-shadow
  port_offset: 100
  pin_node_name: node4

  expose_per_pod: true

  # ---- Autoscaling under test ----
  autoscaling_enabled: true
  autoscaling_signal: "queue"          # per-model router central queue
  autoscaling_min: 1
  autoscaling_max: 4
  autoscaling_threshold: "8"           # scale up when per-model queue depth > 8
  autoscaling_polling_interval: 10
  autoscaling_cooldown_period: 120     # shorter than prod default for quicker observation
  autoscaling_prometheus_server_address: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  # autoscaling_vllm_threshold: "0.8"  # only used when autoscaling_signal: vllm

  router_kv_aware: false
  router_len_aware: true
  router_len_policy: "short_first"
  router_api_key: "ZhongRuanChuangXin!"

  nfs_path: "/saeid/models"
  model_host_path: "/home/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  models:
    - name: qwen3-8b
      servedModelName: served-model
      replicas: 1
      modelSubPath: qwen3-8b
      tensorParallelSize: 1
      batchSize: 8
      sidecarPrefetch: 2
      dataParallel:
        enabled: false
      vllm:
        gpuMemoryUtilization: 0.95
        trustRemoteCode: true
        seed: 1924
