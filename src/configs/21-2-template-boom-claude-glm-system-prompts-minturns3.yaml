# boom-direct-glm-dp.yaml — min_user_turns=3 variant
# Same as 15-2-...-10conv-mixedturns.yaml but filters the CodeFlowBench dataset
# to only include conversations with user turns >= 3. This produces a subset of
# deeper multi-turn conversations for testing prefix caching under sustained
# context accumulation.
#
# DIRECT MODE: BooM routes directly to vLLM pods, bypassing the KV-aware router.
# Use this for A/B comparison against boom-claude-glm-dp.yaml (which uses the router).
#
# In this mode:
#   - NO router-service, redis, cpu-hash, or sidecars are deployed.
#   - BooM routes directly to vLLM leader pods via stable LWS headless DNS.
#   - The "method" in master_config.yaml IS the BooM routing strategy:
#       round_robin   — simple round-robin across pods
#       key_affinity  — sticky routing per API key with load-aware rebalancing
#
# Everything else is identical to boom-claude-glm-dp.yaml.
# Claude Code connects via /v1/messages (Anthropic format) on port 30401.

backend: "boom"

router_url: "http://10.50.156.65:30080"  # local: k8s-master node IP; router NodePort 30080 (chart 31-router.yaml)
total_requests: 10
prompt_source: "codeflow"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/mnt/nvme1/saeid/datasets/CodeFlowBench-2505"  # local: verified dataset dir
  split: "train"
  tokenizer_name: "/data/models/GLM-5-w4a8-mtp-QuaRot"  # local: model dir w/ tokenizer.json
  streaming: false
  min_input_tokens: 1
  max_input_tokens: 3000
  repeat_each: 1
  seed: 314  # explicit seed for reproducibility
  multi_turn: true
  min_user_turns: 3  # only conversations with >= 3 user turns
  max_pool_size: 99999  # load entire dataset before filtering

load_pattern:
  pattern: "det"
  rate_rps: 0.1
  duration_s: 3000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 1024
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: true
  min_output_tokens_floor: 1024
  # replay_output_lengths_from: "305"

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "10.50.156.65:31190"  # local: live prometheus NodePort 31190 (monitoring ns)
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"  # local: router ZMQ results NodePort 30559 (chart 31-router.yaml)
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  # 300s temporary workaround for BooM tokenization bottleneck —
  # see TODO: investigate BooM ~234s/req tokenize latency
  idle_zero_running_s: 300.0

boom:
  base_url: "http://10.50.156.65:30401"  # local: k8s node IP; boom NodePort 30401 (chart values.yaml)
  chat_path: "/v1/chat/completions"
  model: "served-model"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

helm:
  boom_claude_aliases: true
  # boom_route_via: direct
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"  # TODO: app credential, not machine-detectable; kept from original — verify it matches the deployed gateway key

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  nfs_path: "/data/models/GLM-5-w4a8-mtp-QuaRot"  # local model path (only .name -> modelSubPath is used in hostPath mode)
  model_host_path: "/data/models"  # local: verified host dir containing GLM-5-w4a8-mtp-QuaRot (hostPath bypasses NFS)

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  models:
    - name: glm5-chat
      servedModelName: served-model
      replicas: 1
      modelSubPath: GLM-5-w4a8-mtp-QuaRot
      tensorParallelSize: 8
      batchSize: 4
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 13389
        hcclBuffSize: 200
        ompNumThreads: 16
        pairTopologyKey: roce-pair
      vllm:
        gpuMemoryUtilization: 0.95
        quantization: ascend
        enableExpertParallel: true
        enablePrefixCaching: true 
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 4096
        seed: 1924
        toolCallParser: glm47
        reasoningParser: glm45
        additionalConfig:
          multistream_overlap_shared_expert: true

# Claude-Code-style request injection (Phase 3 feature toggle).
# Injects a realistic Claude Code CLI prefix (system blocks + system-reminders +
# 23 tools) into the FIRST user turn of each conversation. On the wired OpenAI
# /v1/chat/completions path the Anthropic templates are mechanically converted to
# OpenAI shape (system message + reminder-prepended user content + function tools);
# cache_control is always stripped. cch stays at the XXXXX placeholder (drift is
# handled router-side by STRIP_CCH). Absent/disabled => behavior identical to the
# original yaml.
claude_code_injection:
  enabled: true
  template_dir: "/home/haiting/llm-la/src/multiturn-generation"
  inject_system_blocks: true
  inject_system_reminders: true
  inject_tools: true
  preserve_cache_control: true  # no-op on OpenAI path (cache_control always stripped); kept for future Anthropic wire path
