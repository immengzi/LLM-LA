# ── PROD master sweep config ──
# Production MiniMax-M2.7 deployments. One active entry at a time; all run with
# the `pull` method. Configs are prefixed by cluster: prod-bz-* (this machine)
# and prod-yz-* (the yz/hq cluster, including its shadow pool). Non-prod /
# benchmark plans live in non-prod/1-master_config.yaml and
# non-prod/boom_master.yaml.
#
# Run:  cd src && python sweep_methods.py            # uses this file by default
#       cd src && python sweep_methods.py --config 1-master_config

# ── BZ cluster (this machine) — MiniMax-M2.7, BooM + router, DP2 + Mooncake ──
# prod-bz-boom-minmax-mooncake:
#   - pull

# ── BZ 4-NODE AFFINITY CHECK: DP1 x 4 replicas, NO Mooncake (worker2 back) ──
# k8s-worker2 networking is fixed and the node is un-tainted, so the 4 replicas
# land one-per-node (master, worker, worker1, worker2) — quick test that worker2
# now takes traffic. DP1 single TP=8 pod each; Mooncake off (external KV not
# needed to validate routing). batchSize (32) and central router settings
# UNCHANGED. Sweep none -> prefix -> affinity -> both back-to-back.
# prod-bz-boom-minmax-multiturn-none-dp1:
#   - pull
# prod-bz-boom-minmax-multiturn-prefix-dp1:
#   - pull
# prod-bz-boom-minmax-multiturn-affinity-dp1:
#   - pull
# prod-bz-boom-minmax-multiturn-both-dp1:
#   - pull

# ── BZ 4-NODE DP2 AFFINITY CHECK: DP2 x 2 replicas, NO Mooncake ──
# dataParallel enabled (2 DP ranks/replica, sizeLocal=1, RoCE-paired); replicas: 2
# -> 2 replicas x 2 ranks = 4 nodes. Mooncake off; hard conversation affinity.
prod-bz-boom-minmax-multiturn-affinity-dp2:
  - pull

# ── Full multi-turn router_strategy sweep (DP2 + Mooncake) ──
