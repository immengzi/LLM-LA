# Same as lmcache-hq-affinity but LOCAL-cache-first: big local CPU cache (128
# GiB/worker), Mooncake remote store OFF, NDS/P2P + router key-affinity kept on.
# Runs 2 DP groups pinned per-role (vllm-role=leader/worker) with per-role NDS
# xds paths. Fixes the peak-load prefix-cache collapse (see disaster-recovery.md
# §11 + 142/ANALYSIS_kv_cache_drop.md). ACTIVE — intended deploy.
prod-yz-boom-minmax-lmcache-local-hq-affinity:
  - pull

