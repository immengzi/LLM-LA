# ── PROD master sweep config ──
# Production MiniMax-M2.7 deployments. One active entry at a time; all run with
# the `pull` method. Configs are prefixed by cluster: prod-bz-* (this machine)
# and prod-yz-* (the yz/hq cluster, including its shadow pool). Non-prod /
# benchmark plans live in non-prod/1-master_config.yaml and
# non-prod/boom_master.yaml.
#
# Run:  cd src && python sweep_methods.py            # uses this file by default
#       cd src && python sweep_methods.py --config 1-master_config

# ── BZ cluster (this machine) — MiniMax-M2.7, BooM + router, DP2 + Mooncake ──
# prod-bz-boom-minmax-mooncake:
#   - pull

# ── BZ 3-NODE AFFINITY CHECK: DP1 x 3 replicas, NO Mooncake (worker2 tainted) ──
# k8s-worker2 is tainted (network-broken=true:NoSchedule) until its VPC security
# group is fixed, so the 3 replicas land one-per-healthy-node (master, worker,
# worker1). DP1 single TP=8 pod each; Mooncake off (external KV not needed to
# validate routing). batchSize (32) and central router settings UNCHANGED.
# Sweep none -> prefix -> affinity -> both back-to-back.
prod-bz-boom-minmax-multiturn-none-dp1:
  - pull
prod-bz-boom-minmax-multiturn-prefix-dp1:
  - pull
prod-bz-boom-minmax-multiturn-affinity-dp1:
  - pull
prod-bz-boom-minmax-multiturn-both-dp1:
  - pull

# ── Full multi-turn router_strategy sweep (DP2 + Mooncake) ──
# Re-enable once k8s-worker2 networking is fixed and the node is un-tainted:
#   kubectl taint nodes k8s-worker2 network-broken:NoSchedule-
# prod-bz-boom-minmax-mooncake-multiturn-none:
#   - pull
# prod-bz-boom-minmax-mooncake-multiturn-prefix:
#   - pull
# prod-bz-boom-minmax-mooncake-multiturn-affinity:
#   - pull
# prod-bz-boom-minmax-mooncake-multiturn-both:
#   - pull

# Single-config variant (router_strategy chosen inline). Use for ad-hoc runs.
# prod-bz-boom-minmax-mooncake-multiturn:
#   - pull

