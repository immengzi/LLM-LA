# boom-claude-glm-mooncake.yaml
# Deploys GLM-5-w4a8-mtp-QuaRot (TP=8) with BooM Gateway + Mooncake KV cache transfer.
#
# Same as boom-claude-glm.yaml but with Mooncake enabled for cross-node KV cache
# transfer via AscendStoreConnector. vLLM pods get hostNetwork + HCCL NIC detection
# for RoCE traffic, plus a mooncake-master coordination service.
#
# Claude Code connects via /v1/messages (Anthropic format) on port 30401.
# See docs/boom_claude.md for ~/.claude/settings.json setup.

backend: "boom"

router_url: "http://10.50.156.65:30080"
total_requests: 8
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/mnt/nvme1/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/mnt/nvme1/saeid/models/GLM-5-w4a8-mtp-QuaRot"
  streaming: false
  min_input_tokens: 256
  max_input_tokens: 10000000
  repeat_each: 8

load_pattern:
  pattern: "det"
  rate_rps: 2
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 5
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 2.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

# BooM Gateway — load test validation uses OpenAI format;
# Claude Code connects separately via /v1/messages (Anthropic format).
boom:
  base_url: "http://10.50.156.65:30401"
  chat_path: "/v1/chat/completions"
  model: "served-model"
  api_key: "sk-boom-master"
  timeout_s: 1000.0
  stream: false

helm:
  replicas: 2
  batch_size: 32
  tensor_parallel_size: 8

  boom_claude_aliases: true

  # API key for external /v1/chat/completions access (empty = no auth)
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 16
  autoscaling_max: 16
  autoscaling_threshold: "16"
  autoscaling_prometheus_query: |
    max(router_central_queue_length{namespace="vllm"})

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  # Model config — GLM-5 W4A8 MoE (quantized)
  model_name: "served-model"
  nfs_path: "/saeid/models/GLM-5-w4a8-mtp-QuaRot"
  model_host_path: "/home/models"  # local disk on each node (bypasses NFS)
  # model_host_path: ""  # uncomment (and comment above) to fall back to NFS PVC

  aibrix_enabled: false
  aibrix_model_name: "served-model"
  aibrix_port: 8200

  # Pre-warm NFS page cache (only needed when using NFS, not hostPath)
  cache_warm_enabled: false

  # vLLM runtime flags — matched to working GLM-5 W4A8 MoE deployment
  vllm_gpu_memory_utilization: 0.95
  vllm_quantization: "ascend"
  vllm_enable_expert_parallel: true
  vllm_compilation_config: '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  vllm_trust_remote_code: true
  vllm_max_model_len: 80896
  vllm_max_num_batched_tokens: 4096
  vllm_seed: 1924
  vllm_tool_call_parser: "glm47"
  vllm_reasoning_parser: "glm45"
  vllm_additional_config: null
  # Speculative decoding (MTP) — enable after base model loads successfully.
  # vllm_speculative_config: '{"numSpeculativeTokens": 3, "method": "deepseek_mtp"}'
  vllm_speculative_config: null

  # ---- Mooncake KV cache transfer ----
  mooncake_enabled: true
  mooncake_master_port: 50088
  mooncake_master_server_address: "10.50.156.106:50088"
  mooncake_global_segment_size: 140000000000
  mooncake_eviction_high_watermark: 0.9
  mooncake_eviction_ratio: 0.1
  mooncake_ascend_buffer_pool: "4:8"
  mooncake_lookup_rpc_port: "10010"
  mooncake_host_network: true
  deploy_mooncake_master: true
