# prod-yz-shadow: SHADOW deployment of the 142 LMCache P2P + host-staging replica.
# Parallel to prod (release/namespace vllm-shadow, port_offset 100) so it can run
# A/B against the prod stack without touching it. Same design as
# prod-yz-boom-minmax-lmcache-p2p-hoststaging-affinity.yaml — LMCacheAscendConnector
# + engine-to-engine HCCL P2P + host-staging (bounded 8 GiB registered arena) +
# a standalone lmcache_controller, NO Mooncake, NO NDS — just scoped to the shadow
# pool. See docs/internal/lmcache-p2p-host-staging.md.
#
# Node layout (single DP2 group, replicas: 1):
#   node3: prod infra (unchanged) + shadow vLLM (one DP2 pod)
#   node4: shadow infra (router, redis, BooM) + shadow vLLM (one DP2 pod)
#          + the lmcache_controller (pinned here)
#
# Pre-requisites:
#   kubectl label node node3 avoid=vllm --overwrite
#   kubectl label node node3 node4 vllm-pool=shadow --overwrite
#   kubectl label node node1 node2 node7 node8 avoid=vllm-shadow --overwrite
#   Pre-pull the P2P image on node3+node4:
#     ctr -n k8s.io images pull reg.local:32000/lmcache-ascend:hccl-p2p
#   sysctl -w vm.swappiness=0 && sysctl -w kernel.numa_balancing=0   (on node3/4)
#
# BEFORE DEPLOY — set the controller IP (the ONE per-env item):
#   The lmcache_controller is pinned to node4; engines dial it over the host/RoCE
#   network (the same network as p2p_host / NODE_IP, i.e. 7.150.x — NOT the 10.50.x
#   mooncake address). Find node4's host IP and put it in controller_pull_url /
#   controller_reply_url below:
#     kubectl get node node4 -o jsonpath='{.status.addresses}'

switch_cluster: yz
backend: "boom"

router_url: "http://10.50.156.65:30180"
total_requests: 10
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  streaming: true
  min_input_tokens: 1
  max_input_tokens: 10000000
  repeat_each: 1

load_pattern:
  pattern: "det"
  rate_rps: 3
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false
  use_dataset_output_len: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 3.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30659"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

boom:
  base_url: "http://10.50.156.65:30501"
  chat_path: "/v1/chat/completions"
  model: "served-model-minmax"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: true

# --- Shadow-specific overrides ---
vllm_node_selector:
  vllm-pool: shadow

vllm_avoid_label: "vllm-shadow"

helm:
  release: vllm-shadow
  namespace: vllm-shadow
  port_offset: 100
  pin_node_name: node4

  boom_claude_aliases: true
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false
  autoscaling_min: 1
  autoscaling_max: 1

  # Router routing = affinity only, HARD mode (mirrors the prod p2p config).
  router_strategy: "affinity"
  router_len_aware: true
  router_len_policy: "short_first"
  router_log_block_hashes: true
  router_measure_prefix: true
  router_affinity_mode: "hard"

  expose_per_pod: true

  nfs_path: "/home/models/MiniMax-M2.7-w8a8-QuaRot"
  model_host_path: "/home/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  # --- Mooncake: OFF (142 has no remote store). ---
  mooncake_enabled: false
  deploy_mooncake_master: false

  # --- LMCache: P2P / host-staging mode (142) ---
  lmcache_enabled: true
  lmcache_mode: "p2p"
  lmcache_chunk_size: 512
  # 50 GiB matches the shadow-hq baseline and is conservative because node3 is
  # SHARED with prod infra. If node3/node4 show headroom (`free -g`), raise toward
  # 100 to match the 142 reference and the prod p2p config.
  lmcache_max_local_cpu_size: 50

  lmcache_use_host_staging: true
  lmcache_os_staging_bytes: 8589934592   # 8 GiB

  # Controller pinned to node4. SET THESE to node4's host/RoCE IP (see header).
  lmcache_p2p_controller_pull_url: "<NODE4_HOST_IP>:9800"
  lmcache_p2p_controller_reply_url: "<NODE4_HOST_IP>:9900"
  deploy_lmcache_controller: true
  lmcache_controller_image: "reg.local:32000/lmcache-ascend:hccl-p2p"

  # NDS dropped in p2p mode (matches 142).
  lmcache_nds_enabled: false

  # --- vLLM flags ---
  dtype: "bfloat16"
  ascend_enable_flashcomm1: true
  # 142 drops the custom LSched scheduler and the hccl-p2p image does not ship
  # the `lsched` module, so setting this crashes EngineCore with
  # "ModuleNotFoundError: No module named 'lsched'". Leave unset to use vLLM's
  # default scheduler (matches the 142 reference run scripts).
  # scheduler_cls: "lsched.lsched_vllm.LSchedVLLMAdapter"
  model_loader_extra_config: '{"enable_multithread_load":true,"num_threads":16}'

  vllm_image: "reg.local:32000/lmcache-ascend:hccl-p2p"

  # Pin the controller to node4 (shadow infra node).
  values:
    lmcacheController.nodeName: "node4"

  models:
    - name: minimax-m2
      servedModelName: served-model-minmax
      replicas: 1
      streamingMode: true
      modelSubPath: MiniMax-M2.7-w8a8-QuaRot
      tensorParallelSize: 8
      # 16 chosen over the 142 reference's 32 — better observed results.
      batchSize: 16
      sidecarPrefetch: 2
      dataParallel:
        enabled: true
        size: 2
        sizeLocal: 1
        rpcPort: 8888
        hcclBuffSize: 1024
        ompNumThreads: 16
      vllm:
        gpuMemoryUtilization: 0.92
        dtype: bfloat16
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxNumBatchedTokens: 32768
        enablePrefixCaching: true
        enablePromptTokensDetails: true
        toolCallParser: minimax_m2
        reasoningParser: minimax_m2_append_think
        # Dropped for p2p/142 — hccl-p2p image has no `lsched` module.
        # schedulerCls: "lsched.lsched_vllm.LSchedVLLMAdapter"
        modelLoaderExtraConfig: '{"enable_multithread_load":true,"num_threads":16}'
        ascendEnableFlashcomm1: true
