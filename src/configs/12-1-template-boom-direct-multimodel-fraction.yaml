# 12-1: Multi-model FRACTION — BooM DIRECT (bypasses router/sidecar).
# 70% of requests → GLM-5, 30% → Qwen3-8B.
# Each request picks one model by weighted random choice.
# Single-turn LMSYS benchmark.

backend: "boom"

router_url: "http://10.50.156.65:30080"
total_requests: 100
prompt_source: "hf-lmsys"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/home/models/qwen3-8b"
  streaming: false
  min_input_tokens: 1
  max_input_tokens: 3000
  repeat_each: 1

load_pattern:
  pattern: "det"
  rate_rps: 0.1
  duration_s: 86400.0
  warmup_reqs: 0
  loadgen_seed: 12345

generation:
  max_tokens: 1024
  temperature: 0.0
  length_mode: "legacy"
  think: false
  use_dataset_output_len: true
  ignore_eos: true

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 3.0

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

boom:
  base_url: "http://10.50.156.65:30401"
  chat_path: "/v1/chat/completions"
  model: "served-model-glm"
  api_key: "sk-boom-master"
  timeout_s: 10000.0
  stream: false

multi_model:
  strategy: "fraction"
  targets:
    - model: "served-model-glm"
      weight: 0.7
    - model: "served-model-qwen"
      weight: 0.3

helm:
  boom_claude_aliases: true
  boom_route_via: direct
  boom_max_inflight: 1000
  router_api_key: "ZhongRuanChuangXin!"

  autoscaling_enabled: false

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  nfs_path: "/saeid/models"
  model_host_path: "/home/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  models:
    - name: glm5-chat
      servedModelName: served-model-glm
      replicas: 1
      modelSubPath: GLM-5-w4a8-mtp-QuaRot
      tensorParallelSize: 8
      batchSize: 4
      sidecarPrefetch: 2
      dataParallel:
        enabled: false
      vllm:
        gpuMemoryUtilization: 0.95
        quantization: ascend
        enableExpertParallel: true
        compilationConfig:
          cudagraphMode: "FULL_DECODE_ONLY"
        trustRemoteCode: true
        maxModelLen: 8192
        maxNumBatchedTokens: 4096
        seed: 1924
        toolCallParser: glm47
        reasoningParser: glm45
        additionalConfig:
          multistream_overlap_shared_expert: true

    - name: qwen3-8b
      servedModelName: served-model-qwen
      replicas: 3
      modelSubPath: qwen3-8b
      tensorParallelSize: 1
      batchSize: 4
      sidecarPrefetch: 2
      dataParallel:
        enabled: false
      vllm:
        gpuMemoryUtilization: 0.95
        trustRemoteCode: true
        maxNumBatchedTokens: 4096
        seed: 1924
