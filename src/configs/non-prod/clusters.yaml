clusters:
  yz:
    router_url: "http://10.50.156.65:30080"
    experiments_root: "/home/data/saeid/experiments"

    hf_lmsys:
      dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
      tokenizer_name: "/home/models/GLM-5-w4a8-mtp-QuaRot"

    metrics:
      prometheus_base_url: "http://10.50.156.65:31190"

    transport:
      results_zmq: "tcp://10.50.156.65:30559"

    boom:
      base_url: "http://10.50.156.65:30401"

    helm:
      nfs_path: "/home/models/GLM-5-w4a8-mtp-QuaRot"
      model_host_path: "/home/models"
      mooncake_master_server_address: "10.50.156.106:50088"
      values:
        global.imageRegistry: "reg.local:32000"
        images.router: "kv-router:latest"
        images.sidecar: "kv-sidecar:latest"
        images.vllm: "docker.io/library/vllm-ascend:v0.18.0"
        images.cpuHash: "vllm-cpu-hash:latest"
        images.redis: "redis:7-alpine"
        images.mooncakeMaster: "quay.io/ascend/vllm-ascend:glm5-openeuler"
        boom.image: "boom-gateway:v4"
        router.imagePullPolicy: "Always"
        sidecar.imagePullPolicy: "IfNotPresent"
        boom.imagePullPolicy: "Always"
        cpuHash.ascendDriverMounts: false
        pin.enabled: true
        pin.nodeName: "node3"

  bz:
    router_url: "http://192.168.0.79:30080"
    # Shared, group-writable (wheel) dir so saeid and haiting both write runs to
    # one place. Each user symlinks their <repo>/src/experiments -> this path so
    # sweep artifacts co-locate with client logs.
    experiments_root: "/data/experiments"

    hf_lmsys:
      dataset_name: "/data/gateway/gateway/data/codeflowbench_conversations.jsonl"
      tokenizer_name: "/data/models/GLM-5-w4a8-mtp-QuaRot"

    metrics:
      prometheus_base_url: "http://192.168.0.79:31190"

    transport:
      results_zmq: "tcp://192.168.0.79:30559"

    boom:
      base_url: "http://192.168.0.79:30401"

    helm:
      nfs_path: "/data/models/GLM-5-w4a8-mtp-QuaRot"
      model_host_path: "/data/models"
      mooncake_master_server_address: "192.168.0.79:50088"
      values:
        # BZ local registry is deployed at reg.local:32000 and resolves to
        # k8s-worker1 (192.168.0.42). Chart images have been rebuilt or mirrored
        # there, so global rewriting keeps mutable local tags pullable when
        # pullPolicy is Always.
        global.imageRegistry: "reg.local:32000"
        images.router: "kv-router:latest"
        images.sidecar: "kv-sidecar:latest"
        images.vllm: "quay.io/ascend/vllm-ascend:glm5-openeuler"
        images.cpuHash: "vllm-cpu-hash:latest"
        images.redis: "redis:7-alpine"
        images.mooncakeMaster: "quay.io/ascend/vllm-ascend:glm5-openeuler"
        boom.image: "boom-gateway:v5"
        router.imagePullPolicy: "Always"
        sidecar.imagePullPolicy: "IfNotPresent"
        boom.imagePullPolicy: "Always"
        cpuHash.ascendDriverMounts: true
        pin.enabled: true
        pin.nodeName: "k8s-master"
