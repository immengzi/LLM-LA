# 14-3: Qwen3-8B router — 40k requests, rps 3, 8 replicas.
# Reproduces Series 40 (exp 161–164).

backend: "router"

router_url: "http://10.50.156.65:30080"
total_requests: 40000
prompt_source: "hf-lmsys"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/home/models/qwen3-8b"
  streaming: false
  min_input_tokens: 256
  max_input_tokens: 10000000
  repeat_each: 1

load_pattern:
  pattern: "det"
  rate_rps: 5
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 8192
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 2.0
  include_debug_metrics: false
  model_name: "served-model"
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

helm:
  autoscaling_enabled: false

  router_kv_aware: false
  router_len_aware: true
  router_len_policy: "short_first"
  router_api_key: "ZhongRuanChuangXin!"

  nfs_path: "/saeid/models"
  model_host_path: "/home/models"

  aibrix_enabled: false
  cache_warm_enabled: false
  sidecar_prefetch: 2

  models:
    - name: qwen3-8b
      servedModelName: served-model
      replicas: 8
      modelSubPath: qwen3-8b
      tensorParallelSize: 1
      batchSize: 8
      sidecarPrefetch: 2
      dataParallel:
        enabled: false
      vllm:
        gpuMemoryUtilization: 0.95
        trustRemoteCode: true
        seed: 1924
