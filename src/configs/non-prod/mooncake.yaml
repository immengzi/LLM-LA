# mooncake.yaml
# Router-based experiment with Mooncake KV cache transfer enabled.
#
# Adds mooncake-master coordination service and --kv-transfer-config on each
# vLLM worker for cross-node KV cache transfer via AscendStoreConnector.
# Requires backend=router; the router runs as normal but vLLM pods get
# hostNetwork + HCCL NIC detection for RoCE traffic.

backend: "router"

router_url: "http://10.50.156.65:30080"
total_requests: 128
prompt_source: "hf-lmsys"

file_prompts:
  path: "prompts.json"
  variant: "short"

hf_lmsys:
  dataset_name: "/home/data/saeid/datasets/lmsys_chat_1m"
  split: "train"
  tokenizer_name: "/home/models/qwen3-8b"
  streaming: false
  min_input_tokens: 256
  max_input_tokens: 10000000
  repeat_each: 8

load_pattern:
  pattern: "det"
  rate_rps: 5
  duration_s: 1000000000.0
  warmup_reqs: 0

  burst_on_s: 2.0
  burst_off_s: 2.0
  burst_rps_on: 40.0
  burst_rps_off: 0.0

  step_schedule: "0:5,30:15,60:3"

  rand_rps_min: 5.0
  rand_rps_max: 20.0
  rand_epoch_s: 5.0
  loadgen_seed: 12345

generation:
  max_tokens: 5
  temperature: 0.0
  length_mode: "legacy"
  target_output_tokens: null
  target_total_tokens: null
  think: false

output_log_mode: "summary"
print_trace: false

metrics:
  enabled: true
  prometheus_base_url: "http://10.50.156.65:31190"
  scrape_interval_s: 1.0
  window_s: 2.0
  include_debug_metrics: false
  model_name: null
  max_instances: null

transport:
  mode: "async_pubsub"
  submit_path: "/submit"
  results_zmq: "tcp://10.50.156.65:30559"
  topic: "results"
  run_id: null
  idle_timeout_s: 1000.0
  idle_zero_running_s: 10.0

helm:
  replicas: 8
  batch_size: 8
  tensor_parallel_size: 1

  autoscaling_enabled: false
  autoscaling_min: 16
  autoscaling_max: 16
  autoscaling_threshold: "16"
  autoscaling_prometheus_query: |
    max(router_central_queue_length{namespace="vllm"})

  router_kv_aware: true
  router_len_aware: true
  router_len_policy: "short_first"

  model_name: "served-model"
  nfs_path: "/home/models/qwen3-8b"
  vllm_quantization: null
  vllm_enable_expert_parallel: false
  vllm_gpu_memory_utilization: null

  aibrix_enabled: false
  aibrix_model_name: "served-model"
  aibrix_port: 8200

  # ---- Mooncake KV cache transfer ----
  mooncake_enabled: true
  mooncake_master_port: 50088
  mooncake_master_server_address: "10.50.156.106:50088"
  mooncake_global_segment_size: 140000000000
  mooncake_eviction_high_watermark: 0.9
  mooncake_eviction_ratio: 0.1
  mooncake_ascend_buffer_pool: "4:8"
  mooncake_lookup_rpc_port: "10010"
  mooncake_host_network: true
  deploy_mooncake_master: true
