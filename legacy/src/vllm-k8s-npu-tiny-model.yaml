apiVersion: v1
kind: Namespace
metadata:
  name: vllm-mini

---
# PV (cluster-scoped; "namespace" is ignored but kept to mirror your template)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen2-mini-pv
  namespace: vllm-mini
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    # Place Qwen/Qwen2-0.5B-Instruct weights here on the NPU machine
    path: /home/saeid/llm-lb/qwen2-0p5b-mini
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen2-mini-pvc
  namespace: vllm-mini
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: qwen2-mini-pv

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen2-mini-npu
  namespace: vllm-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen2-mini-npu
  template:
    metadata:
      labels:
        app: vllm-qwen2-mini-npu
    spec:
      restartPolicy: Always
      containers:
        - name: vllm
          image: quay.io/ascend/vllm-ascend:v0.10.1rc1
          imagePullPolicy: IfNotPresent
          command: ["python","-m","vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "/model"
            - "--tokenizer"
            - "/model"
            - "--port"
            - "8211"                       # different from your original (8200)
            - "--served-model-name"
            - "served-model-mini"
            # Minimal footprint for test boot
            - "--max-num-seqs"
            - "1"
            - "--max-model-len"
            - "64"
            - "--gpu-memory-utilization"
            - "0.05"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYTHONHASHSEED
              value: "0"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          ports:
            - containerPort: 8211
              name: http
              protocol: TCP
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8211
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8211
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              huawei.com/Ascend910: 1
            requests:
              huawei.com/Ascend910: 1
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen2-mini-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen2-mini-npu-svc
  namespace: vllm-mini
spec:
  type: NodePort
  selector:
    app: vllm-qwen2-mini-npu
  ports:
    - name: http
      port: 8211
      targetPort: 8211
      nodePort: 30031                 # different from your original (30003)
