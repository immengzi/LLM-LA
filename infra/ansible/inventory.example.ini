# Copy to inventory.ini and edit for your cluster.
#
# Groups:
#   control_plane : the node where kubectl/helm run (usually the master)
#   workers       : NPU worker nodes that run vLLM
#   nfs           : the NFS server host (often NOT a cluster node)
#   build         : a machine with Docker + repo checkout to build/push images
#
# `ansible_host` is the SSH target; node_name is the Kubernetes node name
# (used for `kubectl label`/taint). Set them explicitly so SSH IP and K8s
# node name can differ.

[control_plane]
node3 ansible_host=10.50.156.65 node_name=node3

[workers]
node1 ansible_host=7.150.1.218  node_name=node1
node2 ansible_host=7.150.5.207  node_name=node2
node3 ansible_host=10.50.156.65 node_name=node3
node4 ansible_host=10.50.156.106 node_name=node4

[nfs]
nfs-head ansible_host=7.242.102.243

[build]
node3 ansible_host=10.50.156.65

# All cluster nodes (control plane + workers) get the common OS config.
[cluster:children]
control_plane
workers

[all:vars]
ansible_user=root
