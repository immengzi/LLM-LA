---
# =====================================================================
# LA-Boom cluster preparation — full orchestrator.
# Mirrors the checklist in docs/operations/cluster-setup.md.
#
#   ansible-playbook site.yml                 # everything
#   ansible-playbook site.yml --tags node     # per-node OS config only
#   ansible-playbook site.yml --tags k8s      # cluster bootstrap only
#   ansible-playbook site.yml --check         # dry run
#
# Run order matters: node config -> NFS -> NPU verify -> registry+images
# -> cluster bootstrap.
# =====================================================================

- name: Per-node OS configuration (DNS, registry, proxy, kube-proxy deps)
  hosts: cluster
  tags: [node, common]
  roles:
    - common

- name: NFS server exports
  hosts: nfs
  tags: [nfs]
  roles:
    - nfs_server

- name: Verify NPU driver stack on workers
  hosts: workers
  tags: [npu]
  roles:
    - npu

- name: Deploy private registry
  hosts: control_plane
  tags: [registry]
  roles:
    - registry

- name: Build and push images
  hosts: build
  tags: [images]
  roles:
    - images

- name: Cluster bootstrap (taint, labels, device plugin, PV/PVC, LWS)
  hosts: control_plane
  tags: [k8s, bootstrap]
  roles:
    - k8s_bootstrap

- name: Deploy monitoring stack (Prometheus + Grafana)
  hosts: control_plane
  tags: [monitoring]
  roles:
    - monitoring

# Optional: only needed for autoscaling.enabled=true deployments. Tagged
# 'never' so it is skipped by a plain `site.yml` run and must be requested
# explicitly (`--tags keda` or `make keda`), keeping `make prep` unchanged.
- name: Install KEDA autoscaler (+ LeaderWorkerSet scale RBAC)
  hosts: control_plane
  tags: [keda, never]
  roles:
    - keda
