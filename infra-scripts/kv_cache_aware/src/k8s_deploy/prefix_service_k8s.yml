---
# Redis StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  clusterIP: None
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --save
        - "60"
        - "1"
        - --loglevel
        - warning
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# Redis NodePort Service for external access
apiVersion: v1
kind: Service
metadata:
  name: redis-external
spec:
  type: NodePort
  ports:
  - port: 6379
    targetPort: 6379
    nodePort: 30379
  selector:
    app: redis

---
# vLLM-1 Deployment
apiVersion: v1
kind: Service
metadata:
  name: vllm-1
  labels:
    app: vllm-1
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: api
  - port: 5557
    targetPort: 5557
    name: zmq
  selector:
    app: vllm-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-1
  template:
    metadata:
      labels:
        app: vllm-1
    spec:
      hostNetwork: false
      containers:
      - name: vllm
        image: quay.io/ascend/vllm-ascend:v0.11.0rc0
        env:
        - name: PYTHONHASHSEED
          value: "0"
        ports:
        - containerPort: 8000
          name: api
        - containerPort: 5557
          name: zmq
        command:
        - python
        - -m
        - vllm.entrypoints.api_server
        - --model
        - /model/qwen-test
        - --tokenizer
        - /model/qwen-test
        - --served-model-name
        - Qwen/Qwen3-0.6B
        - --max-num-seqs
        - "512"
        - --prefix-caching-hash-algo
        - sha256_cbor
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --kv-events-config
        - '{"enable_kv_cache_events": true, "publisher": "zmq", "endpoint": "tcp://*:5557", "topic": "kv@vllm-ascend-1@Qwen/Qwen3-0.6B"}'
        volumeMounts:
        - name: dcmi
          mountPath: /usr/local/dcmi
        - name: npu-smi
          mountPath: /usr/local/bin/npu-smi
        - name: driver-lib
          mountPath: /usr/local/Ascend/driver/lib64/
        - name: driver-version
          mountPath: /usr/local/Ascend/driver/version.info
        - name: ascend-install
          mountPath: /etc/ascend_install.info
        - name: cache
          mountPath: /root/.cache
        - name: model
          mountPath: /model
        - name: code
          mountPath: /code
        securityContext:
          privileged: true
        resources:
          limits:
            huawei.com/Ascend910: 1  # Adjust based on your NPU resource name
      volumes:
      - name: dcmi
        hostPath:
          path: /usr/local/dcmi
      - name: npu-smi
        hostPath:
          path: /usr/local/bin/npu-smi
      - name: driver-lib
        hostPath:
          path: /usr/local/Ascend/driver/lib64/
      - name: driver-version
        hostPath:
          path: /usr/local/Ascend/driver/version.info
      - name: ascend-install
        hostPath:
          path: /etc/ascend_install.info
      - name: cache
        hostPath:
          path: /root/.cache
      - name: model
        hostPath:
          path: /mnt/storage1/haiting/qwen-test
      - name: code
        hostPath:
          path: /home/haiting/llm-lb/kv_cache_aware #change this
      nodeSelector:
        # Add node selector to target nodes with davinci5 NPU
        ascend.huawei.com/npu-device: davinci5

---
# vLLM-1 NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: vllm-1-external
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30801
  selector:
    app: vllm-1

