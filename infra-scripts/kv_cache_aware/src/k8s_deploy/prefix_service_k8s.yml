---
# vLLM KV Scheduler Deployment
apiVersion: v1
kind: Service
metadata:
  name: vllm-kv-scheduler
  labels:
    app: vllm-kv-scheduler
spec:
  ports:
  - port: 9095
    targetPort: 9095
    name: flask
  selector:
    app: vllm-kv-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-kv-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-kv-scheduler
  template:
    metadata:
      labels:
        app: vllm-kv-scheduler
    spec:
      containers:
      - name: scheduler
        image: vllm-arm64:vllm
        command:
        - /bin/bash
        stdin: true
        tty: true
        ports:
        - containerPort: 9095
          name: flask
        volumeMounts:
        - name: code
          mountPath: /code/
        - name: model
          mountPath: /model
        workingDir: /workspace
        securityContext:
          privileged: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: code
        hostPath:
          path: /home/haiting/llm-lb
      - name: model
        hostPath:
          path: /mnt/storage1/haiting/qwen-test

---
# vLLM KV Scheduler NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: vllm-kv-scheduler-external
spec:
  type: NodePort
  ports:
  - port: 9095
    targetPort: 9095
    nodePort: 30095
  selector:
    app: vllm-kv-scheduler
