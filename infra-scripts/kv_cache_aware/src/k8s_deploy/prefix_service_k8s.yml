---
# Listener-1 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listener-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listener-1
  template:
    metadata:
      labels:
        app: listener-1
    spec:
      containers:
      - name: listener
        image: kv_cache_event_listener
        command:
        - python
        - -u
        - zmq_subscriber.py
        env:
        - name: VLLM_HOST
          value: vllm-1
        - name: REDIS_HOST
          value: redis
        - name: CONTAINER_NAME
          value: vllm-1
        - name: MODEL_NAME
          value: Qwen/Qwen3-0.6B
        volumeMounts:
        - name: app-source
          mountPath: /app
        workingDir: /app
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: app-source
        hostPath:
          path: /home/haiting/llm-lb/kv_cache_aware/src
          type: Directory

