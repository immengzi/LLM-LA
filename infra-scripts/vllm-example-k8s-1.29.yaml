apiVersion: v1
kind: Pod
metadata:
  name: vllm-ascend-qwen3-test
spec:
  restartPolicy: Never
  containers:
  - name: vllm
    image: docker.io/library/vllm-ascend-test:v0.11.0
    imagePullPolicy: Never

    # If your environment requires it for /dev + driver mounts
    securityContext:
      privileged: true

    resources:
      requests:
        huawei.com/Ascend: 1
        ephemeral-storage: "2Gi"
      limits:
        huawei.com/Ascend: 1
        ephemeral-storage: "4Gi"
    env:
      - name: MODEL_DIR
        value: /models/qwen3-8b
      - name: HF_HOME
        value: /cache/huggingface
      - name: TRANSFORMERS_CACHE
        value: /cache/huggingface
      - name: HF_HUB_CACHE
        value: /cache/huggingface
      - name: TMPDIR
        value: /tmp

    command: ["/bin/bash", "-lc"]
    args:
      - |
        set -euo pipefail

        echo "--- ASCEND_TOOLKIT_HOME before sourcing:"
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<empty>}"

        # Set Ascend toolkit paths (adjust if your toolkit is elsewhere)
        export ASCEND_TOOLKIT_HOME=/usr/local/Ascend/ascend-toolkit/latest
        export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/devlib:/usr/local/Ascend/ascend-toolkit/latest/aarch64-linux/lib64:${LD_LIBRARY_PATH:-}

        echo "--- ASCEND_TOOLKIT_HOME after export:"
        echo "ASCEND_TOOLKIT_HOME=$ASCEND_TOOLKIT_HOME"
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

        # If set_env.sh exists, source it (optional)
        if [ -f "$ASCEND_TOOLKIT_HOME/set_env.sh" ]; then
          echo "--- sourcing $ASCEND_TOOLKIT_HOME/set_env.sh"
          # shellcheck disable=SC1090
          source "$ASCEND_TOOLKIT_HOME/set_env.sh"
          echo "--- after sourcing:"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
        else
          echo "--- no set_env.sh found at $ASCEND_TOOLKIT_HOME/set_env.sh (skipping)"
        fi

        echo "--- container ready; keeping it alive for exec"
        while true; do sleep 3600; done

    volumeMounts:
      - name: model-dir
        mountPath: /models/qwen3-8b
        readOnly: true
      - name: hf-cache
        mountPath: /cache/huggingface
      - name: tmp
        mountPath: /tmp

      # Ascend runtime mounts (keep if you need host driver libs)
      - name: dcmi
        mountPath: /usr/local/dcmi
      - name: npu-smi
        mountPath: /usr/local/bin/npu-smi
      - name: ascend-driver-lib
        mountPath: /usr/local/Ascend/driver/lib64
      - name: ascend-driver-version
        mountPath: /usr/local/Ascend/driver/version.info
      - name: ascend-install-info
        mountPath: /etc/ascend_install.info


  volumes:
    - name: model-dir
      hostPath:
        path: /mnt/nvme1/haiting_jd/models/qwen3-8b
        type: Directory
    - name: hf-cache
      hostPath:
        path: /mnt/nvme1/hf-cache
        type: DirectoryOrCreate
    - name: tmp
      hostPath:
        path: /mnt/nvme1/tmp
        type: DirectoryOrCreate

    - name: dcmi
      hostPath:
        path: /usr/local/dcmi
        type: Directory
    - name: npu-smi
      hostPath:
        path: /usr/local/bin/npu-smi
        type: File
    - name: ascend-driver-lib
      hostPath:
        path: /usr/local/Ascend/driver/lib64
        type: Directory
    - name: ascend-driver-version
      hostPath:
        path: /usr/local/Ascend/driver/version.info
        type: File
    - name: ascend-install-info
      hostPath:
        path: /etc/ascend_install.info
        type: File


